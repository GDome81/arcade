<script>
// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// ── CONFIG ────────────────────────────────────────────────────────────────────
// Arena dimensions adapt to viewport aspect on game start so the whole
// playable area fills the screen — no empty letterbox bands.
let ARENA_W = 1600, ARENA_H = 1000;       // world coords (mutable)
const TANK_R  = 22;
const BASE_HP        = 100;
const BASE_DAMAGE    = 25;
const BASE_FIRE_MS   = 600;
const BASE_SPEED     = 200;                // px/sec
const BULLET_SPEED   = 460;                // px/sec
const BULLET_R       = 5;
const ENEMY_COLORS = ['#ff4466','#ff9944','#aa44ff','#ff66cc','#44aaff','#88ff44'];

function recomputeArenaDims(){
  // Aim for an arena slightly larger than the viewport in world units so the
  // tank has room to manoeuvre. Aspect matches the screen so no letterbox.
  const aspect = W / Math.max(1, H);
  if(aspect < 1){
    ARENA_H = 1500;
    ARENA_W = Math.max(700, Math.floor(ARENA_H * aspect));
  } else {
    ARENA_W = 1600;
    ARENA_H = Math.max(800, Math.floor(ARENA_W / aspect));
  }
}

// Persistent upgrades (5 levels each)
const UPGRADE_TYPES = ['armor', 'damage', 'fireRate', 'speed'];
const UPGRADE_LABEL = {
  armor:'ARMOR', damage:'DAMAGE', fireRate:'FIRE RATE', speed:'SPEED'
};
const UPGRADE_DESC = {
  armor:    '+20% HP per livello',
  damage:   '+20% danno per livello',
  fireRate: '+15% cadenza per livello',
  speed:    '+12% velocità per livello'
};
const UPGRADE_COST = [0, 15, 25, 40, 65, 100];   // index = next level
const MAX_LEVEL = 5;

const UNLOCK_KEY = 'tanked_upgrades';
function loadUpgrades(){
  try { return JSON.parse(localStorage.getItem(UNLOCK_KEY)) || {armor:0,damage:0,fireRate:0,speed:0}; }
  catch { return {armor:0,damage:0,fireRate:0,speed:0}; }
}
function saveUpgrades(u){ localStorage.setItem(UNLOCK_KEY, JSON.stringify(u)); }
let upgrades = loadUpgrades();

function playerStats(){
  return {
    hp:       BASE_HP       * (1 + upgrades.armor   * 0.20),
    damage:   BASE_DAMAGE   * (1 + upgrades.damage  * 0.20),
    fireMs:   BASE_FIRE_MS  / (1 + upgrades.fireRate* 0.15),
    speed:    BASE_SPEED    * (1 + upgrades.speed   * 0.12),
  };
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let running = false;
let gameStartMs = 0;
let gameTime = 0;
let player = null;
let enemies = [];
let bullets = [];
let walls = [];
let powerups = [];
let killCount = 0;            // kills in the current run (across waves)
let killCountWave = 0;        // kills in the current wave only
let lastPowerupSpawnMs = 0;
let wave = 1;                 // current wave (1..∞)
let waveEnemiesTotal = 0;     // how many enemies the wave started with
let waveCleared = false;      // true while showing between-wave panel
const cam = { x: ARENA_W/2, y: ARENA_H/2, zoom: 1 };

// ── ARENA SETUP ───────────────────────────────────────────────────────────────
// Procedural: pick a random LAYOUT template each match, then mirror it across
// the X and Y axes so all tanks face an equally-fair arena.
function buildArena(){
  walls = [];
  const T = 40;
  // Outer border (always present)
  walls.push({x:0, y:0, w:ARENA_W, h:T});
  walls.push({x:0, y:ARENA_H-T, w:ARENA_W, h:T});
  walls.push({x:0, y:0, w:T, h:ARENA_H});
  walls.push({x:ARENA_W-T, y:0, w:T, h:ARENA_H});

  const templates = [_lyPillars, _lyCross, _lyCorridors, _lyDiagonal, _lyFortress, _lyMaze, _lyOpen];
  const pick = templates[Math.floor(Math.random() * templates.length)];
  const inner = pick();

  // Mirror across both axes for symmetry; de-duplicate exact overlaps.
  const allInner = [];
  for(const w of inner){
    const mirrors = [
      { x: w.x, y: w.y, w: w.w, h: w.h },
      { x: ARENA_W - w.x - w.w, y: w.y, w: w.w, h: w.h },
      { x: w.x, y: ARENA_H - w.y - w.h, w: w.w, h: w.h },
      { x: ARENA_W - w.x - w.w, y: ARENA_H - w.y - w.h, w: w.w, h: w.h }
    ];
    for(const m of mirrors){
      if(!allInner.some(o => Math.abs(o.x - m.x) < 1 && Math.abs(o.y - m.y) < 1)) allInner.push(m);
    }
  }
  // Don't place walls that would block a spawn point (corner safe zone of ~140px).
  const SAFE = 140;
  const spawnPts = [
    { x: 180, y: 120 }, { x: ARENA_W - 180, y: 120 },
    { x: ARENA_W/2, y: ARENA_H/2 - 200 }, { x: ARENA_W/2, y: ARENA_H - 120 }
  ];
  for(const w of allInner){
    const blocksSpawn = spawnPts.some(p =>
      p.x > w.x - SAFE && p.x < w.x + w.w + SAFE &&
      p.y > w.y - SAFE && p.y < w.y + w.h + SAFE);
    if(!blocksSpawn) walls.push(w);
  }
}

// ── ARENA TEMPLATES (each returns inner walls for the top-left quadrant) ──
// All coords are in world space. The buildArena() mirror step rotates them
// to fill the other three quadrants.

function _lyPillars(){
  // 4–6 random square pillars scattered in the top-left quadrant
  const walls = [];
  const n = 4 + Math.floor(Math.random() * 3);
  for(let i = 0; i < n; i++){
    const size = 50 + Math.floor(Math.random() * 40);
    const x = 200 + Math.random() * (ARENA_W/2 - 400);
    const y = 200 + Math.random() * (ARENA_H/2 - 400);
    walls.push({ x, y, w: size, h: size });
  }
  return walls;
}

function _lyCross(){
  // Big plus sign in the centre — narrow openings around it
  return [
    { x: ARENA_W/2 - 30, y: 220, w: 60, h: ARENA_H/2 - 320 },
    { x: 220, y: ARENA_H/2 - 30, w: ARENA_W/2 - 320, h: 60 }
  ];
}

function _lyCorridors(){
  // Two horizontal walls + two vertical, forming a "+" of corridors
  const walls = [];
  walls.push({ x: 240, y: ARENA_H/4, w: 280, h: 40 });
  walls.push({ x: ARENA_W/4, y: 240, w: 40, h: 280 });
  return walls;
}

function _lyDiagonal(){
  // Staircase of small blocks forming a diagonal cover line
  const walls = [];
  const step = 110;
  for(let i = 0; i < 5; i++){
    walls.push({ x: 220 + i * step, y: 220 + i * (step * 0.7), w: 90, h: 50 });
  }
  return walls;
}

function _lyFortress(){
  // Inner ring of 4 short walls forming a central fortress
  return [
    { x: ARENA_W/2 - 220, y: ARENA_H/2 - 220, w: 160, h: 40 },
    { x: ARENA_W/2 - 220, y: ARENA_H/2 - 220, w: 40, h: 160 },
  ];
}

function _lyMaze(){
  // Several parallel walls offset, creates a maze-y feel
  return [
    { x: 250, y: 250, w: 40, h: 320 },
    { x: 400, y: 180, w: 40, h: 320 },
    { x: 550, y: 280, w: 40, h: 280 },
    { x: 240, y: 340, w: 220, h: 40 },
  ];
}

function _lyOpen(){
  // Mostly empty arena with one big central cover and two small ones
  return [
    { x: ARENA_W/2 - 100, y: ARENA_H/2 - 60, w: 100, h: 120 },
    { x: 350, y: 350, w: 80, h: 80 }
  ];
}

// Enemy archetypes. Per-wave the spawner picks a mix that depends on the wave
// number — early waves are mostly 'grunt', later waves add 'fast', 'heavy',
// 'sniper'; every 5th wave is a single 'boss' (much bigger, multi-shot).
const ENEMY_KINDS = {
  grunt:  { hpMult: 1.00, dmgMult: 1.00, fireMult: 1.00, speedMult: 1.00, radiusMult: 1.00 },
  fast:   { hpMult: 0.65, dmgMult: 0.85, fireMult: 0.85, speedMult: 1.55, radiusMult: 0.90 },
  heavy:  { hpMult: 2.20, dmgMult: 1.30, fireMult: 1.30, speedMult: 0.60, radiusMult: 1.25 },
  sniper: { hpMult: 0.80, dmgMult: 1.50, fireMult: 1.60, speedMult: 0.70, radiusMult: 0.95, sniper: true },
  boss:   { hpMult: 6.00, dmgMult: 1.40, fireMult: 0.85, speedMult: 0.55, radiusMult: 1.80, radial: true }
};

// Linear scaling per wave: a tiny boost per wave on HP and damage. Stays
// readable for the player while still ramping difficulty.
function waveScale(w){
  return {
    hp:    1 + (w - 1) * 0.18,
    dmg:   1 + (w - 1) * 0.10,
    speed: 1 + Math.min(0.6, (w - 1) * 0.04),
    fire:  1 / (1 + Math.min(1.5, (w - 1) * 0.06))   // lower fireMs = faster
  };
}

function makeTank(x, y, color, isPlayer, kindKey){
  const k = kindKey || 'grunt';
  const kind = ENEMY_KINDS[k] || ENEMY_KINDS.grunt;
  let stats;
  if(isPlayer){
    stats = playerStats();
  } else {
    const sc = waveScale(wave);
    stats = {
      hp:     BASE_HP       * kind.hpMult    * sc.hp,
      damage: BASE_DAMAGE   * kind.dmgMult   * sc.dmg,
      fireMs: BASE_FIRE_MS  * kind.fireMult  * sc.fire,
      speed:  BASE_SPEED    * kind.speedMult * sc.speed,
    };
  }
  return {
    x, y, angle: 0, turret: 0,
    hp: stats.hp, maxHp: stats.hp,
    damage: stats.damage, fireMs: stats.fireMs, speed: stats.speed,
    color, isPlayer, lastFireMs: -9999, alive: true,
    radiusMult: kind.radiusMult || 1,
    kindKey: isPlayer ? 'player' : k,
    // movement intent
    moveX: 0, moveY: 0,
    // AI
    aiState: { mode: 'approach', nextSwitch: 0, lastTurnMs: 0, jitter: Math.random() * Math.PI * 2 },
    // power-up effects
    shieldUntil: 0, speedBoostUntil: 0, tripleUntil: 0
  };
}

// Pick an enemy roster for the wave: returns an array of kind keys.
function rosterForWave(w){
  if(w % 5 === 0){
    // Boss wave: 1 boss + (w/5) minions
    const n = Math.min(3, Math.floor(w / 5));
    const roster = ['boss'];
    for(let i = 0; i < n; i++) roster.push(i % 2 === 0 ? 'fast' : 'grunt');
    return roster;
  }
  // Regular waves: enemy count grows slowly with wave number
  const count = Math.min(8, 2 + Math.floor(w / 1.2));
  const pool = ['grunt'];
  if(w >= 2) pool.push('grunt', 'fast');
  if(w >= 3) pool.push('fast');
  if(w >= 4) pool.push('heavy');
  if(w >= 6) pool.push('sniper');
  if(w >= 8) pool.push('heavy', 'sniper');
  const roster = [];
  for(let i = 0; i < count; i++) roster.push(pool[Math.floor(Math.random() * pool.length)]);
  return roster;
}

// Compute safe spawn points around the arena edges away from the player.
function enemySpawnPoints(n){
  const pts = [];
  const px = player ? player.x : ARENA_W/2;
  const py = player ? player.y : ARENA_H - 120;
  // 12 candidate ring positions; pick the n farthest from player.
  const candidates = [
    { x: 180,            y: 160 },
    { x: ARENA_W - 180,  y: 160 },
    { x: 180,            y: ARENA_H/2 },
    { x: ARENA_W - 180,  y: ARENA_H/2 },
    { x: ARENA_W/2,      y: 160 },
    { x: ARENA_W/2 - 280, y: 220 },
    { x: ARENA_W/2 + 280, y: 220 },
    { x: 220,            y: ARENA_H/2 - 200 },
    { x: ARENA_W - 220,  y: ARENA_H/2 - 200 },
    { x: ARENA_W/2,      y: ARENA_H/2 - 240 },
    { x: 320,            y: 320 },
    { x: ARENA_W - 320,  y: 320 }
  ];
  candidates.sort((a, b) => {
    const da = (a.x - px) ** 2 + (a.y - py) ** 2;
    const db = (b.x - px) ** 2 + (b.y - py) ** 2;
    return db - da;
  });
  for(let i = 0; i < n; i++) pts.push(candidates[i % candidates.length]);
  return pts;
}

function spawnWave(){
  const roster = rosterForWave(wave);
  const pts = enemySpawnPoints(roster.length);
  enemies = roster.map((kind, i) => {
    const p = pts[i] || pts[0];
    const colorPool = kind === 'boss' ? ['#ffcc44'] : ENEMY_COLORS;
    const color = colorPool[i % colorPool.length];
    return makeTank(p.x, p.y, color, false, kind);
  });
  waveEnemiesTotal = enemies.length;
  killCountWave = 0;
  waveCleared = false;
  flashMsg(wave % 5 === 0 ? 'BOSS WAVE ' + wave : 'WAVE ' + wave);
}

function spawnGame(){
  // Resize arena to the current viewport so it fills the screen.
  recomputeArenaDims();
  wave = 1;
  killCount = 0;
  buildArena();
  // Player at bottom-centre of the arena
  player = makeTank(ARENA_W/2, ARENA_H - 120, '#00f5ff', true);
  bullets = [];
  powerups = [];
  spawnWave();
  gameStartMs = performance.now();
  lastPowerupSpawnMs = gameStartMs;
}

// ── INPUT: keyboard + mouse ───────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if(e.key === 'Escape' && running) showPauseMenu();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let mouseX = 0, mouseY = 0, mouseDown = false;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => { mouseDown = true; });
canvas.addEventListener('mouseup',   () => { mouseDown = false; });

// ── INPUT: touch ──────────────────────────────────────────────────────────────
// Left half = virtual joystick. Right half (or fire button) = fire.
let joyTouchId = null;
let joyOrigin = { x: 0, y: 0 };
let joyVec = { x: 0, y: 0 };          // normalised joystick output (-1..1)
let fireTouchActive = false;

const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');
const fireBtn = document.getElementById('fire-btn');

function showJoystick(x, y){
  joyBase.style.left = (x - 65) + 'px';
  joyBase.style.top  = (y - 65) + 'px';
  joyBase.style.display = 'block';
  joyKnob.style.left = (x - 27) + 'px';
  joyKnob.style.top  = (y - 27) + 'px';
  joyKnob.style.display = 'block';
}
function moveJoystickKnob(x, y){
  const dx = x - joyOrigin.x;
  const dy = y - joyOrigin.y;
  const dist = Math.hypot(dx, dy);
  const max = 50;
  let kx, ky;
  if(dist > max){ kx = (dx/dist) * max; ky = (dy/dist) * max; }
  else { kx = dx; ky = dy; }
  joyKnob.style.left = (joyOrigin.x + kx - 27) + 'px';
  joyKnob.style.top  = (joyOrigin.y + ky - 27) + 'px';
  joyVec.x = kx / max;
  joyVec.y = ky / max;
}
function hideJoystick(){
  joyBase.style.display = 'none';
  joyKnob.style.display = 'none';
  joyVec.x = 0; joyVec.y = 0;
}

canvas.addEventListener('touchstart', e => {
  for(const t of e.changedTouches){
    if(t.clientX < window.innerWidth / 2 && joyTouchId === null){
      joyTouchId = t.identifier;
      joyOrigin = { x: t.clientX, y: t.clientY };
      showJoystick(t.clientX, t.clientY);
    }
  }
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  for(const t of e.changedTouches){
    if(t.identifier === joyTouchId){
      moveJoystickKnob(t.clientX, t.clientY);
    }
  }
}, {passive:true});
canvas.addEventListener('touchend', e => {
  for(const t of e.changedTouches){
    if(t.identifier === joyTouchId){
      joyTouchId = null;
      hideJoystick();
    }
  }
}, {passive:true});

// Fire button on mobile
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); fireTouchActive = true; }, {passive:false});
fireBtn.addEventListener('touchend',   e => { e.preventDefault(); fireTouchActive = false; }, {passive:false});

// ── COLLISIONS ────────────────────────────────────────────────────────────────
function circleVsAABB(cx, cy, cr, ax, ay, aw, ah){
  const closestX = Math.max(ax, Math.min(cx, ax + aw));
  const closestY = Math.max(ay, Math.min(cy, ay + ah));
  const dx = cx - closestX, dy = cy - closestY;
  return dx*dx + dy*dy < cr*cr;
}
function pointVsAABB(px, py, ax, ay, aw, ah){
  return px >= ax && px <= ax+aw && py >= ay && py <= ay+ah;
}
function tankBlocked(t, nx, ny){
  for(const w of walls){
    if(circleVsAABB(nx, ny, TANK_R, w.x, w.y, w.w, w.h)) return true;
  }
  return false;
}
function hasLineOfSight(x1, y1, x2, y2){
  // March from (x1,y1) to (x2,y2); fail if any wall is hit
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  const steps = Math.ceil(dist / 15);
  for(let i = 1; i < steps; i++){
    const t = i / steps;
    const px = x1 + dx * t, py = y1 + dy * t;
    for(const w of walls){
      if(pointVsAABB(px, py, w.x, w.y, w.w, w.h)) return false;
    }
  }
  return true;
}

// ── BULLETS ───────────────────────────────────────────────────────────────────
function fireBullet(t, now){
  if(now - t.lastFireMs < t.fireMs) return;
  t.lastFireMs = now;
  const kind = ENEMY_KINDS[t.kindKey];
  const r = TANK_R * (t.radiusMult || 1);
  // Bosses fire 6 bullets in a radial spread aimed at the player; harder to dodge.
  if(kind && kind.radial && !t.isPlayer){
    const n = 6;
    for(let i = 0; i < n; i++){
      const a = t.turret + (i / n) * Math.PI * 2;
      bullets.push({
        x: t.x + Math.cos(a) * (r + 4),
        y: t.y + Math.sin(a) * (r + 4),
        vx: Math.cos(a) * BULLET_SPEED * 0.85,
        vy: Math.sin(a) * BULLET_SPEED * 0.85,
        damage: t.damage, owner: t, color: t.color, life: 2.5
      });
    }
    return;
  }
  // Snipers fire a single fast bullet but they aim is unchanged.
  const speedMult = (kind && kind.sniper) ? 1.4 : 1;
  const dirs = (now < t.tripleUntil) ? [-0.22, 0, 0.22] : [0];
  for(const off of dirs){
    const a = t.turret + off;
    bullets.push({
      x: t.x + Math.cos(a) * (r + 4),
      y: t.y + Math.sin(a) * (r + 4),
      vx: Math.cos(a) * BULLET_SPEED * speedMult,
      vy: Math.sin(a) * BULLET_SPEED * speedMult,
      damage: t.damage, owner: t, color: t.color,
      life: 2.0
    });
  }
}

function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if(b.life <= 0){ bullets.splice(i, 1); continue; }
    // Wall collisions
    let hit = false;
    for(const w of walls){
      if(pointVsAABB(b.x, b.y, w.x, w.y, w.w, w.h)){ hit = true; break; }
    }
    if(hit){ bullets.splice(i, 1); continue; }
    // Tank collisions
    const tanks = [player, ...enemies].filter(t => t && t.alive);
    let consumed = false;
    for(const t of tanks){
      if(t === b.owner) continue;
      const dx = t.x - b.x, dy = t.y - b.y;
      const tR = TANK_R * (t.radiusMult || 1);
      if(dx*dx + dy*dy < (tR + BULLET_R) * (tR + BULLET_R)){
        // Shield blocks damage but bullet is consumed
        if(performance.now() < t.shieldUntil){
          consumed = true; break;
        }
        t.hp -= b.damage;
        if(t.hp <= 0){
          t.alive = false;
          if(!t.isPlayer){
            killCount++;
            killCountWave++;
            const reward = (t.kindKey === 'boss') ? 25 : 2;
            if(Coins) Coins.add(reward, 'tanked-kill-' + (t.kindKey || 'mob'));
            flashMsg(t.kindKey === 'boss' ? 'BOSS DOWN +' + reward + '🪙' : 'TARGET DOWN +' + reward + '🪙');
          }
        }
        consumed = true; break;
      }
    }
    if(consumed) bullets.splice(i, 1);
  }
}

// ── POWER-UPS ─────────────────────────────────────────────────────────────────
function spawnPowerup(){
  // Find an open spot
  let x, y, ok = false;
  for(let i=0;i<15;i++){
    x = 100 + Math.random() * (ARENA_W - 200);
    y = 100 + Math.random() * (ARENA_H - 200);
    ok = true;
    for(const w of walls){
      if(circleVsAABB(x, y, 24, w.x, w.y, w.w, w.h)){ ok = false; break; }
    }
    if(ok) break;
  }
  if(!ok) return;
  const types = ['health', 'shield', 'triple', 'speed'];
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({ x, y, type, t: 0 });
}

function applyPowerupToTank(t, type){
  const now = performance.now();
  if(type === 'health')  { t.hp = Math.min(t.maxHp, t.hp + 50); flashMsg('+50 HP'); }
  if(type === 'shield')  { t.shieldUntil    = now + 5000; flashMsg('SHIELD 5s'); }
  if(type === 'triple')  { t.tripleUntil    = now + 6000; flashMsg('TRIPLE SHOT 6s'); }
  if(type === 'speed')   { t.speedBoostUntil= now + 5000; flashMsg('SPEED BOOST 5s'); }
}

function updatePowerups(){
  const now = performance.now();
  if(now - lastPowerupSpawnMs > 6500 + Math.random() * 3500){
    if(powerups.length < 3) spawnPowerup();
    lastPowerupSpawnMs = now;
  }
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.t += 1/60;
    // Pickup: only player picks up power-ups (enemies ignore for fairness)
    const dx = player.x - p.x, dy = player.y - p.y;
    if(dx*dx + dy*dy < (TANK_R + 18) * (TANK_R + 18)){
      applyPowerupToTank(player, p.type);
      powerups.splice(i, 1);
    }
  }
}

// ── PLAYER MOVEMENT + AIM ─────────────────────────────────────────────────────
function updatePlayer(dt){
  if(!player.alive) return;
  let mx = 0, my = 0;
  if(keys['w'] || keys['arrowup'])    my -= 1;
  if(keys['s'] || keys['arrowdown'])  my += 1;
  if(keys['a'] || keys['arrowleft'])  mx -= 1;
  if(keys['d'] || keys['arrowright']) mx += 1;
  // Joystick (touch) — and gamepad layered on top.
  mx += joyVec.x; my += joyVec.y;
  if(window.GamepadInput && window.GamepadInput.isConnected()){
    const gp = GamepadInput.state();
    if(Math.abs(gp.stickL.x) > 0.18) mx += gp.stickL.x;
    else if(gp.dir.x)                mx += gp.dir.x;
    if(Math.abs(gp.stickL.y) > 0.18) my += gp.stickL.y;
    else if(gp.dir.y)                my += gp.dir.y;
  }
  // Normalise
  const m = Math.hypot(mx, my);
  if(m > 1) { mx /= m; my /= m; }
  const now = performance.now();
  const speed = player.speed * (now < player.speedBoostUntil ? 1.4 : 1);
  const nx = player.x + mx * speed * dt;
  const ny = player.y + my * speed * dt;
  // Wall collision: separate axes for sliding
  if(!tankBlocked(player, nx, player.y)) player.x = nx;
  if(!tankBlocked(player, player.x, ny)) player.y = ny;
  if(m > 0.05) player.angle = Math.atan2(my, mx);

  // Aim turret — ALWAYS auto-aims at the nearest enemy. Desktop mouse-aim
  // is gone (kids and casual players want zero-input combat). Manual fire
  // input (mouseDown / fireTouchActive) is also redundant since auto-fire
  // covers it; we keep the variables to avoid breaking event handlers but
  // they no longer gate firing.
  const target = nearestAliveEnemy(player.x, player.y);
  if(target){
    player.turret = Math.atan2(target.y - player.y, target.x - player.x);
    // Auto-fire — the tank's own cooldown (lastFireMs / fireMs) caps the
    // rate so this isn't a stream of bullets every frame.
    fireBullet(player, now);
  }
}

function nearestAliveEnemy(x, y){
  let best = null, bestD = Infinity;
  for(const e of enemies){
    if(!e.alive) continue;
    const d = (e.x - x)**2 + (e.y - y)**2;
    if(d < bestD){ bestD = d; best = e; }
  }
  return best;
}

// ── ENEMY AI ──────────────────────────────────────────────────────────────────
function updateEnemy(e, dt){
  if(!e.alive) return;
  const now = performance.now();
  const tdx = player.x - e.x, tdy = player.y - e.y;
  const distToPlayer = Math.hypot(tdx, tdy);
  const los = hasLineOfSight(e.x, e.y, player.x, player.y);

  // State transitions
  if(now >= e.aiState.nextSwitch){
    if(distToPlayer > 320)      e.aiState.mode = 'approach';
    else if(distToPlayer < 160) e.aiState.mode = 'retreat';
    else                        e.aiState.mode = 'strafe';
    e.aiState.nextSwitch = now + 1500 + Math.random() * 1500;
  }

  // Movement intent
  let mx = 0, my = 0;
  if(e.aiState.mode === 'approach'){
    mx = tdx; my = tdy;
  } else if(e.aiState.mode === 'retreat'){
    mx = -tdx; my = -tdy;
  } else {
    // strafe perpendicular, with jitter that drifts over time
    e.aiState.jitter += (Math.random() - 0.5) * 0.05;
    const perp = Math.atan2(tdy, tdx) + Math.PI/2 + Math.sin(e.aiState.jitter) * 0.4;
    mx = Math.cos(perp); my = Math.sin(perp);
  }
  const m = Math.hypot(mx, my) || 1;
  mx /= m; my /= m;
  const nx = e.x + mx * e.speed * dt;
  const ny = e.y + my * e.speed * dt;
  let blocked = false;
  if(!tankBlocked(e, nx, e.y)) e.x = nx; else blocked = true;
  if(!tankBlocked(e, e.x, ny)) e.y = ny; else blocked = true;
  if(blocked && now - e.aiState.lastTurnMs > 400){
    // Pick a new strafe direction to escape the wall
    e.aiState.jitter += Math.PI/2;
    e.aiState.lastTurnMs = now;
  }
  e.angle = Math.atan2(my, mx);

  // Turret: track player only with line of sight; otherwise sweep
  if(los){
    e.turret = Math.atan2(tdy, tdx);
    // Per-kind engagement range so snipers can hit from across the arena
    // and bosses fire whenever they can see the player.
    const range = (e.kindKey === 'sniper') ? 1400
                : (e.kindKey === 'boss')   ? 1600
                : (e.kindKey === 'heavy')  ? 380
                : 480;
    if(distToPlayer < range) fireBullet(e, now);
  } else {
    // Sweep slowly
    e.turret += dt * 1.2;
  }
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
function updateCamera(dt){
  // Arena is now sized to roughly match the viewport, so we just fit it
  // entirely on screen and lock the camera to the arena centre. No scrolling
  // means the whole battlefield is always visible — no empty void below.
  const targetZoom = Math.min(W / ARENA_W, H / ARENA_H);
  cam.zoom += (targetZoom - cam.zoom) * 6 * dt;
  cam.x = ARENA_W / 2;
  cam.y = ARENA_H / 2;
}

function worldToScreen(wx, wy){
  return { x: (wx - cam.x) * cam.zoom + W/2, y: (wy - cam.y) * cam.zoom + H/2 };
}
function screenToWorld(sx, sy){
  return { x: (sx - W/2) / cam.zoom + cam.x, y: (sy - H/2) / cam.zoom + cam.y };
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  // Background
  ctx.fillStyle = '#040608';
  ctx.fillRect(0, 0, W, H);
  // Grid
  ctx.strokeStyle = '#0d1830';
  ctx.lineWidth = 1;
  const gridStep = 80 * cam.zoom;
  const ox = ((-cam.x * cam.zoom + W/2) % gridStep + gridStep) % gridStep;
  const oy = ((-cam.y * cam.zoom + H/2) % gridStep + gridStep) % gridStep;
  for(let x = ox; x < W; x += gridStep){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for(let y = oy; y < H; y += gridStep){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // Walls
  for(const w of walls){
    const p = worldToScreen(w.x, w.y);
    const sw = w.w * cam.zoom, sh = w.h * cam.zoom;
    ctx.fillStyle = '#1f2940';
    ctx.fillRect(p.x, p.y, sw, sh);
    ctx.strokeStyle = '#3e4f78';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#3e4f78';
    ctx.shadowBlur = 6;
    ctx.strokeRect(p.x + 1, p.y + 1, sw - 2, sh - 2);
    ctx.shadowBlur = 0;
  }
  // Power-ups
  for(const pu of powerups) drawPowerup(pu);
  // Tanks
  if(player) drawTank(player);
  for(const e of enemies) drawTank(e);
  // Bullets
  for(const b of bullets){
    const p = worldToScreen(b.x, b.y);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(p.x, p.y, BULLET_R * cam.zoom, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  // Flash
  if(_flash.t > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, _flash.t);
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.05) + 'px Orbitron, sans-serif';
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 18;
    ctx.textAlign = 'center';
    ctx.fillText(_flash.text, W/2, H/2 - Math.min(W, H) * 0.12);
    ctx.restore();
    _flash.t -= 0.012;
  }
}

// Visual evolution stage of the *player* tank: derived from total upgrades.
//   0–1 upgrades  → stage 0 (basic)
//   2–4           → stage 1 (armor plates)
//   5–9           → stage 2 (double cannon)
//   10–14         → stage 3 (heavy chassis + side guns)
//   15+ (max)     → stage 4 (mech-style)
function playerEvolveStage(){
  const total = (upgrades.armor || 0) + (upgrades.damage || 0)
              + (upgrades.fireRate || 0) + (upgrades.speed || 0);
  if(total >= 15) return 4;
  if(total >= 10) return 3;
  if(total >=  5) return 2;
  if(total >=  2) return 1;
  return 0;
}

function drawTank(t){
  const p = worldToScreen(t.x, t.y);
  const r = TANK_R * (t.radiusMult || 1) * cam.zoom;
  const now = performance.now();
  const stage = t.isPlayer ? playerEvolveStage() : 0;
  // Shield ring
  if(now < t.shieldUntil){
    ctx.strokeStyle = '#00f5ff';
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 6, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // Boss aura — slow rotating ring on bosses to make them readable from far.
  if(t.kindKey === 'boss'){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((now * 0.0008) % (Math.PI * 2));
    ctx.strokeStyle = '#ffcc44';
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 18;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(0, 0, r + 14, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  // Body
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(t.angle);
  ctx.fillStyle = t.color + '44';
  ctx.fillRect(-r, -r*0.85, r*2, r*1.7);
  ctx.strokeStyle = t.color;
  ctx.shadowColor = t.color;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2;
  ctx.strokeRect(-r + 1, -r*0.85 + 1, r*2 - 2, r*1.7 - 2);
  ctx.shadowBlur = 0;
  // Treads (sides)
  ctx.fillStyle = t.color + '88';
  ctx.fillRect(-r, -r*0.85, 4, r*1.7);
  ctx.fillRect(r - 4, -r*0.85, 4, r*1.7);
  // Evolution: armor plates
  if(stage >= 1){
    ctx.fillStyle = t.color + 'cc';
    ctx.fillRect(-r * 0.85, -r * 0.7, r * 0.2, r * 0.25);
    ctx.fillRect( r * 0.65, -r * 0.7, r * 0.2, r * 0.25);
    ctx.fillRect(-r * 0.85,  r * 0.45, r * 0.2, r * 0.25);
    ctx.fillRect( r * 0.65,  r * 0.45, r * 0.2, r * 0.25);
  }
  // Evolution: bolts / panels in the centre
  if(stage >= 3){
    ctx.fillStyle = '#fff';
    for(const dx of [-r*0.5, r*0.5]){
      for(const dy of [-r*0.5, r*0.5]){
        ctx.fillRect(dx - 1.5, dy - 1.5, 3, 3);
      }
    }
  }
  ctx.restore();
  // Turret(s)
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(t.turret);
  ctx.fillStyle = t.color;
  ctx.shadowColor = t.color;
  ctx.shadowBlur = 10;
  // Main barrel — longer at higher stages
  const barrelLen = r * (1.1 + stage * 0.13);
  const barrelW   = 6 + stage;
  ctx.fillRect(0, -barrelW/2, barrelLen, barrelW);
  // Stage 2+: double-barrel
  if(stage >= 2){
    ctx.fillRect(0, -r * 0.55, barrelLen * 0.75, 3);
    ctx.fillRect(0,  r * 0.55 - 3, barrelLen * 0.75, 3);
  }
  // Stage 4: mech-look — radial fins around turret
  if(stage >= 4){
    for(let i = 0; i < 6; i++){
      const a = (i / 6) * Math.PI * 2;
      const x1 = Math.cos(a) * r * 0.6, y1 = Math.sin(a) * r * 0.6;
      const x2 = Math.cos(a) * r * 0.85, y2 = Math.sin(a) * r * 0.85;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
  ctx.beginPath();
  ctx.arc(0, 0, r * (0.45 + stage * 0.05), 0, Math.PI*2);
  ctx.fill();
  // Stage 3+: glowing core dot
  if(stage >= 3){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
  // HP bar
  const barW = r * 2, barH = 4;
  ctx.fillStyle = '#000';
  ctx.fillRect(p.x - barW/2, p.y - r - 12, barW, barH);
  const ratio = Math.max(0, t.hp / t.maxHp);
  ctx.fillStyle = ratio > 0.6 ? '#44ff88' : (ratio > 0.3 ? '#ffcc00' : '#ff5566');
  ctx.fillRect(p.x - barW/2, p.y - r - 12, barW * ratio, barH);
  // Player marker
  if(t.isPlayer){
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r + 12, 0, Math.PI*2);
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawPowerup(pu){
  const p = worldToScreen(pu.x, pu.y);
  const pulse = 1 + Math.sin(pu.t * 5) * 0.15;
  const colors = { health:'#44ff88', shield:'#00f5ff', triple:'#ff66cc', speed:'#ffcc00' };
  const labels = { health:'+', shield:'S', triple:'×3', speed:'»' };
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = colors[pu.type];
  ctx.shadowColor = colors[pu.type];
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(0, 0, 16 * cam.zoom, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#050810';
  ctx.font = 'bold ' + Math.floor(14 * cam.zoom) + 'px Orbitron, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(labels[pu.type], 0, 1);
  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHud(nowSec){
  if(!player) return;
  const hp = Math.max(0, Math.round(player.hp));
  const hpEl = document.getElementById('h-hp');
  hpEl.textContent = hp;
  hpEl.classList.toggle('low', hp < player.maxHp * 0.3);
  // "Kills" panel now shows wave progress (Killed this wave / Total this wave).
  const aliveThisWave = enemies.filter(e => e.alive).length;
  const downThisWave = waveEnemiesTotal - aliveThisWave;
  document.getElementById('h-kills').textContent = 'W' + wave + ' ' + downThisWave + '/' + waveEnemiesTotal;
  const m = Math.floor(nowSec / 60), s = Math.floor(nowSec % 60).toString().padStart(2,'0');
  document.getElementById('h-time').textContent = m + ':' + s;
  document.getElementById('h-coins').textContent = Coins ? Coins.formatted() : '0';
}

// ── FLASH ─────────────────────────────────────────────────────────────────────
let _flash = { text:'', t:0 };
function flashMsg(text){ _flash.text = text; _flash.t = 1; }

// ── FLOW ──────────────────────────────────────────────────────────────────────
function showMainMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>TANKED!</h2>
    <p>WASD / joystick = movimento. Sparo automatico verso il nemico più vicino.</p>
    <p>Sopravvivi alle <b>ondate</b>: i nemici diventano sempre più tosti.<br>Ogni 5 onde arriva un <b style="color:#ffcc44">BOSS</b> che spara in tutte le direzioni.</p>
    <div class="shop-grid">${shopHTML()}</div>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function shopHTML(){
  return UPGRADE_TYPES.map(key => {
    const lvl = upgrades[key] || 0;
    const next = lvl + 1;
    const cost = next > MAX_LEVEL ? null : UPGRADE_COST[next];
    const canBuy = cost !== null && Coins && Coins.canSpend(cost) && Coins.mode !== 'free';
    const dots = [];
    for(let i = 1; i <= MAX_LEVEL; i++){
      dots.push(`<div class="dot ${i <= lvl ? 'on' : ''}"></div>`);
    }
    return `<div class="shop-card">
      <div class="name">${UPGRADE_LABEL[key]}</div>
      <div style="color:#a0b8e0;font-size:.7rem;text-align:center">${UPGRADE_DESC[key]}</div>
      <div class="dots">${dots.join('')}</div>
      ${cost === null
        ? '<div style="color:#44ff88;font-family:Orbitron,sans-serif">MAX</div>'
        : `<div class="cost">${cost}🪙</div>
           <button class="buy" ${canBuy ? '' : 'disabled'} onclick="buyUpgrade('${key}')">BUY +1</button>`}
    </div>`;
  }).join('');
}

function buyUpgrade(key){
  const lvl = upgrades[key] || 0;
  if(lvl >= MAX_LEVEL) return;
  const cost = UPGRADE_COST[lvl + 1];
  if(!Coins.canSpend(cost)) return;
  if(!Coins.spend(cost, 'tanked-upgrade-' + key)) return;
  upgrades[key]++;
  saveUpgrades(upgrades);
  showMainMenu();   // refresh shop
}

function startGame(){
  spawnGame();
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  flashMsg('FIGHT');
  requestAnimationFrame(loop);
}

// Between-wave panel — survived this wave, choose to push deeper or shop.
function onWaveCleared(){
  running = false;
  const bonus = 8 + wave * 3;
  if(Coins) Coins.add(bonus, 'tanked-wave-' + wave);
  if(window.Track) Track.event('wave_cleared', { wave, kills: killCount, hp: Math.round(player.hp) });
  // Heal a bit so a marathon run is possible.
  player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.25);
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#44ff88;text-shadow:0 0 28px #44ff88">WAVE ${wave} CLEAR</h2>
    <p>Kills totali: <b style="color:#fff">${killCount}</b> · HP recuperati 25%</p>
    <p>+${bonus}🪙 wave bonus</p>
    <div class="shop-grid">${shopHTML()}</div>
    <div class="btn-row">
      <button class="btn gold" onclick="continueToNextWave()">PROSSIMA WAVE ${wave + 1}</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function continueToNextWave(){
  wave++;
  // Re-apply player stats (in case armour was bought between waves)
  const s = playerStats();
  player.maxHp = s.hp;
  player.hp = Math.min(s.hp, player.hp);   // don't auto-heal, just cap
  player.damage = s.damage;
  player.fireMs = s.fireMs;
  player.speed = s.speed;
  spawnWave();
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function onLose(){
  running = false;
  // Bigger consolation the further you got.
  const reward = 5 + wave * 2;
  if(Coins) Coins.add(reward, 'tanked-loss-w' + wave);
  if(window.Track) Track.event('run_over', { wave, kills: killCount });
  // Leaderboard score = wave * 1000 + kills → wave is primary, kills tie-break.
  if(window.CloudSync) CloudSync.recordScore(null, wave * 1000 + killCount);
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">DESTROYED</h2>
    <p>Hai resistito fino alla <b style="color:#ffcc44">WAVE ${wave}</b></p>
    <p>Kills: <b style="color:#fff">${killCount}</b></p>
    <p>+${reward}🪙 round reward</p>
    <div class="shop-grid">${shopHTML()}</div>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">NEW RUN</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function showPauseMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>PAUSE</h2>
    <p>Wave ${wave} · Kills ${killCount} · HP ${Math.round(player ? player.hp : 0)}</p>
    <div class="btn-row">
      <button class="btn" onclick="resumeGame()">RESUME</button>
      <button class="btn" onclick="startGame()">NEW RUN</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function resumeGame(){
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function goBack(){
  if(running && !confirm('Tornare al menu principale?')) return;
  window.location.href = '../';
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastT = 0;
let pausedAt = 0;            // ms timestamp of pause start, for gameStartMs shift
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  const isPaused = window.Pause && Pause.isPaused();
  if(!isPaused){
    gameTime = ts - gameStartMs;
    updatePlayer(dt);
    for(const e of enemies) updateEnemy(e, dt);
    updateBullets(dt);
    updatePowerups();
  }
  updateCamera(dt);
  draw();
  updateHud(gameTime / 1000);

  if(!isPaused){
    // Lose: player destroyed → run over (you'll keep the coins earned this run).
    if(player && !player.alive){ onLose(); return; }
    // Wave clear: all enemies down → between-wave panel (shop + continue).
    if(!waveCleared && enemies.length > 0 && enemies.every(e => !e.alive)){
      waveCleared = true;
      onWaveCleared();
      return;
    }
  }

  requestAnimationFrame(loop);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
buildArena();
showMainMenu();

window.addEventListener('coins:change', () => {
  // Refresh shop UI if open
  if(!running && document.getElementById('overlay').innerHTML.includes('shop-grid')){
    showMainMenu();
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
<script src="../shared/no-gestures.js"></script>
<script src="../shared/fullscreen.js"></script>
<script src="../shared/pause.js"></script>
<script>
  if(window.Pause){
    Pause.attach({
      canPause: () => !!running && !!(player && player.alive) && !waveCleared,
      onPause:  () => { pausedAt = performance.now(); },
      onResume: () => {
        // Shift gameStartMs forward so the in-run timer doesn't jump while paused.
        if(pausedAt) gameStartMs += (performance.now() - pausedAt);
        pausedAt = 0;
        lastT = performance.now();
      }
    });
  }
</script>
</body>
</html>
