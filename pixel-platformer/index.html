  .btn{

    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;

  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

<script>
// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// ── ASSETS ────────────────────────────────────────────────────────────────────
const Assets = {
  ready: false, _t:0, _d:0,
  _hit(){ this._d++; if(this._d >= this._t) this.ready = true; },
  _load(path){
    const img = new Image();
    img.onload = () => this._hit(); img.onerror = () => this._hit();
    img.src = path; this._t++; return img;
  },
  load(){
    this.idle    = this._load('assets/player_idle.png');
    this.walkA   = this._load('assets/player_walk_a.png');
    this.walkB   = this._load('assets/player_walk_b.png');
    this.jump    = this._load('assets/player_jump.png');
    this.ground  = this._load('assets/ground.png');
    this.groundC = this._load('assets/ground_inner.png');
    this.coin    = this._load('assets/coin.png');
    this.flag    = this._load('assets/flag.png');
    this.slimeR  = this._load('assets/slime_rest.png');
    this.slimeA  = this._load('assets/slime_walk_a.png');
    this.slimeB  = this._load('assets/slime_walk_b.png');
    this.bg      = this._load('assets/bg.png');
    // Brutimon-skin overrides (sourced from neon-defender's skin-pokemon
    // folder). Failed loads silently fall back to the classic sprites.
    this.pkGround = this._load('../neon-defender/assets/skin-pokemon/grass.png');
    this.pkGroundC= this._load('../neon-defender/assets/skin-pokemon/path.png');
    this.pkSlime  = this._load('../neon-defender/assets/skin-pokemon/grunt.png');
  }
};
Assets.load();
function imgReady(img){ return img && img.complete && img.naturalWidth > 0; }

// Graphics mode: 'classic' (default Kenney-style sprites) or 'pokemon'
// (ground tiles + slime swapped with the shared Brutimon skin). Persisted.
// Per-game override wins; otherwise default to launcher's global skin (pokemon by default).
let graphicsMode = (() => {
  const local = localStorage.getItem('ppGraphicsMode');
  if(local === 'pokemon' || local === 'classic') return local;
  return (localStorage.getItem('skin') || 'pokemon') === 'pokemon' ? 'pokemon' : 'classic';
})();
function toggleGraphics(){
  graphicsMode = graphicsMode === 'classic' ? 'pokemon' : 'classic';
  localStorage.setItem('ppGraphicsMode', graphicsMode);
  const btn = document.getElementById('graphics-toggle-btn');
  if(btn) btn.textContent = graphicsMode === 'pokemon' ? 'BRUTIMON' : 'CLASSIC';
}
window.toggleGraphics = toggleGraphics;

// ── CONFIG ────────────────────────────────────────────────────────────────────
const TILE = 64;                            // world pixels per tile
const GRAVITY = 1500;                       // px/sec² — lighter for more airtime
const JUMP_VEL = 780;                       // px/sec upward at jump
const WALK_SPEED = 340;                     // px/sec — a tad faster, helps clear gaps
const AIR_DRAG = 0.96;                      // less drag in air → keeps momentum
const COYOTE_MS = 110;                      // jump grace after leaving ground
const JUMP_BUFFER_MS = 140;                 // press-buffered jump
const MAX_FALL = 1200;
// Procedural generation constraints — derived from the physics above so the
// generator only ever places jumps the player can actually make.
//   WALK_SPEED * 2 * JUMP_VEL/GRAVITY = 340 * 2 * 0.52 ≈ 354 px ≈ 5.5 tiles
//   max apex height = JUMP_VEL² / 2G ≈ 202 px ≈ 3.2 tiles
const MAX_JUMP_GAP_TILES    = 4;     // never put a gap wider than this
const MAX_JUMP_HEIGHT_TILES = 2;     // max upward climb a single platform can rise

// ── STATE ─────────────────────────────────────────────────────────────────────
let levelIdx = 0;
let solids = [];           // {x,y,w,h}  ground rects (world coords)
let coins = [];            // {x,y,collected,t}
let slimes = [];           // {kind, x, y, vx, vy, dir, alive, t, ...}  — name kept for diff churn
let flag = null;           // {x, y, w, h}
let hazards = [];          // {x, y, w, h, kind: 'water' | 'fire'}
let powerups = [];         // {x, y, w, h, kind: 'mushroom' | 'flower' | 'star', taken, t}
let bullets = [];          // {x, y, vx, vy, fromEnemy, life}
let player = null;
let score = 0;
let lives = 3;
let running = false;
let levelW = 0, levelH = 0;
const camera = { x: 0, y: 0 };

// ── PROCEDURAL LEVEL GENERATION ──────────────────────────────────────────────
// Levels are no longer hand-authored: every level is generated on demand.
// Length scales with idx so each run gets progressively longer. The
// generator places platforms with gap widths ≤ MAX_JUMP_GAP_TILES and
// climbs ≤ MAX_JUMP_HEIGHT_TILES so EVERY jump is mathematically
// reachable from the previous platform — there can never be a dead end.
function generateLevel(idx){
  levelIdx = idx;
  const lengthTiles = 40 + idx * 10;   // each level ~10 tiles longer than the previous
  const skyH        = 14;              // vertical tiles
  const baseGround  = skyH - 3;        // baseline ground row

  levelW = lengthTiles * TILE;
  levelH = skyH * TILE;

  solids = []; coins = []; slimes = []; flag = null;
  hazards = []; powerups = []; bullets = [];

  // Helper: emit a solid column from `top` row down to the bottom row.
  function col(c, topRow){
    for(let y = topRow; y < skyH; y++){
      solids.push({ x: c * TILE, y: y * TILE, w: TILE, h: TILE });
    }
  }
  function emitHazard(startCol, endCol, kind){
    for(let c = startCol; c < endCol; c++){
      hazards.push({ x: c * TILE, y: (skyH - 1) * TILE, w: TILE, h: TILE, kind });
    }
  }

  // Spawn area: 6 tiles of safe ground at the start.
  for(let c = 0; c < 6; c++) col(c, baseGround);
  player = makePlayer();
  player.x = 2 * TILE; player.y = (baseGround - 2) * TILE;

  let cursor = 6;
  let curHeight = baseGround;
  let lastEnemyAt = 0;
  let lastPowerAt = 0;

  while(cursor < lengthTiles - 8){
    // Gap width 1..MAX_JUMP_GAP_TILES — clamped so every jump stays reachable.
    const gapW = 1 + Math.floor(Math.random() * MAX_JUMP_GAP_TILES);
    // Climb budget shrinks as the gap widens (a long+high jump is impossible).
    const maxClimb = Math.max(0, MAX_JUMP_HEIGHT_TILES - Math.max(0, gapW - 1));
    const climb    = Math.floor((Math.random() - 0.55) * 2 * (maxClimb + 1));  // bias slightly downward
    const newHeight = Math.max(4, Math.min(skyH - 2, curHeight + climb));

    const platW = 3 + Math.floor(Math.random() * 6);
    if(cursor + gapW + platW > lengthTiles - 6) break;

    // From level 1 onwards, some gaps get water / fire on the floor —
    // falling in is lethal, so the player MUST clear the gap.
    if(idx > 0 && gapW >= 2 && Math.random() < 0.4){
      emitHazard(cursor, cursor + gapW, Math.random() < 0.5 ? 'water' : 'fire');
    }

    cursor += gapW;

    // Place the platform.
    for(let c = 0; c < platW; c++) col(cursor + c, newHeight);

    // Coins (60% chance) above the platform.
    if(Math.random() < 0.6){
      const n = 1 + Math.floor(Math.random() * Math.min(3, Math.max(1, platW - 1)));
      for(let i = 0; i < n; i++){
        const cx = (cursor + 1 + i) * TILE;
        const cy = (newHeight - 2) * TILE;
        coins.push({ x: cx + TILE*0.18, y: cy + TILE*0.18, w: TILE*0.64, h: TILE*0.64, collected: false, t: 0 });
      }
    }

    // Enemy (40% chance, throttled to once every few platforms).
    if(Math.random() < 0.4 && cursor - lastEnemyAt > 5){
      lastEnemyAt = cursor;
      const pool = ['slime'];
      if(idx >= 1) pool.push('jumper');
      if(idx >= 2) pool.push('shooter');
      if(idx >= 3) pool.push('flyer');
      const kind = pool[Math.floor(Math.random() * pool.length)];
      slimes.push(makeEnemy(kind, (cursor + Math.floor(platW/2)) * TILE, (newHeight - 1) * TILE));
    }

    // Powerup (~15% chance, throttled).
    if(Math.random() < 0.15 && cursor - lastPowerAt > 4){
      lastPowerAt = cursor;
      const r = Math.random();
      const pkind = r < 0.45 ? 'mushroom' : r < 0.85 ? 'flower' : 'star';
      const px = (cursor + Math.floor(platW/2)) * TILE;
      const py = (newHeight - 3) * TILE;
      powerups.push({ x: px, y: py, w: TILE*0.8, h: TILE*0.8, kind: pkind, taken: false, t: 0 });
    }

    cursor += platW;
    curHeight = newHeight;
  }

  // Final stretch: continuous ground up to the flag.
  for(let c = cursor; c < lengthTiles; c++) col(c, baseGround);
  flag = { x: (lengthTiles - 3) * TILE, y: (baseGround - 2) * TILE, w: TILE, h: TILE * 2 };
}

function makeEnemy(kind, cx, baseY){
  const w = TILE * 0.85, h = TILE * 0.65;
  const e = {
    kind,
    x: cx - w/2, y: baseY - h,
    w, h,
    vx: -90, vy: 0, dir: -1, alive: true, t: 0
  };
  if(kind === 'jumper'){
    e.vx = -110;
    e.jumpCd = 1200 + Math.random() * 1200;
  } else if(kind === 'shooter'){
    e.vx = 0;
    e.fireCd = 1200 + Math.random() * 600;
  } else if(kind === 'flyer'){
    e.vx = -90;
    e.y = baseY - h - 3 * TILE;          // float high
    e.startY = e.y;
    e.flyT = Math.random() * 6;
    e.weightless = true;
  }
  return e;
}

function makePlayer(){
  return {
    x: 0, y: 0, w: TILE * 0.78, h: TILE * 0.95,
    vx: 0, vy: 0, onGround: false, facing: 1,
    lastGroundMs: -9999, jumpQueuedMs: -9999, jumpHeld: false,
    anim: 'idle', animT: 0, duck: false, alive: true,
    invulnUntil: 0,
    big: false, canShoot: false, starUntil: 0, lastShotMs: 0
  };
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
// keys.* is the KEYBOARD/TOUCH state (button is currently held). The gamepad
// is polled separately each frame into `pad.*` so the two never overwrite
// each other — the previous code wrote keys.* from the gamepad and then
// failed to clear it when the stick re-centered, leaving the character
// running forever ("col joypad fisico l'omino non si ferma mai").
const keys = { left:false, right:false, jump:false, duck:false, shoot:false };
const pad  = { left:false, right:false, jump:false, jumpEdge:false, shoot:false, shootEdge:false, _prevJump:false, _prevShoot:false };
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A'){ keys.left = true; }
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ keys.right = true; }
  if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' '){
    if(!keys.jump && player) player.jumpQueuedMs = performance.now();
    keys.jump = true;
  }
  if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){ keys.duck = true; }
  if(e.key === 'x' || e.key === 'X' || e.key === 'Shift' || e.key === 'z' || e.key === 'Z'){
    keys.shoot = true;
  }
  if(e.key === 'Escape' && running) showPauseMenu();
});
window.addEventListener('keyup', e => {
  if(e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = false;
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
  if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.duck = false;
  if(e.key === 'x' || e.key === 'X' || e.key === 'Shift' || e.key === 'z' || e.key === 'Z') keys.shoot = false;
});

['t-left','t-right','t-jump','t-shoot'].forEach(id => {
  const btn = document.getElementById(id);
  if(!btn) return;
  const fnDown = e => { e.preventDefault();
    if(id === 't-left')  keys.left = true;
    if(id === 't-right') keys.right = true;
    if(id === 't-jump'){ if(!keys.jump && player) player.jumpQueuedMs = performance.now(); keys.jump = true; }
    if(id === 't-shoot') keys.shoot = true;
  };
  const fnUp = e => { e.preventDefault();
    if(id === 't-left')  keys.left = false;
    if(id === 't-right') keys.right = false;
    if(id === 't-jump')  keys.jump = false;
    if(id === 't-shoot') keys.shoot = false;
  };
  btn.addEventListener('touchstart', fnDown, {passive:false});
  btn.addEventListener('mousedown',  fnDown);
  btn.addEventListener('touchend',   fnUp,   {passive:false});
  btn.addEventListener('mouseup',    fnUp);
  btn.addEventListener('mouseleave', fnUp);
});

// Poll gamepad each frame INTO pad.* (not keys.*). Stick deadzone is the
// soft 0.18 we use elsewhere; d-pad fills in below that. Edge flags fire
// once per press so the buffered-jump system keeps working.
function pollGamepad(){
  if(!window.GamepadInput || !window.GamepadInput.isConnected()){
    pad.left = pad.right = pad.jump = pad.shoot = false;
    pad.jumpEdge = pad.shootEdge = false;
    pad._prevJump = pad._prevShoot = false;
    return;
  }
  const gp = GamepadInput.state();
  const stickX = Math.abs(gp.stickL.x) > 0.18 ? gp.stickL.x : 0;
  const dpadX  = gp.dir.x || 0;
  const dx     = stickX !== 0 ? stickX : dpadX;
  pad.left  = dx < -0.18;
  pad.right = dx >  0.18;
  const jump  = !!gp.buttons[0] || !!gp.buttons[3];     // A / Y
  const shoot = !!gp.buttons[2] || !!gp.buttons[1] || !!gp.buttons[7];  // X / B / R2
  pad.jump  = jump;
  pad.shoot = shoot;
  pad.jumpEdge  = jump  && !pad._prevJump;
  pad.shootEdge = shoot && !pad._prevShoot;
  pad._prevJump  = jump;
  pad._prevShoot = shoot;
}

// ── COLLISIONS ────────────────────────────────────────────────────────────────
function rectVsRect(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function moveBox(box, dx, dy){
  // Move box one axis at a time and resolve against solids
  box.x += dx;
  for(const s of solids){
    if(rectVsRect(box, s)){
      if(dx > 0) box.x = s.x - box.w;
      else if(dx < 0) box.x = s.x + s.w;
      box.collidedX = true;
    }
  }
  box.y += dy;
  box.collidedDown = false; box.collidedUp = false;
  for(const s of solids){
    if(rectVsRect(box, s)){
      if(dy > 0){ box.y = s.y - box.h; box.collidedDown = true; }
      else if(dy < 0){ box.y = s.y + s.h; box.collidedUp = true; }
    }
  }
}

// ── PHYSICS ───────────────────────────────────────────────────────────────────
function updatePlayer(dt){
  if(!player.alive) return;
  const now = performance.now();
  pollGamepad();
  // Buffer jump on the rising edge from EITHER source.
  if(pad.jumpEdge) player.jumpQueuedMs = now;
  // OR the two input sources together.
  const leftIn  = keys.left  || pad.left;
  const rightIn = keys.right || pad.right;
  const jumpIn  = keys.jump  || pad.jump;

  player.duck = keys.duck && player.onGround;
  // Horizontal: input
  let ax = 0;
  if(leftIn)  ax = -1;
  if(rightIn) ax =  1;
  if(player.duck) ax *= 0.4;
  if(ax !== 0){
    player.vx = ax * WALK_SPEED;
    player.facing = ax > 0 ? 1 : -1;
  } else {
    // Stop quickly on ground, drift in air
    player.vx *= player.onGround ? 0.6 : AIR_DRAG;
    if(Math.abs(player.vx) < 4) player.vx = 0;
  }
  // Vertical: gravity
  player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
  // Jump: buffered + coyote time
  const canJump =
    (now - player.lastGroundMs) <= COYOTE_MS &&
    (now - player.jumpQueuedMs) <= JUMP_BUFFER_MS;
  if(canJump){
    player.vy = -JUMP_VEL;
    player.jumpQueuedMs = -9999;
    player.lastGroundMs = -9999;
    player.onGround = false;
  }
  // Variable jump height: release jump → halve upward velocity
  if(!jumpIn && player.vy < -200){
    player.vy *= 0.5;
  }
  // Shoot (only if the player picked up the flower powerup).
  if(player.canShoot && (keys.shoot || pad.shootEdge)){
    shootPlayer();
  }
  // Apply movement axis-by-axis
  moveBox(player, player.vx * dt, 0);
  moveBox(player, 0, player.vy * dt);
  if(player.collidedDown){
    player.onGround = true;
    player.lastGroundMs = now;
    player.vy = 0;
  } else {
    player.onGround = false;
  }
  if(player.collidedUp){ player.vy = 0; }
  // Enemy interactions
  const invinc = now < player.starUntil;
  for(const sl of slimes){
    if(!sl.alive) continue;
    const slBox = { x: sl.x, y: sl.y, w: sl.w, h: sl.h };
    if(!rectVsRect(player, slBox)) continue;
    if(invinc){
      // Star power: ram through enemies.
      sl.alive = false;
      score += 75;
      continue;
    }
    // Stomp: player falling AND clearly above. Flyers and shooters can be
    // stomped just the same — landing on their head sends them away.
    const playerBottom = player.y + player.h;
    if(player.vy > 50 && playerBottom - 18 < sl.y){
      sl.alive = false;
      score += 50;
      player.vy = -JUMP_VEL * 0.6;
    } else if(now >= player.invulnUntil){
      playerHit(sl.dir || 0);
    }
  }
  // Coin pickup
  for(const c of coins){
    if(c.collected) continue;
    if(rectVsRect(player, c)){
      c.collected = true;
      score += 10;
      if(Coins) Coins.add(1, 'platformer-coin');
    }
  }
  // Powerup pickup
  for(const p of powerups){
    if(p.taken) continue;
    if(rectVsRect(player, p)){
      p.taken = true;
      applyPowerup(p.kind);
    }
  }
  // Hazard (water / fire) — falling in is lethal unless star is up.
  if(!invinc && now >= player.invulnUntil){
    for(const h of hazards){
      if(rectVsRect(player, h)){
        playerHit(0);
        break;
      }
    }
  }
  // Flag reached
  if(flag && rectVsRect(player, flag)){
    onLevelClear();
    return;
  }
  // Fell off the bottom
  if(player.y > levelH + 200){
    playerHit(0);
  }
  // Animation
  player.animT += dt;
  if(!player.onGround) player.anim = 'jump';
  else if(player.duck) player.anim = 'duck';
  else if(Math.abs(player.vx) > 30) player.anim = 'walk';
  else player.anim = 'idle';
}

function applyPowerup(kind){
  if(kind === 'mushroom'){
    if(!player.big){
      player.big = true;
      player.h = TILE * 1.35;
      // Lift the player so the new bottom matches the old bottom.
      player.y -= TILE * 0.40;
    }
    lives++;
    score += 100;
  } else if(kind === 'flower'){
    player.canShoot = true;
    score += 150;
  } else if(kind === 'star'){
    player.starUntil = performance.now() + 20000;     // 20 s invincibility
    score += 200;
  }
}

function shootPlayer(){
  const now = performance.now();
  if(now - player.lastShotMs < 280) return;
  player.lastShotMs = now;
  bullets.push({
    x: player.x + player.w/2 + player.facing * player.w * 0.5,
    y: player.y + player.h * 0.45,
    vx: player.facing * 560, vy: 0,
    fromEnemy: false, life: 1.5
  });
}

function playerHit(pushDir){
  const now = performance.now();
  if(now < player.invulnUntil || now < player.starUntil) return;
  // Lose powerups first — flower then mushroom — before losing a life.
  if(player.canShoot){
    player.canShoot = false;
    player.invulnUntil = now + 1400;
    return;
  }
  if(player.big){
    player.big = false;
    player.h = TILE * 0.95;
    player.invulnUntil = now + 1400;
    return;
  }
  lives--;
  if(lives <= 0){ onGameOver(); return; }
  player.invulnUntil = now + 1400;
  player.vy = -480;
  player.vx = (pushDir || 0) * 200;
}

// Generic enemy update — branches on .kind. Slime: classic walker.
// Jumper: same walker + periodic jump. Shooter: stationary turret that
// fires aimed bullets at the player. Flyer: floats horizontally in a
// gentle sine wave, no gravity, no walls.
function updateSlimes(dt){
  for(const sl of slimes){
    if(!sl.alive) continue;
    sl.t += dt;

    if(sl.kind === 'shooter'){
      sl.fireCd -= dt * 1000;
      if(sl.fireCd <= 0 && player && player.alive){
        const dx = (player.x + player.w/2) - (sl.x + sl.w/2);
        const dy = (player.y + player.h/2) - (sl.y + sl.h/2);
        const m = Math.hypot(dx, dy) || 1;
        bullets.push({
          x: sl.x + sl.w/2, y: sl.y + sl.h/2,
          vx: (dx/m) * 280, vy: (dy/m) * 280,
          fromEnemy: true, life: 3
        });
        sl.fireCd = 1400 + Math.random() * 800;
      }
      continue;
    }
    if(sl.kind === 'flyer'){
      sl.flyT += dt;
      sl.x += sl.vx * dt;
      sl.y = sl.startY + Math.sin(sl.flyT * 2.4) * 26;
      // Bounce off level edges so they don't fly off into nothingness.
      if(sl.x < 0){ sl.x = 0; sl.vx = Math.abs(sl.vx); }
      if(sl.x + sl.w > levelW){ sl.x = levelW - sl.w; sl.vx = -Math.abs(sl.vx); }
      continue;
    }

    // slime + jumper: walk, fall, optionally jump.
    sl.x += sl.vx * dt;
    for(const s of solids){
      const slBox = { x: sl.x, y: sl.y, w: sl.w, h: sl.h };
      if(rectVsRect(slBox, s)){
        if(sl.vx > 0) sl.x = s.x - sl.w; else sl.x = s.x + s.w;
        sl.vx = -sl.vx; sl.dir = -sl.dir;
      }
    }
    if(sl.kind === 'jumper'){
      sl.jumpCd -= dt * 1000;
    }
    sl.vy = (sl.vy || 0) + GRAVITY * dt;
    sl.vy = Math.min(MAX_FALL, sl.vy);
    sl.y += sl.vy * dt;
    let landed = false;
    for(const s of solids){
      const slBox = { x: sl.x, y: sl.y, w: sl.w, h: sl.h };
      if(rectVsRect(slBox, s)){
        if(sl.vy > 0){ sl.y = s.y - sl.h; sl.vy = 0; landed = true; }
        else if(sl.vy < 0){ sl.y = s.y + s.h; sl.vy = 0; }
      }
    }
    // Jumper: when on ground and cooldown elapsed, leap.
    if(landed && sl.kind === 'jumper' && sl.jumpCd <= 0){
      sl.vy = -520;
      sl.jumpCd = 1500 + Math.random() * 1500;
    }
    // Drop-edge check: slimes flip at platform edges (don't fall off).
    // Jumpers DO fall off — they want to chase the player vertically.
    if(landed && sl.kind === 'slime'){
      const ahead = { x: sl.x + (sl.dir > 0 ? sl.w + 2 : -2), y: sl.y + sl.h + 2, w: 4, h: 4 };
      let hasGround = false;
      for(const s of solids){ if(rectVsRect(ahead, s)){ hasGround = true; break; } }
      if(!hasGround){ sl.vx = -sl.vx; sl.dir = -sl.dir; }
    }
  }
}

function updateBullets(dt){
  const now = performance.now();
  const invinc = now < player.starUntil;
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if(b.life <= 0 || b.x < -50 || b.x > levelW + 50 || b.y > levelH + 100 || b.y < -200){
      bullets.splice(i, 1); continue;
    }
    // Hit solids — bullets don't pierce walls.
    let hitWall = false;
    for(const s of solids){
      if(b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h){
        hitWall = true; break;
      }
    }
    if(hitWall){ bullets.splice(i, 1); continue; }
    if(b.fromEnemy){
      // Vs the player.
      if(player.alive && !invinc && now >= player.invulnUntil){
        const dx = (player.x + player.w/2) - b.x;
        const dy = (player.y + player.h/2) - b.y;
        if(dx*dx + dy*dy < 22*22){
          playerHit(b.vx < 0 ? -1 : 1);
          bullets.splice(i, 1);
          continue;
        }
      }
    } else {
      // Vs enemies — friendly bullets kill any enemy on hit.
      for(const sl of slimes){
        if(!sl.alive) continue;
        if(b.x > sl.x && b.x < sl.x + sl.w && b.y > sl.y && b.y < sl.y + sl.h){
          sl.alive = false;
          score += 50;
          bullets.splice(i, 1);
          break;
        }
      }
    }
  }
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
function updateCamera(dt){
  if(!player) return;
  const targetX = player.x + player.w/2 - W/2;
  const targetY = player.y + player.h/2 - H/2;
  camera.x += (targetX - camera.x) * 6 * dt;
  camera.y += (targetY - camera.y) * 5 * dt;
  camera.x = Math.max(0, Math.min(levelW - W, camera.x));
  camera.y = Math.max(0, Math.min(levelH - H + 40, camera.y));
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  ctx.imageSmoothingEnabled = false;
  // Background (tiled, parallax-1:0.5)
  if(Assets.bg && Assets.bg.complete && Assets.bg.naturalWidth){
    const bgW = Assets.bg.naturalWidth, bgH = Assets.bg.naturalHeight;
    const scale = H / bgH;
    const sw = bgW * scale;
    const offset = -((camera.x * 0.5) % sw);
    for(let x = offset; x < W; x += sw){
      ctx.drawImage(Assets.bg, x, 0, sw, H);
    }
  } else {
    ctx.fillStyle = '#8ec6e8';
    ctx.fillRect(0, 0, W, H);
  }
  // World
  ctx.save();
  ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));
  // Solids (ground)
  const pkOn = graphicsMode === 'pokemon';
  for(const s of solids){
    if(s.x + s.w < camera.x - TILE || s.x > camera.x + W + TILE) continue;
    // Top tile uses grass-topped sprite; deeper tiles use centre dirt sprite.
    // In Brutimon mode, swap to grass/path (with classic-sprite fallback if
    // the Brutimon images failed to load).
    const hasTileAbove = solids.some(o => o.x === s.x && o.y + o.h === s.y);
    let img;
    if(pkOn){
      img = hasTileAbove ? (imgReady(Assets.pkGroundC) ? Assets.pkGroundC : Assets.groundC)
                         : (imgReady(Assets.pkGround)  ? Assets.pkGround  : Assets.ground);
    } else {
      img = hasTileAbove ? Assets.groundC : Assets.ground;
    }
    if(imgReady(img)){
      ctx.drawImage(img, s.x, s.y, s.w, s.h);
    } else {
      ctx.fillStyle = '#6b4022'; ctx.fillRect(s.x, s.y, s.w, s.h);
    }
  }
  // Hazards (water/fire) — animated stripes / flames.
  const nowMs = performance.now();
  for(const h of hazards){
    if(h.x + h.w < camera.x - TILE || h.x > camera.x + W + TILE) continue;
    if(h.kind === 'water'){
      ctx.fillStyle = '#1e6fff';
      ctx.fillRect(h.x, h.y, h.w, h.h);
      // Wavy highlight on top.
      ctx.fillStyle = '#7fc6ff';
      for(let i = 0; i < 4; i++){
        const wx = h.x + (i + 0.5) * (h.w / 4);
        const wy = h.y + 6 + Math.sin(nowMs * 0.005 + i + h.x * 0.01) * 3;
        ctx.fillRect(wx - 6, wy, 12, 3);
      }
    } else {
      ctx.fillStyle = '#3a1208';
      ctx.fillRect(h.x, h.y, h.w, h.h);
      // Flame tongues.
      const flick = (i) => 8 + Math.abs(Math.sin(nowMs * 0.012 + i + h.x * 0.02)) * 26;
      for(let i = 0; i < 4; i++){
        const fx = h.x + (i + 0.5) * (h.w / 4);
        const fh = flick(i);
        ctx.fillStyle = '#ff6622';
        ctx.fillRect(fx - 9, h.y + h.h - fh, 18, fh);
        ctx.fillStyle = '#ffcc44';
        ctx.fillRect(fx - 4, h.y + h.h - fh * 0.55, 8, fh * 0.55);
      }
    }
  }
  // Coins (with bobbing animation)
  for(const c of coins){
    if(c.collected) continue;
    c.t += 0.06;
    const yo = Math.sin(c.t) * 4;
    if(Assets.coin && Assets.coin.complete && Assets.coin.naturalWidth){
      ctx.drawImage(Assets.coin, c.x, c.y + yo, c.w, c.h);
    } else {
      ctx.fillStyle = '#ffcc00'; ctx.beginPath();
      ctx.arc(c.x + c.w/2, c.y + c.h/2 + yo, c.w/2, 0, Math.PI*2); ctx.fill();
    }
  }
  // Powerups — bright icons that bob gently.
  for(const p of powerups){
    if(p.taken) continue;
    p.t += 0.05;
    const yo = Math.sin(p.t) * 3;
    const cx = p.x + p.w/2, cy = p.y + p.h/2 + yo;
    const r  = p.w/2;
    ctx.save();
    ctx.shadowBlur = 14;
    if(p.kind === 'mushroom'){
      ctx.shadowColor = '#ff5566';
      ctx.fillStyle = '#ff5566';
      ctx.beginPath(); ctx.arc(cx, cy - 2, r * 0.75, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff8e6';
      ctx.fillRect(cx - r*0.6, cy - 2, r*1.2, r*0.65);
      ctx.fillStyle = '#ffe6cc';
      ctx.beginPath(); ctx.arc(cx - r*0.35, cy - 6, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r*0.35, cy - 6, r*0.18, 0, Math.PI*2); ctx.fill();
    } else if(p.kind === 'flower'){
      ctx.shadowColor = '#ff8aff';
      ctx.fillStyle = '#ff8aff';
      // 5 petals
      for(let k = 0; k < 5; k++){
        const a = (k / 5) * Math.PI * 2 - Math.PI/2;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a)*r*0.5, cy + Math.sin(a)*r*0.5, r*0.35, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.32, 0, Math.PI*2); ctx.fill();
    } else { // star
      ctx.shadowColor = '#ffe04a';
      ctx.fillStyle = '#ffe04a';
      ctx.beginPath();
      for(let k = 0; k < 5; k++){
        const a1 = (k / 5) * Math.PI * 2 - Math.PI/2;
        const a2 = a1 + Math.PI / 5;
        ctx.lineTo(cx + Math.cos(a1)*r,        cy + Math.sin(a1)*r);
        ctx.lineTo(cx + Math.cos(a2)*r*0.45,   cy + Math.sin(a2)*r*0.45);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // Bullets — small projectiles. Friendly = white core / yellow trail,
  // enemy = red.
  for(const b of bullets){
    if(b.x + 12 < camera.x || b.x - 12 > camera.x + W) continue;
    const col = b.fromEnemy ? '#ff5566' : '#ffe04a';
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // Flag
  if(flag && Assets.flag && Assets.flag.complete && Assets.flag.naturalWidth){
    ctx.drawImage(Assets.flag, flag.x, flag.y, flag.w, flag.h);
  } else if(flag){
    ctx.fillStyle = '#ff4466'; ctx.fillRect(flag.x + TILE*0.3, flag.y, 4, TILE);
  }
  // Slimes (2-frame walk anim; in Brutimon mode all frames use grunt sprite)
  for(const sl of slimes){
    if(!sl.alive) continue;
    let img;
    if(pkOn && imgReady(Assets.pkSlime)){
      img = Assets.pkSlime;
    } else {
      const frame = Math.floor(sl.t * 4) % 2 === 0 ? Assets.slimeA : Assets.slimeB;
      img = frame || Assets.slimeR;
    }
    if(imgReady(img)){
      ctx.save();
      ctx.translate(sl.x + sl.w/2, sl.y + sl.h/2);
      if(sl.dir > 0) ctx.scale(-1, 1);
      ctx.drawImage(img, -sl.w/2, -sl.h/2, sl.w, sl.h);
      ctx.restore();
    } else {
      ctx.fillStyle = '#5fdc5f'; ctx.fillRect(sl.x, sl.y, sl.w, sl.h);
    }
  }
  // Player
  if(player && player.alive){
    let img = Assets.idle;
    if(player.anim === 'walk'){
      img = Math.floor(player.animT * 10) % 2 === 0 ? Assets.walkA : Assets.walkB;
    } else if(player.anim === 'jump') img = Assets.jump;
    else if(player.anim === 'duck')   img = Assets.idle;
    const now = performance.now();
    const flash    = now < player.invulnUntil && Math.floor(now / 80) % 2 === 0;
    const starOn   = now < player.starUntil;
    if(!flash){
      if(img && img.complete && img.naturalWidth){
        ctx.save();
        ctx.translate(player.x + player.w/2, player.y + player.h/2);
        if(player.facing < 0) ctx.scale(-1, 1);
        // Star: rainbow halo + hue-rotated outline behind the sprite.
        if(starOn){
          const hue = (now / 4) % 360;
          ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
          ctx.shadowBlur  = 28;
        }
        // Flower-powerup tint: subtle pink overlay so the user knows
        // they can shoot.
        if(player.canShoot){
          ctx.shadowColor = '#ff8aff';
          ctx.shadowBlur  = Math.max(ctx.shadowBlur || 0, 14);
        }
        ctx.drawImage(img, -player.w/2, -player.h/2, player.w, player.h);
        ctx.restore();
      } else {
        ctx.fillStyle = starOn ? `hsl(${(now/4)%360}, 100%, 60%)` : '#44ff88';
        ctx.fillRect(player.x, player.y, player.w, player.h);
      }
    }
    // Mini star-timer ring under the player while invincible — gives a
    // sense of how much time is left.
    if(starOn){
      const left = (player.starUntil - now) / 20000;
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = `hsl(${(now/4)%360}, 100%, 60%)`;
      ctx.beginPath();
      ctx.arc(player.x + player.w/2, player.y + player.h + 8,
              player.w * 0.45, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * left);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHud(){
  document.getElementById('h-level').textContent = (levelIdx + 1);
  document.getElementById('h-lives').textContent = lives;
  document.getElementById('h-score').textContent = score;
  document.getElementById('h-coins').textContent = Coins ? Coins.formatted() : '0';
}

// ── FLOW ──────────────────────────────────────────────────────────────────────
function showMainMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>PIXEL PLATFORMER</h2>
    <p>Frecce/WASD/d-pad · SPACE / ↑ per saltare · X / Z per sparare</p>
    <p>Salta sui nemici per eliminarli. Schiva acqua e fuoco. Raccogli powerup:
       <b style="color:#ff5566">🍄</b> +vita,
       <b style="color:#ff8aff">✿</b> spara,
       <b style="color:#ffe04a">★</b> invincibile 20s.</p>
    <p style="color:#9ab;font-size:.78rem">Livelli infiniti e procedurali — ognuno più lungo del precedente.</p>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" id="graphics-toggle-btn" onclick="toggleGraphics()" style="padding:6px 18px;font-size:0.72rem">${graphicsMode === 'pokemon' ? 'BRUTIMON' : 'CLASSIC'}</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function startGame(){
  levelIdx = 0;
  score = 0;
  lives = 3;
  player = null;
  generateLevel(0);
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function onLevelClear(){
  running = false;
  const bonus = 5 * (levelIdx + 1);
  if(Coins) Coins.add(bonus, 'platformer-level-' + (levelIdx+1));
  // No max level anymore — the generator runs forever.
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#44ff88;text-shadow:0 0 28px #44ff88">LEVEL CLEAR</h2>
    <p>Level: <b style="color:#fff">${levelIdx + 1}</b></p>
    <p>Score: <b style="color:#fff">${score}</b></p>
    <p>+${bonus}🪙 reward</p>
    <div class="btn-row">
      <button class="btn gold" onclick="nextLevel()">NEXT LEVEL ▶</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function nextLevel(){
  levelIdx++;
  player = null;
  generateLevel(levelIdx);
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function onGameOver(){
  running = false;
  // Leaderboard score = level reached * 1000 + score (level dominates, score tie-break).
  if(window.CloudSync) CloudSync.recordScore(null, (levelIdx + 1) * 1000 + score);
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">GAME OVER</h2>
    <p>Score: <b style="color:#fff">${score}</b></p>
    <p>Level reached: <b style="color:#fff">${levelIdx + 1}</b></p>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">RETRY</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function showPauseMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>PAUSE</h2>
    <p>Level ${levelIdx + 1} · Lives ${lives} · Score ${score}</p>
    <div class="btn-row">
      <button class="btn" onclick="resumeGame()">RESUME</button>
      <button class="btn" onclick="startGame()">RESTART</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function resumeGame(){
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function goBack(){
  if(running && !confirm('Tornare al menu principale?')) return;
  window.location.href = '../';
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.033, (ts - lastT) / 1000);
  lastT = ts;
  updatePlayer(dt);
  updateSlimes(dt);
  updateBullets(dt);
  updateCamera(dt);
  draw();
  updateHud();
  // Show / hide the touch shoot button when the flower powerup is on.
  const sb = document.getElementById('t-shoot');
  if(sb) sb.style.display = (player && player.canShoot) ? 'flex' : 'none';
  requestAnimationFrame(loop);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
showMainMenu();
window.addEventListener('coins:change', updateHud);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
