<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NIGHT STREETS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Streets">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../shared/touch-dpad.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050810;color:#e0e8ff;
    font-family:'Share Tech Mono',monospace;overflow:hidden;
    min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;
  }
  #game-wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  #game{display:block;width:100%;height:100%;background:#050810;touch-action:none}

  #hud{
    position:fixed;top:0;left:0;right:0;padding:8px 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:linear-gradient(to bottom,#050810dd,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center;min-width:48px}
  .hud-label{font-size:9px;letter-spacing:.2em;color:#00f5ff99;text-transform:uppercase}
  .hud-value{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.05rem;color:#fff;
    text-shadow:0 0 10px #00f5ff;line-height:1;margin-top:2px;letter-spacing:.05em;
  }
  .hud-value.coins{color:#ffcc00;text-shadow:0 0 10px #ffcc0088}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#050810cc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.2rem;
    color:#00f5ff;letter-spacing:.25em;text-shadow:0 0 30px #00f5ff;margin-bottom:6px;
  }
  #overlay p{color:#a0b8e0;font-size:.9rem;letter-spacing:.1em}
  .btn{
    margin-top:8px;padding:10px 24px;background:transparent;border:2px solid #00f5ff;
    color:#00f5ff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #00f5ff44;transition:all .15s;
  }
  .btn:hover{background:#00f5ff22;box-shadow:0 0 28px #00f5ff88}
  .btn.gold{border-color:#44ff88;color:#44ff88;box-shadow:0 0 18px #44ff8844}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div style="width:42px"></div>
  <div class="hud-item"><span class="hud-label">Level</span><span class="hud-value" id="h-level">1</span></div>
  <div class="hud-item"><span class="hud-label">Heat</span><span class="hud-value" id="h-heat">0%</span></div>
  <div class="hud-item"><span class="hud-label">Coins</span><span class="hud-value coins" id="h-coins">0</span></div>
</div>

<button id="back-btn" onclick="goBack()">✖</button>

<div id="overlay"></div>

<script src="../shared/coins.js"></script>
<script src="../shared/touch-dpad.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  computeLayout();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));

// ── CONFIG ────────────────────────────────────────────────────────────────────
const CELL = 32;
const MAP_W = 24, MAP_H = 16;
const PLAYER_SPEED = 230;        // px/sec — clearly faster than any guard so a sprint always opens a gap
const GUARD_SPEED = 80;          // px/sec patrol
const GUARD_ALERT_SPEED = 135;   // chase speed
const GUARD_TURN_PATROL = 2.6;   // rad/sec — fast turn while patrolling (always tracks waypoint)
const GUARD_TURN_ALERT  = 1.6;   // rad/sec — slower when alert so dashing sideways DOES break LOS
const VISION_RANGE = 220;
const VISION_ARC = Math.PI / 3;  // 60° vision cone
const SPOT_DELAY_MS = 350;       // grace before heat starts — "huh, was that…?" reaction
const HEAT_PER_SEC = 32;         // ~3.1s of continuous full sight before death
const HEAT_COOL = 60;            // recovery once hidden — fast so a glimpse doesn't snowball
const HEAT_MAX = 100;

// ── LEVELS ────────────────────────────────────────────────────────────────────
// Grid notation: '#'=wall, ' '=floor, 'P'=player spawn, 'X'=exit,
//                'G'=guard (followed by patrol direction in next char optional)
const LEVELS = [
  [
    '########################',
    '#P                     #',
    '#  ###############     #',
    '#  #             #     #',
    '#  #   G         #     #',
    '#  #             #     #',
    '#  ###########   #     #',
    '#                #     #',
    '#  ##########    #######',
    '#  #               G  X#',
    '#  #                   #',
    '#  ############        #',
    '#                G     #',
    '#                      #',
    '#                      #',
    '########################',
  ],
  [
    '########################',
    '#P                G    #',
    '#  #################   #',
    '#  #               #   #',
    '#  #  G            #   #',
    '#  ######          #   #',
    '#       #          #   #',
    '#       #  G       #   #',
    '#       ########   #   #',
    '#                  #   #',
    '#  G               # G #',
    '#                  #####',
    '#  ############        #',
    '#                      #',
    '#                     X#',
    '########################',
  ],
  [
    '########################',
    '#P  G    ##         G  #',
    '#        ##            #',
    '#  ####  ###########   #',
    '#     #            #   #',
    '#     #  G         #   #',
    '#  ####            #   #',
    '#  #          G   ###  #',
    '#  #####           #   #',
    '#                  #   #',
    '#  G               # G #',
    '#         ##########   #',
    '#  ####                #',
    '#               G      #',
    '#                     X#',
    '########################',
  ],
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let levelIdx = 0;
let walls = [];       // {x,y,w,h} (world coords)
let player = null;    // {x,y}
let guards = [];      // {x,y,patrol:[{x,y}], patrolIdx, dir, state:'patrol'|'alert'|'search', alertT}
let exitPos = null;
let heat = 0;
let running = false;

// Camera-scrolling layout — picks a scale that FILLS the viewport (the
// dimension with more headroom may overflow) and tracks the player. This
// removes the letterbox bands the old fit-min approach produced.
let mapScale = 1;
let cam = { x: (MAP_W * CELL) / 2, y: (MAP_H * CELL) / 2 };
function computeLayout(){
  const mapWpx = MAP_W * CELL;
  const mapHpx = MAP_H * CELL;
  // Fill the screen: take the LARGER ratio so neither axis leaves dead space.
  mapScale = Math.max(W / mapWpx, H / mapHpx);
  // Cap zoom on very large screens so gameplay doesn't get absurdly big.
  mapScale = Math.min(mapScale, 1.8);
}
fitCanvas();

// ── POKEMON SKIN (optional) ───────────────────────────────────────────────────
// When the global launcher skin is 'pokemon' (default) we paint the player
// and the guards as Pokemon sprites instead of plain circles. Vision cones
// and gameplay are unchanged.
const SKIN_ON = (localStorage.getItem('skin') || 'pokemon') === 'pokemon';
const PokeAssets = {
  ready:false, _t:0, _d:0, imgs:{},
  _hit(){ this._d++; if(this._d >= this._t) this.ready = true; },
  _load(key, path){
    const im = new Image();
    im.onload = () => this._hit();
    im.onerror = () => this._hit();
    im.src = path;
    this.imgs[key] = im;
    this._t++;
  },
  load(){
    const base = '../neon-defender/assets/skin-pokemon/';
    this._load('player',      base + 'swift.png');     // protagonist — fast & sneaky
    this._load('guardPatrol', base + 'shielded.png');  // patrolling guard
    this._load('guardAlert',  base + 'boss.png');      // alerted guard
  }
};
if(SKIN_ON) PokeAssets.load();
function pkImgReady(im){ return im && im.complete && im.naturalWidth > 0; }
function pkSprite(key){ const im = PokeAssets.imgs[key]; return pkImgReady(im) ? im : null; }

function updateCamera(){
  if(!player) return;
  cam.x = player.x;
  cam.y = player.y;
  // Clamp so we never see outside the map bounds.
  const mapWpx = MAP_W * CELL, mapHpx = MAP_H * CELL;
  const viewW = W / mapScale, viewH = H / mapScale;
  if(mapWpx > viewW){
    cam.x = Math.max(viewW/2, Math.min(mapWpx - viewW/2, cam.x));
  } else {
    cam.x = mapWpx / 2;     // map narrower than view → just center it
  }
  if(mapHpx > viewH){
    cam.y = Math.max(viewH/2, Math.min(mapHpx - viewH/2, cam.y));
  } else {
    cam.y = mapHpx / 2;
  }
}

function w2s(wx, wy){
  return {
    x: (wx - cam.x) * mapScale + W/2,
    y: (wy - cam.y) * mapScale + H/2
  };
}

// ── PROCEDURAL GENERATION ─────────────────────────────────────────────────────
// Generates a new level as a string-array (same format as the hand-crafted
// LEVELS). Algorithm:
//   1. Open arena bordered by walls.
//   2. Random P/X corners (always diagonally opposite for max distance).
//   3. Drop N rectangular wall blocks; reject blocks that would cover the
//      P/X cells or land within 3 tiles of them (no walling-in spawns).
//   4. BFS from P; if X isn't reachable, restart from step 1.
//   5. Place guards on random floor cells away from P/X.
// Difficulty (block count + guard count) scales with `level`.
function bfsReachable(rows, sx, sy, ex, ey){
  const visited = new Set();
  const queue = [[sx, sy]];
  visited.add(sx + ',' + sy);
  while(queue.length){
    const [x, y] = queue.shift();
    if(x === ex && y === ey) return true;
    for(const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, ny = y+dy;
      if(nx<0||nx>=MAP_W||ny<0||ny>=MAP_H) continue;
      const k = nx+','+ny;
      if(visited.has(k)) continue;
      if(rows[ny][nx] === '#') continue;
      visited.add(k);
      queue.push([nx, ny]);
    }
  }
  return false;
}
function generateProceduralLevel(level){
  // level is 1-indexed for difficulty math.
  const numBlocks = Math.min(14, 5 + Math.floor(level * 0.6));
  const numGuards = Math.min(9, 3 + Math.floor(level * 0.4));
  // Up to ~25 attempts in case rejection chains. Each attempt is cheap.
  for(let attempt = 0; attempt < 25; attempt++){
    const rows = [];
    for(let y = 0; y < MAP_H; y++){
      let s = '';
      for(let x = 0; x < MAP_W; x++){
        s += (x===0 || y===0 || x===MAP_W-1 || y===MAP_H-1) ? '#' : ' ';
      }
      rows.push(s);
    }
    const setCell = (x, y, ch) => { rows[y] = rows[y].substring(0, x) + ch + rows[y].substring(x+1); };
    const getCell = (x, y) => rows[y][x];

    // Pick spawn corner; exit goes to the diagonal opposite.
    const corners = [{sp:{x:1,y:1},          ex:{x:MAP_W-2,y:MAP_H-2}},
                     {sp:{x:MAP_W-2,y:1},    ex:{x:1,y:MAP_H-2}},
                     {sp:{x:1,y:MAP_H-2},    ex:{x:MAP_W-2,y:1}},
                     {sp:{x:MAP_W-2,y:MAP_H-2}, ex:{x:1,y:1}}];
    const c = corners[Math.floor(Math.random() * corners.length)];
    setCell(c.sp.x, c.sp.y, 'P');
    setCell(c.ex.x, c.ex.y, 'X');

    // Drop wall blocks (small rectangles).
    for(let i = 0; i < numBlocks; i++){
      const bw = 2 + Math.floor(Math.random() * 4);
      const bh = 2 + Math.floor(Math.random() * 3);
      const bx = 2 + Math.floor(Math.random() * (MAP_W - 4 - bw));
      const by = 2 + Math.floor(Math.random() * (MAP_H - 4 - bh));
      // Skip if too close to P or X (manhattan distance from block center).
      const cxB = bx + bw/2, cyB = by + bh/2;
      if(Math.abs(cxB - c.sp.x) + Math.abs(cyB - c.sp.y) < 4) continue;
      if(Math.abs(cxB - c.ex.x) + Math.abs(cyB - c.ex.y) < 4) continue;
      // Skip if overlaps P/X cells.
      let bad = false;
      for(let yy = by; yy < by+bh && !bad; yy++){
        for(let xx = bx; xx < bx+bw; xx++){
          const ch = getCell(xx, yy);
          if(ch === 'P' || ch === 'X'){ bad = true; break; }
        }
      }
      if(bad) continue;
      for(let yy = by; yy < by+bh; yy++){
        for(let xx = bx; xx < bx+bw; xx++){
          if(getCell(xx, yy) === ' ') setCell(xx, yy, '#');
        }
      }
    }

    // Make sure exit is reachable. Path is the layout's solvability check.
    if(!bfsReachable(rows, c.sp.x, c.sp.y, c.ex.x, c.ex.y)) continue;

    // Place guards on random floor cells, away from spawn and exit.
    let placed = 0, gAttempts = 0;
    while(placed < numGuards && gAttempts < 200){
      gAttempts++;
      const gx = 2 + Math.floor(Math.random() * (MAP_W - 4));
      const gy = 2 + Math.floor(Math.random() * (MAP_H - 4));
      if(getCell(gx, gy) !== ' ') continue;
      const dP = Math.abs(gx - c.sp.x) + Math.abs(gy - c.sp.y);
      const dX = Math.abs(gx - c.ex.x) + Math.abs(gy - c.ex.y);
      if(dP < 5 || dX < 3) continue;
      setCell(gx, gy, 'G');
      placed++;
    }
    return rows;
  }
  // Fallback: tiny safe layout if (somehow) every attempt failed.
  const safe = [];
  for(let y = 0; y < MAP_H; y++){
    let s = '';
    for(let x = 0; x < MAP_W; x++){
      s += (x===0 || y===0 || x===MAP_W-1 || y===MAP_H-1) ? '#' : ' ';
    }
    safe.push(s);
  }
  safe[1] = '#P' + safe[1].slice(2);
  safe[MAP_H-2] = safe[MAP_H-2].slice(0, MAP_W-2) + 'X#';
  return safe;
}
function levelGrid(idx){
  // First N levels are hand-crafted tutorials; from there on it's procedural,
  // with difficulty rising indefinitely. The +1 keeps level math 1-indexed.
  if(idx < LEVELS.length) return LEVELS[idx];
  return generateProceduralLevel(idx + 1);
}

// ── LOAD LEVEL ────────────────────────────────────────────────────────────────
function loadLevel(idx){
  levelIdx = idx;
  const grid = levelGrid(idx);
  walls = []; guards = []; exitPos = null;
  for(let y = 0; y < MAP_H; y++){
    const row = grid[y] || '';
    for(let x = 0; x < MAP_W; x++){
      const ch = row[x] || ' ';
      const wx = x * CELL, wy = y * CELL;
      if(ch === '#') walls.push({ x: wx, y: wy, w: CELL, h: CELL });
      else if(ch === 'P'){
        player = { x: wx + CELL/2, y: wy + CELL/2, r: 10 };
      } else if(ch === 'X'){
        exitPos = { x: wx + CELL/2, y: wy + CELL/2, r: 14 };
      } else if(ch === 'G'){
        // Patrol: random short 3-waypoint path around the spawn
        const patrol = [
          { x: wx + CELL/2, y: wy + CELL/2 },
          { x: wx + CELL/2 + (CELL * (3 + Math.floor(Math.random() * 3))), y: wy + CELL/2 },
          { x: wx + CELL/2, y: wy + CELL/2 + (CELL * (2 + Math.floor(Math.random() * 2))) }
        ];
        guards.push({
          x: patrol[0].x, y: patrol[0].y, r: 10, facing: 0,
          patrol, patrolIdx: 1, state: 'patrol', alertT: 0
        });
      }
    }
  }
  heat = 0;
  updateCamera();   // snap camera to the new player spawn (no warp on first frame)
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key === 'Escape' && running) showPauseMenu(); });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
// Virtual joystick — sets/clears arrow keys for continuous movement
TouchDpad.attach({
  canvas,
  onDirection: ({x, y}) => {
    keys['arrowup']    = (y === -1);
    keys['arrowdown']  = (y ===  1);
    keys['arrowleft']  = (x === -1);
    keys['arrowright'] = (x ===  1);
  },
  onStop: () => {
    keys['arrowup'] = keys['arrowdown'] = keys['arrowleft'] = keys['arrowright'] = false;
  }
});

// ── COLLISION ─────────────────────────────────────────────────────────────────
function circleVsWalls(cx, cy, cr){
  for(const w of walls){
    const closestX = Math.max(w.x, Math.min(cx, w.x + w.w));
    const closestY = Math.max(w.y, Math.min(cy, w.y + w.h));
    const dx = cx - closestX, dy = cy - closestY;
    if(dx*dx + dy*dy < cr*cr) return true;
  }
  return false;
}
function lineHitsWall(x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const steps = Math.ceil(Math.hypot(dx, dy) / 6);
  for(let i = 1; i < steps; i++){
    const t = i / steps;
    const px = x1 + dx * t, py = y1 + dy * t;
    for(const w of walls){
      if(px >= w.x && px <= w.x + w.w && py >= w.y && py <= w.y + w.h) return true;
    }
  }
  return false;
}

// Walk a ray from (x,y) at the given angle until it hits a wall or reaches
// `maxDist`. Returns the distance travelled. Used to clip the vision cone
// polygon against walls so guards can't "see" through corners.
function rayHitDist(x, y, angle, maxDist){
  const cx = Math.cos(angle), sy = Math.sin(angle);
  const STEP = 6;
  for(let d = STEP; d < maxDist; d += STEP){
    const px = x + cx * d, py = y + sy * d;
    for(const w of walls){
      if(px >= w.x && px <= w.x + w.w && py >= w.y && py <= w.y + w.h) return d;
    }
  }
  return maxDist;
}

// ── PLAYER ────────────────────────────────────────────────────────────────────
function updatePlayer(dt){
  let mx = 0, my = 0;
  if(keys['w'] || keys['arrowup'])    my -= 1;
  if(keys['s'] || keys['arrowdown'])  my += 1;
  if(keys['a'] || keys['arrowleft'])  mx -= 1;
  if(keys['d'] || keys['arrowright']) mx += 1;
  const m = Math.hypot(mx, my);
  if(m > 0){ mx /= m; my /= m; }
  const speed = PLAYER_SPEED;
  const nx = player.x + mx * speed * dt;
  const ny = player.y + my * speed * dt;
  if(!circleVsWalls(nx, player.y, player.r)) player.x = nx;
  if(!circleVsWalls(player.x, ny, player.r)) player.y = ny;
  // Exit check
  if(exitPos){
    const dx = exitPos.x - player.x, dy = exitPos.y - player.y;
    if(dx*dx + dy*dy < (player.r + exitPos.r) * (player.r + exitPos.r)){
      onLevelClear();
    }
  }
}

// ── GUARDS ────────────────────────────────────────────────────────────────────
// Lerp `cur` toward `target` (both radians) by at most `maxStep` rad, taking
// the shortest path around the circle. Used to cap the rate at which a
// guard's facing turns — without this, an alert guard would track the
// player instantly and side-stepping never broke line of sight.
function rotateToward(cur, target, maxStep){
  let da = target - cur;
  while(da > Math.PI) da -= 2*Math.PI;
  while(da < -Math.PI) da += 2*Math.PI;
  if(da > maxStep)  da = maxStep;
  if(da < -maxStep) da = -maxStep;
  return cur + da;
}
function updateGuards(dt){
  let seenThisFrame = false;
  const nowMs = performance.now();
  for(const g of guards){
    let speed = GUARD_SPEED;
    let target = g.patrol[g.patrolIdx];
    // Vision check: line of sight + within cone
    const seen = canSee(g, player);
    if(seen){
      if(g.state !== 'alert'){
        g.state = 'alert';
        g.spotStartMs = nowMs;     // start of grace before heat begins ticking
      }
      g.alertT = 3.0;              // pursue for 3 seconds after losing sight
      target = { x: player.x, y: player.y };
      speed = GUARD_ALERT_SPEED;
      // Only count toward heat after SPOT_DELAY_MS has passed.
      if(nowMs - (g.spotStartMs || nowMs) > SPOT_DELAY_MS) seenThisFrame = true;
    } else if(g.state === 'alert'){
      g.alertT -= dt;
      if(g.alertT <= 0){
        g.state = 'patrol';
        g.patrolIdx = 0;
        g.spotStartMs = 0;
      } else {
        // Keep moving to last known player position
        target = g.lastSeen || target;
        speed = GUARD_ALERT_SPEED * 0.85;
      }
    }
    if(seen) g.lastSeen = { x: player.x, y: player.y };
    const dx = target.x - g.x, dy = target.y - g.y;
    const dist = Math.hypot(dx, dy);
    // Smoothed facing toward the movement target. Alert guards turn slower
    // (1.6 rad/sec) so the cone visibly lags behind a player who sprints
    // perpendicular — that's the escape window.
    if(dist > 0.001){
      const wantFacing = Math.atan2(dy, dx);
      const maxRot = (g.state === 'alert' ? GUARD_TURN_ALERT : GUARD_TURN_PATROL) * dt;
      g.facing = rotateToward(g.facing, wantFacing, maxRot);
    }
    if(dist < 6){
      if(g.state === 'patrol'){
        g.patrolIdx = (g.patrolIdx + 1) % g.patrol.length;
      }
    } else {
      const nx = g.x + (dx / dist) * speed * dt;
      const ny = g.y + (dy / dist) * speed * dt;
      if(!circleVsWalls(nx, g.y, g.r)) g.x = nx;
      else { g.patrolIdx = (g.patrolIdx + 1) % g.patrol.length; }
      if(!circleVsWalls(g.x, ny, g.r)) g.y = ny;
      else { g.patrolIdx = (g.patrolIdx + 1) % g.patrol.length; }
    }
  }
  if(seenThisFrame){
    heat = Math.min(HEAT_MAX, heat + HEAT_PER_SEC * dt);
  } else {
    heat = Math.max(0, heat - HEAT_COOL * dt);
  }
  if(heat >= HEAT_MAX) onCaught();
}

function canSee(g, p){
  const dx = p.x - g.x, dy = p.y - g.y;
  const dist = Math.hypot(dx, dy);
  if(dist > VISION_RANGE) return false;
  const angTo = Math.atan2(dy, dx);
  let da = angTo - g.facing;
  while(da > Math.PI) da -= 2*Math.PI;
  while(da < -Math.PI) da += 2*Math.PI;
  if(Math.abs(da) > VISION_ARC / 2) return false;
  if(lineHitsWall(g.x, g.y, p.x, p.y)) return false;
  return true;
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  // Outside-map bg (in case the screen aspect is wider/taller than what the
  // camera can show — happens only briefly during transitions).
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);
  // Map floor — drawn at the camera-transformed position of the map origin (0,0).
  const origin = w2s(0, 0);
  const mapW = MAP_W * CELL * mapScale, mapH = MAP_H * CELL * mapScale;
  ctx.fillStyle = '#0a0d18';
  ctx.fillRect(origin.x, origin.y, mapW, mapH);
  // Walls
  for(const w of walls){
    const p = w2s(w.x, w.y);
    ctx.fillStyle = '#1f2a40';
    ctx.fillRect(p.x, p.y, w.w * mapScale, w.h * mapScale);
    ctx.strokeStyle = '#3a4a70';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x + 0.5, p.y + 0.5, w.w * mapScale - 1, w.h * mapScale - 1);
  }
  // Vision cones — raycast against walls so the cone is clipped at corners
  // and never bleeds into rooms the guard can't actually see into.
  const N_RAYS = 28;
  for(const g of guards){
    const gs = w2s(g.x, g.y);
    const a0 = g.facing - VISION_ARC / 2;
    const a1 = g.facing + VISION_ARC / 2;
    const isAlert = g.state === 'alert';
    ctx.fillStyle = isAlert ? '#ff446644' : '#ffcc0033';
    ctx.beginPath();
    ctx.moveTo(gs.x, gs.y);
    for(let i = 0; i <= N_RAYS; i++){
      const t = i / N_RAYS;
      const a = a0 + (a1 - a0) * t;
      const dWorld = rayHitDist(g.x, g.y, a, VISION_RANGE);
      const dScreen = dWorld * mapScale;
      ctx.lineTo(gs.x + Math.cos(a) * dScreen, gs.y + Math.sin(a) * dScreen);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = isAlert ? '#ff4466aa' : '#ffcc00aa';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // Exit
  if(exitPos){
    const p = w2s(exitPos.x, exitPos.y);
    ctx.fillStyle = '#44ff88';
    ctx.shadowColor = '#44ff88';
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(p.x, p.y, exitPos.r * mapScale, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a1428';
    ctx.font = 'bold ' + Math.floor(14 * mapScale) + 'px Orbitron, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('▲', p.x, p.y + 1);
  }
  // Guards
  for(const g of guards){
    const p = w2s(g.x, g.y);
    const isAlert = g.state === 'alert';
    const sprite = SKIN_ON ? pkSprite(isAlert ? 'guardAlert' : 'guardPatrol') : null;
    // Halo behind the sprite so it still reads as "alert / patrol" at a glance.
    const haloColor = isAlert ? '#ff4466' : '#ffcc00';
    if(sprite){
      ctx.fillStyle = haloColor + '55';
      ctx.beginPath(); ctx.arc(p.x, p.y, g.r * mapScale * 1.3, 0, Math.PI*2); ctx.fill();
      // Sprite rotated to face direction
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(g.facing + Math.PI / 2);   // sprites face "up"
      const sz = g.r * mapScale * 3.0;
      ctx.shadowColor = haloColor; ctx.shadowBlur = 14;
      ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
      ctx.shadowBlur = 0;
      ctx.restore();
    } else {
      ctx.fillStyle = haloColor;
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, g.r * mapScale, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      const dotX = p.x + Math.cos(g.facing) * g.r * mapScale * 0.5;
      const dotY = p.y + Math.sin(g.facing) * g.r * mapScale * 0.5;
      ctx.beginPath(); ctx.arc(dotX, dotY, 3, 0, Math.PI*2); ctx.fill();
    }
  }
  // Player
  if(player){
    const p = w2s(player.x, player.y);
    const sprite = SKIN_ON ? pkSprite('player') : null;
    if(sprite){
      ctx.fillStyle = '#00f5ff55';
      ctx.beginPath(); ctx.arc(p.x, p.y, player.r * mapScale * 1.4, 0, Math.PI*2); ctx.fill();
      const sz = player.r * mapScale * 3.0;
      ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 16;
      ctx.drawImage(sprite, p.x - sz/2, p.y - sz/2, sz, sz);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#00f5ff';
      ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(p.x, p.y, player.r * mapScale, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  // Heat bar
  ctx.fillStyle = '#000a';
  ctx.fillRect(W/2 - 100, 36, 200, 6);
  ctx.fillStyle = heat > 60 ? '#ff4466' : (heat > 30 ? '#ffcc00' : '#44ff88');
  ctx.fillRect(W/2 - 100, 36, 200 * (heat / HEAT_MAX), 6);
}

// ── FLOW ──────────────────────────────────────────────────────────────────────
function showMainMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>NIGHT STREETS</h2>
    <p>Evita i coni di vista delle guardie e raggiungi l'uscita verde ▲</p>
    <p>WASD / frecce / d-pad per muoverti. Esc per la pausa.</p>
    <p>Heat meter sale quando sei visto. Al 100% sei catturato.</p>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function startGame(){
  loadLevel(0);
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function onLevelClear(){
  running = false;
  if(Coins) Coins.add(5 + levelIdx * 3, 'night-streets-level-' + (levelIdx+1));
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#44ff88;text-shadow:0 0 28px #44ff88">LEVEL CLEAR</h2>
    <p>Heat picco: ${Math.round(heat)}%</p>
    <p>+${5 + levelIdx * 3}🪙</p>
    <div class="btn-row">
      <button class="btn gold" onclick="loadLevel(${levelIdx+1});resumeGame()">NEXT ▶</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function onCaught(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">CAUGHT</h2>
    <p>Level reached: <b>${levelIdx + 1}</b></p>
    <div class="btn-row">
      <button class="btn" onclick="loadLevel(${levelIdx});resumeGame()">RETRY</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function showPauseMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>PAUSE</h2>
    <div class="btn-row">
      <button class="btn" onclick="resumeGame()">RESUME</button>
      <button class="btn" onclick="loadLevel(${levelIdx});resumeGame()">RESTART</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}
function resumeGame(){
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function goBack(){
  if(running && !confirm('Tornare al menu?')) return;
  window.location.href = '../';
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.033, (ts - lastT) / 1000);
  lastT = ts;
  updatePlayer(dt);
  updateGuards(dt);
  updateCamera();
  draw();
  document.getElementById('h-level').textContent = (levelIdx + 1);
  document.getElementById('h-heat').textContent = Math.round(heat) + '%';
  document.getElementById('h-coins').textContent = Coins ? Coins.formatted() : '0';
  requestAnimationFrame(loop);
}

showMainMenu();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
