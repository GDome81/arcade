<style>

  #hud{

  }

  #overlay{

  #overlay.reveal p{
    margin:0;font-size:.78rem;color:#fff;background:rgba(8,2,22,.65);

  #overlay.reveal .btn{margin-top:4px;padding:8px 18px;font-size:.74rem}

  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.0rem;
    color:#ff6ad6;letter-spacing:.22em;text-shadow:0 0 28px #ff44aa;margin:0 0 4px 0;
  }
  #overlay p{color:#e6c8f6;font-size:.92rem;letter-spacing:.06em;margin:4px 0;max-width:520px;line-height:1.5}
  .btn{

           transition:background .25s}

<script>
// ─────────────────────────────────────────────────────────────────────────────
// BRUTIMON SPLASH — paint-by-contact arcade with power-ups + projectiles.
//
// Top-down grid; walking over a cell paints it. The mosaic of brutimon
// hidden underneath is revealed as you paint. Most enemies wander randomly,
// but every level a few "chaser" enemies actively pursue the player. The
// player can shoot — bullet behaviour changes based on whichever power-up
// pickup is currently active (DASH / FREEZE / SPRAY / SHIELD).
//
// Original implementation, original visuals (brutimon roster the user
// owns). Game-loop mechanics are this genre's standard, not copied from
// any specific implementation.
// ─────────────────────────────────────────────────────────────────────────────

// ── CANVAS ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// ── GRID ─────────────────────────────────────────────────────────────────────
const VOID = 0, PAINTED = 1;
let GW = 60, GH = 40;
let grid = new Uint8Array(GW * GH);
let TOTAL_AREA = GW * GH;

function setupGridDimensions(){
  const aspect = Math.max(0.42, Math.min(2.4, (window.innerWidth || 1) / (window.innerHeight || 1)));
  const TARGET = 3200;
  GW = Math.max(24, Math.round(Math.sqrt(TARGET * aspect)));
  GH = Math.max(24, Math.round(Math.sqrt(TARGET / aspect)));
  grid = new Uint8Array(GW * GH);
  TOTAL_AREA = GW * GH;
}
setupGridDimensions();

function paintCell(ix, iy){
  if(ix < 0 || iy < 0 || ix >= GW || iy >= GH) return;
  const idx = iy * GW + ix;
  if(grid[idx] === VOID){ grid[idx] = PAINTED; paintedCount++; }
}

// Effective brush radius (in cells) at this instant. Default is wide enough
// to paint a 3-cell stripe; the BRUSH buff grows it further so the player
// can fill the field much faster.
function brushRadius(){
  if(player.buff === 'brush' && performance.now() < player.buffUntil) return 3;
  return 1;
}
// Paint a filled disc of radius `radius` (cells) at world point (x,y).
function paintBlob(x, y, radius){
  const r2 = (radius + 0.4) * (radius + 0.4);
  const ir = Math.ceil(radius);
  const cx = Math.floor(x), cy = Math.floor(y);
  for(let dy = -ir; dy <= ir; dy++){
    for(let dx = -ir; dx <= ir; dx++){
      if(dx * dx + dy * dy > r2) continue;
      paintCell(cx + dx, cy + dy);
    }
  }
}
// Paint a thick stripe between (x0,y0) and (x1,y1) using the current brush
// radius. Sampling step is ≤ 1 cell so adjacent discs always overlap.
function paintLine(x0, y0, x1, y1){
  const radius = brushRadius();
  const steps  = Math.max(2, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2));
  for(let i = 0; i <= steps; i++){
    const t = i / steps;
    paintBlob(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, radius);
  }
}

// ── STATE ────────────────────────────────────────────────────────────────────
let level = 1;
let lives = 3;
let paintedCount = 0;
let levelTotalScore = 0;
let running = false;
let phase   = 'menu';
let chosenSpeciesId = localStorage.getItem('splashPick') || null;
// 'paint'   → classic paint-by-contact, reveal-mosaic-at-85% mode
// 'bubbles' → Pang-style: bouncing bubble monsters split when shot until size 1
let gameMode = localStorage.getItem('splashMode') || 'paint';

const PLAYER_SPEED = 16;
const DASH_SPEED   = 26;
const SHOT_COOLDOWN_MS = 230;
const BUFF_DURATION_MS = 6500;
const WIN_THRESHOLD    = 0.85;

const player = {
  gx: 0, gy: 0,
  // Latest non-zero movement vector — used to decide which way the bullet
  // shoots when the player hits the fire button.
  facingX: 1, facingY: 0,
  buff: null, buffUntil: 0,
  lastShotMs: 0,
  flashUntil: 0
};

let enemies = [];      // { gx, gy, vx, vy, kind, speciesId, stage, size, frozenUntil }
let bullets = [];      // { gx, gy, vx, vy, type, age }
let powerups = [];     // { gx, gy, type, age, life }
let particles = [];

// Direction tracking — players can now move diagonally, so we keep
// independent axis flags + the latest TouchDpad vector and merge them in
// updatePlayer().
const INPUT = { up:false, down:false, left:false, right:false, fire:false };
let touchVec = { x: 0, y: 0 };

const POWERUP_KINDS = ['dash', 'freeze', 'spray', 'shield', 'brush'];
const POWERUP_COLOR = {
  dash:   '#ffe04a',
  freeze: '#66e0ff',
  spray:  '#ff6ad6',
  shield: '#ffffff',
  brush:  '#ff8a3d'
};
const POWERUP_LABEL = { dash:'DASH', freeze:'FREEZE', spray:'SPRAY', shield:'SHIELD', brush:'PENNELLO' };
const BULLET_SPEED  = { normal: 30, dash: 52, freeze: 22, spray: 26 };

// ── ASSETS ───────────────────────────────────────────────────────────────────
let speciesList = [];
async function preloadSpecies(){
  try {
    const reg = await Brutimon.registry();
    speciesList = (reg.species || []);
    if(!chosenSpeciesId && speciesList.length) chosenSpeciesId = speciesList[0].id;
    for(const sp of speciesList){
      for(let st = 1; st <= 5; st++){ Brutimon.image(sp.id, st); }
    }
  } catch(e){}
}
function imgReady(im){ return im && im.complete && im.naturalWidth > 0; }

// ── BACKGROUND MOSAIC ────────────────────────────────────────────────────────
// Same vivid mosaic trick as brutimon-panic: a per-level rainbow gradient
// behind a staggered grid of brutimon sprites at varied scale + rotation.
let bgCanvas = null;
let bgFor    = { w: 0, h: 0, sig: '' };

function buildBackground(){
  const fr = computeFieldRect();
  if(fr.w <= 0 || fr.h <= 0) return;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = fr.w; bgCanvas.height = fr.h;
  const g = bgCanvas.getContext('2d');

  const hueShift = (level * 53 + 30) % 360;
  const grd = g.createLinearGradient(0, 0, fr.w, fr.h);
  grd.addColorStop(0,    `hsl(${(hueShift +   0) % 360}, 95%, 55%)`);
  grd.addColorStop(0.33, `hsl(${(hueShift +  70) % 360}, 95%, 55%)`);
  grd.addColorStop(0.66, `hsl(${(hueShift + 180) % 360}, 95%, 55%)`);
  grd.addColorStop(1,    `hsl(${(hueShift + 270) % 360}, 95%, 55%)`);
  g.fillStyle = grd; g.fillRect(0, 0, fr.w, fr.h);
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, 0, fr.w, fr.h);

  if(speciesList.length){
    const SIZE   = Math.max(72, Math.min(fr.w, fr.h) * 0.18);
    const STEP_X = SIZE * 0.92;
    const STEP_Y = SIZE * 0.78;
    let idx = 0;
    g.imageSmoothingEnabled = false;
    for(let row = 0, py = -SIZE * 0.4; py < fr.h + SIZE; row++, py += STEP_Y){
      const offset = (row % 2) ? STEP_X * 0.5 : 0;
      for(let px = -SIZE + offset; px < fr.w + SIZE; px += STEP_X){
        const sp    = speciesList[idx % speciesList.length];
        const stage = ((idx * 3 + row * 2) % 5) + 1;
        const im    = Brutimon.image(sp.id, stage);
        idx++;
        if(!imgReady(im)) continue;
        const rot   = ((idx * 0.41) % 2 - 1) * 0.22;
        const scale = 0.85 + ((idx * 13) % 10) / 30;
        const sz    = SIZE * scale;
        g.save();
        g.translate(px + SIZE / 2, py + SIZE / 2);
        g.rotate(rot);
        g.globalAlpha = 0.88;
        g.drawImage(im, -sz / 2, -sz / 2, sz, sz);
        g.restore();
      }
    }
  }
  bgFor = { w: fr.w, h: fr.h, sig: level + ':' + speciesList.length };
}
function rebuildBgIfNeeded(force){
  const fr = computeFieldRect();
  const sig = level + ':' + speciesList.length;
  if(force || !bgCanvas || bgFor.w !== fr.w || bgFor.h !== fr.h || bgFor.sig !== sig){
    buildBackground();
  }
}

// ── LAYOUT ───────────────────────────────────────────────────────────────────
function computeFieldRect(){
  const padTop = 46, padBot = 16, padX = 4;
  const availW = W - padX * 2;
  const availH = H - padTop - padBot;
  const cs = Math.max(2, Math.floor(Math.min(availW / GW, availH / GH)));
  const w = cs * GW, h = cs * GH;
  return { x: Math.floor((W - w) / 2), y: padTop + Math.floor((availH - h) / 2), w, h, cs };
}

// ── SPAWN ────────────────────────────────────────────────────────────────────
function spawnEnemies(){
  enemies = [];
  if(!speciesList.length) return;
  if(gameMode === 'bubbles'){ spawnBubbles(); return; }
  const others = speciesList.filter(s => s.id !== chosenSpeciesId);
  const pool   = others.length ? others : speciesList;
  const total  = Math.min(8, 3 + Math.floor((level - 1) / 1.2));
  // From level 2 onwards 1 chaser; +1 chaser every 3 levels, max 3.
  const chasers = Math.min(3, Math.max(0, Math.floor((level) / 3)) + (level >= 2 ? 1 : 0));
  const speed   = 4 + (level - 1) * 0.45;
  for(let i = 0; i < total; i++){
    const ang   = Math.random() * Math.PI * 2;
    const spec  = pool[Math.floor(Math.random() * pool.length)];
    const stage = 1 + Math.floor(Math.random() * 5);
    const kind  = (i < chasers) ? 'chaser' : 'wanderer';
    enemies.push({
      gx: Math.random() * (GW - 4) + 2,
      gy: Math.random() * (GH - 4) + 2,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      kind, speciesId: spec.id, stage,
      size: 2.0 + Math.random() * 0.6,
      frozenUntil: 0,
      changeAt: performance.now() + 800 + Math.random() * 1600
    });
  }
}

// ── BUBBLE SPAWN / PHYSICS ───────────────────────────────────────────────────
// Brutimon-bubbles bounce around the whole field like billiard balls — no
// gravity, walls reflect the velocity component normal to them, speed is
// preserved. Each shot halves the bubble size; smaller bubbles MOVE FASTER
// (so a half-split immediately makes the level harder to clear).
const BUBBLE_PIXEL_R = { 3: 5.5, 2: 3.4, 1: 2.0 };   // visual + hit radius (cells)
const BUBBLE_SPEED   = { 3: 7,   2: 11,  1: 16  };   // cells / sec — bigger = slower

// Build one fresh size-3 bubble at a random spawn point with a non-axial
// trajectory. Used both for the initial spawn AND for the level-respawn
// when the player has destroyed every bubble before painting enough.
function makeBubble(){
  const others = speciesList.filter(s => s.id !== chosenSpeciesId);
  const pool   = others.length ? others : speciesList;
  const spec   = pool[Math.floor(Math.random() * pool.length)];
  const stage  = 3 + Math.floor(Math.random() * 3);
  let ang = Math.random() * Math.PI * 2;
  if(Math.abs(Math.sin(ang)) < 0.25) ang += 0.4 * (Math.random() < 0.5 ? -1 : 1);
  if(Math.abs(Math.cos(ang)) < 0.25) ang += 0.4 * (Math.random() < 0.5 ? -1 : 1);
  const sp     = BUBBLE_SPEED[3];
  const margin = BUBBLE_PIXEL_R[3] + 1;
  return {
    gx: margin + Math.random() * (GW - 2 * margin),
    gy: margin + Math.random() * (GH * 0.5 - margin),
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    kind: 'bubble',
    speciesId: spec.id, stage,
    size: 3,
    frozenUntil: 0
  };
}

function spawnBubbles(){
  // One huge bubble at level 1, +1 each level, capped at 4 (each one splits
  // twice → 4 size-1 fragments to clean up). With the new geometric physics
  // that's plenty of action.
  const N = Math.min(4, 1 + Math.floor((level - 1) / 1));
  for(let i = 0; i < N; i++) enemies.push(makeBubble());
}

// Respawn timer for bubble mode: when the field is clear we wait a brief
// breather (1.2 s) so the player can register the kill, then drop a new
// big bubble in until they've painted enough to win the level.
let bubbleRespawnAt = 0;
function maybeRespawnBubble(){
  if(enemies.length > 0){ bubbleRespawnAt = 0; return; }
  const now = performance.now();
  if(!bubbleRespawnAt){
    bubbleRespawnAt = now + 1200;
    return;
  }
  if(now >= bubbleRespawnAt){
    enemies.push(makeBubble());
    bubbleRespawnAt = 0;
  }
}

function updateBubble(e, dt){
  const R = BUBBLE_PIXEL_R[e.size] || 1;
  e.gx += e.vx * dt;
  e.gy += e.vy * dt;
  // Geometric reflection on all four walls — full energy preserved.
  if(e.gx < R){           e.gx = R;          e.vx =  Math.abs(e.vx); }
  if(e.gx > GW - R){      e.gx = GW - R;     e.vx = -Math.abs(e.vx); }
  if(e.gy < R){           e.gy = R;          e.vy =  Math.abs(e.vy); }
  if(e.gy > GH - R){      e.gy = GH - R;     e.vy = -Math.abs(e.vy); }
}

function splitBubble(idx){
  const e = enemies[idx];
  if(e.size <= 1){ enemies.splice(idx, 1); return; }
  const next = e.size - 1;
  const sp = BUBBLE_SPEED[next] || 10;
  // The two fragments fly off perpendicular to the bullet that hit them
  // (approximated from the bubble's pre-hit velocity), with a small random
  // spread so successive splits don't all line up.
  const baseAng = Math.atan2(e.vy, e.vx);
  const perp    = baseAng + Math.PI / 2;
  const a1 = perp                + (Math.random() - 0.5) * 0.5;
  const a2 = perp + Math.PI      + (Math.random() - 0.5) * 0.5;
  const tpl = { kind:'bubble', speciesId: e.speciesId, stage: Math.max(1, e.stage - 1),
                size: next, frozenUntil: 0 };
  enemies.splice(idx, 1,
    Object.assign({}, tpl, { gx: e.gx, gy: e.gy, vx: Math.cos(a1) * sp, vy: Math.sin(a1) * sp }),
    Object.assign({}, tpl, { gx: e.gx, gy: e.gy, vx: Math.cos(a2) * sp, vy: Math.sin(a2) * sp })
  );
}

function resetForLevel(){
  setupGridDimensions();
  grid.fill(VOID);
  paintedCount = 0;
  player.gx = GW / 2;
  // In bubble mode the player spawns near the floor so they can immediately
  // see incoming bubbles; in paint mode they start centred.
  player.gy = gameMode === 'bubbles' ? (GH - 2) : (GH / 2);
  player.facingX = 1; player.facingY = 0;
  player.buff = null; player.buffUntil = 0;
  player.lastShotMs = 0; player.flashUntil = 0;
  bullets = []; powerups = []; particles = [];
  INPUT.up = INPUT.down = INPUT.left = INPUT.right = false;
  touchVec = { x: 0, y: 0 };
  // Paint the spawn position in both modes — the bubble mode now paints
  // too as a visual reveal of the mosaic.
  paintBlob(player.gx, player.gy, brushRadius());
  spawnEnemies();
  scheduleNextPowerup();
  rebuildBgIfNeeded(true);
  updateHud();
  updateBuffChip();
}

window.addEventListener('keydown', e => {

  if(k === 'ArrowUp'    || k === 'w' || k === 'W'){ INPUT.up    = true; e.preventDefault(); }

  if(k === 'ArrowDown'  || k === 's' || k === 'S') INPUT.down  = false;

});

// ── PLAYER ───────────────────────────────────────────────────────────────────
// Combine the touchpad vector (8-way) + keyboard axis flags + the gamepad
// direction. Priority: gamepad > touch > keys. Each frame picks whichever
// is currently active.
function inputVec(){
  const gp = window.GamepadInput && window.GamepadInput.state();
  if(gp && (gp.dir.x || gp.dir.y)) return { x: gp.dir.x, y: gp.dir.y };
  if(touchVec.x || touchVec.y) return { x: touchVec.x, y: touchVec.y };
  return {
    x: (INPUT.right ? 1 : 0) - (INPUT.left ? 1 : 0),
    y: (INPUT.down  ? 1 : 0) - (INPUT.up   ? 1 : 0)
  };
}

function updatePlayer(dt){
  // Paint whichever cell we're currently sitting on so standing still keeps
  // dripping paint (and so the spawn area gets covered immediately).
  paintBlob(player.gx, player.gy, brushRadius());

  const v = inputVec();
  if(!v.x && !v.y) return;
  // Remember the latest non-zero vector for shooting.
  player.facingX = v.x; player.facingY = v.y;

  // Normalise diagonals so the player doesn't move √2 faster on a diagonal.
  let dx = v.x, dy = v.y;
  if(dx && dy){ const inv = 1 / Math.SQRT2; dx *= inv; dy *= inv; }

  const now   = performance.now();
  const dash  = now < player.buffUntil && player.buff === 'dash';
  const speed = dash ? DASH_SPEED : PLAYER_SPEED;
  const oldX  = player.gx, oldY = player.gy;
  let nx = oldX + dx * speed * dt;
  let ny = oldY + dy * speed * dt;
  nx = Math.max(0, Math.min(GW - 0.001, nx));
  ny = Math.max(0, Math.min(GH - 0.001, ny));
  player.gx = nx; player.gy = ny;
  paintLine(oldX, oldY, nx, ny);
}

// Try to fire a bullet in the player's current facing direction. Rate-
// limited by SHOT_COOLDOWN_MS. The bullet's type comes from the active
// power-up: DASH = faster, FREEZE = stuns, SPRAY = paints, default
// otherwise.
function tryFire(){
  const gp = window.GamepadInput && window.GamepadInput.state();
  if(!INPUT.fire && !(gp && gp.fire)) return;
  const now = performance.now();
  if(now - player.lastShotMs < SHOT_COOLDOWN_MS) return;
  player.lastShotMs = now;
  let type = 'normal';
  if(now < player.buffUntil){
    if(player.buff === 'dash')   type = 'dash';
    if(player.buff === 'freeze') type = 'freeze';
    if(player.buff === 'spray')  type = 'spray';
  }
  // Bullets fire along the latest movement vector — diagonal moves give
  // diagonal bullets too. Normalise so diagonals don't fly √2 faster.
  let vx = player.facingX, vy = player.facingY;
  if(!vx && !vy){ vx = 1; vy = 0; }   // facing reset → default to right
  const mag = Math.hypot(vx, vy) || 1;
  vx /= mag; vy /= mag;
  const sp = BULLET_SPEED[type] || BULLET_SPEED.normal;
  bullets.push({
    gx: player.gx, gy: player.gy,
    vx: vx * sp, vy: vy * sp,
    type, age: 0
  });
  Sfx.shoot(type);
}

// ── ENEMIES ──────────────────────────────────────────────────────────────────
function updateEnemies(dt){
  const now = performance.now();
  for(const e of enemies){
    if(now < e.frozenUntil) continue;
    if(e.kind === 'bubble'){
      updateBubble(e, dt);
      const ddx = player.gx - e.gx, ddy = player.gy - e.gy;
      // Touch counts as soon as the player's centre is INSIDE the bubble's
      // visual disc — bigger bubbles use their real radius (+ a small fudge
      // for the player's own footprint).
      const hitR = (BUBBLE_PIXEL_R[e.size] || 1) + 0.7;
      if(ddx*ddx + ddy*ddy < hitR * hitR){
        if(now < player.flashUntil){ /* invuln */ }
        else if(player.buff === 'shield' && now < player.buffUntil){
          // Bounce the bubble away and spend the visual energy on a hit fx.
          e.vx = -e.vx * 1.1;
          e.vy = -Math.abs(e.vy) - 6;
          spawnHit(player.gx, player.gy);
          Sfx.shield();
        } else {
          onLoseLife();
          return;
        }
      }
      continue;
    }
    if(e.kind === 'wanderer'){
      // Pick a new random direction every couple of seconds (or when bounced).
      if(now > e.changeAt){
        const ang = Math.random() * Math.PI * 2;
        const sp  = Math.hypot(e.vx, e.vy) || 4;
        e.vx = Math.cos(ang) * sp;
        e.vy = Math.sin(ang) * sp;
        e.changeAt = now + 1000 + Math.random() * 2000;
      }
    } else if(e.kind === 'chaser'){
      // Steer toward the player with a small wander offset.
      const dx = player.gx - e.gx, dy = player.gy - e.gy;
      const d  = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(e.vx, e.vy) || 4;
      e.vx += (dx / d) * sp * dt * 1.5;
      e.vy += (dy / d) * sp * dt * 1.5;
      // Cap speed.
      const csp = Math.hypot(e.vx, e.vy);
      if(csp > sp){ e.vx = (e.vx / csp) * sp; e.vy = (e.vy / csp) * sp; }
    }
    // Move + bounce off walls.
    let nx = e.gx + e.vx * dt;
    let ny = e.gy + e.vy * dt;
    if(nx < 0 || nx >= GW){ e.vx = -e.vx; nx = e.gx; }
    if(ny < 0 || ny >= GH){ e.vy = -e.vy; ny = e.gy; }
    e.gx = nx; e.gy = ny;

    // Touch the player?
    const ddx = player.gx - e.gx, ddy = player.gy - e.gy;
    if(ddx * ddx + ddy * ddy < 1.4 * 1.4){
      if(now < player.flashUntil){ /* invuln window — pass through */ }
      else if(player.buff === 'shield' && now < player.buffUntil){
        // Shield consumed: bounce the enemy back and stay alive.
        const d = Math.hypot(ddx, ddy) || 1;
        e.vx = -ddx / d * 8; e.vy = -ddy / d * 8;
        spawnHit(player.gx, player.gy);
        Sfx.shield();
      } else {
        onLoseLife();
        return;
      }
    }
  }
}

// ── BULLETS ──────────────────────────────────────────────────────────────────
function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.age += dt;
    if(b.age > 2.0){ bullets.splice(i, 1); continue; }
    const oldX = b.gx, oldY = b.gy;
    b.gx += b.vx * dt; b.gy += b.vy * dt;
    if(b.gx < 0 || b.gx >= GW || b.gy < 0 || b.gy >= GH){ bullets.splice(i, 1); continue; }
    // Spray bullets paint their flight path so they double as a roller.
    if(b.type === 'spray'){
      paintLine(oldX, oldY, b.gx, b.gy);
    }
    // Hit an enemy? Bubbles use their actual visual radius (+ small fudge)
    // so the larger ones are easy to hit; wanderers/chasers keep the
    // tighter 1.4-cell test.
    let hit = -1;
    for(let j = 0; j < enemies.length; j++){
      const e = enemies[j];
      const dx = b.gx - e.gx, dy = b.gy - e.gy;
      const r  = e.kind === 'bubble' ? ((BUBBLE_PIXEL_R[e.size] || 1) + 0.4) : 1.4;
      if(dx * dx + dy * dy < r * r){ hit = j; break; }
    }
    if(hit >= 0){
      const e = enemies[hit];
      // Bubble mode: split instead of kill (except freeze which just stuns).
      if(e.kind === 'bubble'){
        if(b.type === 'freeze'){
          e.frozenUntil = performance.now() + 4000;
          spawnFreezeBurst(e.gx, e.gy);
        } else {
          spawnHit(e.gx, e.gy);
          splitBubble(hit);
        }
      } else if(b.type === 'freeze'){
        // Freeze instead of kill — frozen enemies wake up after 4 s.
        e.frozenUntil = performance.now() + 4000;
        spawnFreezeBurst(e.gx, e.gy);
      } else if(b.type === 'spray'){
        const cx = Math.floor(e.gx), cy = Math.floor(e.gy);
        for(let yy = -2; yy <= 2; yy++) for(let xx = -2; xx <= 2; xx++){
          if(xx*xx + yy*yy > 4) continue;
          paintCell(cx + xx, cy + yy);
        }
        enemies.splice(hit, 1);
        spawnHit(e.gx, e.gy);
      } else {
        enemies.splice(hit, 1);
        spawnHit(e.gx, e.gy);
      }
      bullets.splice(i, 1);
      Sfx.hit();
    }
  }
}

// ── POWERUPS ─────────────────────────────────────────────────────────────────
let nextPowerupAt = 0;
function scheduleNextPowerup(){
  nextPowerupAt = performance.now() + 8000 + Math.random() * 7000;
}
function spawnPowerup(){
  if(powerups.length >= 2) return;
  const kind = POWERUP_KINDS[Math.floor(Math.random() * POWERUP_KINDS.length)];
  powerups.push({
    gx: 2 + Math.random() * (GW - 4),
    gy: 2 + Math.random() * (GH - 4),
    kind, age: 0, life: 14
  });
}
function updatePowerups(dt){
  if(!nextPowerupAt) scheduleNextPowerup();
  if(performance.now() >= nextPowerupAt){
    spawnPowerup();
    scheduleNextPowerup();
  }
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.age += dt;
    if(p.age > p.life){ powerups.splice(i, 1); continue; }
    const dx = player.gx - p.gx, dy = player.gy - p.gy;
    if(dx * dx + dy * dy < 1.5 * 1.5){
      activatePowerup(p.kind);
      powerups.splice(i, 1);
    }
  }
}
function activatePowerup(kind){
  player.buff = kind;
  player.buffUntil = performance.now() + BUFF_DURATION_MS;
  spawnSparkles(player.gx, player.gy, 14);
  Sfx.powerup();
  updateBuffChip();
}
function updateBuffChip(){
  const chip = document.getElementById('buff-chip');
  const now = performance.now();
  if(!player.buff || now >= player.buffUntil){
    chip.classList.remove('on'); player.buff = null; return;
  }
  chip.classList.add('on');
  chip.style.color = POWERUP_COLOR[player.buff] || '#fff';
  document.getElementById('buff-label').textContent = POWERUP_LABEL[player.buff];
  const remaining = (player.buffUntil - now) / BUFF_DURATION_MS;
  document.getElementById('buff-bar').style.width = (Math.max(0, remaining) * 100) + '%';
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
function spawnSparkles(gx, gy, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 6 + Math.random() * 14;
    particles.push({
      gx, gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.7 + Math.random() * 0.6, age: 0,
      hue: Math.floor(Math.random() * 360), kind: 'sparkle'
    });
  }
}
function spawnHit(gx, gy){
  for(let i = 0; i < 18; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 8 + Math.random() * 22;
    particles.push({
      gx, gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.35, age: 0,
      hue: Math.floor(Math.random() * 60) + 330, kind: 'hit'
    });
  }
}
function spawnFreezeBurst(gx, gy){
  for(let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 10 + Math.random() * 14;
    particles.push({
      gx, gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.6 + Math.random() * 0.4, age: 0,
      hue: 200 + Math.random() * 20, kind: 'sparkle'
    });
  }
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;
    if(p.age >= p.life){ particles.splice(i, 1); continue; }
    p.gx += p.vx * dt; p.gy += p.vy * dt;
    p.vx *= (1 - dt * 1.2); p.vy *= (1 - dt * 1.2);
  }
}

// ── LIFE / FLOW ──────────────────────────────────────────────────────────────
function onLoseLife(){
  spawnHit(player.gx, player.gy);
  player.gx = GW / 2; player.gy = GH / 2;
  player.facingX = 1; player.facingY = 0;
  player.flashUntil = performance.now() + 1400;
  player.buff = null; player.buffUntil = 0;
  INPUT.up = INPUT.down = INPUT.left = INPUT.right = false;
  touchVec = { x: 0, y: 0 };
  updateBuffChip();
  lives--;
  Sfx.hurt();
  flashHurt();
  updateHud();
  if(lives <= 0) onGameOver();
}
function flashHurt(){
  const fx = document.getElementById('hurt-fx');
  fx.classList.add('on');
  setTimeout(() => fx.classList.remove('on'), 220);
}

function onLevelComplete(pct){
  phase = 'levelend';
  grid.fill(PAINTED);
  paintedCount = TOTAL_AREA;
  draw();
  running = false;
  Sfx.win();
  const pctRound = Math.round(pct * 100);
  const overWin  = Math.max(0, pctRound - Math.round(WIN_THRESHOLD * 100));
  const reward   = 6 + Math.floor(overWin * 0.5);
  if(window.Coins) Coins.add(reward, 'splash-' + gameMode + '-lv-' + level);
  levelTotalScore += reward;
  const subtitle = `<p>Dipinto <b style="color:#ffe04a">${pctRound}%</b> · +${reward}🪙</p>`;
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2>LIVELLO ${level} COMPLETATO</h2>
    ${subtitle}
    <div class="btn-row">
      <button class="btn gold" onclick="nextLevel()">PROSSIMO ▶</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
    </div>
  `;
  ol.classList.remove('reveal');
  ol.classList.add('show', 'reveal');
}

function onGameOver(){
  phase = 'lost';
  running = false;
  Sfx.lose();
  const pct = Math.round(paintedCount / TOTAL_AREA * 100);
  const score = (level - 1) * 100 + pct;
  if(window.CloudSync) CloudSync.recordScore(null, score);
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">GAME OVER</h2>
    <p>Livello raggiunto: <b>${level}</b></p>
    <p>Ultima reveal: <b style="color:#ffe04a">${pct}%</b></p>
    <p>+${levelTotalScore}🪙 totali</p>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">RIPROVA</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
  ol.classList.remove('reveal');
  ol.classList.add('show');
}

async function startGame(){
  Sfx.ensure();
  level = 1; lives = 3; levelTotalScore = 0;
  phase = 'playing';
  if(!speciesList.length) await preloadSpecies();
  resetForLevel();
  hideOverlay();
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
async function nextLevel(){
  level++;
  resetForLevel();
  hideOverlay();
  phase = 'playing';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function hideOverlay(){

  ol.classList.remove('reveal');
}
function goBack(){ window.location.href = '../'; }
window.startGame = startGame;
window.nextLevel = nextLevel;
window.goBack    = goBack;

function updateHud(){
  // Both modes now race to the paint threshold; the bubble mode just has
  // bubbles as the obstacle instead of wanderer/chaser enemies.
  const pct = Math.round(paintedCount / TOTAL_AREA * 100);
  document.getElementById('h-pct').textContent = pct + '%';
  const lbl = document.querySelector('.hud-item.pct .label');
  if(lbl) lbl.textContent = 'Dipinto';
  document.getElementById('h-lives').textContent = Math.max(0, lives);
  document.getElementById('h-level').textContent = level;
}

// ── AUDIO ────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let actx = null, master = null;
  let on = localStorage.getItem('splashAudio') !== 'false';
  function ensure(){
    if(actx) return actx;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
    master = actx.createGain(); master.gain.value = on ? 0.5 : 0;
    master.connect(actx.destination);
    return actx;
  }
  function tone({freq=440, dur=0.1, type='square', vol=0.3, sweep=0}){
    if(!on || !ensure()) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.04);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    ensure,
    shoot(type){
      if(type === 'freeze') tone({freq:800, dur:0.08, type:'sine', vol:0.10, sweep:-200});
      else if(type === 'spray') tone({freq:440, dur:0.10, type:'sawtooth', vol:0.10, sweep:200});
      else if(type === 'dash')  tone({freq:1000,dur:0.05, type:'square', vol:0.10, sweep:-400});
      else                      tone({freq:680, dur:0.05, type:'square', vol:0.08, sweep:-300});
    },
    hit(){ tone({freq:220, dur:0.08, type:'sawtooth', vol:0.16, sweep:-60}); },
    hurt(){ tone({freq:160, dur:0.18, type:'sawtooth', vol:0.24, sweep:-80}); },
    powerup(){ [440, 660, 880].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.08, type:'square', vol:0.16}), i * 60)); },
    shield(){ tone({freq:520, dur:0.10, type:'sine', vol:0.14}); },
    win(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.16, vol:0.20}), i * 130)); },
    lose(){ [523, 440, 349, 261].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.28, type:'sawtooth', vol:0.22, sweep:-30}), i * 220)); }
  };
})();

// ── RENDER ───────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#0a0218';
  ctx.fillRect(0, 0, W, H);
  rebuildBgIfNeeded(false);
  const r = computeFieldRect();

  if(bgCanvas){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bgCanvas, r.x, r.y, r.w, r.h);
  }

  // Void wash (the un-painted area) — translucent dark with drifting stripes
  // so it doesn't read as a flat black plate.
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  ctx.fillStyle = 'rgba(8,4,28,0.90)';
  for(let y = 0; y < GH; y++){
    let runStart = -1;
    for(let x = 0; x <= GW; x++){
      const cell = x < GW ? grid[y * GW + x] : -1;
      if(cell === VOID){ if(runStart < 0) runStart = x; }
      else if(runStart >= 0){
        ctx.fillRect(r.x + runStart * r.cs, r.y + y * r.cs, (x - runStart) * r.cs, r.cs);
        runStart = -1;
      }
    }
  }
  const stripeT = (performance.now() * 0.06) % 18;
  ctx.fillStyle = 'rgba(255,160,240,0.07)';
  for(let s = -r.h; s < r.w + r.h; s += 18){
    const xx = s + stripeT;
    ctx.save();
    ctx.translate(r.x + xx, r.y);
    ctx.transform(1, 0, -0.6, 1, 0, 0);
    ctx.fillRect(0, 0, 4, r.h);
    ctx.restore();
  }
  ctx.restore();

  const showDynamic = phase === 'playing';

  if(showDynamic){
    // Power-ups on the field — drawn as a coloured disc with the kind's
    // first letter, breathing.
    for(const p of powerups){
      const cx = r.x + p.gx * r.cs + r.cs / 2;
      const cy = r.y + p.gy * r.cs + r.cs / 2;
      const breath = 0.85 + 0.15 * Math.sin(performance.now() * 0.008 + p.age * 4);
      const sz = r.cs * 1.8 * breath;
      const col = POWERUP_COLOR[p.kind];
      ctx.save();
      ctx.fillStyle = col + '88';
      ctx.shadowColor = col; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
      ctx.font = `bold ${Math.floor(sz * 1.1)}px Orbitron, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(POWERUP_LABEL[p.kind][0], cx, cy + 1);
      ctx.restore();
    }

    // Enemies — brutimon sprites with kind-tinted halo (paint mode) or a
    // glassy soap-bubble ring with the brutimon inside (bubble mode).
    for(const e of enemies){
      const cx = r.x + e.gx * r.cs + r.cs / 2;
      const cy = r.y + e.gy * r.cs + r.cs / 2;
      const frozen = performance.now() < e.frozenUntil;
      if(e.kind === 'bubble'){
        const bR = (BUBBLE_PIXEL_R[e.size] || 2) * r.cs;
        const sz = bR * 1.4;
        const im = Brutimon.image(e.speciesId, e.stage);
        // Glassy translucent fill + bright cyan outline.
        ctx.save();
        const grd = ctx.createRadialGradient(cx - bR * 0.3, cy - bR * 0.3, bR * 0.1, cx, cy, bR);
        grd.addColorStop(0, 'rgba(220,250,255,0.45)');
        grd.addColorStop(0.7, 'rgba(120,220,255,0.18)');
        grd.addColorStop(1, 'rgba(120,220,255,0.02)');
        ctx.fillStyle = grd;
        ctx.shadowColor = '#66e0ff'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(cx, cy, bR, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = frozen ? '#a0e8ff' : '#bff1ff';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(cx, cy, bR, 0, Math.PI * 2); ctx.stroke();
        // Highlight glint
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.arc(cx - bR * 0.35, cy - bR * 0.40, bR * 0.18, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if(imgReady(im)){
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(im, cx - sz / 2, cy - sz / 2, sz, sz);
          if(frozen){
            ctx.fillStyle = 'rgba(120,220,255,0.35)';
            ctx.beginPath(); ctx.arc(cx, cy, bR, 0, Math.PI * 2); ctx.fill();
          }
        }
        continue;
      }
      // Wanderer / chaser (paint mode)
      const sz = r.cs * e.size * 1.6;
      const im = Brutimon.image(e.speciesId, e.stage);
      const halo = frozen ? 'rgba(120,220,255,0.45)' : (e.kind === 'chaser' ? 'rgba(255,80,80,0.40)' : 'rgba(255,80,200,0.30)');
      ctx.save();
      ctx.fillStyle = halo;
      ctx.shadowColor = frozen ? '#66e0ff' : (e.kind === 'chaser' ? '#ff5566' : '#ff44aa');
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(cx, cy, sz * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if(imgReady(im)){
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(im, cx - sz / 2, cy - sz / 2, sz, sz);
        if(frozen){
          ctx.fillStyle = 'rgba(120,220,255,0.35)';
          ctx.fillRect(cx - sz / 2, cy - sz / 2, sz, sz);
        }
      }
    }

    // Bullets — distinct visual per type.
    for(const b of bullets){
      const cx = r.x + b.gx * r.cs + r.cs / 2;
      const cy = r.y + b.gy * r.cs + r.cs / 2;
      const speed = Math.hypot(b.vx, b.vy) || 1;
      const tx = -(b.vx / speed) * r.cs * 1.6;
      const ty = -(b.vy / speed) * r.cs * 1.6;
      let head = '#fff', tail = '#ffe04a';
      if(b.type === 'freeze'){ head = '#fff'; tail = '#66e0ff'; }
      else if(b.type === 'spray'){ head = '#fff'; tail = '#ff6ad6'; }
      else if(b.type === 'dash'){ head = '#fff'; tail = '#ffe04a'; }
      const tg = ctx.createLinearGradient(cx, cy, cx + tx, cy + ty);
      tg.addColorStop(0, tail);
      tg.addColorStop(1, tail + '00');
      ctx.strokeStyle = tg;
      ctx.lineWidth = Math.max(2, r.cs * (b.type === 'dash' ? 0.9 : 0.7));
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + tx, cy + ty); ctx.stroke();
      ctx.fillStyle = head;
      ctx.shadowColor = tail; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(2, r.cs * 0.45), 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // Particles (rendered in both playing and reveal so the burst tail-out is visible).
  for(const p of particles){
    const cx = r.x + p.gx * r.cs + r.cs / 2;
    const cy = r.y + p.gy * r.cs + r.cs / 2;
    const a  = Math.max(0, 1 - p.age / p.life);
    if(p.kind === 'sparkle'){
      ctx.fillStyle = `hsla(${p.hue},100%,70%,${a})`;
      ctx.shadowColor = `hsl(${p.hue},100%,80%)`; ctx.shadowBlur = 8;
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = `hsla(${p.hue},100%,65%,${a})`;
      ctx.beginPath(); ctx.arc(cx, cy, 3 * a + 1, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Player.
  if(showDynamic && speciesList.length){
    const cx = r.x + player.gx * r.cs + r.cs / 2;
    const cy = r.y + player.gy * r.cs + r.cs / 2;
    const sz = r.cs * 2.8;
    const now = performance.now();
    const inv = now < player.flashUntil;
    const shielded = player.buff === 'shield' && now < player.buffUntil;
    // Ring (colour reflects current buff).
    const pulse = 0.6 + 0.4 * Math.sin(now * 0.012);
    const ringColor = shielded ? '#ffffff' : (player.buff ? POWERUP_COLOR[player.buff] : '#ffe04a');
    ctx.save();
    ctx.strokeStyle = `rgba(${shielded ? '255,255,255' : '255,224,80'},${pulse})`;
    ctx.strokeStyle = ringColor + Math.round(pulse * 255).toString(16).padStart(2, '0');
    ctx.lineWidth = 3;
    ctx.shadowColor = ringColor; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(cx, cy, sz * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    const im = Brutimon.image(chosenSpeciesId, 3);
    if(imgReady(im)){
      ctx.imageSmoothingEnabled = false;
      if(!inv || Math.floor(now / 80) % 2 === 0){
        ctx.drawImage(im, cx - sz / 2, cy - sz / 2, sz, sz);
      }
    }
    // Tiny direction arrow (works for diagonals too).
    if(player.facingX || player.facingY){
      const mag = Math.hypot(player.facingX, player.facingY) || 1;
      const ax = cx + (player.facingX / mag) * sz * 0.5;
      const ay = cy + (player.facingY / mag) * sz * 0.5;
      ctx.fillStyle = '#ffe04a';
      ctx.beginPath(); ctx.arc(ax, ay, 5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts){
  if(!running){ return; }
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  if(phase === 'playing'){
    updatePlayer(dt);
    tryFire();
    updateEnemies(dt);
    updateBullets(dt);
    updatePowerups(dt);
    updateParticles(dt);
    updateBuffChip();
    updateHud();
    // Win condition in both modes is the same — paint % of the field.
    // The difference is the obstacle: paint mode has wanderer / chaser
    // enemies, bubble mode has bouncing bubbles.
    const pct = paintedCount / TOTAL_AREA;
    if(pct >= WIN_THRESHOLD){
      onLevelComplete(pct);
    } else if(gameMode === 'bubbles'){
      // No bubbles left and the player hasn't painted enough yet?
      // Spawn a fresh big one after a short pause so the level keeps the
      // pressure on instead of letting the player walk freely.
      maybeRespawnBubble();
    }
  } else {
    updateParticles(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

// ── MAIN MENU ────────────────────────────────────────────────────────────────
async function showMainMenu(){
  phase = 'menu';
  await preloadSpecies();
  const picksHtml = speciesList.map(s => `
    <div class="pick-tile${s.id === chosenSpeciesId ? ' selected' : ''}" data-id="${s.id}">
      <img src="${Brutimon.BASE}/${s.id}/${s.id}_3.png"/>
      <div class="name">${(s.name || s.id).toUpperCase()}</div>
    </div>
  `).join('');
  const paintActive  = gameMode === 'paint'   ? ' selected' : '';
  const bubbleActive = gameMode === 'bubbles' ? ' selected' : '';
  const desc = gameMode === 'paint'
    ? `<p>Cammina sulla griglia (anche in <b>diagonale</b>) per dipingerla con una pennellata larga e rivelare il mosaico di Brutimon nascosto sotto. Schiva i nemici che vagano e gli inseguitori; <b style="color:#ffe04a">spara</b> nella direzione in cui ti muovi.</p>
       <p>Power-up: DASH / FREEZE / SPRAY / SHIELD / <b style="color:#ff8a3d">PENNELLO</b> (ingrandisce la pennellata). Riveli l'<b style="color:#ffe04a">85%</b> per vincere il livello.</p>`
    : `<p>Bolle giganti rimbalzano per tutto lo schermo come palle da biliardo. <b style="color:#ffe04a">Sparare</b> a una bolla la dimezza in due bolle più piccole e più veloci; appena le elimini tutte ne ricompare una nuova grande.</p>
       <p>Cammini anche in <b>diagonale</b> per dipingere il mosaico schivando le bolle. Power-up: DASH / FREEZE / SPRAY / SHIELD / <b style="color:#ff8a3d">PENNELLO</b>. Riveli l'<b style="color:#ffe04a">85%</b> del quadro per vincere il livello.</p>`;
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2>BRUTIMON SPLASH</h2>
    <p style="color:#ffcc44;letter-spacing:.22em;margin-bottom:2px">MODALITÀ</p>
    <div class="pick-grid" style="grid-template-columns:repeat(2, 130px)">
      <div class="pick-tile mode-tile${paintActive}" data-mode="paint" style="width:130px;height:54px;justify-content:center">
        <div class="name" style="font-size:.72rem">VERNICE</div>
      </div>
      <div class="pick-tile mode-tile${bubbleActive}" data-mode="bubbles" style="width:130px;height:54px;justify-content:center">
        <div class="name" style="font-size:.72rem">BOLLE</div>
      </div>
    </div>
    ${desc}
    <p style="color:#ffcc44">Scegli il tuo brutimon:</p>
    <div class="pick-grid">${picksHtml}</div>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
    </div>
    <div class="hint">
      Mobile: <b>tocca lo schermo</b> per joystick · pulsante ⚡ in basso a destra per <b>sparare</b>. Desktop: <b>frecce/WASD</b> + <b>SPAZIO</b>.
    </div>
  `;
  ol.classList.remove('reveal');
  ol.classList.add('show');
  ol.querySelectorAll('.pick-tile[data-id]').forEach(t => {
    t.addEventListener('click', () => {
      chosenSpeciesId = t.dataset.id;
      localStorage.setItem('splashPick', chosenSpeciesId);
      ol.querySelectorAll('.pick-tile[data-id]').forEach(x => x.classList.toggle('selected', x === t));
    });
  });
  ol.querySelectorAll('.pick-tile[data-mode]').forEach(t => {
    t.addEventListener('click', () => {
      gameMode = t.dataset.mode;
      localStorage.setItem('splashMode', gameMode);
      showMainMenu();   // re-render so the description + active states refresh
    });
  });
}

showMainMenu();
requestAnimationFrame(function bootDraw(){
  draw();
  if(phase !== 'playing') requestAnimationFrame(bootDraw);
});
