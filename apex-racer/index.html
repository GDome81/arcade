// ─────────────────────────────────────────────────────────────────────────────
// POWERAPP BRIDGE
// ─────────────────────────────────────────────────────────────────────────────
// Optional integration with the powerapp wallet (parent window). The game runs
// standalone if the parent never sends SET_COINS — all premium features stay off
// and every track stays unlocked. Activated by the first SET_COINS message.
//
// Protocol — every message is { source, v: 1, type, ... }.
//   powerapp → apex-racer : SET_COINS { value }
//   apex-racer → powerapp : READY
//                            RACE_FINISHED { payload: { rewardCoins, mode, position, ... } }
//                            COINS_SPENT   { payload: { amount, reason, detail? } }
// ─────────────────────────────────────────────────────────────────────────────
(function(){
  // Track unlocks live in the powerapp wallet, NOT in localStorage. Apex receives the
  // full list inside every SET_COINS payload. This means a powerapp page refresh wipes
  // the unlock state by design (the demo user resets to zero). Standalone (no parent),
  // PA.active stays false and isTrackUnlockedByIndex returns true for everything, so
  // all tracks remain playable for free.
  const PA = {
    active: false,
    coins: 0,
    unlocked: new Set(),
    NITRO_COST: 10,
    NITRO_DURATION_MS: 2000,
    NITRO_COOLDOWN_MS: 6000,
    CONTINUE_COST: 500,
  };
  // One-shot cleanup of the previous storage scheme, in case the user has stale data.
  try { localStorage.removeItem('apex-racer:unlocked-tracks'); } catch(e) {}
  window.__pa = PA; // for debugging from devtools

  // Track shop: tracks at indexes 5..9 become premium when the bridge is active.
  // (Tracks 6 through 10 in the UI.) We can't reach the TRACKS array from inside this
  // IIFE — apex declares it `const TRACKS = ...` at module scope which is NOT exposed
  // on window. So we key the costs by grid index and identify tracks by their visible
  // label, which we read off the DOM.
  const PREMIUM_COST_BY_INDEX = { 5: 100, 6: 200, 7: 300, 8: 500, 9: 1000 };

  function send(type, payload){
    if(!window.parent || window.parent === window) return;
    const msg = { source: 'apex-racer', v: 1, type };
    if(payload != null) msg.payload = payload;
    window.parent.postMessage(msg, '*');
  }

  function toast(text, ms){
    const el = document.getElementById('pa-toast');
    if(!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms || 2200);
  }

  function updateHud(){
    if(!PA.active) return;
    const hud = document.getElementById('pa-coin-hud');
    const val = document.getElementById('pa-coin-value');
    if(hud) hud.classList.add('active');
    if(val) val.textContent = PA.coins;
  }

  function spendCoins(amount, reason, detail){
    if(PA.coins < amount){
      toast('Coin insufficienti — allenati per guadagnarne');
      return false;
    }
    // Optimistic local update. The parent confirms with a fresh SET_COINS.
    PA.coins -= amount;
    updateHud();
    send('COINS_SPENT', { amount, reason, detail });
    return true;
  }

  // ── Track grid: re-render with locks + buy buttons ──
  function trackNameFromBtn(btn){
    const labelDiv = btn.querySelector('div');
    return labelDiv ? labelDiv.textContent.trim() : '';
  }

  function isTrackUnlockedByIndex(idx, name){
    if(!PA.active) return true;        // standalone: everything's open
    const cost = PREMIUM_COST_BY_INDEX[idx];
    if(!cost) return true;             // free
    return PA.unlocked.has(name);
  }

  if(typeof window.buildTrackGrid === 'function'){
    const origBuild = window.buildTrackGrid;
    const origOnclickStash = new WeakMap();
    window.buildTrackGrid = function(){
      origBuild();
      const grid = document.getElementById('track-grid');
      if(!grid) return;
      const buttons = grid.querySelectorAll('.track-btn');
      buttons.forEach((btn, i) => {
        const cost = PREMIUM_COST_BY_INDEX[i];
        const name = trackNameFromBtn(btn);
        const locked = !isTrackUnlockedByIndex(i, name);
        btn.classList.toggle('pa-locked', locked);
        // Save the original startGame click handler the first time we see this button,
        // so we can restore it cleanly when the track gets unlocked.
        if(!origOnclickStash.has(btn) && btn.onclick) origOnclickStash.set(btn, btn.onclick);
        if(locked && cost){
          btn.setAttribute('data-cost', '🪙 ' + cost);
          btn.onclick = () => {
            if(!confirm('Sbloccare "' + name + '" per ' + cost + ' coin?')) return;
            if(spendCoins(cost, 'unlock-track', name)){
              // Optimistic local unlock. The parent will confirm with a SET_COINS that
              // carries the authoritative unlocked-tracks list and we'll re-sync there.
              PA.unlocked.add(name);
              window.buildTrackGrid();
              toast('Pista sbloccata: ' + name);
            }
          };
        } else {
          btn.removeAttribute('data-cost');
          const orig = origOnclickStash.get(btn);
          if(orig) btn.onclick = orig;
        }
      });
    };
  }

  // ── Race rewards ──
  function rewardForRace(finalPos){
    if(finalPos === 1) return 200;
    if(finalPos === 2) return 100;
    if(finalPos === 3) return 50;
    return 25;
  }
  function rewardForEndless(distanceMeters){
    return Math.max(0, Math.floor(distanceMeters / 50));
  }

  // Read final position from the HUD instead of player.finalPos — `player` is a
  // module-scope let in apex, not exposed on window.
  function readFinalPositionFromDom(){
    const el = document.getElementById('h-pos');
    const txt = (el && el.textContent) || '';
    const m = txt.match(/^(\d+)/);
    return m ? parseInt(m[1], 10) : 4;
  }
  // In endless mode the apex HUD reuses the LAP slot to show distance in meters
  // (e.g. "6290m"). Same trick — parse it from the DOM.
  function readEndlessDistanceFromDom(){
    const el = document.getElementById('h-lap');
    const txt = (el && el.textContent) || '';
    const m = txt.match(/(\d+)m/);
    return m ? parseInt(m[1], 10) : 0;
  }

  if(typeof window.endRace === 'function'){
    const origEnd = window.endRace;
    window.endRace = function(){
      origEnd.apply(this, arguments);
      const pos = readFinalPositionFromDom();
      const reward = rewardForRace(pos);
      if(PA.active){
        send('RACE_FINISHED', { mode: 'race', position: pos, rewardCoins: reward });
        toast('+' + reward + ' coin');
      } else if(reward > 0 && window.Coins){
        // Standalone (paid / free / infinite) — accumulate locally.
        Coins.add(reward, 'apex-race-pos' + pos);
      }
    };
  }

  if(typeof window.endEndlessRace === 'function'){
    const origEndless = window.endEndlessRace;
    window.endEndlessRace = function(){
      origEndless.apply(this, arguments);
      const dist = readEndlessDistanceFromDom();
      const reward = rewardForEndless(dist);
      if(PA.active){
        send('RACE_FINISHED', { mode: 'endless', distance: dist, rewardCoins: reward });
        // Inject a CONTINUE option into the existing overlay.
        const ol = document.getElementById('overlay');
        if(ol && PA.coins >= PA.CONTINUE_COST && typeof window.paContinueEndless === 'function'){
          const btn = document.createElement('button');
          btn.className = 'extra-btn';
          btn.innerHTML = '💪 CONTINUE 500🪙';
          btn.onclick = () => {
            if(spendCoins(PA.CONTINUE_COST, 'endless-continue')){
              ol.style.display = 'none';
              window.paContinueEndless();
            }
          };
          const row = ol.querySelector('div[style*="display:flex"]') || ol.lastElementChild;
          if(row && row.appendChild) row.appendChild(btn);
        }
        if(reward > 0) toast('+' + reward + ' coin');
      } else if(reward > 0 && window.Coins){
        // Standalone (paid / free / infinite) — accumulate locally.
        Coins.add(reward, 'apex-endless-' + dist + 'm');
      }
    };
  }

  // ── Nitro button ──
  // The "are we currently racing?" check uses the overlay's display style: the menu
  // overlay shows display:flex outside of a race and display:none during one. The
  // previous check (window.running) was always undefined — apex declares `running`
  // with `let` at module scope, which does NOT publish to window.
  const nitroBtn = document.getElementById('pa-nitro-btn');
  if(nitroBtn){
    let cooldownEnds = 0;
    const isInRace = () => {
      const ol = document.getElementById('overlay');
      return !!ol && ol.style.display === 'none';
    };
    function refreshNitro(){
      const visible = PA.active && isInRace();
      nitroBtn.classList.toggle('active', visible);
      const now = performance.now();
      const onCd = now < cooldownEnds;
      nitroBtn.disabled = onCd || PA.coins < PA.NITRO_COST;
      nitroBtn.classList.toggle('cooldown', onCd);
    }
    nitroBtn.addEventListener('click', () => {
      if(!PA.active) return;
      const now = performance.now();
      if(now < cooldownEnds) return;
      if(spendCoins(PA.NITRO_COST, 'nitro')){
        window.__paNitroEnds = now + PA.NITRO_DURATION_MS;
        cooldownEnds = now + PA.NITRO_COOLDOWN_MS;
        toast('🚀 NITRO!');
        refreshNitro();
      }
    });
    setInterval(refreshNitro, 250);
  }

  // ── Listener ──
  window.addEventListener('message', (event) => {
    const msg = event.data;
    if(!msg || msg.source !== 'powerapp' || msg.v !== 1) return;
    if(msg.type === 'SET_COINS'){
      PA.active = true;
      PA.coins = Number(msg.value) || 0;
      // The parent is the source of truth for which tracks the user owns. Replace the
      // local set on every SET_COINS so a powerapp refresh (empty list) correctly
      // re-locks the premium tracks.
      const incoming = Array.isArray(msg.unlockedTracks) ? msg.unlockedTracks : [];
      PA.unlocked = new Set(incoming);
      updateHud();
      if(typeof window.buildTrackGrid === 'function') window.buildTrackGrid();
    }
  });

  // Announce readiness to the parent. If nobody answers, the game stays standalone.
  setTimeout(() => send('READY'), 0);
})();
