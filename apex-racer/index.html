// Procedural endless-mode generator: a smoothly-varying radial loop.
function generateProcTrack(){
  const cx = 1200, cy = 900;
  const n  = 14 + Math.floor(Math.random()*5);     // 14-18 control points
  const baseR = 560 + Math.random()*120;
  let prevR = baseR;
  const pts = [];
  for(let i=0;i<n;i++){
    const ang = (i/n) * Math.PI*2;
    let r = baseR * (0.65 + Math.random()*0.6);
    r = prevR*0.55 + r*0.45;
    prevR = r;
    pts.push({
      x: cx + Math.cos(ang)*r + (Math.random()-0.5)*50,
      y: cy + Math.sin(ang)*r*0.82 + (Math.random()-0.5)*50
    });
  }
  const roadW = 82 + Math.floor(Math.random()*22);
  return { name:'Endless', roadW, points: pts, procedural: true };
}

// ── TRUE-ENDLESS MODE ────────────────────────────────────────────────────────
// The track is an open path that EXTENDS as the player progresses. Mathematically
// the trackPoints list is still a closed Catmull-Rom loop (the engine assumes this),
// but the "wrap" between last and first point is always kept far BEHIND the
// player so they never actually reach it. As the player approaches the front of
// the generated path, we append new points to extend it further.
let endlessEnabled  = false;
let endlessHeading  = 0;
let endlessTipX     = 0;
let endlessTipY     = 0;
let endlessCurv     = 0;    // smoothed heading-change velocity
let endlessStartT   = 0;    // normalised t where the player spawns (past padding)
// Turn state machine: most of the time we generate gentle straight-ish points,
// but occasionally we COMMIT to a real curve for several points.
let _endlessTurnSteps   = 0;
let _endlessTurnRate    = 0;
let _endlessStraightAge = 0;
const ENDLESS_STEP    = 280;  // approx world units between control points
const ENDLESS_INITIAL = 28;   // initial number of forward points
const ENDLESS_BUFFER  = 16;   // re-extend when fewer than this many points remain ahead
const ENDLESS_PADDING = 4;    // points BEHIND the start to fix spline tangent

// Endless difficulty curve — everything (player + AI) speeds up over time.
// Every ENDLESS_SPEED_STEP_MS the speed multiplier rises by ENDLESS_SPEED_STEP_PCT,
// capped at ENDLESS_SPEED_CAP. AI rubber-banding still works since this is a
// global multiplier applied uniformly to MAX_SPEED/ACCEL of every car.
const ENDLESS_SPEED_STEP_MS  = 15000;   // every 15 s
const ENDLESS_SPEED_STEP_PCT = 0.06;    // +6%
const ENDLESS_SPEED_CAP      = 2.2;     // ceiling: 2.2× base speed
let   endlessStartTimeMs     = 0;       // performance.now() at endless run start

function endlessSpeedMul(){
  if(!endlessEnabled || !endlessStartTimeMs) return 1;
  const elapsed = performance.now() - endlessStartTimeMs;
  const steps = Math.floor(elapsed / ENDLESS_SPEED_STEP_MS);
  return Math.min(ENDLESS_SPEED_CAP, 1 + steps * ENDLESS_SPEED_STEP_PCT);
}

// Generation parameters tuned to avoid self-overlap that creates the visual
// "fake fork" effect (two close-together road segments crossing).
// Max total turn per committed curve: rate * steps ≤ ~1.1 rad (≈ 63°). Combined
// with a 3-pt minimum straight cooldown after each turn, this guarantees a
// minimum corridor between successive curves so the path never folds back.
let _endlessTurnCooldown = 0;

function _addEndlessPoint(){
  if(_endlessTurnSteps > 0){
    // Inside a committed curve — strong steady heading change
    endlessHeading += _endlessTurnRate;
    _endlessTurnSteps--;
    if(_endlessTurnSteps === 0) _endlessTurnCooldown = 4;   // enforce gap
    _endlessStraightAge = 0;
  } else {
    // Gentle straight-ish wander with damped random walk
    endlessCurv += (Math.random() - 0.5) * 0.07;
    endlessCurv *= 0.82;
    if(endlessCurv >  0.08) endlessCurv =  0.08;
    if(endlessCurv < -0.08) endlessCurv = -0.08;
    endlessHeading += endlessCurv;
    _endlessStraightAge++;
    if(_endlessTurnCooldown > 0) _endlessTurnCooldown--;

    // Only consider a new turn if we've cooled down from the previous one.
    if(_endlessTurnCooldown === 0){
      const turnChance = Math.min(0.30, 0.04 + _endlessStraightAge * 0.022);
      if(Math.random() < turnChance){
        const dir = Math.random() < 0.5 ? -1 : 1;
        // Reduced pools: gentle sweep, moderate, mild-sharp (no hairpins).
        const ratePool = [0.12, 0.18, 0.24];
        const rate = ratePool[Math.floor(Math.random() * ratePool.length)];
        // Cap total turn at ~63° (1.1 rad). Steps = floor(1.1 / rate), 3..5.
        const maxSteps = Math.max(3, Math.min(5, Math.floor(1.1 / rate)));
        _endlessTurnRate  = dir * rate;
        _endlessTurnSteps = 3 + Math.floor(Math.random() * (maxSteps - 2));
        endlessCurv = 0;
      }
    }
  }
  const step = ENDLESS_STEP + (Math.random() - 0.5) * 60;
  let nx = endlessTipX + Math.cos(endlessHeading) * step;
  let ny = endlessTipY + Math.sin(endlessHeading) * step;

  // ── SELF-OVERLAP REPULSION ───────────────────────────────────────────────
  // Scan old points (skipping the last RECENT ones, which are the current
  // segment) and push the heading away from any that fall within MIN_CLEAR.
  // Prevents the procedural walk from folding back on itself → no more
  // visual "fake forks" where two road segments cross in space.
  const MIN_CLEAR = ROAD_W * 3.2;
  const MIN_CLEAR_SQ = MIN_CLEAR * MIN_CLEAR;
  const RECENT = 12;
  const end = trackPoints.length - RECENT;
  let repX = 0, repY = 0;
  for(let i = 0; i < end; i++){
    const p = trackPoints[i];
    const dx = nx - p.x, dy = ny - p.y;
    const d2 = dx*dx + dy*dy;
    if(d2 < MIN_CLEAR_SQ){
      const d = Math.sqrt(d2) || 1;
      const w = (MIN_CLEAR - d) / MIN_CLEAR;       // 0..1, stronger when closer
      repX += (dx / d) * w;
      repY += (dy / d) * w;
    }
  }
  if(repX !== 0 || repY !== 0){
    const repAngle = Math.atan2(repY, repX);
    let dh = repAngle - endlessHeading;
    while(dh >  Math.PI) dh -= 2*Math.PI;
    while(dh < -Math.PI) dh += 2*Math.PI;
    const repMag = Math.min(1, Math.hypot(repX, repY));
    endlessHeading += dh * repMag;
    // Recompute the new point with the corrected heading
    nx = endlessTipX + Math.cos(endlessHeading) * step;
    ny = endlessTipY + Math.sin(endlessHeading) * step;
    // Cancel any ongoing committed turn (we've overridden it)
    _endlessTurnSteps = 0;
    _endlessTurnCooldown = 6;
  }

  endlessTipX = nx;
  endlessTipY = ny;
  trackPoints.push({ x: endlessTipX, y: endlessTipY });
}

function _rebuildEndlessSamples(){
  // Density: ~14 samples per control point — keeps geometry smooth as it grows.
  SAMPLES = trackPoints.length * 14;
  trackSamples.length = 0;
  for(let i=0;i<SAMPLES;i++) trackSamples.push(ptOnTrack(i/SAMPLES));
  trackNormals.length = 0;
  trackDist.length = 0;
  trackDist.push(0);
  for(let i=0;i<SAMPLES;i++){
    const a = trackSamples[i], b = trackSamples[(i+1)%SAMPLES];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.sqrt(dx*dx+dy*dy) || 1;
    trackNormals.push({x:-dy/len, y:dx/len});
    if(i<SAMPLES-1) trackDist.push(trackDist[i]+len);
  }
  totalLen = trackDist[SAMPLES-1] + Math.hypot(
    trackSamples[0].x - trackSamples[SAMPLES-1].x,
    trackSamples[0].y - trackSamples[SAMPLES-1].y
  );
  // Per-sample widths: smooth sin-based variation between 75% and 130% of ROAD_W.
  // Two independent low-frequency waves produce strettoie + allargamenti at
  // different rates, so the road feels organically variable.
  trackWidths.length = 0;
  for(let i=0;i<SAMPLES;i++){
    const a = Math.sin(i * 0.012) * 0.18;
    const b = Math.sin(i * 0.043 + 1.3) * 0.10;
    const mult = 1 + a + b;                  // ≈ 0.72 .. 1.28
    trackWidths.push(ROAD_W * Math.max(0.65, Math.min(1.35, mult)));
  }
  computeRacingLine();
  buildSceneryTrees();   // refresh scenery to match the extended path
}

function initEndlessTrack(){
  trackPoints.length = 0;
  endlessHeading = 0;
  endlessCurv    = 0;
  _endlessTurnSteps    = 0;
  _endlessTurnRate     = 0;
  _endlessStraightAge  = 0;
  _endlessTurnCooldown = 0;
  endlessTipX    = 800;
  endlessTipY    = 1000;

  // Padding points BEHIND the actual start. This gives the Catmull-Rom spline
  // at the player's spawn point a sensible "previous" neighbour, so the heading
  // is aligned with the road instead of getting yanked toward the far-away
  // wrap point (trackPoints[length-1]).
  for(let i = ENDLESS_PADDING; i >= 1; i--){
    trackPoints.push({ x: endlessTipX - i * ENDLESS_STEP, y: endlessTipY });
  }
  // The actual start point (where the player spawns)
  trackPoints.push({ x: endlessTipX, y: endlessTipY });
  // Forward generation
  for(let i = 0; i < ENDLESS_INITIAL; i++) _addEndlessPoint();

  // Player spawns at the start-after-padding point
  endlessStartT = ENDLESS_PADDING / trackPoints.length;

  ROAD_W = 92;
  TRACK_W = 4000; TRACK_H = 4000;
  currentTrackName = 'Endless';
  isProcedural = true;
  resetScenery();
  _rebuildEndlessSamples();
  trackIntersections = [];   // no self-crossings in endless
}

// Add 1–5 crash points to the player (only meaningful in endless mode).
// Scaled by impact magnitude: gentle brushes = 1, full-speed slams = 5.
function addPlayerCrash(impactMag){
  if(!endlessEnabled) return;
  if(!Number.isFinite(impactMag) || impactMag <= 0) return;
  const pts = Math.min(5, Math.max(1, Math.round(impactMag * 0.9)));
  playerCrashPoints = Math.min(CRASH_LIMIT, playerCrashPoints + pts);
  flashMsg('CRASH +' + pts);
  if(playerCrashPoints >= CRASH_LIMIT){
    endEndlessRace();
  }
}

// Show the endless game-over screen with the player's final stats.
function endEndlessRace(){
  if(!endlessEnabled) return;
  running = false;
  setTouchVisible(false);
  const dist = Math.floor(trackDist[player.lastIdx] || 0);
  const pos  = calcPosition();
  const tSec = ((performance.now() - startTime) / 1000).toFixed(1);
  const posStr = ['1st','2nd','3rd','4th'][pos-1] || (pos+'th');
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#ff6644;text-shadow:0 0 30px #ff6644">100 CRASH!</h2>
    <p style="margin-bottom:8px;font-size:1.1rem">Posizione finale: <b>${posStr}</b></p>
    <p style="margin-bottom:8px;font-size:1.1rem">Distanza percorsa: <b>${dist} m</b></p>
    <p style="margin-bottom:16px;font-size:1.1rem">Tempo: <b>${tSec}s</b></p>
    <div style="display:flex;gap:10px">
      <button class="extra-btn" onclick="backToMenu()">MENU</button>
      <button class="extra-btn" onclick="startGameEndless()">RIPROVA</button>
    </div>
  `;
}

// ── ENDLESS OBSTACLES ───────────────────────────────────────────────────────
function spawnEndlessObstacle(){
  if(!endlessEnabled || !player) return;
  const playerIdx = player.lastIdx || 0;
  const ahead = 80 + Math.floor(Math.random() * 70);   // 80–150 samples ahead
  const idx = (playerIdx + ahead) % SAMPLES;
  // Refuse the spawn if it would land too close to an existing cone on the
  // track ring — keeps the road from getting littered with cones.
  for(const o of endlessObstacles){
    let d = Math.abs(((o.idx - idx) % SAMPLES + SAMPLES) % SAMPLES);
    d = Math.min(d, SAMPLES - d);
    if(d < OBSTACLE_MIN_GAP_SAMPLES) return;
  }
  const sample = trackSamples[idx];
  const norm   = trackNormals[idx];
  if(!sample || !norm) return;
  const lateral = (Math.random() - 0.5) * ROAD_W * 0.7;
  endlessObstacles.push({
    x: sample.x + norm.x * lateral,
    y: sample.y + norm.y * lateral,
    r: OBSTACLE_R,
    idx
  });
}

function updateEndlessObstacles(){
  if(!endlessEnabled || !player) return;
  // Spawn periodically — interval shrinks as the speed multiplier grows.
  const now = performance.now();
  const spawnInterval = OBSTACLE_SPAWN_INTERVAL_MS / endlessSpeedMul();
  if(now - endlessLastObstacleSpawn > spawnInterval){
    spawnEndlessObstacle();
    endlessLastObstacleSpawn = now;
  }
  // Remove far-behind obstacles
  endlessObstacles = endlessObstacles.filter(o => {
    const dx = o.x - player.x, dy = o.y - player.y;
    return (dx*dx + dy*dy) < 3000*3000;
  });
  // Collision check (every car, but crash points only for player)
  for(let i=endlessObstacles.length-1; i>=0; i--){
    const o = endlessObstacles[i];
    for(const car of cars){
      const dx = car.x - o.x, dy = car.y - o.y;
      const d = Math.hypot(dx, dy);
      if(d < o.r + 15){
        const speed = Math.hypot(car.vx, car.vy);
        if(car.isPlayer) addPlayerCrash(speed * 1.5);
        // Knock the car back slightly + remove obstacle
        car.vx *= 0.55; car.vy *= 0.55;
        car.collisionShake = 0.25;
        endlessObstacles.splice(i, 1);
        break;
      }
    }
  }
}

function drawEndlessObstacles(ctx, ox, oy, zoom){
  if(!endlessEnabled) return;
  const useSprite = graphicsMode === 'kenney' && Assets.ready
                  && Assets.cone && Assets.cone.complete && Assets.cone.naturalWidth > 0;
  for(const o of endlessObstacles){
    const sx = (o.x - ox) * zoom + W/2;
    const sy = (o.y - oy) * zoom + H/2;
    const r  = o.r * zoom;
    if(useSprite){
      const size = r * 2.2;
      ctx.drawImage(Assets.cone, sx - size/2, sy - size/2, size, size);
    } else {
      // Outer ring (warning red)
      ctx.fillStyle = '#ff6622';
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI*2);
      ctx.fill();
      // White stripe
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx - r*0.7, sy - r*0.18, r*1.4, r*0.36);
      // Inner dark
      ctx.fillStyle = '#220a04';
      ctx.beginPath();
      ctx.arc(sx, sy, r*0.45, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// ── SURFACE PATCHES (dirt / ice / sand / oil / water) ───────────────────────
// Patches are ELLIPSES aligned with the track direction at their spawn idx.
// Long axis (rl) runs along the road — "streaks" of oil/wet pavement.
// Short axis (rw) runs across — limited to part of the road so the player
// can swerve around them if skilled enough.
function spawnEndlessSurface(){
  if(!endlessEnabled || !player) return;
  const playerIdx = player.lastIdx || 0;
  const ahead = 90 + Math.floor(Math.random() * 100);
  const idx = (playerIdx + ahead) % SAMPLES;
  const sample = trackSamples[idx];
  const norm   = trackNormals[idx];
  const nextS  = trackSamples[(idx + 1) % SAMPLES];
  if(!sample || !norm || !nextS) return;
  // Track tangent direction at this sample → patch rotation angle
  const tx = nextS.x - sample.x, ty = nextS.y - sample.y;
  const angle = Math.atan2(ty, tx);
  // Length (along road) varies a lot: from short puddle to long streak
  const rl = 35 + Math.random() * 110;            // 35–145 world units
  // Width (across road) capped to leave the player a clear lane
  const rw = 22 + Math.random() * 22;             // 22–44 world units
  // Lateral offset: keep within ROAD_W − rw so it stays on the asphalt
  const maxLat = Math.max(0, ROAD_W - rw - 5);
  const lateral = (Math.random() * 2 - 1) * maxLat;
  const type = SURFACE_KEYS[Math.floor(Math.random() * SURFACE_KEYS.length)];
  endlessSurfaces.push({
    x: sample.x + norm.x * lateral,
    y: sample.y + norm.y * lateral,
    rl, rw, angle, type
  });
}

// Rotated-ellipse point test: is (px, py) inside the patch?
function _pointInPatch(px, py, p){
  const dx = px - p.x, dy = py - p.y;
  const c = Math.cos(-p.angle), s = Math.sin(-p.angle);
  const lx = dx*c - dy*s;     // along the road
  const ly = dx*s + dy*c;     // across the road
  return (lx*lx)/(p.rl*p.rl) + (ly*ly)/(p.rw*p.rw) < 1;
}

function updateEndlessSurfaces(dt){
  if(!endlessEnabled || !player) return;
  const now = performance.now();
  const surfInterval = SURFACE_SPAWN_INTERVAL_MS / endlessSpeedMul();
  if(now - endlessLastSurfaceSpawn > surfInterval){
    spawnEndlessSurface();
    endlessLastSurfaceSpawn = now;
  }
  // Despawn patches well behind the player
  endlessSurfaces = endlessSurfaces.filter(p => {
    const dx = p.x - player.x, dy = p.y - player.y;
    return (dx*dx + dy*dy) < 3500*3500;
  });
  // For each car: refresh effect while on a patch, else fade out
  for(const car of cars){
    let onPatch = null;
    for(const p of endlessSurfaces){
      if(_pointInPatch(car.x, car.y, p)){ onPatch = p; break; }
    }
    if(onPatch){
      const surf = SURFACE_TYPES[onPatch.type];
      if(car.isPlayer && (!car.surfaceEffect || car.surfaceEffect.type !== onPatch.type)){
        flashMsg(surf.name);
      }
      car.surfaceEffect = { type: onPatch.type, timeLeft: surf.duration };
    } else if(car.surfaceEffect){
      car.surfaceEffect.timeLeft -= dt;
      if(car.surfaceEffect.timeLeft <= 0) car.surfaceEffect = null;
    }
  }
}

function drawEndlessSurfaces(ctx, ox, oy, zoom){
  if(!endlessEnabled) return;
  const oilSpriteOK = graphicsMode === 'kenney' && Assets.ready
                    && Assets.oil && Assets.oil.complete && Assets.oil.naturalWidth > 0;
  for(const p of endlessSurfaces){
    const sx = (p.x - ox) * zoom + W/2;
    const sy = (p.y - oy) * zoom + H/2;
    const rl = p.rl * zoom, rw = p.rw * zoom;
    const surf = SURFACE_TYPES[p.type];
    // Oil patches in Kenney mode: use the bitmap blob sprite (tinted via filter)
    if(oilSpriteOK && p.type === 'oil'){
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(p.angle);
      const W2 = rl * 2, H2 = rw * 2;
      ctx.globalAlpha = 0.85;
      ctx.drawImage(Assets.oil, -W2/2, -H2/2, W2, H2);
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(p.angle);
    // Main blob — soft outer falloff for a "splash" look
    const grad = ctx.createRadialGradient(0, 0, rw*0.3, 0, 0, Math.max(rl, rw));
    grad.addColorStop(0, surf.color + 'd0');
    grad.addColorStop(0.7, surf.color + '99');
    grad.addColorStop(1, surf.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, rl, rw, 0, 0, Math.PI*2);
    ctx.fill();
    // Irregular accent flecks scattered inside the ellipse (golden-angle layout)
    ctx.fillStyle = surf.accent;
    const flecks = Math.floor(Math.sqrt(rl*rw) * 0.7);
    for(let i=0;i<flecks;i++){
      const a  = i * 2.39996;
      const tt = Math.sqrt((i+1) / flecks);
      const fx = Math.cos(a) * rl * tt * 0.82;
      const fy = Math.sin(a) * rw * tt * 0.82;
      ctx.beginPath();
      ctx.arc(fx, fy, Math.max(1, Math.min(rl,rw)*0.06), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// Called every frame from the game loop: if the player is approaching the
// front of the generated path, append more points and rebuild samples.
function maybeExtendEndless(){
  if(!endlessEnabled || !cars.length) return;
  // Trigger on the LEADING car, not just the player, so AI cars don't race
  // off the end of the generated path.
  let leadIdx = 0;
  for(const car of cars){
    const c = closestOnTrack(car.x, car.y, car.lastIdx);
    car.lastIdx = c.idx;
    if(c.idx > leadIdx) leadIdx = c.idx;
  }
  const samplesPerPoint = SAMPLES / trackPoints.length;
  const leadPointIdx    = leadIdx / samplesPerPoint;
  const pointsAhead     = trackPoints.length - leadPointIdx;
  if(pointsAhead < ENDLESS_BUFFER){
    for(let i=0;i<ENDLESS_BUFFER;i++) _addEndlessPoint();
    _rebuildEndlessSamples();
    // After rebuild, sample indices have shifted slightly. Re-locate every car.
    cars.forEach(car => {
      const cc = closestOnTrack(car.x, car.y, car.lastIdx);
      car.lastIdx = cc.idx;
    });
  }
}

// Load default track immediately so the rest of the script has data.
loadTrack(TRACKS[0]);

// Find closest sample point. If a hint index is given, prefer samples near
// the hint — keeps the car on its current branch of a self-intersecting track.
function closestOnTrack(px,py,hint){
  // Guard against NaN inputs.
  if(!Number.isFinite(px) || !Number.isFinite(py)){
    return {idx: 0, dist: 0};
  }
  if(!Number.isFinite(hint)) hint = undefined;
  if(hint !== undefined && hint !== null){
    let best=Infinity, bestIdx=hint;
    const WIN=35;
    for(let k=-WIN;k<=WIN;k++){
      const i=((hint+k)%SAMPLES+SAMPLES)%SAMPLES;
      const s=trackSamples[i];
      const d=(px-s.x)**2+(py-s.y)**2;
      if(d<best){best=d;bestIdx=i;}
    }
    if(Math.sqrt(best) < ROAD_W*3){
      return {idx:bestIdx, dist:Math.sqrt(best)};
    }
  }
  let best=Infinity, bestIdx=0;
  for(let i=0;i<SAMPLES;i++){
    const s=trackSamples[i];
    const d=(px-s.x)**2+(py-s.y)**2;
    if(d<best){best=d;bestIdx=i;}
  }
  return {idx:bestIdx, dist:Math.sqrt(best)};
}

// Total curvature in the next "span" samples (radians of heading change)
function upcomingCurvature(idx, span){
  let sum = 0;
  for(let i=0;i<span;i++){
    const a = trackSamples[(idx+i)%SAMPLES];
    const b = trackSamples[(idx+i+1)%SAMPLES];
    const c = trackSamples[(idx+i+2)%SAMPLES];
    const a1 = Math.atan2(b.y-a.y, b.x-a.x);
    const a2 = Math.atan2(c.y-b.y, c.x-b.x);
    let da = a2-a1;
    while(da > Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    sum += Math.abs(da);
  }
  return sum;
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
let cam = {x:800, y:200, zoom:1.0};

// ── CAR CLASS ─────────────────────────────────────────────────────────────────
class Car {
  constructor(t, color, isPlayer, skill, aiOffset){
    this.t = t; // track position 0..1
    const pos = ptOnTrack(t);
    const pos2 = ptOnTrack((t+0.001)%1);
    this.x = pos.x;
    this.y = pos.y;
    this.angle = Math.atan2(pos2.y-pos.y, pos2.x-pos.x);
    this.vx = 0; this.vy = 0;
    this.speed = 0;
    this.color = color;
    // Map vector colour → closest Kenney sprite colour
    const _sMap = {
      '#00f5ff': 'blue',
      '#ff4466': 'red',
      '#ffcc00': 'yellow',
      '#44ff88': 'green'
    };
    this.spriteColor   = _sMap[color] || 'red';
    this.spriteVariant = Math.floor(Math.random() * 5);   // 0..4
    this.isPlayer = isPlayer;
    this.skill = skill || 1.0;        // AI skill multiplier (target speed in curves)
    this.aiOffset = aiOffset || 0;    // base racing-line bias (px from centre)
    this.dodgeOffset = 0;             // dynamic overtake offset (smoothed)
    this.lap = 1;
    this.lastSeg = 0;
    this.hasLeftStart = false;        // true once we've gone past the middle of the track
    this.lapTimes = [];
    this.lapStart = 0;
    this.finished = false;
    this.finalPos = null;
    this.collisionShake = 0;
    this.lastIdx = Math.floor(t * SAMPLES); // hint for closestOnTrack
    this.health = 100;                // 100 -> 80
    this.HEALTH_MIN = 80;

    // Trail
    this.trail = [];
  }

  computeAI(){
    // ── 0) read state ─────────────────────────────────────────────────────
    const speedNow = Math.hypot(this.vx, this.vy);
    const safeMy = Number.isFinite(this.t)
      ? ((Math.floor(this.t * SAMPLES) % SAMPLES) + SAMPLES) % SAMPLES
      : 0;
    const fwdX = Math.cos(this.angle), fwdY = Math.sin(this.angle);

    // ── 1) target SPEED from precomputed profile, with small lookahead ────
    //   trackMaxSpeed already includes backward braking propagation, so
    //   it tells us how fast we can be HERE to still slow for upcoming
    //   curves. A tiny extra lookahead absorbs sampling jitter.
    const SPEED_LOOK = 5;
    let targetSpeed = trackMaxSpeed[safeMy] || 6.2;
    for(let k=1; k<=SPEED_LOOK; k++){
      const v = trackMaxSpeed[(safeMy + k) % SAMPLES];
      if(v < targetSpeed) targetSpeed = v;
    }
    // Endless mode: scale the precomputed track speed profile by the SAME
    // factor used in Car.update — otherwise the AI would be capped at the
    // base curve-safe speed while the player's MAX_SPEED scales over time,
    // making AI cars feel artificially slow as the run progresses.
    const _endlessMul = endlessSpeedMul();
    targetSpeed *= _endlessMul;
    // Rubber-band asymmetric:
    //  - BOOST (catchup > 1): full on straights; ~35% strength in curves
    //    (enough to gain time on chasers but not enough to break grip).
    //  - PENALTY (catchup < 1): full everywhere (slowing is always safe).
    // Skill (>1) is also capped to 1.0 in curves — never exceed the
    // physically-safe pre-computed speed profile when grip is the limit.
    const aiCatchup  = this.isPlayer ? 1 : rubberBandFactor(this);
    const onStraight = targetSpeed > 5.6 * _endlessMul;
    let speedBoost;
    if(aiCatchup < 1){
      speedBoost = aiCatchup;                              // penalty: always
    } else if(onStraight){
      speedBoost = aiCatchup;                              // boost: full on straight
    } else {
      speedBoost = 1 + (aiCatchup - 1) * 0.50;             // boost: half in curve
    }
    const effSkill = onStraight ? this.skill : Math.min(1.0, this.skill);
    targetSpeed *= effSkill * speedBoost;

    // ── 2) overtake / avoidance ───────────────────────────────────────────
    let dodgeTarget  = 0;
    let blockedAhead = false;
    const SENSE = 110;
    for(const other of cars){
      if(other === this || other.finished) continue;
      const dx = other.x - this.x, dy = other.y - this.y;
      const ahead = dx*fwdX + dy*fwdY;
      const side  = -dx*fwdY + dy*fwdX;
      if(ahead <= 0 || ahead > SENSE) continue;
      if(Math.abs(side) > 55) continue;

      const otherSpeed = Math.hypot(other.vx, other.vy);
      const passSide   = side >= 0 ? -1 : 1;
      const urgency    = (SENSE - ahead) / SENSE;
      dodgeTarget += passSide * urgency * 30;

      if(ahead < 30 && otherSpeed < speedNow + 0.1){
        blockedAhead = true;
      }
    }
    this.dodgeOffset += (dodgeTarget - this.dodgeOffset) * 0.18;
    const DODGE_CAP = ROAD_W * 0.22;
    if(this.dodgeOffset >  DODGE_CAP) this.dodgeOffset =  DODGE_CAP;
    if(this.dodgeOffset < -DODGE_CAP) this.dodgeOffset = -DODGE_CAP;

    // ── 3) steering: aim at the waypoint on the racing line ───────────────
    //   look-ahead scales with speed so the car turns smoothly at high speed
    //   and reacts quickly at low speed. Capped to avoid wrapping a short
    //   loop (max 1/4 of track).
    const wpLook = Math.min(
      Math.floor(SAMPLES * 0.25),
      Math.max(8, Math.floor(8 + speedNow * 5))
    );
    const targetIdx = (safeMy + wpLook) % SAMPLES;
    const wp   = trackSamples[targetIdx];
    const norm = trackNormals[targetIdx];
    if(!wp || !norm) return { gas: 0.5, steer: 0 };

    // Combined lateral offset = racing-line + STRONG personal lane + dodge.
    // The personal bias is now dominant: each AI car keeps a distinct lateral
    // lane so they don't all converge on the apex and collide in a clump.
    let lateral = (trackRacingLine[targetIdx] || 0) * 0.7
                + this.aiOffset
                + this.dodgeOffset;
    // Cap against the LOCAL track half-width — keeps the AI inside narrow sections.
    const _localW = trackWidths[targetIdx] || ROAD_W;
    const LATERAL_CAP = _localW * 0.42;
    if(lateral >  LATERAL_CAP) lateral =  LATERAL_CAP;
    if(lateral < -LATERAL_CAP) lateral = -LATERAL_CAP;

    const wpX = wp.x + norm.x * lateral;
    const wpY = wp.y + norm.y * lateral;

    let dHeading = Math.atan2(wpY - this.y, wpX - this.x) - this.angle;
    while(dHeading >  Math.PI) dHeading -= 2*Math.PI;
    while(dHeading < -Math.PI) dHeading += 2*Math.PI;
    let steer = dHeading * 2.4;

    // SAFETY NET: if we're closer than 30% of ROAD_W from the wall, force a
    // hard steer toward the track centerline. Overrides racing-line bias.
    const wallDist = (typeof this._wallDist === 'number') ? this._wallDist : ROAD_W;
    if(wallDist < ROAD_W * 0.30){
      const here = trackSamples[((this.lastIdx % SAMPLES) + SAMPLES) % SAMPLES];
      if(here){
        let dCenter = Math.atan2(here.y - this.y, here.x - this.x) - this.angle;
        while(dCenter >  Math.PI) dCenter -= 2*Math.PI;
        while(dCenter < -Math.PI) dCenter += 2*Math.PI;
        const urgency = 1 - Math.max(0, wallDist) / (ROAD_W * 0.30);
        // Hard pull toward centerline — overrides the normal steer
        const safetySteer = Math.max(-1, Math.min(1, dCenter * 3.0));
        steer = steer * (1 - urgency) + safetySteer * urgency;
      }
    }
    steer = Math.max(-1, Math.min(1, steer));

    // ── 4) throttle: smooth PI-like control toward targetSpeed ────────────
    //   No more discrete tiers — just push gas up when below target, lift
    //   when at target, brake when meaningfully above. Predictable.
    let appliedTarget = targetSpeed;
    if(blockedAhead) appliedTarget = Math.min(appliedTarget, speedNow * 0.92);

    const diff = appliedTarget - speedNow;
    let gas;
    if(diff > 0.5)       gas =  1.0;
    else if(diff > 0.1)  gas =  0.6 + diff * 0.8;     // smooth ramp
    else if(diff > -0.1) gas =  0.25;                  // maintain
    else if(diff > -0.5) gas = -0.2 - (-diff - 0.1) * 1.0;
    else                 gas = -0.7;                   // hard brake

    return { gas, steer };
  }

  update(dt, keys){
    // Aggressive NaN-guard: any non-finite state gets reset to a sane value.
    // This stops any single-frame edge case from cascading and freezing the game.
    if(!Number.isFinite(this.x) || !Number.isFinite(this.y)){
      const safe = ptOnTrack(this.t > 0 && this.t < 1 ? this.t : 0);
      this.x = safe.x; this.y = safe.y;
    }
    if(!Number.isFinite(this.vx))     this.vx = 0;
    if(!Number.isFinite(this.vy))     this.vy = 0;
    if(!Number.isFinite(this.angle))  this.angle = 0;
    if(!Number.isFinite(this.t))      this.t = 0;
    if(!Number.isFinite(this.lastIdx)) this.lastIdx = 0;
    if(!Number.isFinite(this.health)) this.health = this.HEALTH_MIN;
    if(!Number.isFinite(this.damageThisLap)) this.damageThisLap = 0;
    if(!Number.isFinite(this.speed))  this.speed = 0;
    if(this.finished){
      // coast to a stop, still subject to collisions
      const decay = Math.pow(0.92, dt*60);
      this.vx *= decay; this.vy *= decay;
      this.x += this.vx*60*dt; this.y += this.vy*60*dt;
      this.speed = Math.hypot(this.vx,this.vy);
      return;
    }

    let gas, steerInput;
    if(this.isPlayer){
      // Auto-throttle: gas at 100% by default.
      // - Steering one side: lift to ~35% (natural corner entry / coast)
      // - Both directions pressed simultaneously: hard brake.
      // - Up key (desktop): still works as legacy "force full gas" boost.
      const bothPressed = keys.left && keys.right;
      if(bothPressed){
        gas = -0.7;            // brake
        steerInput = 0;
      } else if(keys.left || keys.right){
        gas = 0.55;            // soft lift-on-steer — keeps momentum through curves
        steerInput = keys.left ? -1 : 1;
      } else {
        gas = 1;               // full throttle
        steerInput = 0;
      }
    } else {
      const ai = this.computeAI();
      gas = ai.gas; steerInput = ai.steer;
    }

    const fwdX = Math.cos(this.angle);
    const fwdY = Math.sin(this.angle);

    // Rubber-banding: cars behind the leader get a boost (Mario-Kart style)
    // Player gets BOOST when behind, but never PENALTY when leading — feels bad.
    // AI gets full symmetric rubber-band (boost when behind, slowdown when leading).
    const rbRaw = rubberBandFactor(this);
    const catchup = this.isPlayer ? Math.max(1, rbRaw) : rbRaw;
    // Powerapp bridge nitro: only the player can buy nitro, and only while bridgeActive.
    const nitroMult = (this.isPlayer && window.__paNitroEnds && performance.now() < window.__paNitroEnds) ? 1.4 : 1;
    const endlessMul = endlessSpeedMul();
    const MAX_SPEED = 6.2 * catchup * nitroMult * endlessMul;
    const ACCEL = 4.2 * catchup * nitroMult * endlessMul;
    const BRAKE = 7.0;

    // Engine
    if(gas > 0){
      this.vx += fwdX * ACCEL * gas * dt;
      this.vy += fwdY * ACCEL * gas * dt;
    } else if(gas < 0){
      const sp = Math.hypot(this.vx, this.vy);
      if(sp > 0.05){
        const brakeDV = Math.min(BRAKE * Math.abs(gas) * dt, sp);
        this.vx -= (this.vx/sp) * brakeDV;
        this.vy -= (this.vy/sp) * brakeDV;
      }
    }

    // Rolling drag — più forte quando NON si accelera (sostituisce il freno).
    // Surface effect modifiers (only set in endless mode, when on/near a patch).
    // While ON a patch, surfaceEffect.timeLeft is refreshed every frame to
    // duration. Off the patch, it decays — so the car gradually "cleans" itself.
    let surfSteerMult = 1, surfDragMult = 1;
    if(this.surfaceEffect){
      const _s = SURFACE_TYPES[this.surfaceEffect.type];
      if(_s){
        const _str = Math.min(1, this.surfaceEffect.timeLeft / _s.duration);
        surfSteerMult = 1 - (1 - _s.steerMult) * _str;
        surfDragMult  = 1 + (_s.dragMult - 1) * _str;
      }
    }
    const drag = ((gas > 0) ? 0.55 : 1.15) * surfDragMult;
    this.vx -= this.vx * drag * dt;
    this.vy -= this.vy * drag * dt;

    // Lateral grip — kills the sideways component of velocity.
    // Grip drops sharply with speed → going fast through corners means SLIDING WIDE.
    const speedNow = Math.hypot(this.vx, this.vy);
    const fwdSpeed = this.vx*fwdX + this.vy*fwdY;
    const latVx = this.vx - fwdX*fwdSpeed;
    const latVy = this.vy - fwdY*fwdSpeed;
    const gripBase = this.isPlayer ? 5.0 : 7.2; // AI con più grip per non finire sui muri
    const grip = Math.max(0.35, gripBase - speedNow * 0.85);
    const gripDt = 1 - Math.exp(-grip * dt);
    this.vx -= latVx * gripDt;
    this.vy -= latVy * gripDt;

    // Steering molto più punchy: efficace anche a bassa velocità,
    // perdita di efficacia in curva veloce è più dolce.
    const STEER_STR = 3.5;
    const lowSpeedRamp = Math.min(1, 0.55 + speedNow / 1.1);
    const highSpeedFalloff = Math.max(0.6, 1.65 - speedNow * 0.15);
    const steerEff = lowSpeedRamp * highSpeedFalloff;
    this.angle += steerInput * STEER_STR * dt * steerEff * surfSteerMult;

    // Speed cap
    const finalSpeed = Math.hypot(this.vx, this.vy);
    if(finalSpeed > MAX_SPEED){
      const k = MAX_SPEED/finalSpeed;
      this.vx *= k; this.vy *= k;
    }

    // Integrate position
    this.x += this.vx * 60 * dt;
    this.y += this.vy * 60 * dt;

    // Off-track: push back, apply heavy "grass" drag, and damage on hard impact
    const c = closestOnTrack(this.x, this.y, this.lastIdx);
    this.lastIdx = c.idx;
    // Use per-sample width so narrows/widenings actually feel different.
    const localW = (trackWidths.length > c.idx ? trackWidths[c.idx] : ROAD_W);
    this._wallDist = localW - c.dist;
    if(c.dist > localW){
      const s = trackSamples[c.idx];
      const push = c.dist - localW;
      const dx = this.x - s.x, dy = this.y - s.y;
      const ld = Math.sqrt(dx*dx+dy*dy)||1;
      const nx = dx/ld, ny = dy/ld;            // outward normal from track
      this.x -= nx * push;
      this.y -= ny * push;
      // Damage when smacking the wall fast
      const intoWall = this.vx*nx + this.vy*ny;
      if(intoWall > 1.0){
        this.applyDamage(intoWall * 1.4);
        // Endless mode: player wall hit → crash points
        if(this.isPlayer) addPlayerCrash(intoWall);
      }
      // Continuous damage if scraping wall at speed
      if(speedNow > 2){
        this.applyDamage(speedNow * 0.45 * dt);
      }
      const grassDrag = 3.4;
      this.vx -= this.vx * grassDrag * dt;
      this.vy -= this.vy * grassDrag * dt;
    }

    this.t = c.idx / SAMPLES;
    this.speed = fwdSpeed;

    // Lap detection: only fire after the car has passed the middle of the lap once.
    if(this.t > 0.4 && this.t < 0.6) this.hasLeftStart = true;
    if(this.hasLeftStart && this.lastSeg > 0.85 && this.t < 0.1){
      const now = performance.now();
      const lt = (now - this.lapStart)/1000;
      this.lapTimes.push(lt);
      if(this.isPlayer){
        flashMsg("LAP " + this.lap + " — " + lt.toFixed(2)+"s");
      }
      this.lapStart = now;
      this.hasLeftStart = false;
      this.damageThisLap = 0;
      this.lap++;
      // In infinite (Endless) mode the race never ends — laps just keep counting.
      if(!isInfiniteMode && this.lap > TOTAL_LAPS){
        this.finished = true;
        this.finalPos = ++finishedCount;
        if(this.isPlayer) endRace();
      }
    }
    this.lastSeg = this.t;

    if(this.collisionShake > 0) this.collisionShake -= dt;

    // Trail
    this.trail.push({x:this.x, y:this.y});
    if(this.trail.length > 30) this.trail.shift();
  }

  applyDamage(amount){ /* damage disabled */ }

  draw(ctx, ox, oy, zoom){
    const sx=(this.x-ox)*zoom+W/2, sy=(this.y-oy)*zoom+H/2;
    // Length runs along the local +x axis (direction of motion).
    const CL = 30*zoom;   // nose-to-tail
    const CW = 16*zoom;   // side-to-side

    // Brutimon skin: replace the whole car with the Brutimon sprite mapped to
    // this car's colour slot. Player gets a yellow glow ring; others a faint
    // halo in their slot colour. Sprite is rotated to face travel direction.
    if(graphicsMode === 'pokemon' && Assets.pkBySlot){
      const pkImg = Assets.pkBySlot[this.spriteColor];
      if(pkImg && pkImg.complete && pkImg.naturalWidth > 0){
        // Shadow
        ctx.save();
        ctx.translate(sx + 1.5*zoom, sy + 2.5*zoom);
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(0, 0, CW*0.9, CL*0.55, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        // Glow ring
        ctx.save();
        ctx.translate(sx, sy);
        ctx.strokeStyle = this.isPlayer ? '#ffcc00' : (this.color + 'aa');
        ctx.lineWidth = (this.isPlayer ? 3 : 2) * zoom;
        ctx.shadowColor = this.isPlayer ? '#ffcc00' : this.color;
        ctx.shadowBlur = (this.isPlayer ? 22 : 12) * zoom;
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(CL, CW) * 0.85, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
        // Sprite — face direction of travel (sprites face "up", world angle 0
        // is "right", so rotate by angle + π/2).
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle + Math.PI/2);
        const sz = CL * 1.8;
        ctx.drawImage(pkImg, -sz/2, -sz/2, sz, sz);
        ctx.restore();
        return;
      }
    }

    // Kenney sprite mode: render the bitmap car and short-circuit the vector pipeline.
    if(graphicsMode === 'kenney' && Assets.ready){
      const list = Assets.cars[this.spriteColor];
      const img  = list && list[this.spriteVariant];
      if(img && img.complete && img.naturalWidth > 0){
        // Subtle shadow under the car for depth
        ctx.save();
        ctx.translate(sx + 1.5*zoom, sy + 2.5*zoom);
        ctx.rotate(this.angle + Math.PI/2);
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(0, 0, CW*0.75, CL*0.55, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        // Player glow ring
        if(this.isPlayer){
          ctx.save();
          ctx.translate(sx, sy);
          ctx.strokeStyle = this.color + '88';
          ctx.lineWidth = 2*zoom;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 14*zoom;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(CL, CW) * 0.85, 0, Math.PI*2);
          ctx.stroke();
          ctx.restore();
        }
        // Car sprite: Kenney cars face UP in the sprite, so rotate by +π/2 from game-x angle
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle + Math.PI/2);
        // Native sprite ≈ 71×131. We render at the same effective length as classic mode (CL = 30 game-units along forward).
        const drawW = 1.05 * CL * (71/131);     // width preserves aspect of sprite
        const drawH = 1.05 * CL;
        ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);
        ctx.restore();
        return;
      }
    }

    // Trail (slipstream): fades as it gets older
    if(this.trail.length>2){
      ctx.save();
      ctx.lineCap='round';
      ctx.lineWidth = 4*zoom;
      for(let i=1;i<this.trail.length;i++){
        const a0=this.trail[i-1], a1=this.trail[i];
        const x0=(a0.x-ox)*zoom+W/2, y0=(a0.y-oy)*zoom+H/2;
        const x1=(a1.x-ox)*zoom+W/2, y1=(a1.y-oy)*zoom+H/2;
        ctx.globalAlpha = (i/this.trail.length) * 0.35;
        ctx.strokeStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.angle);
    // Local frame: +x = forward (nose), +y = right side

    // Shadow under the car
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(2*zoom, 3*zoom, CL*0.50, CW*0.55, 0, 0, Math.PI*2);
    ctx.fill();

    // Rear wing (drawn first, sticks out behind)
    ctx.fillStyle='#0c0e18';
    ctx.fillRect(-CL*0.52, -CW*0.58, CL*0.06, CW*1.16);
    // Wing posts
    ctx.fillRect(-CL*0.48, -CW*0.42, CL*0.04, 2*zoom);
    ctx.fillRect(-CL*0.48,  CW*0.42-2*zoom, CL*0.04, 2*zoom);

    // Wheels (4 tyres) — drawn behind body
    ctx.fillStyle='#0a0a0a';
    const wL=7*zoom, wW=4.5*zoom;
    const wheels=[
      [ CL*0.22, -CW*0.55 ],
      [ CL*0.22,  CW*0.55-wW ],
      [-CL*0.30, -CW*0.55 ],
      [-CL*0.30,  CW*0.55-wW ],
    ];
    wheels.forEach(([wx,wy])=>{
      ctx.fillRect(wx, wy, wL, wW);
      // rim highlight
      ctx.fillStyle='#222';
      ctx.fillRect(wx+1*zoom, wy+1*zoom, wL-2*zoom, wW-2*zoom);
      ctx.fillStyle='#0a0a0a';
    });

    // Main body — tapered nose, wide cockpit, flat rear
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo( CL*0.50,  0);                                            // nose tip
    ctx.quadraticCurveTo( CL*0.46, -CW*0.50,  CL*0.20, -CW*0.50);        // taper L
    ctx.lineTo(-CL*0.36, -CW*0.50);
    ctx.lineTo(-CL*0.48, -CW*0.42);                                      // rear corner L
    ctx.lineTo(-CL*0.48,  CW*0.42);
    ctx.lineTo(-CL*0.36,  CW*0.50);
    ctx.lineTo( CL*0.20,  CW*0.50);
    ctx.quadraticCurveTo( CL*0.46,  CW*0.50,  CL*0.50,  0);              // taper R
    ctx.closePath();
    ctx.fill();

    // Centre stripe (lighter accent)
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillRect(-CL*0.42, -CW*0.09, CL*0.86, CW*0.18);

    // Cockpit / canopy
    ctx.fillStyle='#050810';
    ctx.beginPath();
    ctx.ellipse(-CL*0.02, 0, CL*0.22, CW*0.34, 0, 0, Math.PI*2);
    ctx.fill();
    // Tinted windshield
    ctx.fillStyle='rgba(0,245,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(CL*0.06, -CW*0.05, CL*0.15, CW*0.22, 0, 0, Math.PI*2);
    ctx.fill();

    // Side intakes
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(-CL*0.12, -CW*0.52, CL*0.18, 2*zoom);
    ctx.fillRect(-CL*0.12,  CW*0.52-2*zoom, CL*0.18, 2*zoom);

    // Headlights (front, yellow glow)
    ctx.shadowColor='#fff2aa';
    ctx.shadowBlur=6*zoom;
    ctx.fillStyle='#ffeb88';
    ctx.beginPath();
    ctx.arc(CL*0.44, -CW*0.24, 1.6*zoom, 0, Math.PI*2);
    ctx.arc(CL*0.44,  CW*0.24, 1.6*zoom, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;

    // Tail lights (back, red)
    ctx.fillStyle='#ff3344';
    ctx.shadowColor='#ff3344';
    ctx.shadowBlur=3*zoom;
    ctx.fillRect(-CL*0.46, -CW*0.30, 2*zoom, 4*zoom);
    ctx.fillRect(-CL*0.46,  CW*0.30-4*zoom, 2*zoom, 4*zoom);
    ctx.shadowBlur=0;

    // Damage scorches
    const damageT = (100 - this.health)/20;
    if(damageT > 0.05){
      ctx.fillStyle=`rgba(15,15,20,${0.5*damageT})`;
      ctx.beginPath();
      ctx.arc(CL*0.18, -CW*0.30, 2.5*zoom*Math.min(1,damageT), 0, Math.PI*2);
      ctx.arc(-CL*0.18, CW*0.22, 2.5*zoom*Math.min(1,damageT), 0, Math.PI*2);
      ctx.fill();
    }

    // Player highlight glow
    if(this.isPlayer){
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=this.color+'22';
      ctx.beginPath();
      ctx.ellipse(0, 0, CL*0.72, CW*1.0, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }

    ctx.restore();

    // Damage smoke trailing behind (drawn in world space)
    if(this.health < 95){
      const intensity = (100-this.health)/20;
      const backX = sx - Math.cos(this.angle)*CL*0.55;
      const backY = sy - Math.sin(this.angle)*CL*0.55;
      for(let i=0;i<3;i++){
        const t = ((Date.now()/220) + i*0.33) % 1;
        const px = backX - Math.cos(this.angle)*t*22*zoom + (Math.random()-0.5)*4*zoom;
        const py = backY - Math.sin(this.angle)*t*22*zoom + (Math.random()-0.5)*4*zoom;
        ctx.fillStyle = `rgba(90,90,95,${0.45*intensity*(1-t)})`;
        ctx.beginPath();
        ctx.arc(px, py, (2 + t*5)*zoom, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
}


// ── AUDIO ─────────────────────────────────────────────────────────────────────
const Sfx = {
  ctx: null, master: null,
  enabled: localStorage.getItem('audioOff') !== '1',
  engineOsc: null, engineGain: null,
  scrapeGain: null,

  init(){
    if(this.ctx){ this.tryResume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
    } catch(e){ return; }

    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 0.35 : 0;
    this.master.connect(this.ctx.destination);

    // Engine: sawtooth -> lowpass = soft motor purr
    this.engineOsc = this.ctx.createOscillator();
    this.engineOsc.type = 'sawtooth';
    this.engineOsc.frequency.value = 55;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 720; lp.Q.value = 0.7;
    this.engineGain = this.ctx.createGain();
    this.engineGain.gain.value = 0;
    this.engineOsc.connect(lp); lp.connect(this.engineGain); this.engineGain.connect(this.master);
    this.engineOsc.start();

    // Scrape: bandpass-filtered noise loop, gated by gain
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr, sr);
    const d = buf.getChannelData(0);
    for(let i=0;i<sr;i++) d[i] = Math.random()*2-1;
    const ns = this.ctx.createBufferSource();
    ns.buffer = buf; ns.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 380; bp.Q.value = 0.6;
    this.scrapeGain = this.ctx.createGain();
    this.scrapeGain.gain.value = 0;
    ns.connect(bp); bp.connect(this.scrapeGain); this.scrapeGain.connect(this.master);
    ns.start();

    // Silent-buffer trick: schedule an inaudible play to unlock iOS/Safari.
    try {
      const silent = this.ctx.createBuffer(1, 1, 22050);
      const s = this.ctx.createBufferSource();
      s.buffer = silent;
      s.connect(this.ctx.destination);
      s.start(0);
    } catch(e){}

    // Aggressive resume (handle promise to surface any failure).
    if(this.ctx.resume){
      this.ctx.resume().catch(err => console.warn('audio resume failed:', err));
    }
    setTimeout(()=>this.tryResume(), 100);
    setTimeout(()=>this.tryResume(), 500);
  },

  tryResume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },

  setEnabled(b){
    this.enabled = b;
    localStorage.setItem('audioOff', b ? '0' : '1');
    if(this.master) this.master.gain.value = b ? 0.35 : 0;
    const btn = document.getElementById('audio-toggle');
    if(btn) btn.textContent = b ? '\u266B' : '\u2715';
  },

  // Instantly cut all live sounds (engine drone, scrape noise) to silence.
  // Called when the game returns to its own menu or the player leaves the
  // page (browser back to the arcade launcher, tab hide, \u2026).
  silence(){
    if(!this.ctx) return;
    if(this.engineGain) this.engineGain.gain.value = 0;
    if(this.scrapeGain) this.scrapeGain.gain.value = 0;
  },
  // Suspend the AudioContext entirely \u2014 frees the audio thread when leaving
  // the page. Pairs with init()'s tryResume() on the way back.
  suspend(){
    if(this.ctx && this.ctx.state === 'running'){
      this.silence();
      this.ctx.suspend().catch(()=>{});
    }
  },

  setEngine(speed, throttle){
    if(!this.ctx || !this.enabled) return;
    if(!Number.isFinite(speed))    speed = 0;
    if(!Number.isFinite(throttle)) throttle = 0;
    const t = this.ctx.currentTime;
    const freq = 55 + speed * 40 + throttle * 22;
    this.engineOsc.frequency.setTargetAtTime(freq, t, 0.05);
    const vol = 0.07 + speed * 0.022 + throttle * 0.05;
    this.engineGain.gain.setTargetAtTime(vol, t, 0.08);
  },

  setScrape(active, speed){
    if(!this.ctx || !this.enabled) return;
    if(!Number.isFinite(speed)) speed = 0;
    const v = active ? Math.min(0.22, speed * 0.04) : 0;
    this.scrapeGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
  },

  collision(impact){
    if(!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime, sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, Math.floor(sr*0.28), sr);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const env = Math.exp(-i / d.length * 9);
      d[i] = (Math.random()*2-1) * env;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 140 + impact * 130;
    const g = this.ctx.createGain();
    g.gain.value = Math.min(0.6, impact * 0.24);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.3);
  },

  beep(freq, dur, vol, type){
    if(!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = type || 'square';
    o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol||0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  countdown(){ this.beep(660, 0.18, 0.18); },
  go(){
    this.beep(880, 0.18, 0.22);
    setTimeout(()=>this.beep(1320, 0.32, 0.26), 90);
  },
  finishWin(){
    [523, 659, 784, 1047, 1319].forEach((f,i)=>{
      setTimeout(()=>this.beep(f, 0.18, 0.20), i*110);
    });
  },
  finishLose(){
    [440, 370, 311, 277].forEach((f,i)=>{
      setTimeout(()=>this.beep(f, 0.22, 0.16), i*140);
    });
  },
};

// ── GAME STATE ────────────────────────────────────────────────────────────────
let cars = [], player, keys = {up:false,down:false,left:false,right:false};
let running = false, startTime = 0, finishedCount = 0;
let flashMsg = ()=>{}, flashText='', flashAlpha=0;
let bestLap = Infinity;
let countdownVal = 0;

function initCars(){
  const cols   = ['#00f5ff','#ff4466','#ffcc00','#44ff88'];
  // F1-style 2x2 starting grid: 2 cars on front row, 2 staggered behind.
  // tOff = distance back along the track, lateral = side offset from centerline.
  const lateralStep = Math.min(ROAD_W * 0.45, 22);
  // Endless: spawn past the padding points so spline at spawn is well-defined.
  const baseT = endlessEnabled ? endlessStartT : 0;
  const grid = [
    { tOff: baseT + 0.000, lateral: -lateralStep },   // player (pole, front-left)
    { tOff: baseT + 0.002, lateral:  lateralStep },   // front-right
    { tOff: baseT + 0.006, lateral: -lateralStep },   // second-row left
    { tOff: baseT + 0.008, lateral:  lateralStep },   // second-row right
  ];
  // Player skill = 1.0 (reference). AI skills randomized in [0.80, 1.00)
  // each race so every start has a different balance of opponents.
  const skills = [
    1.0,
    0.80 + Math.random() * 0.20,
    0.80 + Math.random() * 0.20,
    0.80 + Math.random() * 0.20,
  ];
  // Distinct lateral lanes (px from centerline). 25px between lanes ≈
  // diameter of a car → no two AI cars target the same trajectory.
  const lines  = [0,   30,   -30,  10];

  cars = [];
  for(let i=0;i<4;i++){
    const g = grid[i];
    const car = new Car(g.tOff, cols[i], i===0, skills[i], lines[i]);
    // Apply lateral lane offset to spawn position
    const idx = Math.floor(g.tOff * SAMPLES);
    const norm = trackNormals[idx] || {x:0, y:0};
    car.x += norm.x * g.lateral;
    car.y += norm.y * g.lateral;
    cars.push(car);
  }
  player = cars[0];
  finishedCount = 0;
}

// ── CAR-vs-CAR COLLISION ─────────────────────────────────────────────────────
function resolveCollisions(){
  const R = 15;                    // collision radius per car
  // Helper: shove pos toward track centerline if it overshoots ROAD_W
  const clampToTrack = (car)=>{
    const c = closestOnTrack(car.x, car.y, car.lastIdx);
    const lw = (trackWidths.length > c.idx ? trackWidths[c.idx] : ROAD_W);
    const SAFETY = lw - 6;         // keep 6px buffer inside the wall
    if(c.dist > SAFETY){
      const s = trackSamples[c.idx];
      const dx = car.x - s.x, dy = car.y - s.y;
      const ld = Math.sqrt(dx*dx+dy*dy) || 1;
      const push = c.dist - SAFETY;
      car.x -= (dx/ld) * push;
      car.y -= (dy/ld) * push;
    }
  };
  for(let i=0;i<cars.length;i++){
    for(let j=i+1;j<cars.length;j++){
      const a = cars[i], b = cars[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.hypot(dx, dy);
      if(d < R*2 && d > 0.01){
        const overlap = (R*2 - d);
        const nx = dx/d, ny = dy/d;
        // Push apart (split overlap)
        a.x -= nx*overlap*0.5;  a.y -= ny*overlap*0.5;
        b.x += nx*overlap*0.5;  b.y += ny*overlap*0.5;
        // SAFETY: if the push sent either car off-track, snap them back.
        // Prevents pile-ups from squeezing a car through the wall.
        clampToTrack(a);
        clampToTrack(b);

        // Bounce: project relative velocity on the contact normal
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const velAlongNormal = rvx*nx + rvy*ny;
        if(velAlongNormal < 0){
          const e = 0.28;
          const j2 = -(1 + e) * velAlongNormal / 2;
          a.vx -= j2*nx; a.vy -= j2*ny;
          b.vx += j2*nx; b.vy += j2*ny;
          // Energy bleed scales with impact: gentle brush ≈ 0.93×, slam ≈ 0.74×
          const impactMag = Math.abs(velAlongNormal);
          const slow = Math.max(0.74, 0.96 - impactMag * 0.10);
          a.vx *= slow; a.vy *= slow;
          b.vx *= slow; b.vy *= slow;
          a.collisionShake = b.collisionShake = 0.25;

          if(impactMag > 0.45){
            a.applyDamage(impactMag * 1.5);
            b.applyDamage(impactMag * 1.5);
            // Endless: if the player is involved in the crash, add crash points
            if(a.isPlayer || b.isPlayer) addPlayerCrash(impactMag);
          }
          if(a.isPlayer || b.isPlayer){
            Sfx.collision(impactMag);
            if(impactMag > 1.2) flashMsg("CONTATTO!");
          }
        }
      }
    }
  }
}

// ── TRACK RENDERING ───────────────────────────────────────────────────────────
function buildTrackPath(){
  const path = new Path2D();
  path.moveTo(trackSamples[0].x, trackSamples[0].y);
  for(let i=1;i<SAMPLES;i++) path.lineTo(trackSamples[i].x, trackSamples[i].y);
  path.closePath();
  return path;
}

function drawTrack(ctx, ox, oy, zoom){
  const toS=(p)=>({x:(p.x-ox)*zoom+W/2, y:(p.y-oy)*zoom+H/2});
  const spriteMode = graphicsMode === 'kenney' && Assets.ready;

  // Background: tiled grass in sprite mode, dark night-sky color otherwise
  if(spriteMode && Assets.grass && Assets.grass.complete && Assets.grass.naturalWidth > 0){
    if(!Assets.grassPattern){
      Assets.grassPattern = ctx.createPattern(Assets.grass, 'repeat');
    }
    // Translate the pattern origin so the grass appears to scroll with the world.
    const tw = Assets.grass.naturalWidth * zoom;
    const th = Assets.grass.naturalHeight * zoom;
    const offX = ((-ox * zoom) % tw + tw) % tw;
    const offY = ((-oy * zoom) % th + th) % th;
    ctx.save();
    ctx.translate(offX - tw, offY - th);
    ctx.scale(zoom, zoom);
    ctx.fillStyle = Assets.grassPattern;
    ctx.fillRect(0, 0, (W + 2*tw)/zoom, (H + 2*th)/zoom);
    ctx.restore();
  } else {
    ctx.strokeStyle='#ffffff22';
    ctx.lineWidth=1;
    ctx.fillStyle='#0a1020';
    ctx.fillRect(0,0,W,H);
  }

  // Road surface
  ctx.lineCap='round';
  ctx.lineJoin='round';

  // Colour palette: Kenney-style light asphalt vs the legacy dark theme.
  const asphaltMain = spriteMode ? '#9ab8c0' : '#1a2030';
  const asphaltTop  = spriteMode ? '#a8c5cc' : '#1e2535';
  const kerbColor   = spriteMode ? '#ee8833' : '#cc2233';
  const laneColor   = spriteMode ? '#ffffffaa' : '#ffffff22';

  const n=trackSamples;
  const norms = trackNormals;
  const widths = trackWidths;

  // ── Helper: build a polygon path for the road area at width = base ± offset.
  // `widthOff` adds to the per-sample width (e.g. for kerbs use +kerbExtra).
  const _strokePolygon = (widthOff) => {
    ctx.beginPath();
    // Left edge (forward direction)
    for(let i=0;i<SAMPLES;i++){
      const s = n[i], nrm = norms[i];
      const w = (widths[i] || ROAD_W) + widthOff;
      const lx = (s.x + nrm.x * w - ox) * zoom + W/2;
      const ly = (s.y + nrm.y * w - oy) * zoom + H/2;
      i===0 ? ctx.moveTo(lx, ly) : ctx.lineTo(lx, ly);
    }
    // Right edge (reverse direction) to close the polygon
    for(let i=SAMPLES-1;i>=0;i--){
      const s = n[i], nrm = norms[i];
      const w = (widths[i] || ROAD_W) + widthOff;
      const rx = (s.x - nrm.x * w - ox) * zoom + W/2;
      const ry = (s.y - nrm.y * w - oy) * zoom + H/2;
      ctx.lineTo(rx, ry);
    }
    ctx.closePath();
  };

  // Kerbs (wider polygon, drawn underneath the asphalt)
  _strokePolygon(spriteMode ? 3 : 6);
  ctx.fillStyle = kerbColor;
  ctx.fill();

  // Main asphalt polygon
  _strokePolygon(0);
  ctx.fillStyle = asphaltMain;
  ctx.fill();

  // Slightly-lighter top highlight (narrower than full road)
  _strokePolygon(-4);
  ctx.fillStyle = asphaltTop;
  ctx.fill();

  // Centre dashed line
  ctx.setLineDash([20*zoom, 20*zoom]);
  ctx.lineWidth=2*zoom;
  ctx.strokeStyle = laneColor;
  ctx.beginPath();
  for(let i=0;i<SAMPLES;i++){
    const a=toS(n[i]);
    i===0 ? ctx.moveTo(a.x,a.y) : ctx.lineTo(a.x,a.y);
  }
  if(!endlessEnabled) ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // Start/finish line — perpendicular to the road (aligned with the track normal)
  const sfPt=toS(trackSamples[0]);
  const norm=trackNormals[0];
  ctx.save();
  ctx.translate(sfPt.x,sfPt.y);
  // rotate so the local +x axis runs ALONG the track normal (= across the road)
  ctx.rotate(Math.atan2(norm.y,norm.x));
  // Two-row checkerboard, full width of the road
  const cells = 8;
  const cellW = (ROAD_W*2/cells)*zoom;
  for(let c=0;c<cells;c++){
    for(let r=0;r<2;r++){
      ctx.fillStyle = ((c+r)%2===0) ? '#fff' : '#0a0a0a';
      ctx.fillRect(-ROAD_W*zoom + c*cellW, -8*zoom + r*8*zoom, cellW, 8*zoom);
    }
  }
  ctx.restore();
}

// ── MINIMAP ───────────────────────────────────────────────────────────────────
function drawMinimap(){
  mctx.clearRect(0,0,100,100);
  const mw=100, mh=100;
  const scaleX=mw/TRACK_W*0.85, scaleY=mh/TRACK_H*0.85;
  const ox=TRACK_W*0.075, oy=TRACK_H*0.075;

  // Track line
  mctx.strokeStyle='#334';
  mctx.lineWidth=8;
  mctx.lineCap='round';
  mctx.beginPath();
  for(let i=0;i<SAMPLES;i++){
    const p=trackSamples[i];
    const sx=(p.x-ox)*scaleX, sy=(p.y-oy)*scaleY;
    i===0 ? mctx.moveTo(sx,sy) : mctx.lineTo(sx,sy);
  }
  mctx.closePath();
  mctx.stroke();

  mctx.strokeStyle='#2a3444';
  mctx.lineWidth=5;
  mctx.beginPath();
  for(let i=0;i<SAMPLES;i++){
    const p=trackSamples[i];
    const sx=(p.x-ox)*scaleX, sy=(p.y-oy)*scaleY;
    i===0 ? mctx.moveTo(sx,sy) : mctx.lineTo(sx,sy);
  }
  mctx.closePath();
  mctx.stroke();

  // Cars
  cars.forEach(car=>{
    const sx=(car.x-ox)*scaleX, sy=(car.y-oy)*scaleY;
    mctx.beginPath();
    mctx.arc(sx,sy, car.isPlayer?4:2.5, 0, Math.PI*2);
    mctx.fillStyle=car.color;
    mctx.fill();
  });
}

// ── HUD UPDATE ────────────────────────────────────────────────────────────────
function updateHUD(elapsed){
  const spd = Math.round(Math.abs(player.speed) * 60);
  // Speed shown as plain km/h — the previous "×1.06" endless multiplier was
  // dropped because it wrapped to a second line on phones and cluttered the
  // HUD without adding gameplay value.
  document.getElementById('h-speed').textContent = spd + ' km/h';
  if(endlessEnabled){
    // True endless: show distance travelled in metres (1 world unit = 1 m).
    const idx = player.lastIdx || 0;
    const dist = Math.floor(trackDist[idx] || 0);
    document.getElementById('h-lap').textContent = dist + 'm';
  } else if(isInfiniteMode){
    document.getElementById('h-lap').textContent = 'L' + player.lap;
  } else {
    const lap = Math.min(player.lap, TOTAL_LAPS+1);
    document.getElementById('h-lap').textContent = Math.min(lap,TOTAL_LAPS) + '/' + TOTAL_LAPS;
  }

  // Position
  const pos = calcPosition();
  const suffixes=['st','nd','rd','th'];
  document.getElementById('h-pos').textContent = pos + (suffixes[pos-1]||'th');

  if(player.lapTimes.length>0){
    const bl = Math.min(...player.lapTimes);
    if(bl<bestLap){ bestLap=bl; }
    document.getElementById('h-best').textContent = bestLap.toFixed(2)+'s';
  }

  // Endless mode shows CRASH points (0-100). Otherwise the legacy COND %.
  const hpEl = document.getElementById('h-hp');
  const hpLabel = hpEl.parentElement.querySelector('.hud-label');
  if(endlessEnabled){
    if(hpLabel) hpLabel.textContent = 'Crash';
    hpEl.textContent = playerCrashPoints + '/' + CRASH_LIMIT;
    hpEl.style.color = playerCrashPoints < 50 ? '#44ff88'
                      : playerCrashPoints < 80 ? '#ffcc44'
                      : '#ff5566';
  } else {
    if(hpLabel) hpLabel.textContent = 'Cond';
    const hp = Math.round(player.health);
    hpEl.textContent = hp + '%';
    hpEl.style.color = hp >= 95 ? '#44ff88'
                      : hp >= 88 ? '#ffcc44'
                      : '#ff5566';
  }
}

function rubberBandFactor(car){
  if(car.finished) return 1;
  const myT   = Number.isFinite(car.t) ? car.t : 0;
  const myProg = (car.lap - 1) + myT;

  // Find leader progress AND runner-up progress (for leader-penalty calc)
  let leadProg = -Infinity;
  let secondProg = -Infinity;
  let runners = 0;
  for(const c of cars){
    if(c.finished) continue;
    runners++;
    const ct = Number.isFinite(c.t) ? c.t : 0;
    const p  = (c.lap - 1) + ct;
    if(p > leadProg){
      secondProg = leadProg;
      leadProg = p;
    } else if(p > secondProg){
      secondProg = p;
    }
  }
  if(runners < 2 || !Number.isFinite(leadProg)) return 1;

  // I'M THE LEADER → modest penalty to scale back runaway wins.
  //   gap 0.04 → no penalty
  //   gap 0.15 → ~5%
  //   gap 0.30 → ~10%
  //   gap 0.50+ → 14% (cap)
  if(Math.abs(myProg - leadProg) < 1e-6){
    const lead = Math.max(0, leadProg - secondProg);
    if(lead <= 0.04) return 1;
    const penalty = Math.min(0.14, (lead - 0.04) * 0.42);
    return 1 - penalty;
  }

  // I'M BEHIND → very strong boost so chasers really close the gap.
  //   gap 0.05 → ~20%
  //   gap 0.15 → ~35%
  //   gap 0.30 → ~49%
  //   gap 0.50+ → 65% (cap)
  const gap = Math.max(0, leadProg - myProg);
  if(gap <= 0) return 1;
  const boost = Math.min(0.65, Math.sqrt(gap) * 0.90);
  return 1 + boost;
}

function calcPosition(){
  const prog = c => (c.lap-1) + (c.finished ? 2 : c.t);
  const sorted = [...cars].sort((a,b)=>prog(b)-prog(a));
  return sorted.findIndex(c=>c.isPlayer)+1;
}

// FLASH MESSAGE
let fText='', fAlpha=0, fTimer=0;
flashMsg = (txt)=>{ fText=txt; fAlpha=1; fTimer=2; };

// GAME LOOP
let lastTime=0, countdown=3, countdownStart=0, raceStarted=false, raceEndTime=0;

function gameLoop(ts){
  if(!running) return;
  const dt=Math.min((ts-lastTime)/1000, 0.05);
  lastTime=ts;

  if(countdown>0){
    const el=(ts-countdownStart)/1000;
    const prevCd = countdown;
    countdown=Math.max(0, 3-Math.floor(el));
    if(countdown !== prevCd && countdown > 0) Sfx.countdown();
  }

  if(countdown===0){
    if(!raceStarted){
      raceStarted = true;
      Sfx.go();
      const now = performance.now();
      cars.forEach(c => c.lapStart = now);
      startTime = now;
      flashMsg(currentTrackName.toUpperCase());
    }
    cars.forEach(c=>c.update(dt,keys));
    resolveCollisions();
    maybeExtendEndless();   // grow the path when player nears the front (true endless)
    updateEndlessObstacles();
    updateEndlessSurfaces(dt);
    // Engine and scrape audio (player only)
    Sfx.setEngine(player.speed / 6.2, keys.up ? 1 : 0);
    const pd = trackSamples[player.lastIdx];
    const wallDist = pd ? Math.hypot(player.x - pd.x, player.y - pd.y) : 0;
    Sfx.setScrape(wallDist > ROAD_W * 0.78, player.speed);
  } else {
    Sfx.setEngine(0, 0);
    Sfx.setScrape(false, 0);
  }

  cam.x += (player.x - cam.x)*8*dt;
  cam.y += (player.y - cam.y)*8*dt;

  // Speed-based zoom: zoom OUT at high speed (see further ahead),
  // zoom IN at low speed (more detail). Smoothly interpolated.
  // Mobile: the viewport is small, so we ZOOM OUT (factor < 1) so the car
  // takes up less screen and the player can see what's coming. Desktop
  // keeps the original (close) framing.
  const isMobileView = Math.min(window.innerWidth, window.innerHeight) < 700;
  const mobileScale  = isMobileView ? 0.65 : 1.0;
  const pSpeed = Math.hypot(player.vx, player.vy);
  const speedRatio = Math.min(1, pSpeed / 6.2);
  const targetZoom = (1.15 - speedRatio * 0.4) * mobileScale;
  cam.zoom += (targetZoom - cam.zoom) * 2.5 * dt;

  let shakeX=0, shakeY=0;
  if(player.collisionShake > 0){
    const s = player.collisionShake * 6;
    shakeX = (Math.random()-0.5)*s;
    shakeY = (Math.random()-0.5)*s;
  }

  ctx.clearRect(0,0,W,H);
  drawTrack(ctx, cam.x+shakeX, cam.y+shakeY, cam.zoom);
  drawScenery(ctx, cam.x+shakeX, cam.y+shakeY, cam.zoom);  // trees (sprite mode only)
  drawEndlessSurfaces(ctx, cam.x+shakeX, cam.y+shakeY, cam.zoom);
  drawEndlessObstacles(ctx, cam.x+shakeX, cam.y+shakeY, cam.zoom);
  cars.forEach(c=>c.draw(ctx, cam.x+shakeX, cam.y+shakeY, cam.zoom));

  if(fAlpha>0){
    fTimer-=dt;
    fAlpha=Math.max(0,fTimer);
    ctx.save();
    ctx.globalAlpha=Math.min(1,fAlpha);
    ctx.font="bold 28px 'Orbitron', sans-serif";
    ctx.textAlign='center';
    ctx.fillStyle='#00f5ff';
    ctx.shadowColor='#00f5ff';
    ctx.shadowBlur=20;
    ctx.fillText(fText, W/2, H/2-20);
    ctx.restore();
  }

  if(countdown>0){
    ctx.save();
    ctx.font="bold 120px 'Orbitron', sans-serif";
    ctx.textAlign='center';
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=0.9;
    ctx.shadowColor='#00f5ff';
    ctx.shadowBlur=40;
    ctx.fillText(countdown, W/2, H/2+40);
    ctx.restore();
  } else if(countdown===0 && (ts-countdownStart)<1200 && (ts-countdownStart)>900){
    ctx.save();
    ctx.font="bold 80px 'Orbitron', sans-serif";
    ctx.textAlign='center';
    ctx.fillStyle='#44ff88';
    ctx.shadowColor='#44ff88';
    ctx.shadowBlur=40;
    ctx.globalAlpha=Math.max(0,1-(ts-countdownStart-900)/300);
    ctx.fillText('GO!', W/2, H/2+30);
    ctx.restore();
  }

  drawMinimap();
  const hudElapsed = raceEndTime ? (raceEndTime - startTime) : (ts - startTime);
  updateHUD(hudElapsed);

  requestAnimationFrame(gameLoop);
}

function setTouchVisible(v){
  ['t-left','t-right','t-back'].forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.style.display = v ? '' : 'none';
  });
}
function startGame(trackDef){
  if(screen.orientation && screen.orientation.lock)
    screen.orientation.lock('landscape').catch(()=>{});
  if(trackDef) loadTrack(trackDef);
  Sfx.init();
  document.getElementById('overlay').style.display='none';
  setTouchVisible(true);
  initCars();
  cam.x=player.x; cam.y=player.y;
  running=true;
  countdown=3;
  raceStarted=false;
  raceEndTime=0;
  const now=performance.now();
  countdownStart=now;
  startTime=now;
  lastTime=now;
  bestLap=Infinity;
  fText=''; fAlpha=0;
  requestAnimationFrame(t=>{lastTime=t;gameLoop(t);});
}

function endRace(){
  raceEndTime = performance.now();
  setTouchVisible(false);
  const pos=calcPosition();
  (player.finalPos===1) ? Sfx.finishWin() : Sfx.finishLose();
  const suffixes=['st','nd','rd','th'];
  const posStr=player.finalPos+(suffixes[player.finalPos-1]||'th');
  const total=(performance.now()-startTime)/1000;
  const m=Math.floor(total/60), s=(total%60).toFixed(2);
  const ol=document.getElementById('overlay');
  ol.style.display='flex';
  ol.innerHTML=`
    <h2>GARA FINITA</h2>
    <p>Pista: <strong style="color:#00f5ff">${currentTrackName}</strong></p>
    <p>Posizione finale: <strong style="color:#00f5ff">${posStr}</strong></p>
    <p>Tempo totale: ${m}:${s}</p>
    <p>Miglior giro: ${bestLap<Infinity?bestLap.toFixed(2)+'s':'--'}</p>
    <p>Condizione auto: ${Math.round(player.health)}%</p>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="extra-btn" onclick="startGame()">RIVINCITA</button>
      <button class="extra-btn" onclick="backToMenu()">MENU PISTE</button>
    </div>
  `;
}

// Powerapp-bridge hook: paid "continue" after a 100-crash game over.
// Restarts the endless race but keeps the player at 50 crashpoints (penalty for the
// continue). Lives as a top-level function so it's reachable via window.* from inside
// the bridge IIFE — module-scope let/const aren't.
function paContinueEndless(){
  startGameEndless();          // full reset + initEndlessTrack + new race
  playerCrashPoints = 50;      // penalty: half the limit instead of starting at 0
}

function drawTrackPreview(canvas, def){
  const c = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  c.fillStyle = '#050810';
  c.fillRect(0,0,W,H);

  const pts = def.points, n = pts.length;
  const N = 80;
  const s = [];
  for(let i=0;i<N;i++){
    const t = i/N, idx = Math.floor(t*n)%n, j = (idx+1)%n;
    const f = t*n - Math.floor(t*n), f2 = f*f, f3 = f2*f;
    const p0=pts[(idx-1+n)%n], p1=pts[idx], p2=pts[j], p3=pts[(j+1)%n];
    s.push({
      x: 0.5*((2*p1.x)+(-p0.x+p2.x)*f+(2*p0.x-5*p1.x+4*p2.x-p3.x)*f2+(-p0.x+3*p1.x-3*p2.x+p3.x)*f3),
      y: 0.5*((2*p1.y)+(-p0.y+p2.y)*f+(2*p0.y-5*p1.y+4*p2.y-p3.y)*f2+(-p0.y+3*p1.y-3*p2.y+p3.y)*f3)
    });
  }
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of s){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  const pad = 7;
  const sc = Math.min((W-pad*2)/(maxX-minX||1), (H-pad*2)/(maxY-minY||1));
  const ox = (W - (maxX-minX)*sc)/2 - minX*sc;
  const oy = (H - (maxY-minY)*sc)/2 - minY*sc;

  c.strokeStyle = '#1e2535';
  c.lineWidth = 7;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.beginPath();
  s.forEach((p,i)=>{
    const x = ox + p.x*sc, y = oy + p.y*sc;
    i===0 ? c.moveTo(x,y) : c.lineTo(x,y);
  });
  c.closePath();
  c.stroke();
  c.strokeStyle = '#00f5ff';
  c.lineWidth = 1.5;
  c.beginPath();
  s.forEach((p,i)=>{
    const x = ox + p.x*sc, y = oy + p.y*sc;
    i===0 ? c.moveTo(x,y) : c.lineTo(x,y);
  });
  c.closePath();
  c.stroke();
}

  wrap.id = 'touch-controls';

  const btnStyle = `
    position:absolute;top:0;bottom:0;width:18vw;min-width:90px;max-width:160px;
    background:linear-gradient(to {SIDE}, #00f5ff20 0%, #00f5ff05 60%, transparent 100%);

    display:flex;align-items:center;justify-content:center;
    text-shadow:0 0 18px #00f5ff;
    transition:background 0.08s;
  `;
  wrap.innerHTML = `
    <button id="t-left"  style="${btnStyle.replace('{SIDE}', 'right')}left:0;border-right:1px solid #00f5ff33;">&#8592;</button>
    <button id="t-right" style="${btnStyle.replace('{SIDE}', 'left')}right:0;border-left:1px solid #00f5ff33;">&#8594;</button>
    <button id="t-back" title="Torna al menu" style="
      position:absolute;top:8px;left:8px;

      background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
      font-size:14px;font-family:Orbitron,sans-serif;font-weight:700;
      letter-spacing:0.1em;cursor:pointer;user-select:none;touch-action:manipulation;
      pointer-events:auto;z-index:7;
      display:flex;align-items:center;justify-content:center;
    ">&#10006;</button>
  `;
  document.body.appendChild(wrap);

  const bind = { 't-left':'left', 't-right':'right' };
  const pressColor = 'linear-gradient(to {SIDE}, #00f5ff55 0%, #00f5ff15 60%, transparent 100%)';
  Object.entries(bind).forEach(([id, key])=>{
    const btn = document.getElementById(id);
    const side = (key === 'left') ? 'right' : 'left';
    const origBg = btn.style.background;
    const press = (e)=>{ if(e) e.preventDefault(); keys[key]=true;
      btn.style.background = pressColor.replace('{SIDE}', side); };
    const release = (e)=>{ if(e) e.preventDefault(); keys[key]=false;
      btn.style.background = origBg; };
    btn.addEventListener('touchstart', press, {passive:false});
    btn.addEventListener('touchend',   release,{passive:false});
    btn.addEventListener('touchcancel',release,{passive:false});
    btn.addEventListener('mousedown',  press);
    btn.addEventListener('mouseup',    release);
    btn.addEventListener('mouseleave', release);
    btn.addEventListener('contextmenu', e=>e.preventDefault());
  });

  // Back-to-menu button: confirm before leaving the race
  const backBtn = document.getElementById('t-back');
  backBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    if(!running) return;
    if(confirm('Tornare al menu principale? La gara in corso andrà persa.')){
      backToMenu();
    }
  });
})();

// Canvas is sized to fill the entire viewport. The game world is independent
// of canvas pixels (uses world coordinates), so a wider canvas just means the
// player sees more of the world around the car.
let _lastFitW = 0, _lastFitH = 0;
function fitGame(){
  const header = document.getElementById('header');
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if(vw === _lastFitW && vh === _lastFitH) return;
  _lastFitW = vw; _lastFitH = vh;

  // Hide the header on any landscape-ish screen (mobile / small).
  const aspect = vw / Math.max(1, vh);
  const isMobileLandscape = aspect > 1.4 && vh < 750;
  if(header) header.style.display = isMobileLandscape ? 'none' : '';
  const headerH = (header && !isMobileLandscape) ? header.offsetHeight : 0;

  const targetW = Math.max(320, vw);
  const targetH = Math.max(240, vh - headerH);
  // Match canvas internal resolution to its CSS size (1:1 mapping, sharp).
  canvas.width = targetW;
  canvas.height = targetH;
  W = canvas.width;
  H = canvas.height;
}

}
