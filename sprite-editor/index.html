<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SPRITE EDITOR</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#101822;color:#e0e8f0;font-family:'Share Tech Mono',monospace;min-height:100vh}
  body{touch-action:manipulation;user-select:none;-webkit-user-select:none}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#101822cc;border:1px solid #ffcc44aa;color:#ffcc44;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;
  }

  h1{
    font-family:'Orbitron',sans-serif;font-weight:900;
    color:#ffcc44;text-shadow:0 0 18px #ffcc4488;letter-spacing:.18em;
    text-align:center;margin:14px 0 4px;font-size:1.5rem;
  }
  .tagline{
    text-align:center;color:#a0c0e0aa;font-size:.78rem;letter-spacing:.06em;margin-bottom:14px;
  }

  .wrap{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:54px 12px 30px;max-width:560px;margin:0 auto;
  }

  /* Drawing canvas — uses CSS to keep it square + sized to viewport */
  .stage{
    position:relative; touch-action:none;
    background:#0a1018;
    border:2px solid #2a3a55;
    border-radius:8px;
    box-shadow:0 0 26px #ffcc4422 inset;
    width:min(92vw, 480px);
    aspect-ratio:1/1;
  }
  .stage canvas{
    display:block;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  /* Subtle checker background visible through transparent pixels */
  .stage::before{
    content:"";position:absolute;inset:0;border-radius:6px;
    background-image:
      linear-gradient(45deg, #1a2230 25%, transparent 25%),
      linear-gradient(-45deg, #1a2230 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a2230 75%),
      linear-gradient(-45deg, transparent 75%, #1a2230 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    z-index:0;
  }
  .stage canvas{ position:relative; z-index:1; }

  .row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tool{
    width:54px; height:54px; border-radius:8px;
    background:#1a2330; border:2px solid #2a3a55;
    color:#ffcc44; font-size:24px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .tool.active{
    background:#ffcc4422; border-color:#ffcc44;
    box-shadow:0 0 14px #ffcc4488;
  }
  .tool[data-warn].active{ color:#ff6666; border-color:#ff6666; box-shadow:0 0 14px #ff666688; }

  /* Resolution pills — 5 powers of 2 from 8 up to 128. Highlighted = active. */
  .res-row{
    display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  .res-row .label{
    font-family:'Orbitron',sans-serif; font-size:.65rem; letter-spacing:.18em;
    color:#88aacc;
  }
  .res-pill{
    padding:6px 10px; border-radius:6px; cursor:pointer;
    background:#1a2330; border:2px solid #2a3a55; color:#a0c8ff;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
    letter-spacing:.10em;
  }
  .res-pill.active{
    background:#ffcc4422; border-color:#ffcc44; color:#ffcc44;
    box-shadow:0 0 12px #ffcc4488;
  }

  .palette{
    display:grid;grid-template-columns:repeat(8, 34px);gap:6px;
    padding:8px;background:#1a2330;border-radius:8px;border:1px solid #2a3a55;
  }
  .swatch{
    width:34px;height:34px;border-radius:6px;cursor:pointer;
    border:2px solid #2a3a55;
  }
  .swatch.active{ box-shadow:0 0 12px #ffcc44; border-color:#ffcc44; transform:scale(1.08); }
  .swatch.transparent{
    background-image:
      linear-gradient(45deg, #444 25%, transparent 25%),
      linear-gradient(-45deg, #444 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #444 75%),
      linear-gradient(-45deg, transparent 75%, #444 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0;
    background-color: #222;
  }

  .save-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
  }
  .name-input{
    flex:1; min-width:140px; padding:10px 12px; border-radius:6px;
    background:#1a2330; border:2px solid #2a3a55; color:#fff;
    font-family:'Share Tech Mono',monospace; font-size:.95rem;
  }
  .btn{
    padding:10px 18px; border-radius:6px; cursor:pointer;
    background:#101822; border:2px solid #ffcc44; color:#ffcc44;
    font-family:'Orbitron',sans-serif; font-weight:700;
    font-size:.78rem; letter-spacing:.18em; text-transform:uppercase;
    box-shadow:0 0 16px #ffcc4444;
  }
  .btn.danger{ border-color:#ff6666; color:#ff6666; box-shadow:0 0 16px #ff666644; }
  .btn:active{ transform:scale(0.96); }

  h2{
    font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.15em;
    color:#a0c8ff; font-size:.95rem; margin:10px 0 4px;
  }

  .gallery{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px, 1fr));
    gap:10px; width:min(92vw, 480px);
  }
  .gallery-item{
    background:#1a2330; border:2px solid #2a3a55; border-radius:8px;
    padding:8px 6px 6px; text-align:center; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .gallery-item img{
    width:64px; height:64px; image-rendering:pixelated;
    background-image:
      linear-gradient(45deg, #2a3a55 25%, transparent 25%),
      linear-gradient(-45deg, #2a3a55 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a3a55 75%),
      linear-gradient(-45deg, transparent 75%, #2a3a55 75%);
    background-size:10px 10px;background-color:#101822;
  }
  .gallery-name{
    font-size:.7rem; color:#cfe0ff; letter-spacing:.04em;
    word-break:break-all; line-height:1.1;
  }
  .gallery-actions{ display:flex; gap:4px; }
  .gallery-actions button{
    padding:3px 6px; font-size:.6rem; letter-spacing:.08em;
    background:#101822; color:#a0c8ff; border:1px solid #2a3a55; border-radius:4px;
    cursor:pointer; font-family:'Share Tech Mono',monospace;
  }
  .gallery-actions .del{ color:#ff8888; border-color:#553333; }
  .gallery-empty{ color:#5a7090; font-size:.78rem; text-align:center; padding:20px 0; }

  .hint{ color:#88aacc; font-size:.72rem; text-align:center; max-width:380px; line-height:1.5; }
  .hint b{ color:#ffcc44; }
</style>
</head>
<body>

<button id="back-btn" onclick="window.location.href='../'">✖</button>

<div class="wrap">
  <h1>SPRITE EDITOR</h1>
  <div class="tagline">Disegna il tuo mostro · poi usalo nei giochi</div>

  <div class="stage" id="stage">
    <canvas id="grid" width="16" height="16"></canvas>
  </div>

  <div class="row">
    <div class="tool active" data-tool="pencil" title="Matita">✏️</div>
    <div class="tool" data-tool="eraser" data-warn title="Gomma">🧽</div>
    <div class="tool" data-tool="fill" title="Riempi">🪣</div>
    <div class="tool" data-tool="clear" data-warn title="Cancella tutto">🗑️</div>
  </div>

  <div class="res-row">
    <span class="label">RIS</span>
    <div class="res-pill" data-res="8">8×8</div>
    <div class="res-pill active" data-res="16">16×16</div>
    <div class="res-pill" data-res="32">32×32</div>
    <div class="res-pill" data-res="64">64×64</div>
    <div class="res-pill" data-res="128">128×128</div>
  </div>

  <div class="palette" id="palette"></div>

  <div class="hint">
    Disegna con il dito (o il mouse). <b>16×16 pixel</b>, salvato come 128×128.<br>
    Salvalo dandogli un nome e potrai sceglierlo nel calcio e nel volley!
  </div>

  <div class="save-row">
    <input class="name-input" id="name-input" placeholder="Nome del mostro" maxlength="20" />
    <button class="btn" onclick="saveSprite()">SALVA</button>
  </div>

  <h2>I tuoi mostri</h2>
  <div class="gallery" id="gallery"></div>
</div>

<script>
let GRID = 16;                   // mutable — user can switch resolution
const SAVE_PX = 128;             // every sprite saved as 128×128 PNG (scale matches GRID)
const STORAGE_KEY = 'customSprites';

const COLORS = [
  null,                          // transparent (special)
  '#ffffff', '#cccccc', '#888888', '#333333', '#000000',
  '#ff5555', '#cc1111',
  '#ff9944', '#ffcc44',
  '#88dd66', '#44aa44',
  '#66ccff', '#2266dd',
  '#cc66ff', '#883399',
  '#ff77cc', '#cc4488',
  '#88ccaa', '#5a3a20',
];

const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let pixels = [];          // 2D array [y][x] = color string or null
let currentColor = '#ff5555';   // null = transparent (eraser-like)
let currentTool = 'pencil';
let lastCell = null;             // last cell painted while dragging — used for line interpolation

function syncCanvasSize(){
  // The DOM canvas's internal pixel buffer is GRID×GRID; CSS scales it up
  // to fit the stage. image-rendering:pixelated keeps the chunky look.
  canvas.width = GRID;
  canvas.height = GRID;
  ctx.imageSmoothingEnabled = false;
}
function newGrid(){
  pixels = [];
  for(let y = 0; y < GRID; y++){
    pixels.push(new Array(GRID).fill(null));
  }
  syncCanvasSize();
}
// Switch resolution. Upscale (smaller→bigger) preserves the drawing exactly:
// every old cell becomes an N×N block in the new grid. Downscale loses
// detail (we sample the top-left of each block) so we confirm first.
function setResolution(newRes){
  if(newRes === GRID) return;
  if(isEmpty()){
    GRID = newRes;
    newGrid(); redraw();
    refreshResPills();
    return;
  }
  if(newRes > GRID){
    const factor = newRes / GRID;
    const np = [];
    for(let y = 0; y < newRes; y++){
      np.push([]);
      for(let x = 0; x < newRes; x++){
        const ox = Math.floor(x / factor);
        const oy = Math.floor(y / factor);
        np[y].push(pixels[oy][ox]);
      }
    }
    GRID = newRes; pixels = np;
  } else {
    if(!confirm(`Passando da ${GRID}×${GRID} a ${newRes}×${newRes} perderai dettaglio. Continuare?`)) return;
    const factor = GRID / newRes;
    const np = [];
    for(let y = 0; y < newRes; y++){
      np.push([]);
      for(let x = 0; x < newRes; x++){
        const ox = Math.floor(x * factor);
        const oy = Math.floor(y * factor);
        np[y].push(pixels[oy][ox]);
      }
    }
    GRID = newRes; pixels = np;
  }
  syncCanvasSize();
  redraw();
  refreshResPills();
}
function refreshResPills(){
  document.querySelectorAll('.res-pill').forEach(p => {
    p.classList.toggle('active', parseInt(p.dataset.res, 10) === GRID);
  });
}
document.querySelectorAll('.res-pill').forEach(p => {
  p.addEventListener('click', () => setResolution(parseInt(p.dataset.res, 10)));
});
function redraw(){
  ctx.clearRect(0, 0, GRID, GRID);
  for(let y = 0; y < GRID; y++){
    for(let x = 0; x < GRID; x++){
      const c = pixels[y][x];
      if(c){
        ctx.fillStyle = c;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
}

// ── Drawing ──────────────────────────────────────────────────────────────────
function eventToCell(e){
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  return {
    x: Math.floor((cx / rect.width)  * GRID),
    y: Math.floor((cy / rect.height) * GRID)
  };
}
// Set a single cell. Called by the line interpolator below — does NOT
// trigger a redraw (caller batches one redraw per gesture frame).
function setCell(gx, gy){
  if(gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return;
  if(currentTool === 'pencil') pixels[gy][gx] = currentColor;
  else if(currentTool === 'eraser') pixels[gy][gx] = null;
}
// Bresenham line — fills every cell between (x0,y0) and (x1,y1) so a fast
// drag at high resolution doesn't skip pixels.
function paintLine(x0, y0, x1, y1){
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1;
  const sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  let x = x0, y = y0;
  while(true){
    setCell(x, y);
    if(x === x1 && y === y1) break;
    const e2 = err * 2;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 <  dx){ err += dx; y += sy; }
  }
  redraw();
}
function paint(gx, gy){
  setCell(gx, gy);
  redraw();
}
// Flood fill works for any currentColor — including null (transparent),
// which is how the user "wipes" a connected region in one tap.
function floodFill(gx, gy){
  if(gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return;
  const target = pixels[gy][gx];
  const replace = currentColor;
  if(target === replace) return;
  const stack = [[gx, gy]];
  while(stack.length){
    const [x, y] = stack.pop();
    if(x < 0 || x >= GRID || y < 0 || y >= GRID) continue;
    if(pixels[y][x] !== target) continue;
    pixels[y][x] = replace;
    stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
  }
  redraw();
}

let drawing = false;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  drawing = true;
  const c = eventToCell(e);
  if(currentTool === 'fill'){
    floodFill(c.x, c.y);
    lastCell = null;
  } else {
    paint(c.x, c.y);
    lastCell = c;
  }
});
canvas.addEventListener('pointermove', e => {
  if(!drawing) return;
  if(currentTool === 'fill') return;
  const c = eventToCell(e);
  if(lastCell && (lastCell.x !== c.x || lastCell.y !== c.y)){
    // Connect the dots — no more gaps on fast drags at 64×64 / 128×128.
    paintLine(lastCell.x, lastCell.y, c.x, c.y);
  } else {
    paint(c.x, c.y);
  }
  lastCell = c;
});
canvas.addEventListener('pointerup',     () => { drawing = false; lastCell = null; });
canvas.addEventListener('pointercancel', () => { drawing = false; lastCell = null; });

// ── Tools ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tool').forEach(t => {
  t.addEventListener('click', () => {
    const tool = t.dataset.tool;
    if(tool === 'clear'){
      if(confirm('Cancellare tutto?')){ newGrid(); redraw(); }
      return;
    }
    currentTool = tool;
    document.querySelectorAll('.tool').forEach(o => o.classList.toggle('active', o === t));
  });
});

// ── Palette ──────────────────────────────────────────────────────────────────
const palette = document.getElementById('palette');
COLORS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'swatch' + (c === null ? ' transparent' : '');
  if(c) d.style.background = c;
  d.title = c || 'trasparente';
  if(c === currentColor) d.classList.add('active');
  d.addEventListener('click', () => {
    // Selecting any swatch just sets the current colour (including
    // "transparent" → null). Tool stays as the user set it, so picking
    // transparent + fill = flood-erase a region, which used to be
    // impossible. Only switch away from the eraser if the user picks a
    // real colour while erasing — that's a sensible "go back to drawing"
    // affordance.
    currentColor = c;
    if(c !== null && currentTool === 'eraser'){
      currentTool = 'pencil';
      document.querySelectorAll('.tool').forEach(o =>
        o.classList.toggle('active', o.dataset.tool === 'pencil'));
    }
    document.querySelectorAll('.swatch').forEach(o => o.classList.remove('active'));
    d.classList.add('active');
  });
  palette.appendChild(d);
});

// ── Save / Load ──────────────────────────────────────────────────────────────
function getStored(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function setStored(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

function exportPNG(){
  // Render the 16×16 grid as a 128×128 PNG (8× nearest-neighbor — proper pixel art look).
  const off = document.createElement('canvas');
  off.width = SAVE_PX; off.height = SAVE_PX;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;
  const scale = SAVE_PX / GRID;
  for(let y = 0; y < GRID; y++){
    for(let x = 0; x < GRID; x++){
      const c = pixels[y][x];
      if(c){
        octx.fillStyle = c;
        octx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }
  return off.toDataURL('image/png');
}
function isEmpty(){
  for(let y = 0; y < GRID; y++){
    for(let x = 0; x < GRID; x++){
      if(pixels[y][x]) return false;
    }
  }
  return true;
}
function saveSprite(){
  if(isEmpty()){ alert('Disegna qualcosa prima di salvare!'); return; }
  let name = (document.getElementById('name-input').value || '').trim();
  if(!name) name = prompt('Come si chiama il tuo mostro?', 'mio-mostro');
  if(!name) return;
  name = name.slice(0, 20);
  const list = getStored();
  // If a sprite with the same name exists, overwrite it (avoids duplicates).
  const idx = list.findIndex(s => s.name === name);
  const entry = {
    name,
    png: exportPNG(),
    grid: JSON.stringify(pixels),    // keep grid data so we can re-edit later
    createdAt: Date.now()
  };
  if(idx >= 0){
    if(!confirm(`Esiste già un mostro chiamato "${name}". Sovrascrivere?`)) return;
    list[idx] = entry;
  } else {
    list.unshift(entry);
  }
  setStored(list);
  document.getElementById('name-input').value = '';
  renderGallery();
}
function loadSprite(name){
  const found = getStored().find(s => s.name === name);
  if(!found) return;
  try {
    const grid = JSON.parse(found.grid);
    if(!Array.isArray(grid) || grid.length < 4) throw new Error('bad');
    // Adopt whatever resolution the saved sprite has.
    GRID = grid.length;
    pixels = grid;
    syncCanvasSize();
    refreshResPills();
  } catch {
    // Older saves may not have a grid blob — start fresh at current GRID.
    newGrid();
  }
  document.getElementById('name-input').value = name;
  redraw();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function deleteSprite(name){
  if(!confirm(`Eliminare "${name}"?`)) return;
  const list = getStored().filter(s => s.name !== name);
  setStored(list);
  renderGallery();
}
function renderGallery(){
  const g = document.getElementById('gallery');
  const list = getStored();
  if(!list.length){
    g.innerHTML = '<div class="gallery-empty">Nessun mostro salvato. Disegna e tocca <b style="color:#ffcc44">SALVA</b>!</div>';
    return;
  }
  g.innerHTML = list.map(s =>
    `<div class="gallery-item">
       <img src="${s.png}" alt="${s.name}" />
       <div class="gallery-name">${s.name}</div>
       <div class="gallery-actions">
         <button onclick="loadSprite('${s.name.replace(/'/g, "\\'")}')">EDIT</button>
         <button class="del" onclick="deleteSprite('${s.name.replace(/'/g, "\\'")}')">✕</button>
       </div>
     </div>`
  ).join('');
}
window.saveSprite   = saveSprite;
window.loadSprite   = loadSprite;
window.deleteSprite = deleteSprite;

// ── Boot ─────────────────────────────────────────────────────────────────────
newGrid();
redraw();
renderGallery();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
