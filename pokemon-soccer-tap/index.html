<style>
  html,body{margin:0;padding:0;background:#0a1a0a;color:#e0f0e0;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100%}

  #hud{

    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:linear-gradient(to bottom,#000a00dd,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-team{display:flex;flex-direction:column;align-items:center;min-width:48px}

  .hud-team .value{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.7rem;

  .hud-clock{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.0rem;color:#ffcc00;letter-spacing:.18em;text-shadow:0 0 10px #ffcc0088}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1a0acc;border:1px solid #44ff88aa;color:#44ff88;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  }
  #audio-btn{
    position:fixed;top:50px;left:8px;width:46px;height:32px;
    border-radius:6px;background:#0a1a0acc;border:1px solid #44ff88aa;color:#44ff88;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  }
  #audio-btn.off{ color:#888; border-color:#444; }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#0a1a0acc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:10px;padding:24px;text-align:center;
    overflow-y:auto;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.0rem;
    color:#44ff88;letter-spacing:.20em;text-shadow:0 0 30px #44ff88;margin-bottom:6px;
  }
  #overlay p{color:#a0e0a0;font-size:.92rem;letter-spacing:.06em;margin:4px 0;max-width:480px}
  .btn{
    margin-top:8px;padding:10px 24px;background:transparent;border:2px solid #44ff88;
    color:#44ff88;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #44ff8844;transition:all .15s;
  }
  .btn:hover{background:#44ff8822;box-shadow:0 0 28px #44ff8888}
  .btn.warn{border-color:#ffcc00;color:#ffcc00;box-shadow:0 0 18px #ffcc0044}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

  .hint{color:#88cc88;font-size:.78rem;letter-spacing:.06em;margin-top:14px;line-height:1.55}
  .hint b{color:#44ff88}

  /* Brutimon picker grid shown on the main menu. */
  .pick-grid{
    display:grid; grid-template-columns:repeat(4, 70px); gap:10px;
    justify-content:center; margin-top:6px;
  }
  .pick-tile{
    width:70px; height:80px; padding:6px; border-radius:10px;
    background:#0a1a0a99; border:2px solid #2a4a2a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all .12s;
  }
  .pick-tile:hover{ border-color:#44ff88aa; }
  .pick-tile.selected{
    border-color:#ffcc00; box-shadow:0 0 18px #ffcc00aa;
    background:#0a1a0add;
  }
  .pick-tile img{ width:48px; height:48px; image-rendering:pixelated; }
  .pick-tile .name{
    font-family:'Orbitron',sans-serif; font-size:.55rem;
    letter-spacing:.10em; color:#a0e0a0; margin-top:2px;
  }
  .pick-tile.selected .name{ color:#ffcc00; }

  /* Portrait gate — pokemon-soccer-tap is designed for landscape; in portrait
     orientation we show a full-screen "rotate device" prompt instead of trying
     to render the pitch in a tall narrow frame. Mirrors the apex-racer gate. */
  #portrait-gate{
    position:fixed;inset:0;z-index:30;background:#050810;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;color:#a0e0a0;font-family:'Share Tech Mono',monospace;text-align:center;padding:24px;
  }
  #portrait-gate svg{width:80px;height:80px;animation:rot 1.4s ease-in-out infinite}
  #portrait-gate .msg{font-family:Orbitron,sans-serif;letter-spacing:.22em;font-size:.95rem;color:#44ff88}
  @keyframes rot{0%,40%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}

  /* Mode picker pills on the menu */
  .mode-tile{
    width:140px; height:60px; padding:6px 8px; border-radius:10px;
    background:rgba(8,40,16,.55); border:2px solid #44ff8844;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all .12s;
    font-family:Orbitron,sans-serif; letter-spacing:.18em; color:#cfeac8; font-size:.78rem;
  }
  .mode-tile:hover{ border-color:#44ff88aa; }
  .mode-tile.selected{ border-color:#ffcc00; color:#ffcc00; box-shadow:0 0 18px #ffcc00aa; }
  .mode-tile small{display:block;font-size:.55rem;letter-spacing:.10em;color:#9fcca0;margin-top:3px;font-family:Share Tech Mono,monospace}
  .mode-tile.selected small{color:#ffe79a}

  /* POSSESSO fire button (bottom-right thumb-friendly disc). */
  #fire-btn{
    position:fixed;right:14px;bottom:14px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,210,80,.28), rgba(10,32,12,.85));
    border:3px solid #ffcc44;color:#ffcc44;
    font-family:Orbitron,sans-serif;font-weight:900;font-size:40px;
    cursor:pointer;z-index:6;display:none;align-items:center;justify-content:center;
    box-shadow:0 0 28px #ffcc4466;user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #fire-btn.show{display:flex}
  #fire-btn.charging{
    background:radial-gradient(circle, rgba(255,90,90,.55), rgba(10,32,12,.85));
    box-shadow:0 0 38px #ff5566cc;border-color:#ff5566;color:#ff5566;
    transform:scale(.97);
  }
  #fire-meter{
    position:fixed;right:8px;bottom:8px;width:122px;height:122px;
    pointer-events:none;z-index:7;display:none;
  }
  #fire-meter.show{display:block}

  /* Big visible power bar — appears at the top of the screen while the
     player charges a shot. Easier to read at a glance than the ring
     around the fire button. */
  #power-bar{
    position:fixed; left:50%; top:54px; transform:translateX(-50%);
    width:min(360px, 64vw); height:18px;
    background:rgba(8,16,8,.72); border:2px solid #ffcc44; border-radius:9px;
    padding:2px; box-shadow:0 0 18px #ffcc4466;
    display:none; pointer-events:none; z-index:8;
  }
  #power-bar.show{ display:block }
  #power-bar-fill{
    width:0%; height:100%; border-radius:6px;
    background:linear-gradient(90deg, #44ff88 0%, #ffe066 50%, #ff5566 100%);

  }
  #power-bar-label{
    position:absolute; left:0; right:0; top:-22px;

    font-family:Orbitron,sans-serif; font-weight:900; font-size:.78rem;
    letter-spacing:.22em; color:#ffcc44; text-shadow:0 0 12px #ffcc44aa;
  }
</style>

<button id="back-btn" title="Torna al launcher" onclick="goBack()">✖</button>

<!-- POSSESSO mode controls (hidden in TAP mode at runtime) -->

<svg id="fire-meter" viewBox="0 0 122 122">
  <circle cx="61" cy="61" r="56" fill="none" stroke="rgba(255,204,68,.18)" stroke-width="6"/>
  <circle id="fire-meter-arc" cx="61" cy="61" r="56" fill="none" stroke="#ffcc44" stroke-width="6"
          stroke-dasharray="352" stroke-dashoffset="352" transform="rotate(-90 61 61)" stroke-linecap="round"/>

  </svg>

<script src="../shared/profile.js"></script>

<script>
// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  recomputeWorld();
  checkOrientation();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));

// ── WORLD GEOMETRY ────────────────────────────────────────────────────────────
// Height is fixed (640); width tracks the device's landscape aspect so the
// pitch always fills the visible canvas with at most a hairline of letter-
// box. Clamped so weird ultra-wide / portrait values can't make the pitch
// degenerate. Recomputed on every resize / orientationchange.
// Pitch grew with the 5v5 roster bump. WORLD_H 640 → 820 (≈ +28%) opens
// enough room for the new midfielders to spread out without the action
// devolving into a 10-player scrum on the centre circle.
let WORLD_W = 1330, WORLD_H = 820;
let GOAL_TOP    = WORLD_H / 2 - 170;
let GOAL_BOTTOM = WORLD_H / 2 + 170;
const PITCH_PAD = 22;
function recomputeWorld(){
  // `gameMode` is declared with `let` further down the script. fitCanvas()
  // runs at script load and calls us BEFORE that declaration, so a raw
  // reference throws TDZ. try/catch keeps the first pre-init call safe
  // (we just default to the non-championship branch).
  let isChamp = false;
  try { isChamp = (gameMode === 'championship'); } catch(e){ isChamp = false; }
  if(isChamp){
    // Championship uses a FIXED big pitch so the camera always has room
    // to scroll; the aspect of the screen doesn't change the world dims.
    WORLD_W = CHAMP_WORLD_W;
    WORLD_H = CHAMP_WORLD_H;
  } else {
    WORLD_H = 820;     // tap / possesso baseline — has to be reset in case we switched out of championship
    const aspect = Math.max(1.3, Math.min(2.4, (window.innerWidth || 1) / (window.innerHeight || 1)));
    WORLD_W = Math.round(WORLD_H * aspect);
  }
  GOAL_TOP    = WORLD_H / 2 - 170;
  GOAL_BOTTOM = WORLD_H / 2 + 170;
}
function checkOrientation(){
  const gate = document.getElementById('portrait-gate');
  if(!gate) return;
  // Only force landscape DURING a match. The menu (mode / brutimon
  // pickers) is taller than wide and needs portrait to scroll on phones.
  // `running` is declared with `let` further below — fitCanvas() runs FIRST
  // and would TDZ-throw. try/catch keeps the first call safe.
  // Foldables open at ~1.1–1.25 aspect — leave them alone, only nag on
  // truly tall screens (normal phones in portrait, ~1.78+).
  const portrait = window.innerHeight > window.innerWidth * 1.30;
  let inGame = false;
  try { inGame = !!running; } catch(e){ inGame = false; }
  gate.style.display = (portrait && inGame) ? 'flex' : 'none';
  if(!inGame){
    try { if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  }
}
fitCanvas();
// Camera-aware projection. In tap / possesso the camera is identity and
// the whole pitch is scaled to fit the canvas. In championship the
// camera holds the top-left world coord of a CHAMP_CAM_W × CHAMP_CAM_H
// slice that fits the canvas with letterboxing — we render only that
// slice and the scrolling does the rest.
function world2screen(wx, wy){
  if(gameMode === 'championship'){
    const s = Math.min(W / CHAMP_CAM_W, H / CHAMP_CAM_H);
    const ox = (W - CHAMP_CAM_W * s) / 2;
    const oy = (H - CHAMP_CAM_H * s) / 2;
    return { x: (wx - camera.x) * s + ox, y: (wy - camera.y) * s + oy, s };
  }
  const s = Math.min(W / WORLD_W, H / WORLD_H);
  return { x: (wx - WORLD_W/2) * s + W/2, y: (wy - WORLD_H/2) * s + H/2, s };
}
function screen2world(sx, sy){
  if(gameMode === 'championship'){
    const s = Math.min(W / CHAMP_CAM_W, H / CHAMP_CAM_H);
    const ox = (W - CHAMP_CAM_W * s) / 2;
    const oy = (H - CHAMP_CAM_H * s) / 2;
    return { x: (sx - ox) / s + camera.x, y: (sy - oy) / s + camera.y };
  }
  const s = Math.min(W / WORLD_W, H / WORLD_H);
  return { x: (sx - W/2) / s + WORLD_W/2, y: (sy - H/2) / s + WORLD_H/2 };
}
function worldScale(){
  if(gameMode === 'championship') return Math.min(W / CHAMP_CAM_W, H / CHAMP_CAM_H);
  return Math.min(W / WORLD_W, H / WORLD_H);
}

// Smooth camera that follows the ball each frame (championship only).
function updateCamera(){
  if(gameMode !== 'championship' || !ball){ camera.x = 0; camera.y = 0; return; }
  const targetX = ball.x - CHAMP_CAM_W / 2;
  const targetY = ball.y - CHAMP_CAM_H / 2;
  camera.x += (targetX - camera.x) * 0.15;
  camera.y += (targetY - camera.y) * 0.15;
  camera.x = Math.max(0, Math.min(WORLD_W - CHAMP_CAM_W, camera.x));
  camera.y = Math.max(0, Math.min(WORLD_H - CHAMP_CAM_H, camera.y));
}

// ── ASSETS ────────────────────────────────────────────────────────────────────
const Assets = {
  ready:false, _t:0, _d:0, imgs:{},
  _hit(){ this._d++; if(this._d >= this._t) this.ready = true; },
  _load(key, path){
    const im = new Image();
    im.onload  = () => this._hit();
    im.onerror = () => this._hit();
    im.src = path;
    this.imgs[key] = im;
    this._t++;
  },
  load(){
    const base = '../neon-defender/assets/skin-pokemon/';
    this._load('grass',    base + 'grass.png');
    // Player can pick from any of these — each is loaded under its species
    // key so we can address it by name (e.g. 'runner', 'tank') at runtime.
    for(const k of ['grunt','runner','mini','swift','tank','shielded','splitter','boss']){
      this._load(k, base + k + '.png');
    }
  }
};
Assets.load();
function imgReady(im){ return im && im.complete && im.naturalWidth > 0; }
function spr(key){ const im = Assets.imgs[key]; return imgReady(im) ? im : null; }

// ── CUSTOM SPRITES ────────────────────────────────────────────────────────────
// Player-drawn sprites from /sprite-editor live in localStorage as base64 PNGs.
// We expose them under the key prefix 'custom:<name>' so the picker, the AI
// teammate distribution, and the renderer can all use the same string key.
const CUSTOM_KEY = 'customSprites';
const customCache = {};        // 'custom:foo' → Image
function customList(){
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); }
  catch { return []; }
}
function customSprite(spriteKey){
  if(!spriteKey || !spriteKey.startsWith('custom:')) return null;
  if(customCache[spriteKey] && imgReady(customCache[spriteKey])) return customCache[spriteKey];
  const name = spriteKey.slice(7);
  const entry = customList().find(s => s.name === name);
  if(!entry) return null;
  if(!customCache[spriteKey]){
    const im = new Image();
    im.src = entry.png;
    customCache[spriteKey] = im;
  }
  return imgReady(customCache[spriteKey]) ? customCache[spriteKey] : null;
}
// Unified sprite resolver. Use this anywhere a player.sprite or
// celebrating.sprite needs to become a renderable Image.
function resolveSprite(key){
  if(key && key.startsWith('custom:')) return customSprite(key);
  return spr(key);
}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let ctx = null, master = null, sfxG = null, musicG = null;
  let enabled = localStorage.getItem('soccTapAudio') !== 'false';
  let crowdSrc = null, crowdGain = null;
  function ensure(){
    if(ctx) return ctx;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
    master = ctx.createGain(); master.gain.value = enabled ? 1 : 0; master.connect(ctx.destination);
    sfxG   = ctx.createGain(); sfxG.gain.value   = 0.6;  sfxG.connect(master);
    musicG = ctx.createGain(); musicG.gain.value = 0.16; musicG.connect(master);
    return ctx;
  }
  function tone({freq=440, dur=0.1, type='sine', vol=0.3, attack=0.005, release=0.05, sweep=0, dest}){
    if(!enabled) return; if(!ensure()) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.linearRampToValueAtTime(0, t0 + dur + release);
    o.connect(g); g.connect(dest || sfxG);
    o.start(t0); o.stop(t0 + dur + release + 0.02);
  }
  function noise({dur=0.18, vol=0.4, lp=8000, hp=80}){
    if(!enabled) return; if(!ensure()) return;
    const t0 = ctx.currentTime;
    const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for(let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f1 = ctx.createBiquadFilter(); f1.type='highpass'; f1.frequency.value = hp;
    const f2 = ctx.createBiquadFilter(); f2.type='lowpass';  f2.frequency.value = lp;
    const g  = ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f1); f1.connect(f2); f2.connect(g); g.connect(sfxG);
    src.start(t0); src.stop(t0 + dur);
  }
  function kick(power){
    const pw = Math.max(0.4, Math.min(1.6, power || 1));
    tone({freq: 220 - pw*40, dur:0.07*pw, type:'sawtooth', vol: 0.18*pw, sweep:-120});
    noise({dur:0.04, vol:0.18, hp:300, lp:4000});
  }
  function whistle(){
    tone({freq:2200, dur:0.18, type:'square', vol:0.20});
    setTimeout(() => tone({freq:1800, dur:0.20, type:'square', vol:0.18}), 200);
  }
  // Celebration: chaotic ascending arpeggio + filter sweep, then a long
  // descending whoosh and a final boom. Plays simultaneously with the visual
  // celebration animation.
  function celebrate(){
    if(!enabled) return; if(!ensure()) return;
    // Random arpeggio — uses pentatonic, mostly upward.
    const scale = [440, 523, 659, 784, 880, 1047, 1319, 1568];
    for(let i = 0; i < 10; i++){
      setTimeout(() => {
        const f = scale[Math.floor(Math.random() * scale.length)] * (1 + i * 0.05);
        tone({freq: f, dur: 0.08, type:'square', vol: 0.20});
      }, i * 90);
    }
    // Whoosh
    setTimeout(() => noise({dur:0.6, vol:0.35, hp:200, lp:5000}), 80);
    // Final boom
    setTimeout(() => {
      tone({freq:140, dur:0.4, type:'sawtooth', vol:0.32, sweep:-80});
      noise({dur:0.25, vol:0.35, hp:60, lp:1800});
    }, 1500);
  }
  function startCrowd(){
    if(!enabled) return; if(!ensure()) return;
    if(crowdSrc) return;
    const len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let last = 0;
    for(let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + w * 0.04) * 0.96;
      ch[i] = last;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 900;
    const g = ctx.createGain(); g.gain.value = 0.6;
    src.connect(lp); lp.connect(g); g.connect(musicG);
    src.start(0);
    crowdSrc = src; crowdGain = g;
  }
  function stopCrowd(){ if(crowdSrc){ try{ crowdSrc.stop(); }catch(e){} crowdSrc=null; crowdGain=null; } }

// ── Stuck-ball detection ─────────────────────────────────────────────────────
// The classic "every player and the ball pile against the corner and just
// vibrate forever" failure mode. We watch for ~3 seconds of low-velocity
// ball-near-the-wall and then violently scatter everything so play resumes.
let stuckTimer = 0;
const STUCK_TRIGGER_S   = 2.6;   // how long the ball has to look stuck
const STUCK_SPEED_LIMIT = 60;    // px/s below which the ball is "slow"
function isBallStuck(){
  const sp = Math.hypot(ball.vx, ball.vy);
  if(sp >= STUCK_SPEED_LIMIT) return false;
  // Also count "fighting against the wall but going nowhere" — ball pinned to
  // within 40 px of any side AND below the speed limit.
  const margin = 40;
  const nearWall =
    ball.x < PITCH_PAD + margin ||
    ball.x > WORLD_W - PITCH_PAD - margin ||
    ball.y < PITCH_PAD + margin ||
    ball.y > WORLD_H - PITCH_PAD - margin;
  return nearWall;
}
function scatterExplosion(){
  // Yeet the ball back toward centre with a big random angle.
  const a = Math.random() * Math.PI * 2;
  const sp = 520 + Math.random() * 260;
  ball.x  = WORLD_W/2 + (Math.random() - 0.5) * 220;
  ball.y  = WORLD_H/2 + (Math.random() - 0.5) * 120;
  ball.vx = Math.cos(a) * sp;
  ball.vy = Math.sin(a) * sp;
  // Shove non-goalkeepers in random directions; GKs snap back to their goal.
  for(const p of players){
    if(p.role === 'gk'){
      const goalX = (p.team === 'home') ? 60 : WORLD_W - 60;
      p.x = goalX; p.y = WORLD_H/2;
      p.vx = 0; p.vy = 0;
      p.tx = p.x; p.ty = p.y;
      continue;
    }
    const ang = Math.random() * Math.PI * 2;
    const psp = 380 + Math.random() * 200;
    p.vx = Math.cos(ang) * psp;
    p.vy = Math.sin(ang) * psp;
    // Also pick a fresh wander target so the AI doesn't drag everyone right
    // back into the same corner the next frame.
    p.tx = PITCH_PAD + 80 + Math.random() * (WORLD_W - 2 * PITCH_PAD - 160);
    p.ty = PITCH_PAD + 60 + Math.random() * (WORLD_H - 2 * PITCH_PAD - 120);
  }
  Sfx.kick(1.6);
  Sfx.whistle();
}
function updateStuckCheck(dt){
  if(celebrating || !running) { stuckTimer = 0; return; }
  if(isBallStuck()) stuckTimer += dt;
  else              stuckTimer  = 0;
  if(stuckTimer >= STUCK_TRIGGER_S){
    scatterExplosion();
    stuckTimer = 0;
  }
}

// the goal line. Slot order:
//   0 home GK,   1-2 home forwards,  3-4 home midfielders
//   5 away GK,   6-7 away forwards,  8-9 away midfielders
// HUMAN_IDX stays at 1 (top forward) so existing references keep working.
const FORMATION = [
  { team: 'home', role: 'gk',  fx: 0.045, fy: 0.50 },   // 0
  { team: 'home', role: 'fwd', fx: 0.40,  fy: 0.30 },   // 1  ← HUMAN_IDX
  { team: 'home', role: 'fwd', fx: 0.40,  fy: 0.70 },   // 2

  { team: 'home', role: 'fwd', fx: 0.22,  fy: 0.70 },   // 4
  { team: 'away', role: 'gk',  fx: 0.955, fy: 0.50 },   // 5
  { team: 'away', role: 'fwd', fx: 0.60,  fy: 0.30 },   // 6
  { team: 'away', role: 'fwd', fx: 0.60,  fy: 0.70 },   // 7
  { team: 'away', role: 'fwd', fx: 0.78,  fy: 0.30 },   // 8
  { team: 'away', role: 'fwd', fx: 0.78,  fy: 0.70 },   // 9
];

function buildTeams(){
  const mk = (team, role, sprite, x, y) => ({
    team, role, sprite, x, y, vx:0, vy:0, tx:x, ty:y
  });
  // Same-team outfielders share a sprite (so home/away kits read like
  // actual teams), each team's GK uses a different sprite so the keeper
  // is instantly distinguishable from his own forwards.
  const homeFwdSprite = chosenSprite;
  const pool = POKE_POOL.filter(k => k !== homeFwdSprite);
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const awayFwdSprite = pool[0] || 'tank';
  const homeGkSprite  = pool[1] || 'shielded';
  const awayGkSprite  = pool[2] || 'boss';
  const FM = (gameMode === 'championship') ? CHAMP_FORMATION : FORMATION;
  players = FM.map(slot => {
    const sprite = slot.role === 'gk'
      ? (slot.team === 'home' ? homeGkSprite  : awayGkSprite)
      : (slot.team === 'home' ? homeFwdSprite : awayFwdSprite);
    return mk(slot.team, slot.role, sprite, slot.fx * WORLD_W, slot.fy * WORLD_H);
  });
  // GKs sit on the goal line. Find them by role + team — works for both
  // the 5v5 layout (slots 0 / 5) and the 11v11 layout (slots 0 / 11).
  for(const p of players){
    if(p.role !== 'gk') continue;
    p.x = (p.team === 'home') ? 60 : (WORLD_W - 60);
    p.tx = p.x;
  }
  ball = { x: WORLD_W/2, y: WORLD_H/2, vx: 0, vy: 0, lastTouchIdx: -1,
           kickerTeam: null, kickerImmunityUntil: 0 };
  aiMoveTimer = 0;
}

function kickoff(scoredAgainst){
  const FM = (gameMode === 'championship') ? CHAMP_FORMATION : FORMATION;
  for(const p of players){ p.vx = 0; p.vy = 0; }
  for(let i = 0; i < players.length; i++){
    const slot = FM[i];
    players[i].x = slot.fx * WORLD_W;
    players[i].y = slot.fy * WORLD_H;
  }
  for(const p of players){
    if(p.role === 'gk') p.x = (p.team === 'home') ? 60 : (WORLD_W - 60);
  }
  for(const p of players){ p.tx = p.x; p.ty = p.y; }
  ball.x = WORLD_W/2; ball.y = WORLD_H/2;
  ball.vx = (scoredAgainst === 'home' ? 1 : -1) * 110;
  ball.vy = (Math.random() - 0.5) * 60;
  ball.lastTouchIdx = -1;
  ball.kickerTeam = null;
  ball.kickerImmunityUntil = 0;
  // POSSESSO/CHAMPIONSHIP: clear carrier + restore captain. For
  // championship the default active is the closest home outfielder to
  // the kickoff spot; otherwise we use HUMAN_IDX (the fixed top forward).
  heldByIdx  = -1;
  if(gameMode === 'championship'){
    let best = -1, bestD = 1e9;
    for(let i = 0; i < players.length; i++){
      if(players[i].team !== 'home' || players[i].role === 'gk') continue;
      const d = Math.hypot(players[i].x - ball.x, players[i].y - ball.y);
      if(d < bestD){ bestD = d; best = i; }
    }
    activeIdx = (best >= 0) ? best : HUMAN_IDX;
  } else {
    activeIdx = HUMAN_IDX;
  }
  firePressed = false; lastChargeFrac = 0;
  aiMoveTimer = 0;
  prevAtkAway = -1;
}

  const w = screen2world(sx, sy);

}

  e.preventDefault();

// ── PHYSICS ───────────────────────────────────────────────────────────────────
// Pool-ball style movement: each frame the player walks STRAIGHT toward its
// current target at a constant speed. No acceleration, no drag, no inertia.
// When the player arrives within ARRIVE_RADIUS we zero its velocity so it
// stops crisply (and so the ball impulse uses a sensible "current speed").
// Distance-ramped speed: short taps move slowly (precise dribbling), long
// taps sprint. The human gets the ramp; the AI uses a fixed speed.
function humanSpeedForDist(d){
  const t = Math.min(1, d / SPEED_RAMP_PX);
  return SPEED_MIN + (SPEED_MAX - SPEED_MIN) * t;
}
function updatePlayers(dt){
  for(let i = 0; i < players.length; i++){
    const p = players[i];
    // POSSESSO: the active home player is driven directly by the joystick.
    // Every other player keeps using the existing tx/ty target logic
    // (so the AI still chases the ball / picks attacker / GK positions).
    if((gameMode === 'possesso' || gameMode === 'championship') && i === activeIdx){
      const mag = Math.hypot(joyVec.x, joyVec.y);
      if(mag > 0.05){
        // Analog joystick → joyVec already carries magnitude in [0, 1].
        // Multiply by the top speed and you get walk-to-sprint scaling
        // straight out of the finger position. The previous normalisation
        // threw the magnitude away, which is why every push read as full
        // speed (the user's "only 4 axes" / "always same velocity" report).
        p.vx = joyVec.x * POSSESSO_PLAYER_SPEED;
        p.vy = joyVec.y * POSSESSO_PLAYER_SPEED;
        // Facing must stay unit-length — the ball-offset uses it as a
        // direction vector regardless of how hard you're pushing.
        facingX = joyVec.x / mag;
        facingY = joyVec.y / mag;
      } else {
        // Decelerate hard when no input so the captain stops crisply.
        const decel = Math.pow(0.00001, dt);
        p.vx *= decel; p.vy *= decel;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      // Keep tx/ty in sync so if the player switches back to TAP mode mid-
      // session the target isn't stale.
      p.tx = p.x; p.ty = p.y;
      clampToPitch(p);
      continue;
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const d = Math.hypot(dx, dy);
    // Non-active players in POSSESSO and every non-human in TAP follow tx/ty
    // at the difficulty-scaled AI speed. Slot 1 only gets the human-distance
    // ramp when it actually IS the human (TAP mode, or POSSESSO before any
    // pass switches control to another teammate).
    let speed;
    if(gameMode === 'possesso' || gameMode === 'championship'){
      speed = SPEED_AI * diff().speedMul;
    } else if(i === HUMAN_IDX){
      speed = humanSpeedForDist(d);
    } else {
      speed = SPEED_AI * diff().speedMul;
    }
    if(d > ARRIVE_RADIUS){
      const step = speed * dt;
      const k = Math.min(step, d) / d;
      p.vx = (dx / d) * speed;
      p.vy = (dy / d) * speed;
      p.x += dx * k;
      p.y += dy * k;
    } else {
      p.vx = 0; p.vy = 0;
    }
    clampToPitch(p);
  }
  // Player-vs-player: bumper-car bounce so collisions visibly knock both
  // characters apart instead of letting them grind to a halt overlapping.
  for(let i = 0; i < players.length; i++){
    for(let j = i + 1; j < players.length; j++){
      const a = players[i], b = players[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const overlap = (PLAYER_R * 2) - d;
      if(overlap > 0){
        const nx = dx / d, ny = dy / d;
        // Don't shove a GK off his line. Only the non-GK absorbs the
        // separation in a GK-vs-outfielder collision.
        if(a.role === 'gk' && b.role !== 'gk'){
          b.x += nx * overlap; b.y += ny * overlap;
        } else if(b.role === 'gk' && a.role !== 'gk'){
          a.x -= nx * overlap; a.y -= ny * overlap;
        } else {
          a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2; b.y += ny * overlap / 2;
        }
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const rel = rvx * nx + rvy * ny;
        if(rel < 0){
          const j2 = -(1 + PLAYER_PLAYER_BOUNCE) * rel / 2;
          // Bonus shove so the bump is visible.
          const PUSH = 70;
          a.vx -= j2 * nx + nx * PUSH; a.vy -= j2 * ny + ny * PUSH;
          b.vx += j2 * nx + nx * PUSH; b.vy += j2 * ny + ny * PUSH;
        }
      }
    }
  }
  // Re-clamp after pvp resolution so GKs snap back to their line even if
  // a forward bumped them sideways during the collision pass.
  for(const p of players) clampToPitch(p);
}
// Bouncy wall clamp. Now the player recoils off a wall instead of just
// stopping flat against it (helps unstick from corners).
// GKs get a STRICTER clamp: they only ever slide vertically along their
// goal line. This prevents bumper-car collisions from yeeting the keeper
// out of the box and leaving the net wide open.
function clampToPitch(p){
  if(p.role === 'gk'){
    const lineX = (p.team === 'home') ? 60 : (WORLD_W - 60);
    p.x = lineX;
    p.vx = 0;
    if(p.y < GOAL_TOP    + PLAYER_R + 4){ p.y = GOAL_TOP    + PLAYER_R + 4; if(p.vy < 0) p.vy = 0; }
    if(p.y > GOAL_BOTTOM - PLAYER_R - 4){ p.y = GOAL_BOTTOM - PLAYER_R - 4; if(p.vy > 0) p.vy = 0; }
    return;
  }
  if(p.x < PITCH_PAD + PLAYER_R){ p.x = PITCH_PAD + PLAYER_R; if(p.vx < 0) p.vx = -p.vx * PLAYER_BOUNCE; }
  if(p.x > WORLD_W - PITCH_PAD - PLAYER_R){ p.x = WORLD_W - PITCH_PAD - PLAYER_R; if(p.vx > 0) p.vx = -p.vx * PLAYER_BOUNCE; }
  if(p.y < PITCH_PAD + PLAYER_R){ p.y = PITCH_PAD + PLAYER_R; if(p.vy < 0) p.vy = -p.vy * PLAYER_BOUNCE; }
  if(p.y > WORLD_H - PITCH_PAD - PLAYER_R){ p.y = WORLD_H - PITCH_PAD - PLAYER_R; if(p.vy > 0) p.vy = -p.vy * PLAYER_BOUNCE; }
}

function updateBall(dt){
  // POSSESSO: if a player is carrying the ball, lock its position to that
  // player's facing offset. Skip all physics — the ball only moves once
  // the carrier shoots / passes / loses possession.
  if((gameMode === 'possesso' || gameMode === 'championship') && heldByIdx >= 0){
    const carrier = players[heldByIdx];
    if(!carrier){ heldByIdx = -1; }
    else {
      let fx, fy;
      if(heldByIdx === activeIdx){ fx = facingX; fy = facingY; }
      else {
        // AI carriers face toward the enemy goal so the ball reads
        // visually consistent with their intent.
        const goalX = (carrier.team === 'home') ? WORLD_W - 60 : 60;
        const dx = goalX - carrier.x, dy = (WORLD_H/2) - carrier.y;
        const m = Math.hypot(dx, dy) || 1;
        fx = dx/m; fy = dy/m;
      }
      const offset = PLAYER_R + BALL_R + 4;
      ball.x = carrier.x + fx * offset;
      ball.y = carrier.y + fy * offset;
      ball.vx = 0; ball.vy = 0;
      // AI carrier (anyone NOT the active player) decides shoot-or-pass
      // after holding the ball for `carryMs` (scaled by difficulty). GKs
      // get a SHORTER carry (~0.8 s) and ALWAYS try to pass to a forward
      // — they shouldn't punt blind toward the opposite goal, and they
      // shouldn't dawdle long enough for a forward to set up a press.
      const D = diff();
      const isGkCarrier = (carrier.role === 'gk');
      // GKs now hold the ball for a clean 2 s (was 800 ms) — feels like a
      // proper save → throw rather than an instant punt. Always a pass.
      const carryMs    = isGkCarrier ? 2000           : D.carryMs;
      const passChance = isGkCarrier ? 1.0            : D.passChance;
      const heldFor = performance.now() - (carrier.heldSince || performance.now());
      if(heldByIdx !== activeIdx && heldFor > carryMs){
        const enemyGoalX = (carrier.team === 'home') ? WORLD_W - 60 : 60;
        const enemyGoalY = WORLD_H / 2;
        // Decide: pass to a teammate further upfield, or just shoot.
        let targetX = enemyGoalX, targetY = enemyGoalY, isPass = false;
        if(Math.random() < passChance){
          let best = -1, bestX = carrier.x;
          for(let k = 0; k < players.length; k++){
            if(k === heldByIdx) continue;
            const m = players[k];
            if(m.team !== carrier.team) continue;
            if(m.role === 'gk') continue;
            const ahead = (carrier.team === 'home') ? (m.x > carrier.x + 40) : (m.x < carrier.x - 40);
            if(!ahead) continue;
            const better = (carrier.team === 'home') ? (m.x > bestX) : (m.x < bestX);
            if(best < 0 || better){ best = k; bestX = m.x; }
          }
          if(best >= 0){
            targetX = players[best].x;
            targetY = players[best].y;
            isPass  = true;
          }
        }
        // Aim with difficulty-scaled angular jitter so easy AI sprays shots.
        const dx = targetX - carrier.x, dy = targetY - carrier.y;
        const baseAng = Math.atan2(dy, dx);
        const ang = baseAng + (Math.random() - 0.5) * 2 * D.aimJitter;
        const baseSp = isPass ? 520 : (560 + Math.random() * 240);
        const sp = baseSp * D.shootSpeedBoost;
        ball.vx = Math.cos(ang) * sp;
        ball.vy = Math.sin(ang) * sp;
        ball.lastTouchIdx = heldByIdx;
        // Post-kick immunity for the OPPOSING team. GK passes (which fly
        // farthest) get a longer window so the receiver actually arrives
        // ahead of the away-team attacker.
        ball.kickerTeam = carrier.team;
        ball.kickerImmunityUntil = performance.now() + (isGkCarrier ? 1500 : 900);
        heldByIdx = -1;
        lastKickMs = performance.now();
        Sfx.kick(isPass ? 0.5 : 0.85);
      }
      return;   // physics + collisions skipped while held
    }
  }
  // (Loose-ball auto-focus removed — the user wants to drive the team
  // manually, using the fire button to cycle between teammates. Auto-
  // focus still kicks in when a home player actually PICKS UP the ball,
  // see the pickup branch in the collision loop further down.)
  // Drag + cap
  const dragFactor = Math.pow(1 - BALL_DRAG_PER_SEC, dt);
  ball.vx *= dragFactor;
  ball.vy *= dragFactor;
  const sp = Math.hypot(ball.vx, ball.vy);
  if(sp > BALL_MAX_SPEED){
    ball.vx = (ball.vx / sp) * BALL_MAX_SPEED;
    ball.vy = (ball.vy / sp) * BALL_MAX_SPEED;
  }
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  // Goal check FIRST — past the goal line through the mouth = score
  if(ball.x < PITCH_PAD + BALL_R){
    if(ball.y > GOAL_TOP && ball.y < GOAL_BOTTOM){ onGoal('away'); return; }
    ball.x = PITCH_PAD + BALL_R; ball.vx = Math.abs(ball.vx) * BALL_WALL_BOUNCE;
  }
  if(ball.x > WORLD_W - PITCH_PAD - BALL_R){
    if(ball.y > GOAL_TOP && ball.y < GOAL_BOTTOM){ onGoal('home'); return; }
    ball.x = WORLD_W - PITCH_PAD - BALL_R; ball.vx = -Math.abs(ball.vx) * BALL_WALL_BOUNCE;
  }
  if(ball.y < PITCH_PAD + BALL_R){ ball.y = PITCH_PAD + BALL_R; ball.vy = Math.abs(ball.vy) * BALL_WALL_BOUNCE; }
  if(ball.y > WORLD_H - PITCH_PAD - BALL_R){ ball.y = WORLD_H - PITCH_PAD - BALL_R; ball.vy = -Math.abs(ball.vy) * BALL_WALL_BOUNCE; }
  // Anti-stuck: if the ball is crawling AND pressed against any wall, give
  // it a small kick away from that wall toward the centre. Keeps the ball
  // from going dormant in a corner.
  const sp2 = Math.hypot(ball.vx, ball.vy);
  if(sp2 < 50){
    const cx = WORLD_W / 2, cy = WORLD_H / 2;
    const dxc = cx - ball.x, dyc = cy - ball.y;
    const dc  = Math.hypot(dxc, dyc) || 1;
    let nudge = 0;
    if(ball.x < PITCH_PAD + BALL_R + 4) nudge = 120;
    if(ball.x > WORLD_W - PITCH_PAD - BALL_R - 4) nudge = 120;
    if(ball.y < PITCH_PAD + BALL_R + 4) nudge = 120;
    if(ball.y > WORLD_H - PITCH_PAD - BALL_R - 4) nudge = 120;
    if(nudge > 0){
      ball.vx += (dxc / dc) * nudge;
      ball.vy += (dyc / dc) * nudge;
    }
  }
  // Player-ball impulse collision — the heart of the game. The ball's
  // velocity after impact reflects the relative velocity along the contact
  // normal, multiplied by a >1 restitution for arcade pop.
  for(let i = 0; i < players.length; i++){
    const p = players[i];
    const dx = ball.x - p.x, dy = ball.y - p.y;
    const d = Math.hypot(dx, dy) || 0.001;
    const minD = PLAYER_R + BALL_R;
    if(d >= minD) continue;
    // POSSESSO: a player TOUCHING the loose ball picks it up. If the
    // toucher is on the home team, control switches to them too — that's
    // the "pass" mechanic the user asked for. Goalkeepers are EXEMPT
    // from the post-kick cooldown so a goal-line save always grabs the
    // ball (the cooldown was letting close shots slip through their hands).
    // Post-kick immunity: for `kickerImmunityUntil` ms after a kick the
    // OPPOSING team can't pick up the ball. This stops an away forward
    // from camping the GK's pass lane and instantly stealing every long
    // ball — the receiving team gets a fair chance to settle the pass.
    const _isGk = p.role === 'gk';
    const _now  = performance.now();
    const _cooldownOk = _isGk || _now - lastKickMs > POSSESSO_PASS_COOLDOWN_MS;
    const _immunityBlocks = (ball.kickerImmunityUntil && _now < ball.kickerImmunityUntil
                              && ball.kickerTeam && p.team !== ball.kickerTeam);
    if((gameMode === 'possesso' || gameMode === 'championship') && heldByIdx === -1 && _cooldownOk && !_immunityBlocks){
      heldByIdx = i;
      players[i].heldSince = _now;
      if(p.team === 'home') activeIdx = i;
      ball.lastTouchIdx = i;
      ball.kickerTeam = null;
      ball.kickerImmunityUntil = 0;
      Sfx.kick(0.8);
      continue;
    }
    const nx = dx / d, ny = dy / d;
    // de-overlap
    ball.x = p.x + nx * minD;
    ball.y = p.y + ny * minD;
    // relative velocity in the normal direction
    const rvx = ball.vx - p.vx, rvy = ball.vy - p.vy;
    const rvn = rvx * nx + rvy * ny;
    if(rvn < 0){
      // closing — apply impulse
      const J = -(1 + COLLISION_RESTITUTION) * rvn;
      ball.vx += J * nx;
      ball.vy += J * ny;
    } else {
      // not closing (e.g. ball was already moving away) — still give a
      // small outward push so a stationary player nudges a slow ball
      ball.vx += nx * 60;
      ball.vy += ny * 60;
    }
    ball.lastTouchIdx = i;
    Sfx.kick(Math.min(1.5, Math.hypot(p.vx, p.vy) / 250));
  }
}

// ── AI ────────────────────────────────────────────────────────────────────────
// TAP mode keeps the old "farthest non-GK gets a target near the ball" logic
// because pure target-chasing reads fine when there's no possession state.
// POSSESSO mode uses a smarter role-based loop:
//   • GK    — strict Y-track of the ball along the goal line
//   • One outfielder per team is ATTACKER (whoever is closer to the ball)
//   • The other outfielder is DEFENDER (covers the lane to own goal)
//   • Off-frame: AI defenders attempt steals when in range
//   • AI carriers decide between SHOOT and PASS based on difficulty
// Tracks which AWAY outfielder is currently the "attacker" so the role
// swap only happens when the other is meaningfully closer to the ball.
// Without this the two defenders trade attacker duty every reassign
// cycle, which looked like both pile-on the ball at once.
let prevAtkAway = -1;
const ROLE_SWAP_HYSTERESIS_PX = 80;
// After any steal — by AI or by the user — the ball can't be stolen
// again for STEAL_IMMUNITY_MS. Lets the new carrier actually do
// something with possession before the closest opponent grabs it back.
const STEAL_IMMUNITY_MS = 2000;
let lastStealMs = -99999;

function updateAI(dt){
  const D = diff();
  // GK Y-tracking (difficulty-scaled reflex).
  for(const p of players){
    if(p.role !== 'gk') continue;
    const lineX = (p.team === 'home') ? 60 : WORLD_W - 60;
    p.tx = lineX;
    p.ty = p.ty + (ball.y - p.ty) * D.gkLerp;
    p.ty = Math.max(GOAL_TOP + 30, Math.min(GOAL_BOTTOM - 30, p.ty));
  }
  // Per-frame: AI defenders attempt to steal the ball off a nearby opposing
  // carrier. Throttled per-AI so they don't yo-yo possession instantly.
  aiSteals();
  // Symmetric for the HUMAN: the active home player auto-steals if he
  // closes inside POSSESSO_STEAL_RADIUS of a non-GK opposing carrier.
  // The user asked for either an automatic steal or a separate steal
  // button — auto-steal keeps the fire button single-purpose (kick).
  humanAutoSteal();
  // Auto-focus rule (user request): if the user isn't currently driving
  // anyone (joystick at rest) AND a different home outfielder is closer
  // to the ball, hand control to that teammate. The "user is idle" gate
  // is what stops the focus from being yanked away mid-dribble.
  if(gameMode === 'possesso' || gameMode === 'championship'){
    const userIdle = Math.abs(joyVec.x) < 0.05 && Math.abs(joyVec.y) < 0.05;
    const cur = players[activeIdx];
    if(userIdle){
      let bestIdx = -1, bestD2 = Infinity;
      for(let k = 0; k < players.length; k++){
        const p = players[k];
        if(p.team !== 'home' || p.role === 'gk') continue;
        const ddx = p.x - ball.x, ddy = p.y - ball.y;
        const d2 = ddx*ddx + ddy*ddy;
        if(d2 < bestD2){ bestD2 = d2; bestIdx = k; }
      }
      if(bestIdx >= 0 && bestIdx !== activeIdx){
        const curD2 = (cur && cur.role !== 'gk')
          ? ((cur.x - ball.x)*(cur.x - ball.x) + (cur.y - ball.y)*(cur.y - ball.y))
          : Infinity;
        // Only swap if the new candidate is meaningfully closer (40 px hysteresis)
        // OR the current active is the GK (defensive — should never happen).
        if(curD2 - bestD2 > 40 * 40 || (cur && cur.role === 'gk')){
          activeIdx = bestIdx;
        }
      }
    }
    // Defensive: never let activeIdx be a goalkeeper. If it somehow did
    // (e.g. on first kickoff before the auto-focus rule fires), snap to
    // the closest home outfielder right now.
    const a = players[activeIdx];
    if(a && a.role === 'gk'){
      let bestIdx = -1, bestD2 = Infinity;
      for(let k = 0; k < players.length; k++){
        const p = players[k];
        if(p.team !== 'home' || p.role === 'gk') continue;
        const ddx = p.x - ball.x, ddy = p.y - ball.y;
        const d2 = ddx*ddx + ddy*ddy;
        if(d2 < bestD2){ bestD2 = d2; bestIdx = k; }
      }
      if(bestIdx >= 0) activeIdx = bestIdx;
    }
  }
  aiMoveTimer -= dt;
  if(aiMoveTimer > 0) return;
  aiMoveTimer = 0.18;

  if(gameMode === 'possesso' || gameMode === 'championship'){
    // Special case: when a GK holds the ball, everyone (except the
    // user-piloted active home player) repositions to a mid-field
    // formation, spread along Y so the GK has multiple pass targets.
    if(heldByIdx >= 0 && players[heldByIdx].role === 'gk'){
      // Distinct y positions for each team's 4 outfielders.
      const ys = [WORLD_H * 0.18, WORLD_H * 0.40, WORLD_H * 0.60, WORLD_H * 0.82];
      const homeList = [], awayList = [];
      for(let i = 0; i < players.length; i++){
        if(players[i].role === 'gk') continue;
        (players[i].team === 'home' ? homeList : awayList).push(i);
      }
      const place = (list, x) => {
        list.forEach((idx, n) => {
          if(idx === activeIdx && players[idx].team === 'home') return;   // user-driven, leave alone
          players[idx].tx = x;
          players[idx].ty = ys[n % ys.length];
        });
      };
      place(homeList, WORLD_W * 0.40);
      place(awayList, WORLD_W * 0.60);
      return;
    }
    // Home outfielders are USER-PILOTED only. The active one runs off the
    // joystick (see updatePlayers); the OTHER non-active home outfielder
    // stays put so the user is the sole driver of his own team. (Their
    // tx/ty is parked at their current position so updatePlayers' arrive
    // check doesn't drag them anywhere.)
    for(let i = 0; i < players.length; i++){
      if(players[i].team !== 'home') continue;
      if(players[i].role === 'gk')   continue;
      if(i === activeIdx) continue;
      players[i].tx = players[i].x;
      players[i].ty = players[i].y;
    }
    // Away team keeps the attacker / defender split (with hysteresis so
    // the role doesn't swap mid-engagement).
    assignRoles('away');
  } else {
    // TAP mode: original simple behavior — farthest non-GK non-human AI
    // gets a ball-lead target.
    let farthestIdx = -1, farthestD2 = -1;
    for(let i = 0; i < players.length; i++){
      if(i === HUMAN_IDX) continue;
      if(players[i].role === 'gk') continue;
      const dx = players[i].x - ball.x, dy = players[i].y - ball.y;
      const d2 = dx*dx + dy*dy;
      if(d2 > farthestD2){ farthestD2 = d2; farthestIdx = i; }
    }
    if(farthestIdx >= 0) assignAITarget(farthestIdx);
  }
}

// Pick attacker/defender for `team` and assign their targets. Only the
// AWAY team uses this in POSSESSO mode — the home team is fully
// user-piloted. Role assignment has hysteresis: the previous attacker
// keeps the job unless the other player is at least 80 px closer to the
// ball. Without that the two AI players were swapping roles every reassign
// cycle, which read as both diving at the ball.
function assignRoles(team){
  const idx = [];
  for(let i = 0; i < players.length; i++){
    if(players[i].team !== team) continue;
    if(players[i].role === 'gk') continue;
    if(team === 'home' && i === activeIdx) continue;
    idx.push(i);
  }
  if(idx.length === 0) return;
  // Pick the attacker — closest to the ball, with hysteresis on the
  // away team so the role doesn't ping-pong every reassign cycle.
  let atk = idx[0];
  if(team === 'away' && prevAtkAway >= 0 && idx.includes(prevAtkAway)){
    const cur  = players[prevAtkAway];
    const dCur = Math.hypot(cur.x - ball.x, cur.y - ball.y);
    let bestOther = -1, bestOtherD = 1e9;
    for(const i2 of idx){
      if(i2 === prevAtkAway) continue;
      const d = Math.hypot(players[i2].x - ball.x, players[i2].y - ball.y);
      if(d < bestOtherD){ bestOtherD = d; bestOther = i2; }
    }
    atk = (bestOther >= 0 && bestOtherD + ROLE_SWAP_HYSTERESIS_PX < dCur) ? bestOther : prevAtkAway;
  } else {
    let bestD = 1e9;
    for(const i2 of idx){
      const d = Math.hypot(players[i2].x - ball.x, players[i2].y - ball.y);
      if(d < bestD){ bestD = d; atk = i2; }
    }
  }
  if(team === 'away') prevAtkAway = atk;
  assignAttacker(atk);
  // Everyone else defends — but staggered so 3 defenders don't pile on
  // the same spot. assignDefender's optional `laneIdx` argument picks
  // one of three vertical lanes.
  let laneIdx = 0;
  for(const i2 of idx){
    if(i2 !== atk) assignDefender(i2, laneIdx++);
  }
}

function assignAttacker(i){
  const p = players[i];
  const D = diff();
  const enemyGoalX = (p.team === 'home') ? WORLD_W - 60 : 60;
  const enemyGoalY = WORLD_H / 2;
  let tx, ty;
  if(heldByIdx === i){
    // I'm the carrier — push toward the enemy goal, slightly off-center so
    // I don't run head-on into their GK.
    const yOff = (p.y < WORLD_H / 2 ? -1 : 1) * 70;
    tx = enemyGoalX;
    ty = enemyGoalY + yOff;
  } else if(heldByIdx >= 0 && players[heldByIdx].team === p.team){
    // Teammate has the ball — offer a pass lane up the pitch.
    const dir = (p.team === 'home') ? 1 : -1;
    tx = players[heldByIdx].x + dir * 180;
    ty = enemyGoalY + (Math.random() - 0.5) * 220;
  } else if(heldByIdx >= 0){
    // Opponent has the ball — close on the carrier.
    tx = players[heldByIdx].x;
    ty = players[heldByIdx].y;
  } else {
    // Loose ball — aim at the predicted intercept point a fraction of a
    // second ahead of the ball's current trajectory.
    tx = ball.x + ball.vx * D.interceptLead;
    ty = ball.y + ball.vy * D.interceptLead;
    tx += (Math.random() - 0.5) * 40;
    ty += (Math.random() - 0.5) * 40;
  }
  p.tx = Math.max(PITCH_PAD, Math.min(WORLD_W - PITCH_PAD, tx));
  p.ty = Math.max(PITCH_PAD, Math.min(WORLD_H - PITCH_PAD, ty));
}

function assignDefender(i, laneIdx = 0){
  const p = players[i];
  const ownGoalX = (p.team === 'home') ? 60 : WORLD_W - 60;
  // Three vertical lanes so multiple defenders don't pile up on the same
  // spot. Lane 0 = top, 1 = middle, 2 = bottom; older callers pass no
  // index and get the middle lane by default.
  const lanes = [WORLD_H * 0.25, WORLD_H * 0.50, WORLD_H * 0.75];
  const laneY = lanes[laneIdx % lanes.length];
  // Defender SITS DEEP — only joins the play if the ball comes to him.
  // The user's rule: "l'altro si avvicina all'azione ma non entra in
  // gioco se la palla non è più vicina a lui". So the target is heavily
  // weighted toward own goal, not the ball, with the Y locked to its
  // assigned lane so the unit holds a clean position.
  let tx, ty;
  if(heldByIdx >= 0 && players[heldByIdx].team !== p.team){
    const c = players[heldByIdx];
    tx = c.x * 0.30 + ownGoalX * 0.70;
    ty = c.y * 0.30 + laneY    * 0.70;
  } else {
    tx = ball.x * 0.20 + ownGoalX * 0.80;
    ty = ball.y * 0.25 + laneY    * 0.75;
  }
  p.tx = Math.max(PITCH_PAD, Math.min(WORLD_W - PITCH_PAD, tx));
  p.ty = Math.max(PITCH_PAD, Math.min(WORLD_H - PITCH_PAD, ty));
}

// Auto-steal for the user's active player: if you walk within
// POSSESSO_STEAL_RADIUS of a non-GK opposing carrier, the ball flips
// to you. Throttled by aiStealAt[activeIdx] so a clumsy tackle doesn't
// yo-yo possession every frame.
function humanAutoSteal(){
  if(gameMode !== 'possesso') return;
  if(heldByIdx < 0) return;
  const carrier = players[heldByIdx];
  if(!carrier) return;
  if(carrier.team === 'home') return;        // teammates don't get stolen from
  if(carrier.role === 'gk')   return;        // GKs are tackle-proof (rule 1)
  const me = players[activeIdx];
  if(!me) return;
  const now = performance.now();
  // Shared 2 s immunity — same window the AI honours.
  if(now - lastStealMs < STEAL_IMMUNITY_MS) return;
  const d = Math.hypot(carrier.x - me.x, carrier.y - me.y);
  if(d < POSSESSO_STEAL_RADIUS + PLAYER_R){
    heldByIdx = activeIdx;
    me.heldSince = now;
    lastKickMs  = now;
    lastStealMs = now;
    Sfx.kick(0.5);
  }
}

// Defender steal check — runs every frame but throttled per-player by
// stealCooldownMs so a defender can't infinite-grab the ball.
function aiSteals(){
  if(gameMode !== 'possesso') return;
  if(heldByIdx < 0) return;
  const carrier = players[heldByIdx];
  if(!carrier) return;
  if(carrier.role === 'gk') return;             // can't tackle a goalkeeper holding the ball
  const D = diff();
  const now = performance.now();
  // Global 2 s ball immunity from the user request — also honoured here.
  if(now - lastStealMs < STEAL_IMMUNITY_MS) return;
  for(let i = 0; i < players.length; i++){
    if(i === heldByIdx) continue;
    const p = players[i];
    if(p.team === carrier.team) continue;       // teammates don't steal
    if(p.role === 'gk') continue;
    if(i === activeIdx) continue;               // human steals via fire button
    const lastTry = aiStealAt[i] || 0;
    if(now - lastTry < D.stealCooldownMs) continue;
    const d = Math.hypot(carrier.x - p.x, carrier.y - p.y);
    if(d < D.stealRadius + PLAYER_R){
      aiStealAt[i] = now;
      heldByIdx = i;
      p.heldSince = now;
      lastKickMs = now;                         // brief cooldown after swap
      lastStealMs = now;                        // 2 s global immunity from re-steal
      // Human "loses the ball" → control reverts to the closest home
      // outfielder so the user doesn't end up stranded with nobody.
      if(carrier.team === 'home' && i !== activeIdx){
        let best = -1, bestD = 1e9;
        for(let k = 0; k < players.length; k++){
          if(players[k].team !== 'home') continue;
          if(players[k].role === 'gk') continue;
          const dd = Math.hypot(players[k].x - ball.x, players[k].y - ball.y);
          if(dd < bestD){ bestD = dd; best = k; }
        }
        if(best >= 0) activeIdx = best;
      }
      Sfx.kick(0.45);
      return;
    }
  }
}

function assignAITarget(idx){
  const p = players[idx];
  const enemyGoalX = (p.team === 'home') ? WORLD_W - 60 : 60;
  const enemyGoalY = WORLD_H / 2;
  // Aim a bit PAST the ball toward the enemy goal — running through the
  // ball naturally launches it that direction.
  const dgx = enemyGoalX - ball.x, dgy = enemyGoalY - ball.y;
  const dg = Math.hypot(dgx, dgy) || 1;
  const lead = 50 + Math.random() * 40;
  let tx = ball.x + (dgx / dg) * lead;
  let ty = ball.y + (dgy / dg) * lead;
  // Add a small random jitter so AI isn't laser-precise.
  tx += (Math.random() - 0.5) * 90;
  ty += (Math.random() - 0.5) * 90;
  p.tx = Math.max(PITCH_PAD, Math.min(WORLD_W - PITCH_PAD, tx));
  p.ty = Math.max(PITCH_PAD, Math.min(WORLD_H - PITCH_PAD, ty));
}

// ── GOAL + CELEBRATION ────────────────────────────────────────────────────────
function onGoal(scoringTeam){
  if(scoringTeam === 'home') scoreHome++;
  else scoreAway++;
  updateScoreHud();
  startCelebration(scoringTeam);
}
function startCelebration(team){
  // Fallback scorer: if ball.lastTouchIdx wasn't tracked, just grab any
  // outfielder from the celebrating team — works with any roster size.
  let fallbackIdx = -1;
  for(let i = 0; i < players.length; i++){
    if(players[i].team === team && players[i].role !== 'gk'){ fallbackIdx = i; break; }
  }
  const scorerIdx = (ball.lastTouchIdx >= 0) ? ball.lastTouchIdx : (fallbackIdx >= 0 ? fallbackIdx : 1);
  // Pick the sprite of the SCORER, but if the scorer is on the losing side
  // (own-goal) fall back to a random teammate of the scoring team so the
  // animation shows the right team's pokemon celebrating.
  let scorerSprite = players[scorerIdx]?.sprite;
  if(players[scorerIdx]?.team !== team){
    for(const p of players){
      if(p.team === team && p.role !== 'gk'){ scorerSprite = p.sprite; break; }
    }
  }
  celebrating = {
    sprite: scorerSprite,
    team,
    startMs: performance.now(),
  };
  Sfx.celebrate();
  setTimeout(() => {
    celebrating = null;
    // Championship has NO first-to-N rule — the match only ends when the
    // clock runs out. Other modes keep the original goal cap.
    const goalCapReached = gameMode !== 'championship' &&
      (scoreHome >= MATCH_GOALS || scoreAway >= MATCH_GOALS);
    if(goalCapReached){
      onMatchEnd(team);
    } else {
      kickoff(team === 'home' ? 'away' : 'home');
    }
  }, CELEBRATE_MS);
}
// Clean two-phase celebration: the scorer's sprite is shown ONE time at
// the center. First it bounces in place (vertical hops) for ~60% of the
// duration, then it grows to fill the screen. Single subject = easy to
// read at a glance.
function drawCelebration(){
  if(!celebrating) return;
  const now = performance.now();
  const t = Math.min(1, (now - celebrating.startMs) / CELEBRATE_MS);
  // Dim the field (more as we grow).
  ctx.fillStyle = `rgba(0, 0, 0, ${0.4 + t * 0.35})`;
  ctx.fillRect(0, 0, W, H);
  const im = resolveSprite(celebrating.sprite);
  const teamColor = celebrating.team === 'home' ? '#66ccff' : '#ff6666';
  // ── Geometry of the bounce + grow ──
  const BOUNCE_END = 0.60;
  let scale, oy, rot;
  if(t < BOUNCE_END){
    // 3 hops up/down, gentle wobble.
    const bt = t / BOUNCE_END;
    const hops = 3;
    const phase = bt * hops * Math.PI;
    scale = 1 + 0.10 * Math.abs(Math.sin(phase));
    oy    = -Math.abs(Math.sin(phase)) * Math.min(W, H) * 0.18;
    rot   = Math.sin(phase * 0.6) * 0.18;
  } else {
    // Grow toward fill-screen, settling near center.
    const gt = (t - BOUNCE_END) / (1 - BOUNCE_END);
    scale = 1 + Math.pow(gt, 1.4) * 9;
    oy = (1 - gt) * (-Math.min(W, H) * 0.05);
    rot = Math.sin(now * 0.005) * 0.06;
  }
  const baseSize = Math.min(W, H) * 0.22;
  const sz = baseSize * scale;
  // Sprite halo
  ctx.save();
  ctx.translate(W/2, H/2 + oy);
  ctx.fillStyle = teamColor + '33';
  ctx.beginPath(); ctx.arc(0, 0, sz * 0.6, 0, Math.PI*2); ctx.fill();
  ctx.rotate(rot);
  if(im){
    ctx.drawImage(im, -sz/2, -sz/2, sz, sz);
  } else {
    ctx.fillStyle = teamColor;
    ctx.beginPath(); ctx.arc(0, 0, sz/2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // GOL! banner
  ctx.save();
  const fontSize = Math.min(W, H) * (0.08 + t * 0.07);
  ctx.fillStyle = teamColor;
  ctx.shadowColor = teamColor;
  ctx.shadowBlur = 30 + t * 25;
  ctx.font = 'bold ' + Math.floor(fontSize) + 'px Orbitron, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const bannerY = Math.min(W, H) * 0.10 + Math.sin(now * 0.012) * 6;
  ctx.fillText('GOL!', W/2, bannerY);
  ctx.restore();
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#062006'; ctx.fillRect(0, 0, W, H);
  const s = worldScale();
  const origin = world2screen(0, 0);
  // Grass tiles
  const grass = spr('grass');
  if(grass){
    const TILE = 64 * s;
    for(let yy = origin.y; yy < origin.y + WORLD_H * s; yy += TILE){
      for(let xx = origin.x; xx < origin.x + WORLD_W * s; xx += TILE){
        ctx.drawImage(grass, xx, yy, TILE + 1, TILE + 1);
      }
    }
  } else {
    ctx.fillStyle = '#1a6a1a';
    ctx.fillRect(origin.x, origin.y, WORLD_W * s, WORLD_H * s);
  }
  // Pitch markings
  ctx.strokeStyle = '#e8ffe855';
  ctx.lineWidth = Math.max(2, 3 * s);
  ctx.strokeRect(origin.x + PITCH_PAD * s, origin.y + PITCH_PAD * s,
                 (WORLD_W - PITCH_PAD * 2) * s, (WORLD_H - PITCH_PAD * 2) * s);
  const midX = world2screen(WORLD_W / 2, 0).x;
  ctx.beginPath(); ctx.moveTo(midX, origin.y + PITCH_PAD * s); ctx.lineTo(midX, origin.y + (WORLD_H - PITCH_PAD) * s); ctx.stroke();
  const ct = world2screen(WORLD_W / 2, WORLD_H / 2);
  ctx.beginPath(); ctx.arc(ct.x, ct.y, 90 * s, 0, Math.PI * 2); ctx.stroke();
  // Goals
  function drawGoal(side){
    const gx = side === 'left' ? 0 : WORLD_W - PITCH_PAD;
    const gw = PITCH_PAD;
    const g1 = world2screen(gx, GOAL_TOP);
    const g2 = world2screen(gx + gw, GOAL_BOTTOM);
    ctx.fillStyle = side === 'left' ? '#66ccff44' : '#ff666644';
    ctx.fillRect(g1.x, g1.y, g2.x - g1.x, g2.y - g1.y);
    ctx.strokeStyle = side === 'left' ? '#66ccff' : '#ff6666';
    ctx.lineWidth = Math.max(2, 3 * s);
    ctx.strokeRect(g1.x, g1.y, g2.x - g1.x, g2.y - g1.y);
  }
  drawGoal('left'); drawGoal('right');

  // Players. In POSSESSO mode the "active" player can switch from frame to
  // frame (the ball touching a teammate passes control), so we highlight
  // whichever home player is currently controlled instead of just slot 1.
  const ctrlIdx = (gameMode === 'possesso') ? activeIdx : HUMAN_IDX;
  for(let i = 0; i < players.length; i++){
    const p = players[i];
    const pos = world2screen(p.x, p.y);
    const rad = PLAYER_R * s;
    const isCtrl = (i === ctrlIdx);
    const halo = p.team === 'home' ? '#66ccff' : '#ff6666';
    ctx.fillStyle = halo + (isCtrl ? '88' : '44');
    ctx.beginPath(); ctx.arc(pos.x, pos.y + rad * 0.6, rad * 1.05, 0, Math.PI * 2); ctx.fill();
    const im = resolveSprite(p.sprite);
    const sz = rad * 2.4;
    if(im){
      ctx.drawImage(im, pos.x - sz/2, pos.y - sz/2, sz, sz);
    } else {
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, rad, 0, Math.PI * 2); ctx.fill();
    }
    if(isCtrl){
      // Pulsing yellow halo on the controlled player.
      const pulse = 0.85 + Math.sin(performance.now() / 180) * 0.15;
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = Math.max(2, 3.5 * s);
      ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 22 * s * pulse;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, rad + 5, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0;
      // Downward arrow above the head — instant "this one's me" cue that
      // tracks the swap when control hops to another teammate in POSSESSO.
      const ay = pos.y - rad - 14 * s + Math.sin(performance.now() / 220) * 3 * s;
      const ah = 14 * s, aw = 11 * s;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.moveTo(pos.x,        ay + ah);
      ctx.lineTo(pos.x - aw/2, ay);
      ctx.lineTo(pos.x + aw/2, ay);
      ctx.closePath(); ctx.fill();
      // Target marker (TAP mode only — joystick mode doesn't have a tx/ty)
      if(gameMode !== 'possesso'){
        const tg = world2screen(p.tx, p.ty);
        const td = Math.hypot(p.tx - p.x, p.ty - p.y);
        if(td > ARRIVE_RADIUS){
          ctx.fillStyle = '#ffcc0066';
          ctx.beginPath(); ctx.arc(tg.x, tg.y, 8 * s, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#ffcc00';
          ctx.lineWidth = Math.max(1, 2 * s);
          ctx.setLineDash([6, 6]);
          ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.lineTo(tg.x, tg.y); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }
  }

  // Ball
  const bp = world2screen(ball.x, ball.y);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 12 * s;
  ctx.beginPath(); ctx.arc(bp.x, bp.y, BALL_R * s, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(1, s);
  ctx.beginPath(); ctx.arc(bp.x, bp.y, BALL_R * s, 0, Math.PI * 2); ctx.stroke();

  // Celebration on top of everything
  drawCelebration();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateScoreHud(){
  document.getElementById('score-home').textContent = scoreHome;
  document.getElementById('score-away').textContent = scoreAway;
  const clockEl = document.getElementById('clock');
  if(gameMode === 'championship'){
    const remaining = Math.max(0, CHAMP_MATCH_MS - matchClockMs);
    const sec = Math.floor(remaining / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    clockEl.textContent = mm + ':' + ss;
  } else {
    clockEl.textContent = 'FIRST TO ' + MATCH_GOALS;
  }
}

// ── POSSESSO INPUT (joystick + fire button) ─────────────────────────────────
// Attach the shared touch-dpad to the canvas. It only does anything when
// gameMode === 'possesso' — in TAP mode joyVec stays {0,0} so the joystick
// is effectively invisible.
// joyVec is the EFFECTIVE input each frame — composed in the loop from
// joyTouch (set by TouchDpad below) and joyPad (set by the gamepad poll
// inside the loop). Keeping them separate means releasing the physical
// stick zeroes joyPad without clobbering an active touch and vice versa,
// which is what was broken: the old code only wrote joyVec when the
// gamepad stick was past the deadzone, so a released stick kept the
// previous frame's value and the player kept running.
let joyTouch = { x: 0, y: 0 };
let joyPad   = { x: 0, y: 0 };
if(window.TouchDpad){
  TouchDpad.attach({
    canvas,
    analog: true,
    onDirection: ({x, y}) => { if(gameMode === 'possesso' || gameMode === 'championship') joyTouch = { x, y }; },
    onStop:      ()         => { joyTouch = { x: 0, y: 0 }; }
  });
}

const fireBtn = document.getElementById('fire-btn');

  if(!show && powerBar){ powerBar.classList.remove('show'); }
}
function chargeFracNow(){
  if(!firePressed) return 0;
  return Math.min(1, (performance.now() - chargeStartMs) / POSSESSO_MAX_CHARGE_MS);
}
function setFireDown(){
  if(gameMode !== 'possesso' && gameMode !== 'championship') return;

// Cycle control to the next home outfielder (slot 1 → slot 2 → slot 1 …).
// This is the user's manual way of switching between teammates when they
// don't hold the ball — there's no auto-focus on loose balls anymore.
function cycleActivePlayer(){
  const outs = [];
  for(let k = 0; k < players.length; k++){
    if(players[k].team === 'home' && players[k].role !== 'gk') outs.push(k);
  }
  if(outs.length === 0) return;
  const cur = outs.indexOf(activeIdx);
  activeIdx = outs[(cur + 1) % outs.length];
  Sfx.kick(0.25);
}

// CHAMPIONSHIP: directional pass to the teammate most in the joystick
// direction (or the closest if the joystick is at rest). Pass speed
// scales with distance so close passes stay crisp and long passes
// arrive in time.
function passToTeammate(){
  const me = players[activeIdx]; if(!me) return;
  const jmag = Math.hypot(joyVec.x, joyVec.y);
  let best = -1, bestScore = -Infinity;
  for(let i = 0; i < players.length; i++){
    if(i === activeIdx) continue;
    if(players[i].team !== 'home' || players[i].role === 'gk') continue;
    const dx = players[i].x - me.x, dy = players[i].y - me.y;
    const d = Math.hypot(dx, dy) || 1;
    let score;
    if(jmag > 0.15){
      const dot = (dx * joyVec.x + dy * joyVec.y) / d / jmag;   // [-1, 1]
      score = dot * 1000 - d * 0.6;                              // direction-first, distance tiebreak
    } else {
      score = -d;                                                // no joystick → closest
    }
    if(score > bestScore){ bestScore = score; best = i; }
  }
  if(best < 0) return;
  const tgt = players[best];
  const dx = tgt.x - me.x, dy = tgt.y - me.y;
  const d  = Math.hypot(dx, dy) || 1;
  const sp = Math.min(900, 320 + d * 0.8);
  ball.vx = (dx / d) * sp;
  ball.vy = (dy / d) * sp;
  ball.lastTouchIdx = activeIdx;
  ball.kickerTeam = 'home';
  ball.kickerImmunityUntil = performance.now() + 800;
  heldByIdx = -1;
  lastKickMs = performance.now();
  Sfx.kick(0.5);
}

// CHAMPIONSHIP: short lunge in the player's facing direction. Auto-steal
// (humanAutoSteal) handles the actual possession swap if the lunge
// closes the gap to the opposing carrier.
function slideTackle(){
  const me = players[activeIdx]; if(!me) return;
  me.vx = facingX * POSSESSO_PLAYER_SPEED * 1.9;
  me.vy = facingY * POSSESSO_PLAYER_SPEED * 1.9;
  me.tackleUntil = performance.now() + 260;
  Sfx.kick(0.4);
}

function setFireUp(){
  if((gameMode !== 'possesso' && gameMode !== 'championship') || !firePressed) return;
  const frac = chargeFracNow();
  const pressDurMs = performance.now() - chargeStartMs;
  firePressed = false;
  fireBtn.classList.remove('charging');
  fireMeterArc.setAttribute('stroke-dashoffset', '352');
  if(powerBar){ powerBar.classList.remove('show'); powerBarFill.style.width = '0%'; }
  const me = players[activeIdx]; if(!me) return;

  // ── CHAMPIONSHIP: context-aware single button ──
  if(gameMode === 'championship'){
    const wasTap = pressDurMs < TAP_THRESHOLD_MS;
    if(heldByIdx === activeIdx){
      if(wasTap){
        // Short tap → directional pass to the most-aligned teammate.
        passToTeammate();
      } else {
        // Hold-release → charged shot in the facing direction.
        const sp = POSSESSO_KICK_MIN + (POSSESSO_KICK_MAX - POSSESSO_KICK_MIN) * frac;
        ball.vx = facingX * sp; ball.vy = facingY * sp;
        ball.lastTouchIdx = activeIdx;
        ball.kickerTeam = 'home';
        ball.kickerImmunityUntil = performance.now() + 900;
        heldByIdx = -1;
        lastKickMs = performance.now();
        Sfx.kick(0.6 + frac);
      }
    } else {
      // No ball: tap launches a slide tackle, hold is meaningless.
      const carrier = (heldByIdx >= 0) ? players[heldByIdx] : null;
      const stealable = carrier && carrier.team !== 'home' && carrier.role !== 'gk';
      if(stealable){
        slideTackle();
      } else if(wasTap){
        cycleActivePlayer();
      }
    }
    return;
  }

  // ── POSSESSO: original behaviour ──
  if(heldByIdx === activeIdx){
    // Shoot in the facing direction with charge-scaled power.
    const sp = POSSESSO_KICK_MIN + (POSSESSO_KICK_MAX - POSSESSO_KICK_MIN) * frac;
    ball.vx = facingX * sp; ball.vy = facingY * sp;
    ball.lastTouchIdx = activeIdx;
    ball.kickerTeam = 'home';
    ball.kickerImmunityUntil = performance.now() + 900;
    heldByIdx = -1;
    lastKickMs = performance.now();
    Sfx.kick(0.6 + frac);
  } else {
    cycleActivePlayer();
  }
}
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); setFireDown(); });
fireBtn.addEventListener('pointerup',   e => { e.preventDefault(); setFireUp(); });
fireBtn.addEventListener('pointerleave',e => { setFireUp(); });
fireBtn.addEventListener('pointercancel',e => { setFireUp(); });
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  if(e.code === 'Space' || e.code === 'Enter'){ setFireDown(); e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if(e.code === 'Space' || e.code === 'Enter'){ setFireUp(); }
});

// ── LOOP ──────────────────────────────────────────────────────────────────────
function loop(ts){
  if(!running) return;
  const realDt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  // If the player started the match while still holding the phone vertically,
  // freeze all physics until the device is rotated — otherwise the AI can
  // score on a kickoff the user can't even see. The portrait-gate covers
  // the screen during this window (see checkOrientation).
  // Same threshold as checkOrientation — a near-square foldable counts
  // as "landscape enough" for the physics to keep running.
  const waitingLandscape = window.innerHeight > window.innerWidth * 1.30;
  const isPaused = window.Pause && Pause.isPaused();
  // Detect a portrait → landscape transition and (re)arm the 3-2-1.
  // Also kill any in-flight countdown if the player rotates BACK to
  // portrait mid-game (auto-pause via the existing waitingLandscape gate).
  if(waitingLandscape){
    countdownEndsAt = 0;
  } else if(wasWaitingLandscape && !countdownEndsAt){
    countdownEndsAt = performance.now() + 3000;
    lastT = ts;       // discard the accumulated dt from the portrait window
  }
  wasWaitingLandscape = waitingLandscape;
  const inCountdown = countdownEndsAt && performance.now() < countdownEndsAt;
  if(inCountdown && performance.now() >= countdownEndsAt){
    countdownEndsAt = 0;
  }
  if(!celebrating && !waitingLandscape && !isPaused && !inCountdown){
    updateAI(realDt);
    updatePlayers(realDt);
    updateBall(realDt);
    updateStuckCheck(realDt);
    updateCamera();
    // Championship match clock — counts UP from 0 to CHAMP_MATCH_MS,
    // then the match ends regardless of score (can finish in a draw).
    if(gameMode === 'championship'){
      matchClockMs += realDt * 1000;
      updateScoreHud();    // tick the on-screen mm:ss every frame
      if(matchClockMs >= CHAMP_MATCH_MS){
        const winner = scoreHome > scoreAway ? 'home'
                     : scoreAway > scoreHome ? 'away' : 'draw';
        onMatchEnd(winner);
        return;
      }
    }
    // POSSESSO / CHAMPIONSHIP HUD: update the charge meter ring.
    if(gameMode === 'possesso' || gameMode === 'championship'){
      const frac = chargeFracNow();
      lastChargeFrac = frac;
      fireMeterArc.setAttribute('stroke-dashoffset', String(352 * (1 - frac)));
      if(firePressed && powerBarFill){ powerBarFill.style.width = (frac * 100).toFixed(1) + '%'; }
      // Gamepad passthrough — stick (or d-pad) drives joyPad; the loop
      // below picks whichever of joyTouch / joyPad is active each frame.
      // ALWAYS overwrite joyPad each frame so a centred stick reads as
      // zero — the previous code only assigned on non-zero input and
      // the stale last-value kept the player running.
      if(window.GamepadInput && window.GamepadInput.isConnected()){
        const gp = GamepadInput.state();
        const mag = Math.hypot(gp.stickL.x, gp.stickL.y);
        if(mag > 0.18){
          joyPad = { x: gp.stickL.x, y: gp.stickL.y };
        } else if(gp.dir16.x || gp.dir16.y){
          joyPad = { x: gp.dir16.x, y: gp.dir16.y };
        } else {
          joyPad = { x: 0, y: 0 };
        }
        if(gp.fire && !firePressed) setFireDown();
        else if(!gp.fire && firePressed) setFireUp();
      } else {
        joyPad = { x: 0, y: 0 };
      }
      // Compose the effective vector: prefer touch when active, fall back
      // to the gamepad pad when the screen isn't being touched.
      const touchActive = Math.abs(joyTouch.x) > 0.02 || Math.abs(joyTouch.y) > 0.02;
      joyVec = touchActive ? joyTouch : joyPad;
    }
  }
  draw();
  drawCountdownOverlay();
  requestAnimationFrame(loop);
}

// Big "3 / 2 / 1" digit drawn over the canvas while the post-rotation
// countdown is running. Pulses on each second boundary.
function drawCountdownOverlay(){
  if(!countdownEndsAt) return;
  const remaining = countdownEndsAt - performance.now();
  if(remaining <= 0) return;
  const sec = Math.max(1, Math.ceil(remaining / 1000));
  const inPhase = 1 - ((remaining % 1000) / 1000);
  const alpha = 0.55 + 0.45 * Math.min(1, inPhase * 4);
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '900 ' + Math.round(Math.min(W, H) * 0.42) + 'px Orbitron, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(255, 224, 80, ${alpha})`;
  ctx.shadowColor = '#ffe04a';
  ctx.shadowBlur = 32;
  ctx.fillText(String(sec), W / 2, H / 2);
  ctx.restore();
}

if(window.Pause){
  Pause.attach({
    canPause: () => !!running && !celebrating,
    onPause:  () => { try { Sfx.stopCrowd(); } catch(e){} },
    onResume: () => { try { Sfx.startCrowd(); } catch(e){} lastT = performance.now(); }
  });
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
showMainMenu();
(() => {
  const b = document.getElementById('audio-btn');
  if(b){
    const on = Sfx.isEnabled();
    b.textContent = on ? '🔊' : '🔇';
    b.classList.toggle('off', !on);
  }
})();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
