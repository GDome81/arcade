<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEON BREAKER</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Breaker">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050810;color:#e0e8ff;
    font-family:'Share Tech Mono',monospace;
    overflow:hidden;
    min-height:100vh;min-height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  #game-wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  #game{display:block;width:100%;height:100%;background:#050810;touch-action:none}

  #hud{
    position:fixed;top:0;left:0;right:0;padding:8px 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:linear-gradient(to bottom,#050810dd,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center}
  .hud-label{font-size:9px;letter-spacing:.2em;color:#00f5ff99;text-transform:uppercase}
  .hud-value{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.15rem;color:#fff;
    text-shadow:0 0 10px #00f5ff;line-height:1;margin-top:2px;letter-spacing:.05em;
  }
  .hud-value.coins{color:#ffcc00;text-shadow:0 0 10px #ffcc0088}

  #back-btn{
    position:fixed;top:8px;left:8px;
    width:42px;height:36px;border-radius:6px;
    background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;
    display:flex;align-items:center;justify-content:center;
    pointer-events:auto;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#050810cc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.4rem;
    color:#00f5ff;letter-spacing:.25em;
    text-shadow:0 0 30px #00f5ff;margin-bottom:6px;
  }
  #overlay p{color:#a0b8e0;font-size:.95rem;letter-spacing:.1em}
  .btn{
    margin-top:14px;padding:10px 26px;
    background:transparent;border:2px solid #00f5ff;color:#00f5ff;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #00f5ff44;transition:all .15s;
  }
  .btn:hover{background:#00f5ff22;box-shadow:0 0 28px #00f5ff88}
  .btn.warn{border-color:#ffcc00;color:#ffcc00;box-shadow:0 0 18px #ffcc0044}
  .btn.warn:hover{background:#ffcc0022;box-shadow:0 0 28px #ffcc0088}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  /* Touch hint */
  #hint{
    position:fixed;bottom:12px;left:0;right:0;text-align:center;
    color:#ffffff44;font-size:11px;letter-spacing:.15em;pointer-events:none;z-index:4;
  }
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div style="width:42px"></div>
  <div class="hud-item"><span class="hud-label">Level</span><span class="hud-value" id="h-level">1</span></div>
  <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="h-score">0</span></div>
  <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-value" id="h-lives">3</span></div>
  <div class="hud-item"><span class="hud-label">Coins</span><span class="hud-value coins" id="h-coins">0</span></div>
</div>

<button id="back-btn" title="Torna al launcher" onclick="goBack()">✖</button>

<div id="overlay">
  <h2>NEON BREAKER</h2>
  <p>Trascina o muovi il mouse per controllare la paddle</p>
  <p>Tocca / clicca per lanciare la palla</p>
  <div class="btn-row">
    <button class="btn" onclick="startGame()">START</button>
  </div>
</div>

<div id="hint" style="display:none">Drag/Mouse = paddle &nbsp;·&nbsp; Tap = launch/fire &nbsp;·&nbsp; Esc = menu</div>

<script src="../shared/coins.js"></script>
<script>
// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// ── GAME STATE ────────────────────────────────────────────────────────────────
const PADDLE_W = 130, PADDLE_H = 14;
const BALL_R   = 7;
const BRICK_ROWS = 6, BRICK_COLS = 10;
const BRICK_GAP  = 4;
const BRICK_TOP  = 90;    // y where bricks start
const COLORS = ['#ff4466','#ff9944','#ffcc00','#44ff88','#00f5ff','#aa44ff'];
// HP-tier colours for multi-hit bricks (used as base brick colour when hp > 1).
// Brighter / more "danger" tone the higher the hp.
const HP_COLORS = {
  1: null,           // null = use the row colour
  2: '#88aaff',
  3: '#aa88ff',
  4: '#dd66ff',
  5: '#ff5599'
};

const POWERUP_DROP_CHANCE = 0.12;        // ~12% of destroyed bricks drop a powerup
const POWERUP_TYPES = ['gun','multi'];   // gun = 10 bullets, multi = +2 balls
const POWERUP_FALL_SPEED = 2.6;          // px/frame
const GUN_BULLETS = 10;
const BULLET_SPEED = 9;

let level = 1;
let score = 0;
let lives = 3;
let running = false;
let bricks = [];                 // {x,y,w,h,color,hp,maxHp,score}
let balls  = [];                 // {x,y,vx,vy,r,attached}
let powerups = [];               // {x,y,type,t}  t = anim time
let bullets  = [];               // {x,y,vy}
let gunBullets = 0;              // remaining bullets player can fire

const paddle = { x: 0, y: 0, w: PADDLE_W, h: PADDLE_H, vx: 0 };

// Convenience accessors
function attachedBall(){ return balls.find(b => b.attached); }
function hasGun(){ return gunBullets > 0; }

// ── LEVEL BUILDER ─────────────────────────────────────────────────────────────
// Each level picks a random LAYOUT template (defines which cells are filled),
// then applies random HP / wide / indestructible decoration on top.
function buildLevel(n){
  bricks.length = 0;
  powerups.length = 0;
  bullets.length  = 0;
  const margin = 24;
  const availW = W - margin*2;
  const cols = BRICK_COLS;
  const bw = (availW - (cols-1) * BRICK_GAP) / cols;
  const bh = 22;
  const startX = margin;
  const startY = BRICK_TOP;
  const rows   = 5 + Math.floor(Math.random() * 4);   // 5–8 rows of random height

  // Toughness/black/wide caps grow gently with level
  const maxHp       = Math.min(5, 1 + Math.floor((n - 1) / 2));
  const blackChance = Math.min(0.14, (n - 1) * 0.014);
  const wideChance  = Math.min(0.20, 0.04 + (n - 1) * 0.014);

  // Pick a layout template; mask[r][c] = true means "place a brick here"
  const templates = [_lyFull, _lyHollow, _lyPyramid, _lyColumns, _lyCheckers, _lyScatter, _lyArch];
  const mask = templates[Math.floor(Math.random() * templates.length)](rows, cols);

  const occupied = new Array(rows * cols).fill(false);
  const idx = (r, c) => r * cols + c;

  for(let r = 0; r < rows; r++){
    for(let c = 0; c < cols; c++){
      if(occupied[idx(r, c)]) continue;
      if(!mask[r][c]) continue;

      const isWide = (c < cols - 1) && !occupied[idx(r, c+1)] && mask[r][c+1]
                  && Math.random() < wideChance;
      const isBlack = !isWide && Math.random() < blackChance;
      const widthCells = isWide ? 2 : 1;

      let hp = 1;
      if(!isBlack && maxHp > 1){
        const rowFactor = 1 - (r / Math.max(1, rows - 1));
        const target    = 1 + Math.round(rowFactor * (maxHp - 1));
        hp = Math.max(1, Math.min(maxHp, target + (Math.random() < 0.3 ? -1 : 0)));
      }

      const color = isBlack ? '#1a1a1a'
                  : (HP_COLORS[hp] || COLORS[r % COLORS.length]);

      bricks.push({
        x: startX + c * (bw + BRICK_GAP),
        y: startY + r * (bh + BRICK_GAP),
        w: bw * widthCells + (widthCells - 1) * BRICK_GAP,
        h: bh,
        color,
        hp: isBlack ? Infinity : hp,
        maxHp: isBlack ? Infinity : hp,
        indestructible: isBlack,
        score: (rows - r) * 10 * widthCells
      });

      occupied[idx(r, c)] = true;
      if(isWide) occupied[idx(r, c+1)] = true;
    }
  }
}

// ── Layout templates: each returns a `rows × cols` boolean mask ──
function _emptyMask(rows, cols){ return Array.from({length:rows}, ()=>new Array(cols).fill(false)); }

function _lyFull(rows, cols){           // classic solid wall
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) m[r][c] = true;
  return m;
}
function _lyHollow(rows, cols){         // border only, with a window
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(r === 0 || r === rows-1 || c === 0 || c === cols-1) m[r][c] = true;
  }
  return m;
}
function _lyPyramid(rows, cols){        // narrowing toward bottom
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++){
    const inset = Math.floor((r / rows) * (cols/2));
    for(let c=inset;c<cols-inset;c++) m[r][c] = true;
  }
  return m;
}
function _lyColumns(rows, cols){        // alternating vertical strips
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(c % 2 === 0) m[r][c] = true;
  }
  return m;
}
function _lyCheckers(rows, cols){       // checkerboard
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if((r + c) % 2 === 0) m[r][c] = true;
  }
  return m;
}
function _lyScatter(rows, cols){        // sparse 70% fill
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(Math.random() < 0.72) m[r][c] = true;
  }
  return m;
}
function _lyArch(rows, cols){           // arch / cathedral shape
  const m = _emptyMask(rows, cols);
  for(let r=0;r<rows;r++){
    // arch curve: more inset at the bottom centre
    const inset = Math.floor(Math.sin((r/rows) * Math.PI) * (cols * 0.25));
    for(let c=0;c<cols;c++){
      if(c < inset || c >= cols - inset){
        m[r][c] = true;
      } else if(r < 2){
        m[r][c] = true;   // top rows always solid
      }
    }
  }
  return m;
}

let gameStartTime = 0;     // ms timestamp when the current run began

function currentTargetSpeed(){
  // Base speed scales with viewport. Time multiplier ramps continuously:
  //  +50% after 60s, +100% after 120s, capped at +200% so it stays playable.
  const elapsedSec = gameStartTime ? (performance.now() - gameStartTime) / 1000 : 0;
  const ramp = Math.min(2.0, elapsedSec * 0.008);   // 0.008/sec = +50% in ~60s
  return Math.min(W, H) * 0.55 / 60 * (1 + ramp);
}

function resetBallsOnPaddle(){
  paddle.x = W/2 - paddle.w/2;
  paddle.y = H - 60;
  balls.length = 0;
  balls.push({
    x: paddle.x + paddle.w/2,
    y: paddle.y - BALL_R - 2,
    vx: 0, vy: 0, r: BALL_R, attached: true
  });
}

function launchAttached(){
  const b = attachedBall();
  if(!b) return;
  b.attached = false;
  const speed = currentTargetSpeed();
  const angle = (-Math.PI/2) + (Math.random() * 0.6 - 0.3); // up ± 17°
  b.vx = Math.cos(angle) * speed;
  b.vy = Math.sin(angle) * speed;
}

function spawnExtraBalls(srcBall, count){
  const speed = Math.hypot(srcBall.vx, srcBall.vy) || currentTargetSpeed();
  const baseAngle = Math.atan2(srcBall.vy, srcBall.vx);
  for(let i = 1; i <= count; i++){
    const a = baseAngle + (i % 2 ? 1 : -1) * (0.35 + Math.random() * 0.25) * (Math.ceil(i / 2));
    balls.push({
      x: srcBall.x, y: srcBall.y,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      r: BALL_R, attached: false
    });
  }
}

function fireBullet(){
  if(!hasGun()) return;
  gunBullets--;
  // Fire two bullets, one from each side of the paddle.
  bullets.push({ x: paddle.x + 14,             y: paddle.y, vy: -BULLET_SPEED });
  bullets.push({ x: paddle.x + paddle.w - 14,  y: paddle.y, vy: -BULLET_SPEED });
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
let targetX = null;     // where paddle wants to be (set by pointer)
function setTargetFromEvent(clientX){
  const rect = canvas.getBoundingClientRect();
  targetX = clientX - rect.left;
}
canvas.addEventListener('mousemove', e => setTargetFromEvent(e.clientX));
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(e.touches[0]) setTargetFromEvent(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(e.touches[0]) setTargetFromEvent(e.touches[0].clientX);
  primaryAction();
}, {passive:false});
canvas.addEventListener('mousedown', () => primaryAction());
window.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter') primaryAction();
  if(e.key === 'Escape') { if(running) showPauseMenu(); }
  if(e.key === 'ArrowLeft')  targetX = (paddle.x + paddle.w/2) - 40;
  if(e.key === 'ArrowRight') targetX = (paddle.x + paddle.w/2) + 40;
});

// Click/tap/space does the contextually-correct thing:
//   ball attached → launch it
//   gun active    → fire a bullet
//   otherwise     → no-op
function primaryAction(){
  if(attachedBall()) { launchAttached(); return; }
  if(hasGun())       { fireBullet();      return; }
}

// ── COLLISION ─────────────────────────────────────────────────────────────────
function circleRectHit(cx, cy, cr, rx, ry, rw, rh){
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX, dy = cy - closestY;
  return (dx*dx + dy*dy) < cr*cr;
}

function reflectFromRect(cx, cy, cr, rx, ry, rw, rh, vx, vy){
  // Determine which side the ball hit by comparing penetration depths
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX, dy = cy - closestY;
  if(Math.abs(dx) > Math.abs(dy)){
    return { vx: -vx, vy: vy };
  } else {
    return { vx: vx, vy: -vy };
  }
}

// ── GAME LOOP ─────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts){
  if(!running) return;
  const dt = Math.min(33, ts - lastT) / 16.666;   // normalised to 60fps frames
  lastT = ts;

  // ── Paddle motion (lerps toward target) ──
  if(targetX !== null){
    const desired = Math.max(paddle.w/2, Math.min(W - paddle.w/2, targetX));
    // Snappier follow: 0.55 instead of 0.30 → ~95% of distance covered in 4 frames
    paddle.x += (desired - paddle.w/2 - paddle.x) * 0.55 * dt;
  }
  paddle.y = H - 60;

  // ── Renormalise every ball to the current target speed.
  // Speed grows with elapsed time → ball gradually accelerates over the run.
  const tgtSpeed = currentTargetSpeed();
  for(const b of balls){
    if(b.attached) continue;
    const cur = Math.hypot(b.vx, b.vy);
    if(cur > 0.001){
      const k = tgtSpeed / cur;
      b.vx *= k; b.vy *= k;
    }
  }

  // ── Balls update ──
  for(let bi = balls.length - 1; bi >= 0; bi--){
    const b = balls[bi];
    if(b.attached){
      b.x = paddle.x + paddle.w/2;
      b.y = paddle.y - b.r - 2;
      continue;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    // Wall bounce
    if(b.x < b.r)        { b.x = b.r;     b.vx = -b.vx; }
    if(b.x > W - b.r)    { b.x = W - b.r; b.vx = -b.vx; }
    if(b.y < b.r)        { b.y = b.r;     b.vy = -b.vy; }
    // Paddle bounce
    if(b.vy > 0 && circleRectHit(b.x, b.y, b.r, paddle.x, paddle.y, paddle.w, paddle.h)){
      const hit = (b.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      const speed = Math.hypot(b.vx, b.vy);
      const angle = (-Math.PI/2) + hit * 1.0;
      b.vx = Math.cos(angle) * speed;
      b.vy = Math.sin(angle) * speed;
      b.y  = paddle.y - b.r - 1;
    }
    // Brick collisions
    for(let i = bricks.length - 1; i >= 0; i--){
      const br = bricks[i];
      if(circleRectHit(b.x, b.y, b.r, br.x, br.y, br.w, br.h)){
        const ref = reflectFromRect(b.x, b.y, b.r, br.x, br.y, br.w, br.h, b.vx, b.vy);
        b.vx = ref.vx; b.vy = ref.vy;
        if(br.indestructible) break;          // black brick: bounce only
        br.hp--;
        if(br.hp <= 0){
          score += br.score;
          maybeDropPowerup(br);
          bricks.splice(i, 1);
        }
        break;
      }
    }
    // Fell below paddle
    if(b.y > H + 40) balls.splice(bi, 1);
  }

  // ── Lost all balls → lose a life and respawn one ──
  if(balls.length === 0){
    lives--;
    if(lives <= 0){ gameOver(); return; }
    resetBallsOnPaddle();
  }

  // ── Powerups falling ──
  for(let pi = powerups.length - 1; pi >= 0; pi--){
    const p = powerups[pi];
    p.y += POWERUP_FALL_SPEED * dt;
    p.t = (p.t || 0) + dt * 0.06;
    // Caught by paddle?
    if(p.y + 14 > paddle.y && p.y - 14 < paddle.y + paddle.h
       && p.x > paddle.x && p.x < paddle.x + paddle.w){
      applyPowerup(p.type);
      powerups.splice(pi, 1);
      continue;
    }
    if(p.y > H + 30) powerups.splice(pi, 1);
  }

  // ── Bullets ──
  for(let bi = bullets.length - 1; bi >= 0; bi--){
    const bu = bullets[bi];
    bu.y += bu.vy * dt;
    if(bu.y < -20){ bullets.splice(bi, 1); continue; }
    // Hit brick?
    for(let i = bricks.length - 1; i >= 0; i--){
      const br = bricks[i];
      if(bu.x > br.x && bu.x < br.x + br.w && bu.y > br.y && bu.y < br.y + br.h){
        bullets.splice(bi, 1);
        if(br.indestructible) break;
        br.hp--;
        if(br.hp <= 0){
          score += br.score;
          maybeDropPowerup(br);
          bricks.splice(i, 1);
        }
        break;
      }
    }
  }

  // ── Level cleared? (only count destructible bricks) ──
  if(!bricks.some(b => !b.indestructible)){
    // Coin reward for clearing the level — grows mildly with depth.
    if(Coins){
      const reward = 2 + Math.floor(level / 2);
      Coins.add(reward, 'neon-breaker-level-' + level);
    }
    level++;
    buildLevel(level);
    resetBallsOnPaddle();
    flashLevel();
  }

  draw();
  updateHud();
  requestAnimationFrame(loop);
}

// Drop chance + spawn
function maybeDropPowerup(brick){
  if(Math.random() > POWERUP_DROP_CHANCE) return;
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  powerups.push({
    x: brick.x + brick.w/2,
    y: brick.y + brick.h/2,
    type, t: 0
  });
}

function applyPowerup(type){
  if(type === 'gun'){
    gunBullets = GUN_BULLETS;
    flashMsg('GUN +' + GUN_BULLETS);
  } else if(type === 'multi'){
    // Spawn 2 extra balls from the first non-attached ball (or attached fallback).
    const src = balls.find(b => !b.attached) || balls[0];
    if(src){
      // If only the attached ball exists, launch it first
      if(src.attached){ launchAttached(); }
      spawnExtraBalls(src, 2);
    }
    flashMsg('MULTI BALL');
  }
}

// ── FLASH MESSAGE ─────────────────────────────────────────────────────────────
let _flash = { text: '', t: 0 };
function flashMsg(text){ _flash.text = text; _flash.t = 1; }
function flashLevel(){ flashMsg('LEVEL ' + level); }

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);

  // Bricks
  for(const b of bricks){
    if(b.indestructible){
      // Black/steel brick: dark gradient + bright border
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      // Highlight strip
      ctx.fillStyle = '#444';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 2);
    } else {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur  = 12;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.shadowBlur = 0;
      // HP indicator dots (only when > 1 hp remaining)
      if(b.hp > 1){
        const dotR = Math.min(b.h * 0.18, 3.5);
        const spacing = b.w / (b.hp + 1);
        for(let i = 0; i < b.hp; i++){
          ctx.fillStyle = '#ffffffcc';
          ctx.beginPath();
          ctx.arc(b.x + spacing * (i + 1), b.y + b.h/2, dotR, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
  }
  ctx.shadowBlur = 0;

  // Powerups (animated, falling)
  for(const p of powerups) drawPowerup(p);

  // Bullets
  ctx.fillStyle = '#ffcc00';
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 12;
  for(const bu of bullets){
    ctx.fillRect(bu.x - 2, bu.y - 6, 4, 12);
  }
  ctx.shadowBlur = 0;

  // Paddle (slight orange tint when gun is loaded)
  const pcol = hasGun() ? '#ffcc00' : '#00f5ff';
  ctx.fillStyle = pcol;
  ctx.shadowColor = pcol;
  ctx.shadowBlur = 22;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  // Gun nozzles when loaded
  if(hasGun()){
    ctx.fillStyle = '#fff';
    ctx.fillRect(paddle.x + 12,            paddle.y - 4, 4, 4);
    ctx.fillRect(paddle.x + paddle.w - 16, paddle.y - 4, 4, 4);
  }
  ctx.shadowBlur = 0;

  // Balls
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 20;
  for(const b of balls){
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Flash message
  if(_flash.t > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, _flash.t);
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.07) + 'px Orbitron, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 22;
    ctx.textAlign = 'center';
    ctx.fillText(_flash.text, W/2, H/2);
    ctx.restore();
    _flash.t -= 0.02;
  }
}

function drawPowerup(p){
  const r = 14;
  const pulse = 1 + Math.sin(p.t * 6) * 0.08;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pulse, pulse);
  if(p.type === 'gun'){
    ctx.fillStyle = '#ffcc00';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#050810';
    ctx.font = 'bold 12px Orbitron, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('G', 0, 1);
  } else if(p.type === 'multi'){
    ctx.fillStyle = '#aa44ff';
    ctx.shadowColor = '#aa44ff';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Orbitron, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×3', 0, 1);
  }
  ctx.restore();
}

function updateHud(){
  document.getElementById('h-level').textContent = level + (hasGun() ? ' 🔫' + gunBullets : '');
  document.getElementById('h-score').textContent = score;
  document.getElementById('h-lives').textContent = lives;
  document.getElementById('h-coins').textContent = Coins ? Coins.formatted() : '0';
}

// ── FLOW ──────────────────────────────────────────────────────────────────────
function startGame(){
  level = 1;
  score = 0;
  lives = 3;
  gunBullets = 0;
  powerups.length = 0;
  bullets.length = 0;
  gameStartTime = performance.now();
  buildLevel(level);
  resetBallsOnPaddle();
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('hint').style.display = '';
  running = true;
  lastT = performance.now();
  flashLevel();
  requestAnimationFrame(loop);
}

function gameOver(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  const reviveCost = 5;
  const canRevive = Coins && Coins.canSpend(reviveCost);
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">GAME OVER</h2>
    <p>Score: <b style="color:#fff">${score}</b></p>
    <p>Level reached: <b style="color:#fff">${level}</b></p>
    <p>Coins: <b style="color:#ffcc00">${Coins ? Coins.formatted() : '0'}</b></p>
    <div class="btn-row">
      ${canRevive ? `<button class="btn warn" onclick="revive(${reviveCost})">REVIVE (${reviveCost}🪙)</button>` : ''}
      <button class="btn" onclick="startGame()">RESTART</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function revive(cost){
  if(!Coins || !Coins.spend(cost)) return;
  lives = 1;
  resetBallsOnPaddle();
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function showPauseMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>PAUSE</h2>
    <p>Score: <b style="color:#fff">${score}</b> · Level: <b style="color:#fff">${level}</b></p>
    <div class="btn-row">
      <button class="btn" onclick="resume()">RESUME</button>
      <button class="btn" onclick="startGame()">RESTART</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function resume(){
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function goBack(){
  if(running && !confirm('Tornare al menu principale?')) return;
  window.location.href = '../';
}

// PWA SW registration
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
