<style>
  html,body{margin:0;padding:0;background:#0a0218;color:#fff;
    font-family:'Share Tech Mono',monospace;overflow:hidden;height:100%;
    -webkit-text-size-adjust:100%;}
  body{touch-action:none;user-select:none;-webkit-user-select:none}

  #game-wrap{position:fixed;inset:0}
  #game{display:block;width:100%;height:100%;touch-action:none;
        image-rendering:pixelated;image-rendering:crisp-edges}

  /* HUD overlays on top of the field; chips with tiny coloured rims so they
     read against any bright mosaic background. */
  #hud{
    position:fixed;top:0;left:0;right:0;padding:8px 56px 8px 60px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    pointer-events:none;z-index:5;
  }
  .hud-item{
    background:#000a a;background:rgba(10,2,24,.72);
    backdrop-filter:blur(4px);
    padding:5px 12px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;min-width:54px;
    border:1px solid #ffffff20;
  }
  .hud-item .label{font-size:9px;letter-spacing:.2em;color:#ffffff99;text-transform:uppercase}
  .hud-item .value{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.2rem;
    line-height:1;margin-top:2px;letter-spacing:.04em;
  }
  .hud-item.pct .value{color:#ffe04a;text-shadow:0 0 10px #ffcc44}
  .hud-item.lives .value{color:#ff6ad6;text-shadow:0 0 10px #ff44aa}
  .hud-item.lvl .value{color:#44ffe6;text-shadow:0 0 10px #44ffcc}

  /* Tiny target marker so the player can read what species they're revealing */
  #target-chip{
    position:fixed;left:50%;top:6px;transform:translateX(-50%);
    background:rgba(10,2,24,.72);border:1px solid #ffffff20;
    padding:4px 14px 4px 8px;border-radius:14px;
    display:flex;align-items:center;gap:8px;z-index:5;
    pointer-events:none;backdrop-filter:blur(4px);
  }
  #target-chip img{width:30px;height:30px;image-rendering:pixelated}
  #target-chip .nm{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.18em;font-size:.7rem;color:#fff}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:rgba(10,2,24,.78);border:1px solid #ff66ddaa;color:#ff66dd;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:rgba(8,2,22,.88);backdrop-filter:blur(6px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center;
  }
  #overlay.show{display:flex}
  /* Reveal mode: only used after a level is completed, so the player can
     actually SEE the mosaic they just unlocked. The full wash is gone, but
     each text/button gets a strong opaque pill so it remains readable
     against the bright mosaic underneath. */
  #overlay.reveal{
    background:transparent;backdrop-filter:none;
    justify-content:flex-end;padding:0 18px 22px;pointer-events:none;gap:10px;
  }
  #overlay.reveal > *{pointer-events:auto}
  #overlay.reveal h2{
    font-size:1.7rem;letter-spacing:.22em;margin:0;
    background:rgba(5,2,16,.95);padding:12px 26px;border-radius:14px;
    border:2px solid #ff66dd;backdrop-filter:blur(10px);
    box-shadow:0 0 32px #ff44aa88, 0 6px 24px rgba(0,0,0,.55);
    color:#ffffff;text-shadow:0 0 10px #ff44aa, 0 0 22px #ff44aa66;
  }
  #overlay.reveal p{
    margin:0;font-size:.98rem;color:#ffffff;
    background:rgba(5,2,16,.94);
    padding:10px 18px;border-radius:10px;backdrop-filter:blur(8px);
    border:2px solid #ffffff44;
    box-shadow:0 0 16px rgba(0,0,0,.5);
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  #overlay.reveal .btn{
    margin-top:6px;padding:14px 30px;font-size:.88rem;
    background:rgba(5,2,16,.94);backdrop-filter:blur(8px);
    box-shadow:0 0 24px #ff44aa88, 0 4px 16px rgba(0,0,0,.5);
  }
  #overlay.reveal .btn.gold{
    background:rgba(5,2,16,.94);
    box-shadow:0 0 24px #ffcc44aa, 0 4px 16px rgba(0,0,0,.5);
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.2rem;
    color:#ff6ad6;letter-spacing:.22em;text-shadow:0 0 28px #ff44aa;margin:0 0 4px 0;
  }
  #overlay p{color:#e6c8f6;font-size:.92rem;letter-spacing:.06em;margin:4px 0;max-width:520px;line-height:1.5}
  .btn{
    margin-top:8px;padding:10px 24px;background:transparent;border:2px solid #ff66dd;
    color:#ff66dd;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #ff44aa44;transition:all .15s;border-radius:6px;
  }
  .btn:hover{background:#ff66dd22;box-shadow:0 0 28px #ff44aa88}
  .btn.gold{border-color:#ffcc44;color:#ffcc44;box-shadow:0 0 18px #ffcc4444}
  .btn.gold:hover{background:#ffcc4422;box-shadow:0 0 28px #ffcc4488}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .hint{color:#c8a4dd;font-size:.78rem;letter-spacing:.06em;margin-top:14px;line-height:1.55}

  /* Species picker tiles on the main menu. */
  .pick-grid{
    display:grid; grid-template-columns:repeat(5, 64px); gap:8px;
    justify-content:center; margin-top:6px;
  }
  .pick-tile{
    width:64px; height:78px; padding:5px; border-radius:10px;
    background:rgba(8,2,22,.55); border:2px solid #ff44aa44;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all .12s;
  }
  .pick-tile:hover{ border-color:#ff66ddaa; }
  .pick-tile.selected{ border-color:#ffcc44; box-shadow:0 0 18px #ffcc44aa; }
  .pick-tile img{ width:44px; height:44px; image-rendering:pixelated; }
  .pick-tile .name{ font-family:Orbitron,sans-serif; font-size:.55rem; letter-spacing:.10em; color:#dfb8ef; margin-top:2px; }
  .pick-tile.selected .name{ color:#ffcc44; }

  /* Hit-flash on life loss. */
  #hurt-fx{position:fixed;inset:0;pointer-events:none;background:#ff44aa00;z-index:8;
           transition:background .25s}
  #hurt-fx.on{background:#ff44aa55}
</style>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// BRUTIMON PANIC — vivid territory-carving arcade. The field starts hidden
// behind a tinted mosaic of brutimon sprites; carving an area reveals the
// mosaic. Enemy brutimon roam the unrevealed area and periodically lob
// projectiles. Win at 75 % revealed.
//
// Original implementation in the area-claim genre (Qix-style is decades old,
// the core mechanic is generic). Visuals use only the user's own brutimon
// roster.
// ─────────────────────────────────────────────────────────────────────────────

// ── CANVAS / LAYOUT ──────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  // Bg rebuild is intentionally NOT triggered here — the initial call runs
  // before the grid constants (GW/GH) are declared, and the draw loop
  // re-checks bg dimensions every frame anyway via rebuildBgIfNeeded(false).
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// ── GRID ─────────────────────────────────────────────────────────────────────
// Grid dimensions track the screen aspect ratio so the field fills the
// available area on both portrait phones and landscape desktops/tablets.
// Total cell count stays roughly constant (~4400) so the gameplay difficulty
// is similar across shapes.
const VOID = 0, CLAIMED = 1, BORDER = 2, TRAIL = 3;
let GW = 80, GH = 52;
let grid = new Uint8Array(GW * GH);
let TOTAL_VOID_AT_START = (GW - 2) * (GH - 2);

function setupGridDimensions(){
  const aspect = Math.max(0.42, Math.min(2.4, (window.innerWidth || 1) / (window.innerHeight || 1)));
  const TARGET = 4400;
  GW = Math.max(28, Math.round(Math.sqrt(TARGET * aspect)));
  GH = Math.max(28, Math.round(Math.sqrt(TARGET / aspect)));
  grid = new Uint8Array(GW * GH);
  TOTAL_VOID_AT_START = (GW - 2) * (GH - 2);
}
setupGridDimensions();

function resetGrid(){
  grid.fill(VOID);
  for(let x = 0; x < GW; x++){ grid[x] = BORDER; grid[(GH - 1) * GW + x] = BORDER; }
  for(let y = 0; y < GH; y++){ grid[y * GW] = BORDER; grid[y * GW + (GW - 1)] = BORDER; }
}

// ── STATE ────────────────────────────────────────────────────────────────────
let level = 1;
let lives = 3;
let claimedCount = 0;
let levelTotalScore = 0;
let running = false;
let phase   = 'menu';
let chosenSpeciesId = localStorage.getItem('panicPick') || null;
let targetSpecies   = null;   // the "main reveal" species shown in the HUD chip

const player = {
  x: 0, y: 0,
  dir: null, drawing: false, trail: [],
  lastTrailIdx: -1, stepAcc: 0,
  flashUntil: 0
};
let enemies = [];      // { x, y, vx, vy, speciesId, stage, size, shootAt }
let bullets = [];      // { x, y, vx, vy, hue, age }
let particles = [];    // { x, y, vx, vy, life, age, hue, kind }

const INPUT = { dir: null };

const PLAYER_STEPS_PER_SEC = 24;
const ENEMY_BASE_SPEED     = 7;     // cells/sec
const BULLET_SPEED         = 12;
const BULLET_LIFE          = 2.4;

// ── ASSETS ───────────────────────────────────────────────────────────────────
let speciesList = [];          // [{id, name, ...}]
async function preloadSpecies(){
  try {
    const reg = await Brutimon.registry();
    speciesList = (reg.species || []);
    if(!chosenSpeciesId && speciesList.length) chosenSpeciesId = speciesList[0].id;
    // Warm every stage image we'll use for player / enemies / mosaic.
    for(const sp of speciesList){
      for(let st = 1; st <= 5; st++){ Brutimon.image(sp.id, st); }
    }
  } catch(e){ /* the renderer falls back to gradients */ }
}
function imgReady(im){ return im && im.complete && im.naturalWidth > 0; }

// ── BACKGROUND MOSAIC ────────────────────────────────────────────────────────
// Pre-rendered offscreen canvas: bright rainbow gradient overlaid with a
// staggered mosaic of brutimon sprites at varied scales/rotations. This is
// what's revealed when the player claims a region — much chunkier and more
// colourful than a single big sprite.
let bgCanvas = null;
let bgFor    = { w: 0, h: 0, sig: '' };

function buildBackground(){
  const fr = computeFieldRect();
  if(fr.w <= 0 || fr.h <= 0) return;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = fr.w; bgCanvas.height = fr.h;
  const g = bgCanvas.getContext('2d');

  // Vivid diagonal rainbow band — different per level so each reveal looks
  // distinct even when the same species turn up in the mosaic.
  const hueShift = (level * 47) % 360;
  const grd = g.createLinearGradient(0, 0, fr.w, fr.h);
  grd.addColorStop(0,    `hsl(${(hueShift +   0) % 360}, 95%, 55%)`);
  grd.addColorStop(0.33, `hsl(${(hueShift +  70) % 360}, 95%, 55%)`);
  grd.addColorStop(0.66, `hsl(${(hueShift + 180) % 360}, 95%, 55%)`);
  grd.addColorStop(1,    `hsl(${(hueShift + 270) % 360}, 95%, 55%)`);
  g.fillStyle = grd; g.fillRect(0, 0, fr.w, fr.h);

  // Soft white veil so the sprites pop against the gradient.
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.fillRect(0, 0, fr.w, fr.h);

  // Staggered brutimon mosaic. Each row is shifted half a tile so it reads
  // as a honeycomb rather than a uniform grid.
  if(speciesList.length){
    const SIZE    = Math.max(72, Math.min(fr.w, fr.h) * 0.18);
    const STEP_X  = SIZE * 0.92;
    const STEP_Y  = SIZE * 0.78;
    let idx = 0;
    g.imageSmoothingEnabled = false;
    for(let row = 0, py = -SIZE * 0.4; py < fr.h + SIZE; row++, py += STEP_Y){
      const offset = (row % 2) ? STEP_X * 0.5 : 0;
      for(let px = -SIZE + offset; px < fr.w + SIZE; px += STEP_X){
        const sp    = speciesList[idx % speciesList.length];
        const stage = ((idx * 3 + row * 2) % 5) + 1;
        const im    = Brutimon.image(sp.id, stage);
        idx++;
        if(!imgReady(im)) continue;
        const rot   = ((idx * 0.37) % 2 - 1) * 0.22;       // ±0.22 rad
        const scale = 0.85 + ((idx * 13) % 10) / 30;       // 0.85–1.18
        const sz    = SIZE * scale;
        g.save();
        g.translate(px + SIZE / 2, py + SIZE / 2);
        g.rotate(rot);
        g.globalAlpha = 0.88;
        g.drawImage(im, -sz / 2, -sz / 2, sz, sz);
        g.restore();
      }
    }
  }
  bgFor = { w: fr.w, h: fr.h, sig: level + ':' + speciesList.length };
}
function rebuildBgIfNeeded(force){
  const fr = computeFieldRect();
  const sig = level + ':' + speciesList.length;
  if(force || !bgCanvas || bgFor.w !== fr.w || bgFor.h !== fr.h || bgFor.sig !== sig){
    buildBackground();
  }
}

// ── LAYOUT ───────────────────────────────────────────────────────────────────
function computeFieldRect(){
  // Fullscreen: only leave a thin strip top (HUD overlay) and bottom (so the
  // joystick has clear pixels for thumb feedback). Aspect ratio of the grid
  // is honoured so cells stay square — and the grid itself is reshaped to
  // match the screen aspect in setupGridDimensions(), so the field nearly
  // always fills the available space with at most a hairline of letterbox.
  const padTop = 46, padBot = 16, padX = 4;
  const availW = W - padX * 2;
  const availH = H - padTop - padBot;
  const cs = Math.max(2, Math.floor(Math.min(availW / GW, availH / GH)));
  const w = cs * GW, h = cs * GH;
  return { x: Math.floor((W - w) / 2), y: padTop + Math.floor((availH - h) / 2), w, h, cs };
}

// ── ENEMIES & SPAWN ──────────────────────────────────────────────────────────
function spawnEnemies(){
  enemies = [];
  if(!speciesList.length) return;
  const targetIdx = speciesList.findIndex(s => s.id === (targetSpecies && targetSpecies.id));
  const others = speciesList.filter((s, i) => i !== targetIdx);
  const pool   = others.length ? others : speciesList;
  const n      = Math.min(6, 1 + Math.floor((level - 1) / 1.4));
  const sp     = ENEMY_BASE_SPEED + (level - 1) * 0.7;
  for(let i = 0; i < n; i++){
    const ang   = Math.random() * Math.PI * 2;
    const spec  = pool[Math.floor(Math.random() * pool.length)];
    const stage = 1 + Math.floor(Math.random() * 5);
    enemies.push({
      x: GW / 2 + (Math.random() - 0.5) * GW * 0.5,
      y: GH / 2 + (Math.random() - 0.5) * GH * 0.5,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      speciesId: spec.id,
      stage,
      size: 2.4 + Math.random() * 0.8,                   // in grid cells
      shootAt: performance.now() + 1500 + Math.random() * 3500
    });
  }
  bullets = [];
}

function pickTargetSpecies(){
  if(!speciesList.length){ targetSpecies = null; return; }
  // Slight bias toward the chosen species (player's pick) so the menu choice
  // sometimes carries into the level reveal.
  if(chosenSpeciesId && Math.random() < 0.35){
    targetSpecies = speciesList.find(s => s.id === chosenSpeciesId) || speciesList[0];
  } else {
    targetSpecies = speciesList[Math.floor(Math.random() * speciesList.length)];
  }
  const chip = document.getElementById('target-chip');
  const stage = Math.max(1, Math.min(5, 1 + Math.floor((level - 1) / 2)));
  const img = Brutimon.image(targetSpecies.id, stage);
  if(img){ document.getElementById('target-img').src = img.src; }
  document.getElementById('target-name').textContent = targetSpecies.name || targetSpecies.id;
  chip.style.display = 'flex';
}

function resetForLevel(){
  // Recompute grid shape every level — handles rotation between runs and
  // gives portrait phones their tall pitch / landscape phones their wide one.
  setupGridDimensions();
  resetGrid();
  claimedCount = 0;
  player.x = 0; player.y = 0;
  player.dir = null;
  player.drawing = false;
  player.trail = [];
  player.lastTrailIdx = -1;
  player.stepAcc = 0;
  INPUT.dir = null;
  spawnEnemies();
  rebuildBgIfNeeded(true);
  updateHud();
}

// ── PLAYER STEP ──────────────────────────────────────────────────────────────
function dirVec(d){
  if(d === 'left')  return { x: -1, y:  0 };
  if(d === 'right') return { x:  1, y:  0 };
  if(d === 'up')    return { x:  0, y: -1 };
  if(d === 'down')  return { x:  0, y:  1 };
  return { x: 0, y: 0 };
}

function takeStep(){
  const d = INPUT.dir || player.dir;
  if(!d) return;
  const v = dirVec(d);
  if(v.x === 0 && v.y === 0) return;
  const nx = player.x + v.x;
  const ny = player.y + v.y;
  if(nx < 0 || ny < 0 || nx >= GW || ny >= GH) return;
  const idx = ny * GW + nx;
  const cell = grid[idx];

  if(player.drawing){
    if(cell === TRAIL){
      if(idx === player.lastTrailIdx) return;   // pulled-back step on last cell
      onLoseLife();
      return;
    }
    if(cell === CLAIMED || cell === BORDER){
      player.trail.push(idx); grid[idx] = TRAIL;
      player.x = nx; player.y = ny;
      closeTrail();
      return;
    }
    if(cell === VOID){
      grid[idx] = TRAIL;
      player.trail.push(idx); player.lastTrailIdx = idx;
      player.x = nx; player.y = ny;
      return;
    }
  } else {
    if(cell === VOID){
      grid[idx] = TRAIL;
      player.trail = [idx]; player.lastTrailIdx = idx;
      player.drawing = true;
      player.x = nx; player.y = ny;
      return;
    }
    if(cell === BORDER || cell === CLAIMED){
      player.x = nx; player.y = ny;
      return;
    }
  }
}

function updatePlayer(dt){
  // Gamepad: if a pad is reporting and the left stick / d-pad is moved,
  // map it to the equivalent cardinal direction (panic carves straight
  // lines, so no diagonals).
  const gp = window.GamepadInput && window.GamepadInput.state();
  if(gp && (gp.dir.x || gp.dir.y)){
    if(Math.abs(gp.stickL.x) > Math.abs(gp.stickL.y)){
      INPUT.dir = gp.stickL.x > 0 ? 'right' : 'left';
    } else if(Math.abs(gp.stickL.y) > 0.05){
      INPUT.dir = gp.stickL.y > 0 ? 'down' : 'up';
    } else if(gp.dir.x !== 0){
      INPUT.dir = gp.dir.x > 0 ? 'right' : 'left';
    } else {
      INPUT.dir = gp.dir.y > 0 ? 'down' : 'up';
    }
  }
  if(!INPUT.dir) return;
  player.dir = INPUT.dir;
  player.stepAcc += dt;
  const interval = 1 / PLAYER_STEPS_PER_SEC;
  let safety = 8;
  while(player.stepAcc >= interval && safety-- > 0){
    player.stepAcc -= interval;
    takeStep();
    if(phase !== 'playing') return;
  }
}

// ── CLOSE TRAIL: claim enemy-free regions ────────────────────────────────────
function closeTrail(){
  const enemyCells = new Set();
  for(const e of enemies){
    const ex = Math.round(e.x), ey = Math.round(e.y);
    if(ex >= 0 && ex < GW && ey >= 0 && ey < GH) enemyCells.add(ey * GW + ex);
  }
  const visited = new Uint8Array(GW * GH);
  let gained = 0;
  const claimedRegions = [];
  for(let y = 1; y < GH - 1; y++){
    for(let x = 1; x < GW - 1; x++){
      const start = y * GW + x;
      if(grid[start] !== VOID || visited[start]) continue;
      const stack = [start]; visited[start] = 1;
      const cells = []; let hasEnemy = false;
      while(stack.length){
        const i = stack.pop(); cells.push(i);
        if(enemyCells.has(i)) hasEnemy = true;
        const cx = i % GW, cy = (i - cx) / GW;
        const neigh = [
          cx > 0 ? i - 1 : -1, cx < GW - 1 ? i + 1 : -1,
          cy > 0 ? i - GW : -1, cy < GH - 1 ? i + GW : -1
        ];
        for(const ni of neigh){
          if(ni < 0 || visited[ni] || grid[ni] !== VOID) continue;
          visited[ni] = 1; stack.push(ni);
        }
      }
      if(!hasEnemy){
        for(const i of cells) grid[i] = CLAIMED;
        gained += cells.length;
        claimedRegions.push(cells);
      }
    }
  }
  for(const i of player.trail){ if(grid[i] === TRAIL){ grid[i] = CLAIMED; gained++; } }
  player.trail = []; player.drawing = false; player.lastTrailIdx = -1;
  claimedCount += gained;

  // Sparkle particles around each newly claimed region's centroid for feel.
  for(const cells of claimedRegions){
    if(!cells.length) continue;
    let sx = 0, sy = 0;
    for(const i of cells){ sx += i % GW; sy += (i - i % GW) / GW; }
    const cx = sx / cells.length, cy = sy / cells.length;
    spawnSparkles(cx, cy, 18 + Math.min(40, Math.floor(cells.length / 20)));
  }
  const pct = claimedCount / TOTAL_VOID_AT_START;
  updateHud();
  Sfx.claim(gained / TOTAL_VOID_AT_START);
  if(pct >= 0.75){ onLevelComplete(pct); }
}

// ── ENEMIES ──────────────────────────────────────────────────────────────────
function updateEnemies(dt){
  const now = performance.now();
  for(const e of enemies){
    // X axis
    let nx = e.x + e.vx * dt;
    const ix = Math.round(nx), iy = Math.round(e.y);
    if(ix < 1 || ix >= GW - 1 || blocking(grid[iy * GW + ix])){
      e.vx = -e.vx; nx = e.x;
    }
    // Y axis
    let ny = e.y + e.vy * dt;
    const ix2 = Math.round(nx), iy2 = Math.round(ny);
    if(iy2 < 1 || iy2 >= GH - 1 || blocking(grid[iy2 * GW + ix2])){
      e.vy = -e.vy; ny = e.y;
    }
    const finalIdx = Math.round(ny) * GW + Math.round(nx);
    if(grid[finalIdx] === TRAIL){
      onLoseLife();
      return;
    }
    e.x = nx; e.y = ny;

    // Shoot every shootAt ms — slow projectile aimed at the player.
    if(now >= e.shootAt){
      fireBullet(e);
      e.shootAt = now + 3500 + Math.random() * 3500;
    }
  }
}
function blocking(cell){ return cell === CLAIMED || cell === BORDER; }

function fireBullet(e){
  const dx = player.x - e.x, dy = player.y - e.y;
  const d  = Math.hypot(dx, dy) || 1;
  // Slight inaccuracy so they're dodgeable.
  const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.35;
  bullets.push({
    x: e.x, y: e.y,
    vx: Math.cos(ang) * BULLET_SPEED,
    vy: Math.sin(ang) * BULLET_SPEED,
    hue: Math.floor(Math.random() * 360),
    age: 0
  });
  Sfx.shoot();
}
function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.age += dt;
    if(b.age > BULLET_LIFE){ bullets.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    // Out of grid?
    if(b.x < 0 || b.y < 0 || b.x >= GW || b.y >= GH){ bullets.splice(i, 1); continue; }
    const idx = Math.round(b.y) * GW + Math.round(b.x);
    const cell = grid[idx];
    // Bullets stopped by claimed area / border (so safe zones really are safe).
    if(cell === CLAIMED || cell === BORDER){ bullets.splice(i, 1); continue; }
    // Trail hit by bullet — same as enemy touching it: -1 life.
    if(cell === TRAIL){ onLoseLife(); return; }
    // Player hit?
    const px = player.x, py = player.y;
    if(Math.hypot(b.x - px, b.y - py) < 1.2){
      bullets.splice(i, 1);
      onLoseLife();
      return;
    }
  }
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
function spawnSparkles(gx, gy, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 6 + Math.random() * 14;
    particles.push({
      x: gx, y: gy,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.7 + Math.random() * 0.6, age: 0,
      hue: Math.floor(Math.random() * 360),
      kind: 'sparkle'
    });
  }
}
function spawnHit(gx, gy){
  for(let i = 0; i < 26; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 8 + Math.random() * 22;
    particles.push({
      x: gx, y: gy,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.55 + Math.random() * 0.35, age: 0,
      hue: Math.floor(Math.random() * 60) + 330,    // red/pink
      kind: 'hit'
    });
  }
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;
    if(p.age >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 1.2); p.vy *= (1 - dt * 1.2);
  }
}

// ── LIFE / FLOW ──────────────────────────────────────────────────────────────
function onLoseLife(){
  spawnHit(player.x, player.y);
  for(const i of player.trail){ if(grid[i] === TRAIL) grid[i] = VOID; }
  player.trail = []; player.drawing = false; player.lastTrailIdx = -1;
  player.x = 0; player.y = 0; player.dir = null; INPUT.dir = null;
  player.flashUntil = performance.now() + 700;
  lives--;
  Sfx.hit();
  flashHurt();
  updateHud();
  if(lives <= 0) onGameOver();
}
function flashHurt(){
  const fx = document.getElementById('hurt-fx');
  fx.classList.add('on');
  setTimeout(() => fx.classList.remove('on'), 220);
}

function onLevelComplete(pct){
  phase = 'levelend';
  // Force every still-VOID interior cell to CLAIMED so the entire mosaic
  // is revealed for the celebration — the player only had to hit 75 % to
  // win, but they earned the view of the whole thing.
  for(let y = 1; y < GH - 1; y++){
    for(let x = 1; x < GW - 1; x++){
      const i = y * GW + x;
      if(grid[i] === VOID || grid[i] === TRAIL) grid[i] = CLAIMED;
    }
  }
  draw();
  running = false;
  Sfx.win();
  const pctRound = Math.round(pct * 100);
  const overFifteen = Math.max(0, pctRound - 75);
  const reward = 6 + Math.floor(overFifteen * 0.5);
  if(window.Coins) Coins.add(reward, 'panic-lv-' + level);
  levelTotalScore += reward;
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2>LIVELLO ${level} COMPLETATO</h2>
    <p>Rivelato <b style="color:#ffe04a">${pctRound}%</b> · +${reward}🪙</p>
    <div class="btn-row">
      <button class="btn gold" onclick="nextLevel()">PROSSIMO ▶</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
    </div>
  `;
  ol.classList.remove('reveal');
  ol.classList.add('show', 'reveal');
}

function onGameOver(){
  phase = 'lost';
  running = false;
  Sfx.lose();
  document.getElementById('target-chip').style.display = 'none';
  const pct = Math.round(claimedCount / TOTAL_VOID_AT_START * 100);
  const score = (level - 1) * 100 + pct;
  if(window.CloudSync) CloudSync.recordScore(null, score);
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">GAME OVER</h2>
    <p>Livello raggiunto: <b>${level}</b></p>
    <p>Ultima reveal: <b style="color:#ffe04a">${pct}%</b></p>
    <p>+${levelTotalScore}🪙 totali</p>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">RIPROVA</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
  ol.classList.remove('reveal');
  ol.classList.add('show');
}

async function startGame(){
  Sfx.ensure();
  level = 1; lives = 3; levelTotalScore = 0;
  phase = 'playing';
  if(!speciesList.length) await preloadSpecies();
  pickTargetSpecies();
  resetForLevel();
  hideOverlay();
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
async function nextLevel(){
  level++;
  pickTargetSpecies();
  resetForLevel();
  hideOverlay();
  phase = 'playing';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function hideOverlay(){
  const ol = document.getElementById('overlay');
  ol.classList.remove('show');
  ol.classList.remove('reveal');
}
function goBack(){ window.location.href = '../'; }
window.startGame = startGame;
window.nextLevel = nextLevel;
window.goBack    = goBack;

function updateHud(){
  const pct = Math.round(claimedCount / TOTAL_VOID_AT_START * 100);
  document.getElementById('h-pct').textContent   = pct + '%';
  document.getElementById('h-lives').textContent = Math.max(0, lives);
  document.getElementById('h-level').textContent = level;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#0a0218';
  ctx.fillRect(0, 0, W, H);

  rebuildBgIfNeeded(false);
  const r = computeFieldRect();

  // 1) Background mosaic (or fallback gradient).
  if(bgCanvas){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bgCanvas, r.x, r.y, r.w, r.h);
  } else {
    const t = performance.now() * 0.0006;
    const g = ctx.createLinearGradient(r.x, r.y, r.x + r.w, r.y + r.h);
    g.addColorStop(0, `hsl(${280 + Math.sin(t) * 30},85%,50%)`);
    g.addColorStop(1, `hsl(${ 40 + Math.cos(t) * 30},85%,55%)`);
    ctx.fillStyle = g; ctx.fillRect(r.x, r.y, r.w, r.h);
  }

  // 2) Void cells — translucent dark wash that occludes the mosaic until
  //    claimed. Animated diagonal stripes inside the wash so unclaimed area
  //    feels alive instead of static black.
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();
  // Fill voids with a base wash
  ctx.fillStyle = 'rgba(8,4,28,0.88)';
  for(let y = 0; y < GH; y++){
    let runStart = -1;
    for(let x = 0; x <= GW; x++){
      const cell = x < GW ? grid[y * GW + x] : -1;
      if(cell === VOID){ if(runStart < 0) runStart = x; }
      else if(runStart >= 0){
        ctx.fillRect(r.x + runStart * r.cs, r.y + y * r.cs, (x - runStart) * r.cs, r.cs);
        runStart = -1;
      }
    }
  }
  // Diagonal stripes drifting across the void wash
  const stripeT = (performance.now() * 0.07) % 18;
  ctx.fillStyle = 'rgba(255,160,240,0.07)';
  for(let s = -r.h; s < r.w + r.h; s += 18){
    const xx = s + stripeT;
    ctx.save();
    ctx.translate(r.x + xx, r.y);
    ctx.transform(1, 0, -0.6, 1, 0, 0);
    ctx.fillRect(0, 0, 4, r.h);
    ctx.restore();
  }
  ctx.restore();

  // 3) Border — pulsing rainbow.
  const borderHue = (performance.now() * 0.08) % 360;
  ctx.fillStyle = `hsl(${borderHue}, 95%, 65%)`;
  ctx.shadowColor = `hsl(${(borderHue + 60) % 360}, 100%, 70%)`;
  ctx.shadowBlur = 6;
  for(let y = 0; y < GH; y++){
    for(let x = 0; x < GW; x++){
      if(grid[y * GW + x] === BORDER){
        ctx.fillRect(r.x + x * r.cs, r.y + y * r.cs, r.cs, r.cs);
      }
    }
  }
  ctx.shadowBlur = 0;

  // 4) Trail (in progress) — bright yellow with pulse glow.
  if(player.trail.length){
    const tpulse = 0.7 + 0.3 * Math.sin(performance.now() * 0.012);
    ctx.fillStyle = `rgba(255,224,80,${tpulse})`;
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 10;
    for(const i of player.trail){
      const tx = i % GW, ty = (i - tx) / GW;
      ctx.fillRect(r.x + tx * r.cs, r.y + ty * r.cs, r.cs, r.cs);
    }
    ctx.shadowBlur = 0;
  }

  // While the level-end reveal is up we skip the in-game sprites (enemies,
  // bullets, player) so the mosaic the user just unlocked is unobstructed.
  // Particles + border stay because they're decorative and they frame, not
  // cover, the reveal.
  const showDynamic = phase === 'playing';

  if(showDynamic){
  // 5) Enemies — actual brutimon sprites with a soft glow ring.
  for(const e of enemies){
    const cx = r.x + e.x * r.cs + r.cs / 2;
    const cy = r.y + e.y * r.cs + r.cs / 2;
    const sz = r.cs * e.size * 1.6;
    const im = Brutimon.image(e.speciesId, e.stage);
    // Glow halo behind sprite
    ctx.save();
    ctx.fillStyle = 'rgba(255,80,200,0.32)';
    ctx.shadowColor = '#ff44aa'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(cx, cy, sz * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if(imgReady(im)){
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(im, cx - sz / 2, cy - sz / 2, sz, sz);
    } else {
      ctx.fillStyle = '#ff44aa';
      ctx.beginPath(); ctx.arc(cx, cy, sz * 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 6) Bullets — small glowing dots with stretched trail.
  for(const b of bullets){
    const cx = r.x + b.x * r.cs + r.cs / 2;
    const cy = r.y + b.y * r.cs + r.cs / 2;
    const speed = Math.hypot(b.vx, b.vy) || 1;
    const tx = -(b.vx / speed) * r.cs * 1.6;
    const ty = -(b.vy / speed) * r.cs * 1.6;
    const trailGrad = ctx.createLinearGradient(cx, cy, cx + tx, cy + ty);
    trailGrad.addColorStop(0, `hsl(${b.hue},100%,70%)`);
    trailGrad.addColorStop(1, `hsla(${b.hue},100%,60%,0)`);
    ctx.strokeStyle = trailGrad; ctx.lineWidth = Math.max(2, r.cs * 0.7); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + tx, cy + ty); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = `hsl(${b.hue},100%,70%)`; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(2, r.cs * 0.45), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 7) Particles.
  for(const p of particles){
    const cx = r.x + p.x * r.cs + r.cs / 2;
    const cy = r.y + p.y * r.cs + r.cs / 2;
    const a  = Math.max(0, 1 - p.age / p.life);
    if(p.kind === 'sparkle'){
      ctx.fillStyle = `hsla(${p.hue},100%,70%,${a})`;
      ctx.shadowColor = `hsl(${p.hue},100%,80%)`; ctx.shadowBlur = 8;
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = `hsla(${p.hue},100%,65%,${a})`;
      ctx.beginPath(); ctx.arc(cx, cy, 3 * a + 1, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 8) Player — chosen brutimon sprite with a flashing ring while invulnerable
  //    (right after a life loss) and a forward arrow showing current dir.
  if(speciesList.length){
    const cx = r.x + player.x * r.cs + r.cs / 2;
    const cy = r.y + player.y * r.cs + r.cs / 2;
    const sz = r.cs * 3.2;
    const now = performance.now();
    const inv = now < player.flashUntil;
    // Bright pulsing ring
    const pulse = 0.6 + 0.4 * Math.sin(now * 0.012);
    ctx.save();
    ctx.strokeStyle = inv ? `rgba(255,255,255,${pulse})` : `rgba(255,224,80,${pulse})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(cx, cy, sz * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    const im = Brutimon.image(chosenSpeciesId, 3);
    if(imgReady(im)){
      ctx.imageSmoothingEnabled = false;
      if(!inv || Math.floor(now / 80) % 2 === 0){
        ctx.drawImage(im, cx - sz / 2, cy - sz / 2, sz, sz);
      }
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - sz / 2, cy - sz / 2, sz, sz);
    }
    // Direction arrow
    if(player.dir){
      const v = dirVec(player.dir);
      const ax = cx + v.x * sz * 0.5;
      const ay = cy + v.y * sz * 0.5;
      ctx.fillStyle = '#ffe04a';
      ctx.beginPath();
      ctx.arc(ax, ay, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  }  // end if(showDynamic)
}

// ── INPUT ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  const k = e.key;
  if(k === 'ArrowUp'    || k === 'w' || k === 'W'){ INPUT.dir = 'up';    e.preventDefault(); }
  if(k === 'ArrowDown'  || k === 's' || k === 'S'){ INPUT.dir = 'down';  e.preventDefault(); }
  if(k === 'ArrowLeft'  || k === 'a' || k === 'A'){ INPUT.dir = 'left';  e.preventDefault(); }
  if(k === 'ArrowRight' || k === 'd' || k === 'D'){ INPUT.dir = 'right'; e.preventDefault(); }
});

// Virtual joystick — shared module. Snaps to cardinal direction; on release
// the player keeps walking in the last direction (sticky), so a flick is
// enough to send the cursor along a wall.
if(window.TouchDpad){
  TouchDpad.attach({
    canvas,
    onDirection: ({x, y}) => {
      if(x ===  1) INPUT.dir = 'right';
      else if(x === -1) INPUT.dir = 'left';
      else if(y ===  1) INPUT.dir = 'down';
      else if(y === -1) INPUT.dir = 'up';
    }
  });
}

// ── AUDIO ────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let actx = null, master = null;
  let on = localStorage.getItem('panicAudio') !== 'false';
  function ensure(){
    if(actx) return actx;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
    master = actx.createGain(); master.gain.value = on ? 0.5 : 0;
    master.connect(actx.destination);
    return actx;
  }
  function tone({freq=440, dur=0.1, type='square', vol=0.3, sweep=0}){
    if(!on || !ensure()) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.04);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    ensure,
    claim(pct){
      const n = Math.min(6, Math.max(2, Math.round(pct * 12)));
      for(let i = 0; i < n; i++) setTimeout(() => tone({freq:440 + i*80, dur:0.07, vol:0.16}), i * 50);
    },
    hit(){ tone({freq:160, dur:0.18, type:'sawtooth', vol:0.25, sweep:-80}); },
    shoot(){ tone({freq:680, dur:0.06, type:'square', vol:0.10, sweep:-300}); },
    win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.16, vol:0.22}), i * 130)); },
    lose(){ [523, 440, 349, 261].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.28, type:'sawtooth', vol:0.24, sweep:-30}), i * 220)); },
  };
})();

// ── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts){
  if(!running){ return; }
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  if(phase === 'playing'){
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateParticles(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

// ── MAIN MENU ────────────────────────────────────────────────────────────────
async function showMainMenu(){
  phase = 'menu';
  await preloadSpecies();
  document.getElementById('target-chip').style.display = 'none';
  const picksHtml = speciesList.map(s => `
    <div class="pick-tile${s.id === chosenSpeciesId ? ' selected' : ''}" data-id="${s.id}">
      <img src="${Brutimon.BASE}/${s.id}/${s.id}_3.png"/>
      <div class="name">${(s.name || s.id).toUpperCase()}</div>
    </div>
  `).join('');
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2>BRUTIMON PANIC</h2>
    <p>Esci dal bordo per disegnare un tratto e <b style="color:#ffe04a">rivelare il mosaico</b>. Torna al bordo per chiudere la regione che non contiene nemici.</p>
    <p>I brutimon nemici rimbalzano nello spazio buio e <b style="color:#ff66dd">sparano proiettili</b> — schivali e non farli toccare il tratto giallo!</p>
    <p style="color:#ffcc44">Scegli il tuo brutimon:</p>
    <div class="pick-grid">${picksHtml}</div>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
    </div>
    <div class="hint">
      Mobile: <b>tocca lo schermo</b> per far comparire il joystick · Desktop: <b>frecce</b> o <b>WASD</b>.
    </div>
  `;
  ol.classList.remove('reveal');
  ol.classList.add('show');
  ol.querySelectorAll('.pick-tile').forEach(t => {
    t.addEventListener('click', () => {
      chosenSpeciesId = t.dataset.id;
      localStorage.setItem('panicPick', chosenSpeciesId);
      ol.querySelectorAll('.pick-tile').forEach(x => x.classList.toggle('selected', x === t));
    });
  });
}

resetGrid();
showMainMenu();
// Keep drawing while in the menu so the mosaic shimmers behind the panel.
requestAnimationFrame(function bootDraw(){
  draw();
  if(phase !== 'playing') requestAnimationFrame(bootDraw);
});
