<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>BRUTIMON RUSH</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff44aa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#1a0a2a;color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100%}
  body{touch-action:none;user-select:none;-webkit-user-select:none}
  #game-wrap{position:fixed;inset:0}
  #game{display:block;width:100%;height:100%;background:#1a0a2a;touch-action:none}

  #hud{
    /* padding makes room for back ✖ (left, 42px wide) and fullscreen ⛶ (right, 36px wide)
       so HUD values are never hidden behind the corner buttons. */
    position:fixed;top:0;left:0;right:0;padding:8px 56px 6px 60px;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to bottom,#000a1add,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center;min-width:50px}
  .hud-item .label{font-size:10px;letter-spacing:.22em;color:#e0a0ff99;text-transform:uppercase;font-family:'Orbitron',sans-serif}
  .hud-item .value{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.4rem;color:#ff44aa;
    text-shadow:0 0 12px #ff44aa;letter-spacing:.06em;line-height:1;margin-top:2px;
  }
  .hud-item.hp .value{color:#ff6666}
  .hud-item.lvl .value{color:#ffcc44}
  .hud-item.kills .value{color:#44ffcc}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#1a0a2acc;border:1px solid #ff44aaaa;color:#ff44aa;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#1a0a2acc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;overflow-y:auto;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2rem;
    color:#ff44aa;letter-spacing:.18em;text-shadow:0 0 26px #ff44aa;margin:6px 0;
  }
  #overlay h3{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.1rem;
    color:#ffcc44;letter-spacing:.14em;margin:6px 0;
  }
  #overlay p{color:#dfb8ef;font-size:.95rem;margin:4px 0}
  #overlay .hint{color:#bb88cc;font-size:.78rem;margin-top:10px;line-height:1.5;max-width:380px}
  #overlay .hint b{color:#ffcc44}
  .btn{
    margin-top:10px;padding:10px 22px;background:transparent;border:2px solid #ff44aa;
    color:#ff44aa;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.8rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #ff44aa44;
  }
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}

  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:16px;max-width:680px}
  .card{
    background:linear-gradient(160deg,#2a1240,#1a0a2a);
    border:2px solid #ff44aa66;border-radius:10px;
    padding:16px 14px;width:180px;cursor:pointer;
    box-shadow:0 0 20px #ff44aa33;transition:all .15s;
  }
  .card:hover{border-color:#ff44aa;transform:translateY(-3px);box-shadow:0 0 28px #ff44aa66}
  .card .ic{font-size:2rem;line-height:1;margin-bottom:6px}
  .card .nm{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.1em;color:#ffcc44}
  .card .ds{color:#dfb8ef;font-size:.72rem;margin-top:6px;line-height:1.35}
  .card.rare{border-color:#44ffcc66;box-shadow:0 0 22px #44ffcc44}
  .card.rare .nm{color:#44ffcc}
  .card.epic{border-color:#ffcc44cc;box-shadow:0 0 30px #ffcc4488}
  .card.epic .nm{color:#ff8844}

  #stats{
    position:fixed;left:8px;bottom:8px;
    background:#1a0a2acc;border:1px solid #ff44aa44;border-radius:6px;
    padding:6px 10px;font-size:.7rem;color:#dfb8ef;letter-spacing:.05em;
    pointer-events:none;z-index:5;line-height:1.5;
  }
  #stats b{color:#ffcc44}
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div class="hud-item lvl"><span class="label">Stanza</span><span class="value" id="h-lvl">1</span></div>
  <div class="hud-item kills"><span class="label">Nemici</span><span class="value" id="h-kills">0/0</span></div>
  <div class="hud-item hp"><span class="label">HP</span><span class="value" id="h-hp">3</span></div>
</div>

<button id="back-btn" onclick="window.location.href='../'">✖</button>

<div id="stats">
  DMG <b id="s-dmg">1</b> · RATE <b id="s-rate">1.0</b> · VEL <b id="s-spd">1.0</b><br>
  MULTI <b id="s-multi">1</b> · PIERCE <b id="s-pierce">0</b> · BOUNCE <b id="s-bounce">0</b>
</div>

<div id="overlay"></div>

<script src="../shared/profile.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/coins.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// World coordinates = screen pixels. The arena fills the viewport with a
// HUD margin at the top and a stats strip at the bottom kept clear.
let WORLD_W = W, WORLD_H = H;
const ARENA_TOP = 56;     // px reserved for HUD at top
const ARENA_BOT = 36;     // px reserved for stats at bottom
function recomputeWorld(){ WORLD_W = W; WORLD_H = H; }
function s(){ return 1; }
function w2s(wx, wy){ return { x: wx, y: wy, s: 1 }; }
function s2w(sx, sy){ return { x: sx, y: sy }; }
recomputeWorld();
window.addEventListener('resize', recomputeWorld);
window.addEventListener('orientationchange', () => setTimeout(recomputeWorld, 100));

// ── Assets ──────────────────────────────────────────────────────────────────
// The player picks a Brutimon species; we always render that species at
// stage 1 (cucciolo) since you "stay small" during the run. Enemies come
// from the shared Brutimon roster — stage 1-4 by weighted rarity, stage 5
// reserved for boss waves.
let PLAYER_SPECIES_LIST = [];     // populated when registry resolves
const imgs = {};                  // legacy: only 'grass' tile now
{
  const grass = new Image();
  grass.src = '../neon-defender/assets/skin-pokemon/grass.png';
  imgs.grass = grass;
}
function ready(im){ return im && im.complete && im.naturalWidth > 0; }
// Kick off the registry + asset preload immediately; the picker fills in
// once the species list is in hand.
Brutimon.registry().then(reg => {
  PLAYER_SPECIES_LIST = reg.species || [];
  Brutimon.preloadAll();
}).catch(() => {});

// ── SFX ─────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let ac = null, master = null, on = true;
  function ensure(){
    if(ac) return ac;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
    master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
    return ac;
  }
  function tone({freq=440, dur=0.08, type='sine', vol=0.18, sweep=0}){
    if(!on || !ensure()) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.04);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise({dur=0.08, vol=0.2, lp=4000, hp=200}){
    if(!on || !ensure()) return;
    const t0 = ac.currentTime;
    const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    const ch = buf.getChannelData(0);
    for(let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f1 = ac.createBiquadFilter(); f1.type='highpass'; f1.frequency.value = hp;
    const f2 = ac.createBiquadFilter(); f2.type='lowpass';  f2.frequency.value = lp;
    const g  = ac.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f1); f1.connect(f2); f2.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur);
  }
  function silenceAll(){ if(master) master.gain.value = 0; }
  function unmute(){ if(master) master.gain.value = 0.55; }
  function shot(){ tone({freq:880, dur:0.05, type:'square', vol:0.14}); }
  function hit(){  tone({freq:200, dur:0.12, type:'sawtooth', vol:0.22, sweep:-100}); }
  function kill(){ noise({dur:0.18, vol:0.22, hp:300}); tone({freq:520, dur:0.10, type:'square', vol:0.18, sweep:-200}); }
  function hurt(){ tone({freq:140, dur:0.30, type:'sawtooth', vol:0.30, sweep:-60}); noise({dur:0.15, vol:0.22}); }
  function levelup(){
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.10, type:'square', vol:0.20}), i * 90));
  }
  function over(){
    [523, 440, 349, 262].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.30, type:'sawtooth', vol:0.26, sweep:-50}), i * 220));
  }
  function pickup(){ [880, 1100, 1320].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.06, type:'square', vol:0.18}), i * 60)); }
  return { shot, hit, kill, hurt, levelup, over, pickup, silenceAll, unmute };
})();
window.addEventListener('pagehide', () => Sfx.silenceAll());
window.addEventListener('beforeunload', () => Sfx.silenceAll());
document.addEventListener('visibilitychange', () => { if(document.hidden) Sfx.silenceAll(); else Sfx.unmute(); });

// ── State ───────────────────────────────────────────────────────────────────
const PLAYER_R = 22;
const ENEMY_R  = 20;
const BASE_SPEED = 280;
const BULLET_R = 7;
const BULLET_SPEED = 540;
const FIRE_INTERVAL_BASE = 360;  // ms between shots

// Selected brutimon species (defaults to the first one in the registry).
// The actual sprite resolved each frame via Brutimon.image(playerSpecies, 1).
let playerSpecies = 'glitchino';
let player = {
  x: WORLD_W/2, y: WORLD_H/2,
  hp: 3, maxHp: 3,
  invulnUntil: 0,
  lastFireMs: 0,
  facing: 0,
};

// Upgrade stats — picked from cards between rooms
let stats = {
  dmgMult: 1,      // damage multiplier per bullet
  rateMult: 1,     // fire-rate multiplier (higher = faster)
  spdMult: 1,      // movement-speed multiplier
  multishot: 1,    // number of bullets per volley
  pierce: 0,       // # of extra enemies a bullet can pass through
  bounce: 0,       // # of wall bounces a bullet can do
  size: 1,         // bullet size multiplier (also damage radius)
};

let enemies = [];           // { x, y, sprite, hp, maxHp, speed, kind, spawned }
let bullets = [];           // { x, y, vx, vy, dmg, pierce, bounce, size, hits:Set }
let coins = [];             // floating heal/coin pickups dropped by enemies
let particles = [];         // hit fx
let walls = [];             // [{x, y, w, h}] static cover blocks inside the arena

let level = 1;              // current room
let killsInRoom = 0;
let roomTotalEnemies = 0;
let phase = 'menu';         // 'menu' | 'fighting' | 'card' | 'gameover' | 'pause'
let lastT = 0;

// Joystick / movement input
let joy = { active:false, ax:0, ay:0, dx:0, dy:0, id:null };

function resetRun(){
  level = 1;
  stats = { dmgMult:1, rateMult:1, spdMult:1, multishot:1, pierce:0, bounce:0, size:1 };
  player.maxHp = 3; player.hp = 3;
  player.x = WORLD_W/2; player.y = WORLD_H/2;
  player.invulnUntil = 0; player.lastFireMs = 0;
  enemies = []; bullets = []; coins = []; particles = [];
  killsInRoom = 0;
  joy.active = false;
  updateHud();
}

function updateHud(){
  document.getElementById('h-lvl').textContent = level;
  document.getElementById('h-kills').textContent = `${killsInRoom}/${roomTotalEnemies}`;
  document.getElementById('h-hp').textContent = `${player.hp}/${player.maxHp}`;
  document.getElementById('s-dmg').textContent   = stats.dmgMult.toFixed(2).replace(/\.00$/, '');
  document.getElementById('s-rate').textContent  = stats.rateMult.toFixed(2).replace(/\.00$/, '');
  document.getElementById('s-spd').textContent   = stats.spdMult.toFixed(2).replace(/\.00$/, '');
  document.getElementById('s-multi').textContent  = stats.multishot;
  document.getElementById('s-pierce').textContent = stats.pierce;
  document.getElementById('s-bounce').textContent = stats.bounce;
}

// ── Joystick (anywhere on canvas) ───────────────────────────────────────────
canvas.addEventListener('pointerdown', e => {
  if(phase !== 'fighting') return;
  e.preventDefault(); canvas.setPointerCapture(e.pointerId);
  const w = s2w(e.clientX, e.clientY);
  joy.active = true; joy.id = e.pointerId;
  joy.ax = w.x; joy.ay = w.y;
  joy.dx = 0; joy.dy = 0;
});
canvas.addEventListener('pointermove', e => {
  if(!joy.active || e.pointerId !== joy.id) return;
  const w = s2w(e.clientX, e.clientY);
  const dx = w.x - joy.ax, dy = w.y - joy.ay;
  const d = Math.hypot(dx, dy);
  const DEAD = 12, MAX = 80;
  if(d < DEAD){ joy.dx = 0; joy.dy = 0; }
  else {
    const mag = Math.min(d, MAX) / MAX;
    joy.dx = (dx / d) * mag; joy.dy = (dy / d) * mag;
  }
});
function endJoy(e){
  if(e && e.pointerId !== joy.id) return;
  joy.active = false; joy.dx = 0; joy.dy = 0; joy.id = null;
}
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);
canvas.addEventListener('pointerleave', endJoy);
window.addEventListener('contextmenu', e => { if(phase === 'fighting') e.preventDefault(); });

// Keyboard fallback (desktop)
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

// ── Arena helpers (the playable rectangle) ─────────────────────────────────
function arenaTop()   { return ARENA_TOP; }
function arenaBot()   { return WORLD_H - ARENA_BOT; }
function arenaLeft()  { return 0; }
function arenaRight() { return WORLD_W; }
function arenaCenterY(){ return (arenaTop() + arenaBot()) / 2; }

// ── Walls (axis-aligned blocks, generated per room) ─────────────────────────
function rectsOverlap(a, b, pad){
  pad = pad || 0;
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x &&
         a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}
function generateWalls(){
  walls = [];
  if(WORLD_W < 80 || arenaBot() - arenaTop() < 200) return;
  // 0..4 walls depending on level + arena size
  const aw = WORLD_W, ah = arenaBot() - arenaTop();
  const maxByArea = Math.min(4, Math.floor((aw * ah) / 80000));
  const target = Math.min(maxByArea, (level % 5 === 0) ? 1 : (1 + (level % 3)));
  const playerSafe = { x: WORLD_W/2 - 90, y: arenaCenterY() - 90, w: 180, h: 180 };
  let tries = 0;
  while(walls.length < target && tries < 60){
    tries++;
    const ww = 40 + Math.random() * Math.min(160, aw * 0.35);
    const hh = 40 + Math.random() * Math.min(160, ah * 0.35);
    const x  = arenaLeft() + 36 + Math.random() * (aw - ww - 72);
    const y  = arenaTop()  + 36 + Math.random() * (ah - hh - 72);
    const cand = { x, y, w: ww, h: hh };
    if(rectsOverlap(cand, playerSafe, 12)) continue;
    let bad = false;
    for(const w of walls){ if(rectsOverlap(cand, w, 28)){ bad = true; break; } }
    if(bad) continue;
    walls.push(cand);
  }
}

// Push a circle (cx, cy, cr) out of every wall. Returns clamped position.
function resolveAgainstWalls(cx, cy, cr){
  for(const w of walls){
    const nx = Math.max(w.x, Math.min(cx, w.x + w.w));
    const ny = Math.max(w.y, Math.min(cy, w.y + w.h));
    const dx = cx - nx, dy = cy - ny;
    const d2 = dx*dx + dy*dy;
    if(d2 < cr * cr){
      if(d2 < 0.0001){
        // Centre is inside the wall — push out toward the nearest edge
        const dxL = cx - w.x, dxR = (w.x + w.w) - cx;
        const dyT = cy - w.y, dyB = (w.y + w.h) - cy;
        const m = Math.min(dxL, dxR, dyT, dyB);
        if(m === dxL) cx = w.x - cr;
        else if(m === dxR) cx = w.x + w.w + cr;
        else if(m === dyT) cy = w.y - cr;
        else cy = w.y + w.h + cr;
      } else {
        const d = Math.sqrt(d2);
        const push = cr - d;
        cx += (dx / d) * push;
        cy += (dy / d) * push;
      }
    }
  }
  return { x: cx, y: cy };
}
function bulletInWall(b){
  for(const w of walls){
    if(b.x >= w.x - BULLET_R * 0.4 && b.x <= w.x + w.w + BULLET_R * 0.4 &&
       b.y >= w.y - BULLET_R * 0.4 && b.y <= w.y + w.h + BULLET_R * 0.4) return true;
  }
  return false;
}
function lineOfSight(x1, y1, x2, y2){
  // Sample along the segment; if any sample is inside a wall, blocked.
  const dx = x2 - x1, dy = y2 - y1;
  const d = Math.hypot(dx, dy);
  const steps = Math.max(4, Math.floor(d / 18));
  for(let i = 1; i < steps; i++){
    const t = i / steps;
    const x = x1 + dx * t, y = y1 + dy * t;
    for(const w of walls){
      if(x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return false;
    }
  }
  return true;
}

// ── Room spawning ───────────────────────────────────────────────────────────
function startRoom(){
  enemies = []; bullets = []; coins = []; particles = [];
  killsInRoom = 0;
  // Place player at arena center
  player.x = WORLD_W/2; player.y = arenaCenterY();
  player.invulnUntil = performance.now() + 1200;

  generateWalls();

  const isBoss = (level % 5 === 0);
  if(isBoss){
    roomTotalEnemies = 1;
    spawnBoss();
  } else {
    const cnt = Math.min(18, 3 + Math.floor(level * 1.0));
    roomTotalEnemies = cnt;
    for(let i = 0; i < cnt; i++){
      setTimeout(() => spawnEnemy(), i * 180);
    }
  }
  phase = 'fighting';
  hideOverlay();
  updateHud();
}

function spawnEnemy(){
  // Find a spawn point at the arena perimeter that isn't inside a wall
  let x, y, tries = 0;
  do {
    const side = Math.floor(Math.random() * 4);
    if(side === 0)      { x = arenaLeft() + 30;     y = arenaTop() + 30 + Math.random() * (arenaBot() - arenaTop() - 60); }
    else if(side === 1) { x = arenaRight() - 30;    y = arenaTop() + 30 + Math.random() * (arenaBot() - arenaTop() - 60); }
    else if(side === 2) { x = arenaLeft() + 30 + Math.random() * (WORLD_W - 60); y = arenaTop() + 30; }
    else                { x = arenaLeft() + 30 + Math.random() * (WORLD_W - 60); y = arenaBot() - 30; }
    tries++;
  } while(tries < 10 && walls.some(w =>
    x >= w.x - ENEMY_R && x <= w.x + w.w + ENEMY_R &&
    y >= w.y - ENEMY_R && y <= w.y + w.h + ENEMY_R));

  // Pull from the shared Brutimon roster — stage 1-4 by weighted rarity,
  // each stage maps to a tier (chibi swarm / chaser / shooter / charger).
  const spec = Brutimon.randomEnemy(level);
  // HP scales with both the tier multiplier and the run level.
  const baseHp = Math.max(1, Math.round(spec.hpMult * (1 + Math.max(0, (level - 3) / 4))));
  const baseSpeed = 70 + Math.min(120, level * 8);
  enemies.push({
    x, y,
    species: spec.species, stage: spec.stage, brutimonSprite: spec.sprite,
    hp: baseHp, maxHp: baseHp,
    speed: baseSpeed * spec.spdMult,
    kind: 'mob',
    behavior: spec.behavior,
    spawned: performance.now(),
    fireCd: (spec.fireRateMs || 0) + Math.random() * 600,
    fireRateMs: spec.fireRateMs || 0,
    projSpd: spec.projSpd || 0,
    range: spec.range || 0,
    chargeCdMs: spec.chargeCdMs || 0,
    chargeDurMs: spec.chargeDurMs || 0,
    chargeMult: spec.chargeMult || 1,
    chargePhase: 'rest', chargeT: 0,
    chargeVx: 0, chargeVy: 0,
    radiusMult: spec.radiusMult || 1,
    color: spec.color || '#ff44aa',
    rarity: spec.rarity || 'comune',
    split: spec.stage === 2 && Math.random() < 0.15, // rare splitter chance for stage 2
  });
}

function spawnBoss(){
  // Boss = a random species at its legendary stage 5 form.
  const spec = Brutimon.bossEnemy(level);
  const hp = 25 + level * 4;
  enemies.push({
    x: WORLD_W/2, y: arenaTop() + 70,
    species: spec.species, stage: 5, brutimonSprite: spec.sprite,
    hp, maxHp: hp,
    speed: (80 + level * 2) * spec.spdMult,
    kind:'boss', behavior:'boss',
    spawned: performance.now(),
    fireCd: 1500,
    radiusMult: spec.radiusMult || 1.8,
    color: spec.color || '#ffcc44',
    rarity: 'leggendario'
  });
}

// ── Auto-fire ───────────────────────────────────────────────────────────────
function nearestEnemy(x, y){
  let best = null, bd = Infinity;
  for(const e of enemies){
    const d = (e.x - x)*(e.x - x) + (e.y - y)*(e.y - y);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function fire(now){
  const interval = FIRE_INTERVAL_BASE / stats.rateMult;
  if(now - player.lastFireMs < interval) return;
  const tgt = nearestEnemy(player.x, player.y);
  if(!tgt) return;
  const baseA = Math.atan2(tgt.y - player.y, tgt.x - player.x);
  player.facing = baseA;
  const n = stats.multishot;
  const spread = (n === 1) ? 0 : Math.min(0.7, 0.15 + 0.06 * (n-1));
  for(let i = 0; i < n; i++){
    const t = (n === 1) ? 0 : (i / (n - 1)) - 0.5;
    const a = baseA + t * spread;
    bullets.push({
      x: player.x + Math.cos(a) * 18,
      y: player.y + Math.sin(a) * 18,
      vx: Math.cos(a) * BULLET_SPEED,
      vy: Math.sin(a) * BULLET_SPEED,
      dmg: 1 * stats.dmgMult,
      pierce: stats.pierce,
      bounce: stats.bounce,
      size: stats.size,
      hits: new Set()
    });
  }
  player.lastFireMs = now;
  Sfx.shot();
}

// ── Update ──────────────────────────────────────────────────────────────────
function update(dt){
  const now = performance.now();
  if(phase !== 'fighting') return;

  // Player movement
  let mx = joy.dx, my = joy.dy;
  if(keys['arrowleft'] || keys['a']) mx = -1;
  if(keys['arrowright']|| keys['d']) mx =  1;
  if(keys['arrowup']   || keys['w']) my = -1;
  if(keys['arrowdown'] || keys['s']) my =  1;
  const mag = Math.hypot(mx, my);
  const moving = mag > 0.02;
  if(moving){
    const nx = mx / mag, ny = my / mag;
    const speed = BASE_SPEED * stats.spdMult * Math.min(1, mag);
    player.x += nx * speed * dt;
    player.y += ny * speed * dt;
    // Arena bounds (avoid HUD strip top and stats strip bottom)
    player.x = Math.max(arenaLeft() + PLAYER_R, Math.min(arenaRight() - PLAYER_R, player.x));
    player.y = Math.max(arenaTop()  + PLAYER_R, Math.min(arenaBot()   - PLAYER_R, player.y));
    // Resolve against walls
    const r = resolveAgainstWalls(player.x, player.y, PLAYER_R);
    player.x = r.x; player.y = r.y;
  } else {
    // Auto-fire only when standing still (classic Archero feel)
    fire(now);
  }

  // Enemies — per-behavior AI
  for(const e of enemies){
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const dirx = dx / d, diry = dy / d;
    let mvx = 0, mvy = 0;

    if(e.behavior === 'boss'){
      const wanted = 220;
      const dir = (d > wanted ? 1 : -0.5);
      mvx = dirx * e.speed * dir;
      mvy = diry * e.speed * dir;
      e.fireCd -= dt * 1000;
      if(e.fireCd <= 0){
        const n = 8;
        for(let i = 0; i < n; i++){
          const a = (i / n) * Math.PI * 2 + now * 0.0005;
          bullets.push({
            x: e.x, y: e.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
            dmg: 0, pierce: 99, bounce: 0, size: 1, hits: new Set(),
            hostile: true
          });
        }
        e.fireCd = 1700;
      }
    } else if(e.behavior === 'shoot'){
      // Stays at `range` from player, orbits a bit, fires aimed shots.
      const desired = e.range;
      const ringDelta = d - desired;
      const orbitTangent = 0.45;
      // Radial drift toward the ring distance
      mvx = dirx * e.speed * Math.sign(ringDelta);
      mvy = diry * e.speed * Math.sign(ringDelta);
      // Tangential motion (perpendicular)
      const tx = -diry, ty = dirx;
      mvx += tx * e.speed * orbitTangent;
      mvy += ty * e.speed * orbitTangent;
      e.fireCd -= dt * 1000;
      if(e.fireCd <= 0 && lineOfSight(e.x, e.y, player.x, player.y)){
        bullets.push({
          x: e.x, y: e.y, vx: dirx * e.projSpd, vy: diry * e.projSpd,
          dmg: 0, pierce: 0, bounce: 0, size: 1, hits: new Set(),
          hostile: true
        });
        e.fireCd = e.fireRateMs;
      }
    } else if(e.behavior === 'snipe'){
      // Stays still; fires fast aimed shot with windup if it has LOS.
      mvx = 0; mvy = 0;
      e.fireCd -= dt * 1000;
      if(e.fireCd <= 0 && lineOfSight(e.x, e.y, player.x, player.y)){
        bullets.push({
          x: e.x, y: e.y, vx: dirx * e.projSpd, vy: diry * e.projSpd,
          dmg: 0, pierce: 0, bounce: 0, size: 1.1, hits: new Set(),
          hostile: true
        });
        e.fireCd = e.fireRateMs;
      }
    } else if(e.behavior === 'charge'){
      // Alternates rest (slow drift) and burst (fast straight line)
      e.chargeT -= dt * 1000;
      if(e.chargePhase === 'rest'){
        mvx = dirx * e.speed * 0.25;
        mvy = diry * e.speed * 0.25;
        if(e.chargeT <= 0){
          e.chargePhase = 'burst';
          e.chargeT = e.chargeDurMs;
          // Lock-in direction at burst start
          e.chargeVx = dirx * e.speed * e.chargeMult;
          e.chargeVy = diry * e.speed * e.chargeMult;
        }
      } else { // burst
        mvx = e.chargeVx;
        mvy = e.chargeVy;
        if(e.chargeT <= 0){
          e.chargePhase = 'rest';
          e.chargeT = e.chargeCdMs;
        }
      }
    } else {
      // default chase
      mvx = dirx * e.speed;
      mvy = diry * e.speed;
    }

    // Apply movement with wall resolution
    e.x += mvx * dt;
    e.y += mvy * dt;
    // Keep enemies inside the arena bounds (they spawn just inside the edge)
    e.x = Math.max(arenaLeft()  + 6, Math.min(arenaRight() - 6, e.x));
    e.y = Math.max(arenaTop()   + 6, Math.min(arenaBot()   - 6, e.y));
    const r = resolveAgainstWalls(e.x, e.y, ENEMY_R * 0.9);
    e.x = r.x; e.y = r.y;
  }

  // Bullets
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    // arena bounds (bounce or despawn)
    if(b.x < arenaLeft() + BULLET_R || b.x > arenaRight() - BULLET_R){
      if(b.bounce > 0 && !b.hostile){ b.vx *= -1; b.x = Math.max(arenaLeft() + BULLET_R, Math.min(arenaRight() - BULLET_R, b.x)); b.bounce--; }
      else { bullets.splice(i,1); continue; }
    }
    if(b.y < arenaTop() + BULLET_R || b.y > arenaBot() - BULLET_R){
      if(b.bounce > 0 && !b.hostile){ b.vy *= -1; b.y = Math.max(arenaTop() + BULLET_R, Math.min(arenaBot() - BULLET_R, b.y)); b.bounce--; }
      else { bullets.splice(i,1); continue; }
    }
    // walls — bullets cannot pass through (hostile and friendly alike)
    if(bulletInWall(b)){ bullets.splice(i, 1); continue; }
    if(b.hostile){
      // hostile bullet vs player
      if(now > player.invulnUntil){
        const dx = b.x - player.x, dy = b.y - player.y;
        if(dx*dx + dy*dy < (PLAYER_R + BULLET_R)*(PLAYER_R + BULLET_R)){
          damagePlayer(now);
          bullets.splice(i, 1); continue;
        }
      }
    } else {
      // friendly bullet vs enemies
      let consumed = false;
      for(let j = enemies.length - 1; j >= 0; j--){
        const e = enemies[j];
        if(b.hits.has(e)) continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        const rr = ENEMY_R * (e.radiusMult || 1) + BULLET_R * b.size;
        if(dx*dx + dy*dy < rr*rr){
          e.hp -= b.dmg;
          b.hits.add(e);
          spawnHit(b.x, b.y);
          if(e.hp <= 0){
            killEnemy(j, e);
          } else {
            Sfx.hit();
          }
          if(b.pierce > 0){ b.pierce--; }
          else { consumed = true; break; }
        }
      }
      if(consumed){ bullets.splice(i, 1); continue; }
    }
  }

  // Player ↔ enemy contact
  if(now > player.invulnUntil){
    for(const e of enemies){
      const dx = e.x - player.x, dy = e.y - player.y;
      const rr = ENEMY_R * (e.radiusMult || 1) + PLAYER_R;
      if(dx*dx + dy*dy < rr*rr){
        damagePlayer(now);
        break;
      }
    }
  }

  // Pickups
  for(let i = coins.length - 1; i >= 0; i--){
    const c = coins[i];
    c.life -= dt;
    if(c.life <= 0){ coins.splice(i, 1); continue; }
    const dx = c.x - player.x, dy = c.y - player.y;
    if(dx*dx + dy*dy < (PLAYER_R + 18) * (PLAYER_R + 18)){
      if(c.kind === 'heart' && player.hp < player.maxHp){
        player.hp++; updateHud(); Sfx.pickup();
      } else if(c.kind === 'coin'){
        if(window.Coins) Coins.add(1, 'rush');
        Sfx.pickup();
      }
      coins.splice(i, 1);
    }
  }

  // Particles
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }

  // Room cleared?
  if(enemies.length === 0 && killsInRoom >= roomTotalEnemies && phase === 'fighting'){
    phase = 'card';
    Sfx.levelup();
    if(window.Track) Track.event('room_clear', { level, isBoss: (level % 5 === 0), hp: player.hp });
    setTimeout(showCardPicker, 350);
  }
}

function spawnHit(x, y){
  for(let i = 0; i < 4; i++){
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 200,
      vy: (Math.random() - 0.5) * 200,
      life: 0.25, color:'#ffcc44'
    });
  }
}

function damagePlayer(now){
  player.hp--;
  player.invulnUntil = now + 1200;
  Sfx.hurt();
  updateHud();
  if(player.hp <= 0) onGameOver();
}

function killEnemy(j, e){
  // Particles
  for(let i = 0; i < 10; i++){
    particles.push({
      x: e.x, y: e.y,
      vx: (Math.random() - 0.5) * 280,
      vy: (Math.random() - 0.5) * 280,
      life: 0.45, color:'#ff44aa'
    });
  }
  // Splitter spawns two minis (the rare stage-2 splitter variant).
  if(e.split && e.kind === 'mob' && !e._splitChild){
    for(let k = 0; k < 2; k++){
      const childSpec = Brutimon.randomEnemy(1);   // always common chibi minions
      enemies.push({
        x: e.x + (k ? 16 : -16), y: e.y,
        species: childSpec.species, stage: 1, brutimonSprite: childSpec.sprite,
        hp: 1, maxHp: 1,
        speed: e.speed * 1.2, kind: 'mob',
        behavior: 'chase',
        _splitChild: true,
        spawned: performance.now(),
        radiusMult: 0.7,
        color: childSpec.color
      });
    }
    roomTotalEnemies += 2;
  }
  // Drop chance
  if(Math.random() < 0.15){
    coins.push({ x: e.x, y: e.y, kind:'heart', life: 8 });
  } else if(Math.random() < 0.35){
    coins.push({ x: e.x, y: e.y, kind:'coin', life: 8 });
  }
  enemies.splice(j, 1);
  killsInRoom++;
  updateHud();
  Sfx.kill();
}

// ── Draw ────────────────────────────────────────────────────────────────────
function draw(){
  // World coordinates now equal screen pixels (no letterbox), so the legacy
  // scale factor `sc` collapses to 1. Kept as a local so the rest of this
  // function (which still multiplies sizes by sc) reads unchanged.
  const sc = 1;
  const aTop = arenaTop(), aBot = arenaBot();
  const aH = aBot - aTop;
  // Full background (covers HUD strip area too)
  ctx.fillStyle = '#0a0418'; ctx.fillRect(0, 0, W, H);
  // Arena floor
  ctx.fillStyle = '#2a1240';
  ctx.fillRect(0, aTop, WORLD_W, aH);
  // Grid floor
  ctx.strokeStyle = '#ff44aa22';
  ctx.lineWidth = 1;
  const GRID = 60;
  for(let gx = 0; gx < WORLD_W; gx += GRID){
    ctx.beginPath(); ctx.moveTo(gx, aTop); ctx.lineTo(gx, aBot); ctx.stroke();
  }
  for(let gy = aTop; gy < aBot; gy += GRID){
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(WORLD_W, gy); ctx.stroke();
  }
  // Arena border
  ctx.strokeStyle = '#ff44aa';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff44aa'; ctx.shadowBlur = 22;
  ctx.strokeRect(0.5, aTop + 0.5, WORLD_W - 1, aH - 1);
  ctx.shadowBlur = 0;

  // Walls — cyber blocks with neon edge
  for(const w of walls){
    ctx.save();
    ctx.fillStyle = '#1a0628';
    ctx.shadowColor = '#44ccff'; ctx.shadowBlur = 18;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#44ccff';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    // inner pattern
    ctx.strokeStyle = '#44ccff44';
    ctx.lineWidth = 1;
    for(let lx = w.x + 8; lx < w.x + w.w - 4; lx += 12){
      ctx.beginPath(); ctx.moveTo(lx, w.y + 6); ctx.lineTo(lx, w.y + w.h - 6); ctx.stroke();
    }
    ctx.restore();
  }

  const now = performance.now();

  // Coins / hearts
  for(const c of coins){
    const pos = w2s(c.x, c.y);
    const alpha = c.life < 1 ? c.life : 1;
    const pulse = 1 + 0.18 * Math.sin(now * 0.01);
    if(c.kind === 'heart'){
      ctx.fillStyle = `rgba(255,80,120,${alpha})`;
      ctx.font = `bold ${Math.floor(28 * sc * pulse)}px Orbitron`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('♥', pos.x, pos.y);
    } else {
      ctx.fillStyle = `rgba(255,204,68,${alpha})`;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 9 * sc * pulse, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(40,20,0,${alpha})`;
      ctx.font = `bold ${Math.floor(14 * sc)}px Orbitron`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('$', pos.x, pos.y);
    }
  }

  // Enemies
  for(const e of enemies){
    const pos = w2s(e.x, e.y);
    const baseR = (e.kind === 'boss' ? 44 : ENEMY_R) * sc;
    const r = baseR * (e.radiusMult || 1);
    // shadow
    ctx.fillStyle = '#00000066';
    ctx.beginPath(); ctx.ellipse(pos.x, pos.y + r * 0.7, r * 0.9, r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    // Rarity halo for stages 3+ — communicates "this one is special".
    if(e.stage >= 3 && e.color){
      const haloA = e.stage >= 5 ? 0.55 : e.stage >= 4 ? 0.40 : 0.28;
      const haloR = r * (e.stage >= 5 ? 1.35 : 1.20);
      ctx.save();
      ctx.shadowColor = e.color; ctx.shadowBlur = e.stage >= 5 ? 28 : 18;
      ctx.fillStyle = e.color + Math.floor(haloA * 255).toString(16).padStart(2,'0');
      ctx.beginPath(); ctx.arc(pos.x, pos.y, haloR, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // Brutimon sprite (image was preloaded at boot via Brutimon.preloadAll)
    const im = e.brutimonSprite;
    const sz = r * 2.2;
    if(im && im.complete && im.naturalWidth > 0){
      ctx.drawImage(im, pos.x - sz/2, pos.y - sz/2, sz, sz);
    } else {
      ctx.fillStyle = e.color || (e.kind === 'boss' ? '#ffcc44' : '#ff44aa');
      ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI*2); ctx.fill();
    }
    // hp bar (only if damaged or boss)
    if(e.hp < e.maxHp || e.kind === 'boss'){
      const bw = r * 2.2, bh = 5 * sc;
      const bx = pos.x - bw/2, by = pos.y - r - 10 * sc;
      ctx.fillStyle = '#22002288'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = e.kind === 'boss' ? '#ffcc44' : '#ff6688';
      ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
    }
  }

  // Bullets
  for(const b of bullets){
    const pos = w2s(b.x, b.y);
    if(b.hostile){
      ctx.fillStyle = '#ff8844';
      ctx.shadowColor = '#ff8844'; ctx.shadowBlur = 12 * sc;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, BULLET_R * sc, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#44ffcc';
      ctx.shadowColor = '#44ffcc'; ctx.shadowBlur = 16 * sc;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, BULLET_R * b.size * sc, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // Particles
  for(const p of particles){
    const pos = w2s(p.x, p.y);
    const a = Math.max(0, p.life / 0.45);
    ctx.fillStyle = (p.color || '#ffcc44') + Math.floor(a*255).toString(16).padStart(2,'0');
    ctx.fillRect(pos.x - 2, pos.y - 2, 4, 4);
  }

  // Player
  const pp = w2s(player.x, player.y);
  const blinking = now < player.invulnUntil;
  if(!(blinking && Math.floor(now / 80) % 2 === 0)){
    // halo
    ctx.fillStyle = '#44ffcc66';
    ctx.beginPath(); ctx.arc(pp.x, pp.y + PLAYER_R * 0.5 * sc, PLAYER_R * sc * 1.1, 0, Math.PI*2); ctx.fill();
    // Player is always rendered at stage-1 (cucciolo) of the chosen brutimon.
    const im = Brutimon.image(playerSpecies, 1);
    const sz = PLAYER_R * 2.4 * sc;
    if(Brutimon.imageReady(im)) ctx.drawImage(im, pp.x - sz/2, pp.y - sz/2, sz, sz);
    else { ctx.fillStyle = '#44ffcc'; ctx.beginPath(); ctx.arc(pp.x, pp.y, PLAYER_R * sc, 0, Math.PI*2); ctx.fill(); }
    // aim hint when standing still and target exists
    if(!(joy.dx || joy.dy) && enemies.length){
      const tgt = nearestEnemy(player.x, player.y);
      if(tgt){
        const a = Math.atan2(tgt.y - player.y, tgt.x - player.x);
        ctx.strokeStyle = '#44ffcc';
        ctx.lineWidth = Math.max(2, 2 * sc);
        ctx.beginPath();
        ctx.moveTo(pp.x + Math.cos(a) * PLAYER_R * sc, pp.y + Math.sin(a) * PLAYER_R * sc);
        ctx.lineTo(pp.x + Math.cos(a) * (PLAYER_R + 16) * sc, pp.y + Math.sin(a) * (PLAYER_R + 16) * sc);
        ctx.stroke();
      }
    }
  }

  // Joystick visualization
  if(joy.active){
    const a = w2s(joy.ax, joy.ay);
    const k = w2s(joy.ax + joy.dx * 80, joy.ay + joy.dy * 80);
    ctx.strokeStyle = '#ff44aa66';
    ctx.lineWidth = Math.max(2, 2 * sc);
    ctx.beginPath(); ctx.arc(a.x, a.y, 60 * sc, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#ff44aa88';
    ctx.beginPath(); ctx.arc(k.x, k.y, 22 * sc, 0, Math.PI*2); ctx.fill();
  }
}

// ── Loop ────────────────────────────────────────────────────────────────────
function loop(ts){
  if(phase === 'menu' || phase === 'gameover') return;
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── Cards (upgrades) ────────────────────────────────────────────────────────
const CARD_POOL = [
  { id:'dmg',     ic:'⚔️',  nm:'POTENZA',     ds:'+25% danno',                  rarity:0, apply:() => { stats.dmgMult  *= 1.25; } },
  { id:'rate',    ic:'⚡',  nm:'CADENZA',     ds:'+18% velocità di tiro',       rarity:0, apply:() => { stats.rateMult *= 1.18; } },
  { id:'spd',     ic:'👟',  nm:'AGILITÀ',     ds:'+15% velocità movimento',     rarity:0, apply:() => { stats.spdMult  *= 1.15; } },
  { id:'hp',      ic:'❤️',  nm:'VITALITÀ',    ds:'+1 HP max e cura completa',   rarity:0, apply:() => { player.maxHp++; player.hp = player.maxHp; } },
  { id:'multi',   ic:'🔱',  nm:'MULTI-SHOT',  ds:'+1 proiettile per volley',    rarity:1, apply:() => { stats.multishot++; } },
  { id:'pierce',  ic:'➡️',  nm:'PERFORANTE',  ds:'+1 nemico attraversato',      rarity:1, apply:() => { stats.pierce++; } },
  { id:'bounce',  ic:'↩️',  nm:'RIMBALZO',    ds:'+1 rimbalzo sui muri',        rarity:1, apply:() => { stats.bounce++; } },
  { id:'big',     ic:'🟢',  nm:'PALLA GIGA',  ds:'+30% dimensione proiettile',  rarity:1, apply:() => { stats.size *= 1.3; } },
  { id:'heal',    ic:'💖',  nm:'CURA',        ds:'Recupera tutti gli HP',       rarity:0, apply:() => { player.hp = player.maxHp; } },
];
function showCardPicker(){
  const pool = CARD_POOL.slice();
  const picks = [];
  for(let i = 0; i < 3 && pool.length; i++){
    const idx = Math.floor(Math.random() * pool.length);
    picks.push(pool[idx]); pool.splice(idx, 1);
  }
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2>STANZA ${level} LIBERATA</h2>
    <h3>Scegli un potenziamento</h3>
    <div class="cards">
      ${picks.map((c, i) => `
        <div class="card ${c.rarity===1?'rare':''}" data-i="${i}">
          <div class="ic">${c.ic}</div>
          <div class="nm">${c.nm}</div>
          <div class="ds">${c.ds}</div>
        </div>
      `).join('')}
    </div>
    <p class="hint">Le carte si accumulano per tutta la run. Boss alla stanza 5, 10, 15…</p>
  `;
  ol.style.display = 'flex';
  ol.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const i = +el.dataset.i;
      if(window.Track) Track.event('card_pick', { level, id: picks[i].id, name: picks[i].nm });
      picks[i].apply();
      updateHud();
      level++;
      startRoom();
      lastT = performance.now();
      requestAnimationFrame(loop);
    });
  });
}

// ── Game flow ───────────────────────────────────────────────────────────────
function hideOverlay(){ document.getElementById('overlay').style.display = 'none'; }

function startGame(speciesId){
  if(speciesId) playerSpecies = speciesId;
  resetRun();
  startRoom();
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function onGameOver(){
  phase = 'gameover';
  Sfx.over();
  if(window.Track) Track.event('run_over', {
    level, species: playerSpecies,
    dmgMult: stats.dmgMult, rateMult: stats.rateMult, spdMult: stats.spdMult,
    multishot: stats.multishot, pierce: stats.pierce, bounce: stats.bounce
  });
  const reward = level * 2;
  if(window.Coins && reward > 0) Coins.add(reward, 'rush-lv-' + level);
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>GAME OVER</h2>
    <p>Stanze superate: <b style="color:#ffcc44">${level - 1}</b></p>
    <p>+${reward}🪙</p>
    <div class="btn-row">
      <button class="btn" onclick="showMenu()">MENU</button>
      <button class="btn" onclick="startGame(0)">RIPROVA</button>
    </div>
  `;
}
function showMenu(){
  phase = 'menu';
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  // Wait for the registry, then render with the live brutimon roster.
  Brutimon.registry().then(reg => {
    const species = reg.species || [];
    const choices = species.map(s => `
      <div class="card" data-id="${s.id}" style="width:130px">
        <img src="${Brutimon.BASE}/${s.id}/${s.id}_1.png"
             style="width:80px;height:80px;display:block;margin:0 auto 6px;image-rendering:pixelated"/>
        <div class="nm">${s.name.toUpperCase()}</div>
        <div class="ds">${s.tag || ''}</div>
      </div>
    `).join('');
    ol.innerHTML = `
      <h2>BRUTIMON RUSH</h2>
      <p>Stanze procedurali infinite. Boss ogni 5 livelli.</p>
      <div class="hint">
        <div><b>Tieni premuto</b> e muovi per spostarti</div>
        <div><b>Rilascia</b>: spari automatici verso il nemico più vicino</div>
        <div>Scegli 1 carta tra 3 alla fine di ogni stanza</div>
        <div style="margin-top:6px;color:#ffcc44">Nemici: BRUTIMON stage 1-4 · Boss: leggendari (stage 5)</div>
      </div>
      <h3>Scegli il tuo Brutimon</h3>
      <div class="cards">${choices}</div>
    `;
    ol.querySelectorAll('.card[data-id]').forEach(el => {
      el.addEventListener('click', () => startGame(el.dataset.id));
    });
  });
}
window.startGame = startGame;
window.showMenu  = showMenu;
showMenu();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
