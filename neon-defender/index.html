<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEON DEFENDER+</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Defender">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050810;color:#e0e8ff;
    font-family:'Share Tech Mono',monospace;overflow:hidden;
    min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;
  }
  #game-wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  #game{display:block;width:100%;height:100%;background:#050810;touch-action:none}

  #hud{
    position:fixed;top:0;left:0;right:0;padding:8px 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:linear-gradient(to bottom,#050810dd,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center;min-width:48px}
  .hud-label{font-size:9px;letter-spacing:.2em;color:#00f5ff99;text-transform:uppercase}
  .hud-value{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.05rem;color:#fff;
    text-shadow:0 0 10px #00f5ff;line-height:1;margin-top:2px;letter-spacing:.05em;
  }
  .hud-value.coins{color:#ffcc00;text-shadow:0 0 10px #ffcc0088}
  .hud-value.energy{color:#44ff88;text-shadow:0 0 10px #44ff8888}
  .hud-value.lives{color:#ff5566;text-shadow:0 0 10px #ff556688}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  }
  /* Speed-toggle button — cycles 1× → 2× → 3× → 1× on tap. Stacked under
     the back button so it doesn't overlap with the top-right Coins block. */
  #speed-btn{
    position:fixed;top:52px;left:8px;min-width:46px;height:32px;padding:0 8px;
    border-radius:6px;background:#0a1428cc;border:1px solid #ffcc00aa;color:#ffcc00;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
    box-shadow:0 0 10px #ffcc0044;
  }
  #speed-btn.active{box-shadow:0 0 16px #ffcc00aa;background:#0a1428ee}

  /* Tower selector — bottom bar */
  #tower-bar{
    position:fixed;bottom:0;left:0;right:0;padding:10px;
    display:flex;justify-content:center;gap:10px;
    background:linear-gradient(to top,#050810cc,transparent);
    pointer-events:none;z-index:5;
  }
  .twr{
    pointer-events:auto;cursor:pointer;user-select:none;
    width:72px;padding:8px 6px;border-radius:8px;
    background:#0a1428cc;border:2px solid #00f5ff44;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.1em;
    transition:all .15s;
  }
  .twr:hover{border-color:#00f5ff88;background:#0a1428ee}
  .twr.active{border-color:#00f5ff;box-shadow:0 0 18px #00f5ff66;background:#00f5ff11}
  .twr.locked{opacity:.5;cursor:not-allowed}
  .twr.locked:hover{border-color:#00f5ff44}
  .twr .icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
  .twr .name{color:#00f5ff;font-weight:700}
  .twr .cost{color:#44ff88;font-size:9px;letter-spacing:.05em}
  .twr.locked .cost{color:#ffcc00}

  #upgrade-panel{
    position:fixed;left:50%;transform:translateX(-50%);bottom:90px;
    z-index:6;min-width:240px;max-width:340px;padding:12px 14px;border-radius:10px;
    background:#0a1428ee;border:1px solid #00f5ff88;display:none;
    box-shadow:0 0 28px #00f5ff44;
    font-family:'Share Tech Mono',monospace;color:#e0e8ff;
  }
  #upgrade-panel h3{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.95rem;
    letter-spacing:.2em;color:#00f5ff;margin-bottom:8px;text-align:center;
    text-shadow:0 0 12px #00f5ff77;
  }
  .stat-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:5px 0;font-size:.78rem;
  }
  .stat-row .label{color:#a0b8e0;letter-spacing:.12em;width:60px}
  .stat-row .dots{display:flex;gap:3px}
  .stat-row .dot{
    width:9px;height:9px;border-radius:50%;
    border:1px solid #00f5ff44;background:transparent;
  }
  .stat-row .dot.on{background:#00f5ff;box-shadow:0 0 8px #00f5ff;border-color:#00f5ff}
  .stat-row .up-btn{
    padding:3px 10px;border-radius:4px;cursor:pointer;
    background:#0a1428;border:1px solid #44ff88;color:#44ff88;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.08em;
  }
  .stat-row .up-btn:hover{background:#44ff8822;box-shadow:0 0 12px #44ff8888}
  .stat-row .up-btn.disabled{
    border-color:#88888844;color:#888;cursor:not-allowed;background:transparent;
  }
  .panel-row{display:flex;gap:8px;margin-top:8px;justify-content:space-between}
  .panel-row .sell-btn{
    flex:1;padding:6px;background:#0a1428;border:1px solid #ff998866;color:#ff9988;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em;
    cursor:pointer;border-radius:4px;
  }
  .panel-row .close-btn{
    padding:6px 12px;background:#0a1428;border:1px solid #00f5ff66;color:#00f5ff;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em;
    cursor:pointer;border-radius:4px;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#050810cc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.2rem;
    color:#00f5ff;letter-spacing:.25em;text-shadow:0 0 30px #00f5ff;margin-bottom:6px;
  }
  #overlay p{color:#a0b8e0;font-size:.92rem;letter-spacing:.1em}
  .btn{
    margin-top:8px;padding:10px 24px;background:transparent;border:2px solid #00f5ff;
    color:#00f5ff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #00f5ff44;transition:all .15s;
  }
  .btn:hover{background:#00f5ff22;box-shadow:0 0 28px #00f5ff88}
  .btn.warn{border-color:#ffcc00;color:#ffcc00;box-shadow:0 0 18px #ffcc0044}
  .btn.warn:hover{background:#ffcc0022;box-shadow:0 0 28px #ffcc0088}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

  .unlock-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;max-width:520px;margin-top:8px;
  }
  .unlock-card{
    border:1px solid #00f5ff44;border-radius:8px;padding:10px;background:#0a142866;
    font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .unlock-card.owned{border-color:#44ff88;color:#44ff88}
  .unlock-card .price{color:#ffcc00;font-family:Orbitron,sans-serif;font-weight:700}
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div style="width:42px"></div>
  <div class="hud-item"><span class="hud-label">Wave</span><span class="hud-value" id="h-wave">0/10</span></div>
  <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-value lives" id="h-lives">20</span></div>
  <div class="hud-item"><span class="hud-label">Energy</span><span class="hud-value energy" id="h-energy">100</span></div>
  <div class="hud-item"><span class="hud-label">Coins</span><span class="hud-value coins" id="h-coins">0</span></div>
</div>

<button id="back-btn" title="Torna al launcher" onclick="goBack()">✖</button>
<button id="speed-btn" class="active" title="Velocita di gioco" onclick="toggleGameSpeed()">2×</button>

<div id="tower-bar"></div>

<div id="upgrade-panel"></div>

<div id="overlay"></div>

<script src="../shared/coins.js"></script>
<script>
// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  computeLayout();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));

// ── GRAPHICS MODE + ASSET LOADER ────────────────────────────────────────────
// Three visual modes — cycle in this order on tap:
//   'classic' → neon-cyber procedural shapes (no sprites)
//   'kenney'  → Kenney top-down tower-defense pack tiles (grass/path/base)
//   'pokemon' → user-supplied Pokemon-style sprites from assets/skin-pokemon/
// Same gameplay either way; only the visuals change. Each enemy sprite that
// is MISSING from the pokemon skin falls back to the procedural shape, so
// the skin can be filled in incrementally.
let graphicsMode = localStorage.getItem('defGraphicsMode') || 'classic';
const Assets = {
  ready: false, imgs: {}, _t: 0, _d: 0,
  _hit(){ this._d++; if(this._d >= this._t) this.ready = true; },
  load(name, src){
    const img = new Image();
    img.onload  = () => this._hit();
    img.onerror = () => this._hit();   // missing sprite → silently skip (caller checks naturalWidth)
    img.src = src;
    this.imgs[name] = img;
    this._t++;
  }
};
// Kenney shared tiles
Assets.load('grass', 'assets/grass.png');
Assets.load('path',  'assets/path.png');
Assets.load('base',  'assets/base.png');
Assets.load('bush',  'assets/bush.png');
// Pokemon skin — only the assets the user has uploaded so far. Missing ones
// (boss / splitter / mini / swift / shielded / towers) fall back gracefully.
Assets.load('pk_grass',    'assets/skin-pokemon/grass.png');
Assets.load('pk_path',     'assets/skin-pokemon/path.png');
Assets.load('pk_grunt',    'assets/skin-pokemon/grunt.png');
Assets.load('pk_runner',   'assets/skin-pokemon/runner.png');
Assets.load('pk_tank',     'assets/skin-pokemon/tank.png');
Assets.load('pk_boss',     'assets/skin-pokemon/boss.png');
Assets.load('pk_splitter', 'assets/skin-pokemon/splitter.png');
Assets.load('pk_mini',     'assets/skin-pokemon/mini.png');
Assets.load('pk_swift',    'assets/skin-pokemon/swift.png');
Assets.load('pk_shielded', 'assets/skin-pokemon/shielded.png');
Assets.load('pk_tower_cannon', 'assets/skin-pokemon/cannon.png');
Assets.load('pk_tower_laser',  'assets/skin-pokemon/laser.png');
Assets.load('pk_tower_freeze', 'assets/skin-pokemon/freeze.png');
Assets.load('pk_tower_splash', 'assets/skin-pokemon/splash.png');
Assets.load('pk_tower_base',   'assets/skin-pokemon/tower-base.png');

function toggleGraphics(){
  graphicsMode = graphicsMode === 'classic' ? 'kenney'
               : graphicsMode === 'kenney'  ? 'pokemon'
               : 'classic';
  localStorage.setItem('defGraphicsMode', graphicsMode);
  const btn = document.getElementById('graphics-toggle-btn');
  if(btn) btn.textContent = graphicsMode === 'kenney' ? 'SPRITE'
                          : graphicsMode === 'pokemon' ? 'POKEMON'
                          : 'CLASSICA';
}
window.toggleGraphics = toggleGraphics;
function isKenney() { return graphicsMode === 'kenney'  && Assets.ready; }
function isPokemon(){ return graphicsMode === 'pokemon' && Assets.ready; }
// Returns a loaded Image for the given skin key, or null if it failed/missing.
function pkSprite(key){
  const img = Assets.imgs[key];
  return (img && img.naturalWidth > 0) ? img : null;
}

// ── CONFIG ────────────────────────────────────────────────────────────────────
// Grid dimensions are LET, not const — `computeGridDimensions()` sets them at
// game start based on the screen size so the playable area always fills the
// available viewport instead of being tiny on portrait phones.
let GRID_COLS = 20, GRID_ROWS = 12;
// Paths — array of paths, each path is a list of cells {x, y} from an ENTRY
// (just outside the grid on some edge) to an EXIT (just outside another edge).
// Built by `generatePaths()` which produces 1–3 independent paths each game.
// Enemies are assigned a random pathId at spawn and walk along that path.
let PATHS = [];
const STARTING_LIVES = 20;
const STARTING_ENERGY = 160;     // enough for 3 cannons at start (50⚡ each)
const SLOW_DURATION_MS = 5000;     // freeze tower slows each enemy for this long

// Tower types
// `coinCost` = 🪙 to pay PER PLACEMENT (no permanent unlock). Cannon is free.
// `cost` = ⚡ in-run energy spent to place (the green resource).
const TOWER_TYPES = {
  cannon: {
    name:'CANNON', cost:50, coinCost:0, range:3.4, cooldown:480, damage:14,
    color:'#00f5ff', projColor:'#00f5ff',
    description:'single target, low cooldown'
  },
  laser: {
    name:'LASER',  cost:80, coinCost:4, range:4.5, cooldown:120, damage:3,
    color:'#ff66cc', projColor:'#ff66cc',
    description:'beam, fast tick'
  },
  slow: {
    name:'FREEZE', cost:60, coinCost:3, range:2.8, cooldown:4000, damage:0, slow:0.5,
    color:'#88ccff', projColor:'#88ccff',
    description:`slows enemies in range for ${SLOW_DURATION_MS/1000}s, then cools down`
  },
  splash: {
    name:'BLAST',  cost:100, coinCost:6, range:3.5, cooldown:900, damage:18, splashRadius:1.4,
    color:'#ffcc00', projColor:'#ffcc00',
    description:'AOE explosion'
  }
};

// Free mode now has a real per-session wallet (see shared/coins.js), so the
// only check we need is whether the current wallet covers the tower's coinCost.
function canAfford(type){
  const t = TOWER_TYPES[type];
  if(t.coinCost <= 0) return true;
  if(!Coins) return false;
  return Coins.canSpend(t.coinCost);
}

// Enemy types. Flags:
//   shielded → immune to FREEZE tower slow
//   swift    → +60% speed (already baked into `speed`)
//   splitter → on death, spawns 3 mini-runners at its position
const ENEMY_TYPES = {
  grunt:    { hp:30,  speed:1.4, score:5,  reward:8,  size:14, color:'#ff4466' },
  runner:   { hp:22,  speed:2.6, score:8,  reward:10, size:11, color:'#ff9944' },
  tank:     { hp:140, speed:0.7, score:20, reward:25, size:18, color:'#aa44ff' },
  boss:     { hp:600, speed:0.9, score:100,reward:80, size:24, color:'#ff66cc' },
  // New, harder enemies — introduced gradually past wave 6.
  splitter: { hp:60,  speed:1.5, score:18, reward:18, size:16, color:'#44ff88', splitter:true,
              splitInto:'mini', splitCount:3 },
  mini:     { hp:10,  speed:3.0, score:2,  reward:3,  size:8,  color:'#88ff44' },
  swift:    { hp:38,  speed:4.0, score:12, reward:14, size:12, color:'#ffcc00', swift:true },
  shielded: { hp:180, speed:1.1, score:25, reward:30, size:18, color:'#88ccff', shielded:true }
};

// Wave definitions: list of {type, count, gap (ms between spawns), wait (ms before first)}
// Endless mode: difficulty escalates over time. The first ~4 waves are a
// gentle ramp (only grunts) so a player who started with just two cannons
// can build a foothold; new enemy types unlock progressively from there.
function waveDef(n){
  const w = [];
  // Grunts always — gentle start (wave 1 = 4 grunts), then linear growth.
  const grunts = 3 + Math.floor(n * 1.5);
  const grGap  = Math.max(260, 1050 - n * 50);
  w.push({ type:'grunt', count: grunts, gap: grGap, wait: 0 });
  // Runners from wave 3 (was wave 2). Counts grow from wave 3 onward.
  if(n >= 3){
    const runners = Math.max(1, Math.floor(1 + (n - 2) * 1.1));
    w.push({ type:'runner', count: runners, gap: Math.max(220, 600 - n*15), wait: 4500 });
  }
  // Tanks from wave 5 (was wave 3).
  if(n >= 5){
    const tanks = Math.max(1, Math.floor(1 + (n - 4) * 0.5));
    w.push({ type:'tank', count: tanks, gap: Math.max(550, 1200 - n*40), wait: 7500 });
  }
  // Splitters from wave 8 (was 6) — punish chokepoints.
  if(n >= 8){
    const splitters = 1 + Math.floor((n - 8) * 0.3);
    w.push({ type:'splitter', count: splitters, gap: 2000, wait: 5500 });
  }
  // Swift from wave 11 (was 9) — fast, low-HP.
  if(n >= 11){
    const swifts = 2 + Math.floor((n - 11) * 0.5);
    w.push({ type:'swift', count: swifts, gap: 350, wait: 9000 });
  }
  // Shielded from wave 14 (was 12) — immune to freeze.
  if(n >= 14){
    const shielded = 1 + Math.floor((n - 14) * 0.4);
    w.push({ type:'shielded', count: shielded, gap: 1000, wait: 8500 });
  }
  // Boss every 4 waves (was 3), starting from wave 8 (was 6). Multi-boss
  // begins to appear around wave 13. HP scaling is also steeper for bosses
  // inside spawnEnemy.
  if(n >= 8 && n % 4 === 0){
    const bosses = Math.max(1, 1 + Math.floor((n - 12) / 5));
    w.push({ type:'boss', count: bosses, gap: 2200, wait: 10000 });
  }
  return w;
}

// ── LAYOUT ────────────────────────────────────────────────────────────────────
let CELL = 50;
let gridOX = 0, gridOY = 0;       // offset to centre the grid on screen
// Compute GRID_COLS / GRID_ROWS to FILL the viewport given a target cell
// size. Called ONCE at startGame so existing tower coordinates stay valid
// across mid-run resize (the grid count doesn't change during a run; only
// CELL/gridOX/gridOY rescale via computeLayout).
function computeGridDimensions(){
  const hudPad = 60, barPad = 110;
  const availW = Math.max(320, W - 8);
  const availH = Math.max(320, H - hudPad - barPad);
  // Target cell size: bigger on tablet/desktop, smaller on phone so we fit
  // more cells in. Bounded so we never end up with ridiculous extremes.
  const targetCell = (availW < 600 || availH < 600) ? 38 : 52;
  GRID_COLS = Math.max(14, Math.min(28, Math.floor(availW / targetCell)));
  GRID_ROWS = Math.max(10, Math.min(22, Math.floor(availH / targetCell)));
}
function computeLayout(){
  // Fit grid into the canvas, leaving space for HUD top + tower bar bottom.
  // Cell size adapts to the current viewport — but GRID_COLS / GRID_ROWS
  // stay locked for the run (see computeGridDimensions).
  const hudPad = 60, barPad = 110;
  const availW = W;
  const availH = H - hudPad - barPad;
  CELL = Math.floor(Math.min(availW / GRID_COLS, availH / GRID_ROWS));
  gridOX = Math.floor((W - CELL * GRID_COLS) / 2);
  gridOY = hudPad + Math.floor((availH - CELL * GRID_ROWS) / 2);
}
computeGridDimensions();
fitCanvas();

function cellToWorld(cx, cy){ return { x: gridOX + cx*CELL + CELL/2, y: gridOY + cy*CELL + CELL/2 }; }
function worldToCell(wx, wy){
  return { cx: Math.floor((wx - gridOX) / CELL), cy: Math.floor((wy - gridOY) / CELL) };
}

// Pre-compute which cells are on ANY path (forbidden for towers).
let PATH_OCCUPIED = new Set();
function buildPathOccupied(){
  PATH_OCCUPIED = new Set();
  for(const path of PATHS){
    const cells = path.cells;
    for(let i = 0; i < cells.length - 1; i++){
      const a = cells[i], b = cells[i + 1];
      const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
      let x = a.x, y = a.y;
      while(x !== b.x || y !== b.y){
        PATH_OCCUPIED.add(`${x},${y}`);
        if(x !== b.x) x += dx;
        else if(y !== b.y) y += dy;
      }
      PATH_OCCUPIED.add(`${b.x},${b.y}`);
    }
  }
}

// ── PATH GENERATOR ────────────────────────────────────────────────────────────
// Builds 1–3 procedural paths. Each path has its own ENTRY (just outside the
// grid on a random edge) and EXIT (just outside the grid on a different edge).
// Enemies are randomly assigned a path at spawn time. Towers must defend ALL
// paths since enemies are spawned across the lot.
function generatePaths(){
  const numEntries = 1 + Math.floor(Math.random() * 3);   // 1..3
  const numExits   = numEntries >= 2 ? (1 + Math.floor(Math.random() * 2)) : 1;
  PATHS = [];
  // Reserve a few candidate edge points so paths don't share the same entry/exit.
  const entryPoints = pickEdgePoints(numEntries);
  const exitPoints  = pickEdgePoints(numExits, entryPoints);
  for(let i = 0; i < numEntries; i++){
    const entry = entryPoints[i];
    const exit  = exitPoints[i % numExits];
    const cells = buildRandomPath(entry, exit);
    if(cells.length >= 2) PATHS.push(makePath(cells));
  }
  if(PATHS.length === 0){
    // Fallback: at least one straight path so the game never stalls.
    PATHS.push(makePath(buildRandomPath(
      { x: -1, y: Math.floor(GRID_ROWS / 2), edge: 'L' },
      { x: GRID_COLS, y: Math.floor(GRID_ROWS / 2), edge: 'R' }
    )));
  }
  buildPathOccupied();
}
// Wrap a list of cells into a Path object with cached length.
function makePath(cells){
  let len = 0;
  for(let i = 0; i < cells.length - 1; i++){
    len += Math.abs(cells[i+1].x - cells[i].x) + Math.abs(cells[i+1].y - cells[i].y);
  }
  return { cells, length: len };
}
// Pick N random edge points avoiding the given exclusion set.
function pickEdgePoints(n, exclude){
  const used = new Set();
  if(exclude){
    for(const e of exclude) used.add(e.edge + ':' + (e.edge === 'L' || e.edge === 'R' ? e.y : e.x));
  }
  const out = [];
  // Available edges: L (left), R (right), T (top), B (bottom)
  const edges = ['L', 'R', 'T', 'B'];
  let tries = 0;
  while(out.length < n && tries < 50){
    tries++;
    const edge = edges[Math.floor(Math.random() * edges.length)];
    let p;
    if(edge === 'L'){
      const y = 2 + Math.floor(Math.random() * Math.max(1, GRID_ROWS - 4));
      p = { x: -1, y, edge };
    } else if(edge === 'R'){
      const y = 2 + Math.floor(Math.random() * Math.max(1, GRID_ROWS - 4));
      p = { x: GRID_COLS, y, edge };
    } else if(edge === 'T'){
      const x = 2 + Math.floor(Math.random() * Math.max(1, GRID_COLS - 4));
      p = { x, y: -1, edge };
    } else {
      const x = 2 + Math.floor(Math.random() * Math.max(1, GRID_COLS - 4));
      p = { x, y: GRID_ROWS, edge };
    }
    const k = edge + ':' + (edge === 'L' || edge === 'R' ? p.y : p.x);
    if(used.has(k)) continue;
    used.add(k);
    out.push(p);
  }
  return out;
}
// Generate a sequence of waypoints from `entry` to `exit` with a random walk.
// Walks toward the exit on each "hop" (alternating axis), with vertical /
// horizontal detours for interest.
function buildRandomPath(entry, exit){
  const pts = [{ x: entry.x, y: entry.y }];
  // First cell: just inside the grid from the entry.
  let cur;
  if(entry.edge === 'L')      cur = { x: 0, y: entry.y };
  else if(entry.edge === 'R') cur = { x: GRID_COLS - 1, y: entry.y };
  else if(entry.edge === 'T') cur = { x: entry.x, y: 0 };
  else                         cur = { x: entry.x, y: GRID_ROWS - 1 };
  pts.push({ ...cur });

  // Target cell: just inside the grid from the exit.
  let target;
  if(exit.edge === 'L')      target = { x: 0, y: exit.y };
  else if(exit.edge === 'R') target = { x: GRID_COLS - 1, y: exit.y };
  else if(exit.edge === 'T') target = { x: exit.x, y: 0 };
  else                        target = { x: exit.x, y: GRID_ROWS - 1 };

  // Random walk toward the target. Up to ~10 detour waypoints.
  const detours = 5 + Math.floor(Math.random() * 5);
  for(let i = 0; i < detours; i++){
    // Move along a random axis by a small step, biased toward the target.
    const axis = Math.random() < 0.5 ? 'x' : 'y';
    if(axis === 'x'){
      const dist = target.x - cur.x;
      if(Math.abs(dist) > 1){
        const step = Math.sign(dist) * (2 + Math.floor(Math.random() * 3));
        cur.x = clamp(cur.x + step, 1, GRID_COLS - 2);
        pts.push({ ...cur });
      } else {
        // Wiggle vertically
        const step = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 2));
        cur.y = clamp(cur.y + step, 1, GRID_ROWS - 2);
        pts.push({ ...cur });
      }
    } else {
      const dist = target.y - cur.y;
      if(Math.abs(dist) > 1){
        const step = Math.sign(dist) * (2 + Math.floor(Math.random() * 3));
        cur.y = clamp(cur.y + step, 1, GRID_ROWS - 2);
        pts.push({ ...cur });
      } else {
        const step = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 2));
        cur.x = clamp(cur.x + step, 1, GRID_COLS - 2);
        pts.push({ ...cur });
      }
    }
  }
  // Final approach to the target waypoint, two-axis manhattan.
  if(cur.x !== target.x){ cur.x = target.x; pts.push({ ...cur }); }
  if(cur.y !== target.y){ cur.y = target.y; pts.push({ ...cur }); }
  // Step off the grid into the exit cell.
  pts.push({ x: exit.x, y: exit.y });
  return pts;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function generatePath(){ generatePaths(); }   // back-compat alias
generatePaths();

// ── UPGRADE SYSTEM ────────────────────────────────────────────────────────────
// Each tower has three stats upgradeable to level 5. Effects compound linearly.
const MAX_UP_LEVEL = 5;
const UP_COST = [0, 25, 45, 75, 120, 180];   // index = next level (1..5)
function effectiveStats(t){
  const def = TOWER_TYPES[t.type];
  const up  = t.upgrades || { damage:0, speed:0, range:0 };
  return {
    range:    def.range    * (1 + up.range  * 0.18),
    damage:   def.damage   * (1 + up.damage * 0.40),
    cooldown: def.cooldown * (1 - up.speed  * 0.15),   // level 5 = 25% cooldown
    slow:     def.slow,
    splashRadius: def.splashRadius,
    // Slow tower: DAMAGE-level upgrade extends the slow duration (+ 1s per level)
    slowMs:   SLOW_DURATION_MS + up.damage * 1000,
  };
}
function upgradeCost(t, stat){
  const next = (t.upgrades[stat] || 0) + 1;
  if(next > MAX_UP_LEVEL) return Infinity;
  return UP_COST[next];
}
function tryUpgrade(towerIdx, stat){
  const t = towers[towerIdx];
  if(!t) return;
  if((t.upgrades[stat] || 0) >= MAX_UP_LEVEL){ flashMsg('MAX LEVEL'); return; }
  const cost = upgradeCost(t, stat);
  if(energy < cost){ flashMsg('NOT ENOUGH ENERGY'); return; }
  energy -= cost;
  t.upgrades[stat]++;
  renderUpgradePanel();
}
function sellTower(towerIdx){
  const t = towers[towerIdx];
  if(!t) return;
  const def = TOWER_TYPES[t.type];
  let spent = def.cost;
  for(const s of ['damage','speed','range']){
    for(let lvl = 1; lvl <= (t.upgrades[s]||0); lvl++) spent += UP_COST[lvl];
  }
  energy += Math.floor(spent * 0.6);
  towers.splice(towerIdx, 1);
  selectedPlacedIdx = -1;
  hideUpgradePanel();
}

// ── UPGRADE PANEL UI ──────────────────────────────────────────────────────────
function showUpgradePanel(){ renderUpgradePanel(); }
function hideUpgradePanel(){
  // If a panel was actually open, ALSO deselect the tower-creation chip in
  // the bottom bar — otherwise a stray tap on an empty cell right after
  // closing would accidentally place a new tower. (Skip when called from
  // startGame / enterPlacementPhase where no panel was open and the caller
  // wants to preserve selectedTower.)
  const wasOpen = selectedPlacedIdx >= 0;
  selectedPlacedIdx = -1;
  if(wasOpen){
    selectedTower = null;
    buildTowerBar();
  }
  document.getElementById('upgrade-panel').style.display = 'none';
}
function renderUpgradePanel(){
  const panel = document.getElementById('upgrade-panel');
  if(selectedPlacedIdx < 0 || selectedPlacedIdx >= towers.length){
    panel.style.display = 'none';
    return;
  }
  const t = towers[selectedPlacedIdx];
  const def = TOWER_TYPES[t.type];
  function row(stat, label){
    const lvl = t.upgrades[stat] || 0;
    const dots = [];
    for(let i = 1; i <= MAX_UP_LEVEL; i++){
      dots.push(`<div class="dot ${i <= lvl ? 'on' : ''}"></div>`);
    }
    const maxed = lvl >= MAX_UP_LEVEL;
    const cost = maxed ? '—' : upgradeCost(t, stat);
    const enough = !maxed && energy >= cost;
    const cls = (maxed || !enough) ? 'up-btn disabled' : 'up-btn';
    const onclick = (maxed || !enough) ? '' : `onclick="tryUpgrade(${selectedPlacedIdx},'${stat}')"`;
    const btnLabel = maxed ? 'MAX' : ('+ ' + cost + '⚡');
    return `<div class="stat-row">
      <span class="label">${label}</span>
      <div class="dots">${dots.join('')}</div>
      <button class="${cls}" ${onclick}>${btnLabel}</button>
    </div>`;
  }
  // Refund preview
  let spent = def.cost;
  for(const s of ['damage','speed','range']){
    for(let lvl=1; lvl<=(t.upgrades[s]||0); lvl++) spent += UP_COST[lvl];
  }
  const refund = Math.floor(spent * 0.6);

  panel.innerHTML = `
    <h3 style="color:${def.color};text-shadow:0 0 12px ${def.color}88">${def.name}</h3>
    ${t.type === 'slow'
       ? row('damage','DURATION') + row('speed','COOLDOWN') + row('range','RANGE')
       : row('damage','DAMAGE')   + row('speed','SPEED')    + row('range','RANGE')}
    <div class="panel-row">
      <button class="sell-btn" onclick="sellTower(${selectedPlacedIdx})">SELL +${refund}⚡</button>
      <button class="close-btn" onclick="hideUpgradePanel()">CLOSE</button>
    </div>
  `;
  panel.style.display = 'block';
}

canvas.addEventListener('click', e => handlePlace(e.clientX, e.clientY));
canvas.addEventListener('touchend', e => {

    e.preventDefault();
    handlePlace(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
}, {passive:false});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape' && running) showPauseMenu();
  if(e.key === '1') selectTower('cannon');
  if(e.key === '2') selectTower('laser');

function handlePlace(clientX, clientY){
  if(!running) return;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const c = worldToCell(x, y);

  // 1) Tap on an existing tower → open / switch its upgrade panel. Also
  //    DESELECT the tower-creation chip in the bottom bar so the next tap
  //    on an empty cell doesn't accidentally place a new tower.
  if(c.cx >= 0 && c.cx < GRID_COLS && c.cy >= 0 && c.cy < GRID_ROWS){
    const existing = towers.findIndex(t => t.cx === c.cx && t.cy === c.cy);
    if(existing >= 0){
      selectedPlacedIdx = existing;
      selectedTower = null;
      buildTowerBar();
      showUpgradePanel();
      return;
    }
  }

  // 2) Any other tap → close the panel (clicking "outside" a tower).
  //    hideUpgradePanel() also clears selectedTower, so a subsequent tap on
  //    an empty cell does nothing until the player re-taps a chip in the bar.
  hideUpgradePanel();

  // ── Placement phase (after path mutation) ──
  // Re-place the player's existing towers from the pendingPlacements queue.
  // Upgrades are preserved; nothing is bought or refunded.
  if(awaitingPlacement){
    if(c.cx < 0 || c.cx >= GRID_COLS || c.cy < 0 || c.cy >= GRID_ROWS) return;
    if(PATH_OCCUPIED.has(`${c.cx},${c.cy}`)) return;
    if(towers.some(t => t.cx === c.cx && t.cy === c.cy)) return;
    if(pendingPlacements.length === 0) return;
    // Auto-pick the first pending tower if the player hasn't tapped one.
    if(selectedPending < 0 || selectedPending >= pendingPlacements.length){
      selectedPending = 0;
    }
    const p = pendingPlacements.splice(selectedPending, 1)[0];
    towers.push({
      cx: c.cx, cy: c.cy, type: p.type,
      lastShotMs: 0, angle: 0, target: null,
      upgrades: { damage: p.upgrades.damage, speed: p.upgrades.speed, range: p.upgrades.range }
    });
    selectedPending = -1;
    buildTowerBar();
    return;
  }

  // 3) Then try to place a new tower from the bottom-bar selection.
  //    If no chip is selected (just closed an upgrade panel), do nothing —
  //    the player must explicitly tap a chip first to opt in to placement.
  if(!selectedTower) return;
  if(c.cx < 0 || c.cx >= GRID_COLS || c.cy < 0 || c.cy >= GRID_ROWS) return;
  if(PATH_OCCUPIED.has(`${c.cx},${c.cy}`)) return;
  const def = TOWER_TYPES[selectedTower];
  if(energy < def.cost){ flashMsg('NOT ENOUGH ENERGY'); return; }
  if(def.coinCost > 0){
    if(!Coins.canSpend(def.coinCost)){ flashMsg('NEED ' + def.coinCost + '🪙'); return; }
    if(!Coins.spend(def.coinCost, 'place-' + selectedTower)) return;
  }
  energy -= def.cost;
  towers.push({
    cx: c.cx, cy: c.cy, type: selectedTower,
    lastShotMs: 0, angle: 0, target: null,
    upgrades: { damage: 0, speed: 0, range: 0 }
  });
}

      `;

    });

    div.className = 'twr' + (selectedTower === key ? ' active' : '') + (affordable ? '' : ' locked');

      <div class="icon">${towerIconSVG(key, t.color)}</div>
      <div class="name">${t.name}</div>
      <div class="cost">${t.cost}⚡</div>
      ${coinTxt}
    `;

}

// ── ENEMY PATHING ─────────────────────────────────────────────────────────────
function enemyPathLength(pathId){
  const p = PATHS[pathId] || PATHS[0];
  return p ? p.length : 0;
}

function enemyPosAt(t, pathId){
  // t in [0..1] along the given path, returns world position
  const path = PATHS[pathId] || PATHS[0];
  if(!path) return { x: 0, y: 0 };
  const cells = path.cells;
  const total = path.length;
  let acc = 0;
  for(let i = 0; i < cells.length - 1; i++){
    const a = cells[i], b = cells[i + 1];
    const segLen = Math.abs(b.x - a.x) + Math.abs(b.y - a.y);
    const fracStart = acc / total;
    const fracEnd = (acc + segLen) / total;
    if(t >= fracStart && t <= fracEnd){
      const segT = (t - fracStart) / (fracEnd - fracStart);
      const cx = a.x + (b.x - a.x) * segT;
      const cy = a.y + (b.y - a.y) * segT;
      return cellToWorld(cx, cy);
    }
    acc += segLen;
  }
  const last = cells[cells.length - 1];
  return cellToWorld(last.x, last.y);
}

function spawnEnemy(type, opts){
  const def = ENEMY_TYPES[type];
  // Endless scaling — HP grows steeply, speed grows mildly. Bosses scale HARDER.
  // Early waves are EXPLICITLY slowed (×0.55 at wave 1, ×0.75 at wave 2) so
  // a player with 2-3 starter cannons can actually keep up. From wave 3
  // onward HP/speed both ramp; the speed cap was raised so late-game waves
  // remain a real challenge instead of plateauing at +85 %.
  const hpMul    = (type === 'boss')
                   ? 1 + (waveNum - 1) * 0.28
                   : 1 + (waveNum - 1) * 0.15;
  const speedMul = waveNum <= 1 ? 0.55
                 : waveNum === 2 ? 0.75
                 : 1 + Math.min(1.20, (waveNum - 3) * 0.05);
  // Pick a random path for this enemy. Splitters inherit the parent path so
  // their minis pop along the same lane.
  const pathId = (opts && Number.isInteger(opts.pathId))
               ? opts.pathId
               : Math.floor(Math.random() * Math.max(1, PATHS.length));
  const e = {
    type, hp: def.hp * hpMul, maxHp: def.hp * hpMul,
    pathId,
    progress: (opts && opts.progress) || 0,
    speed: def.speed * speedMul,    // cells / sec
    color: def.color, size: def.size,
    slowUntil: 0, slowMult: 1,
    splitter: !!def.splitter, splitInto: def.splitInto, splitCount: def.splitCount || 0,
    shielded: !!def.shielded,
    swift:    !!def.swift,
    isMini:   (opts && opts.isMini) || false
  };
  enemies.push(e);
}

// ── WAVES ─────────────────────────────────────────────────────────────────────
const WAVE_PREP_MS = 5000;        // countdown before each wave's first spawn
const PATH_MUTATION_EVERY = 8;    // regen path every N waves — refunds towers
function startNextWave(){
  waveNum++;
  enemiesSpawnedThisWave = 0;
  enemiesKilledThisWave = 0;
  enemiesToSpawn = [];

  // ── PATH MUTATION ──
  // Every PATH_MUTATION_EVERY waves the path regenerates. Existing towers are
  // pushed into the `pendingPlacements` queue (preserving their upgrades) and
  // the player gets a FREE placement phase: pick each tower from the bar,
  // place it on the new layout, then click START WAVE to begin. Nothing is
  // re-bought — the towers you owned before mutation are placed for free.
  if(waveNum > 1 && (waveNum - 1) % PATH_MUTATION_EVERY === 0 && towers.length > 0){
    enterPlacementPhase();
    return;   // wave doesn't start until exitPlacementPhase()
  }

  buildWaveQueue();
  flashMsg('WAVE ' + waveNum);
  hideOverlay();
}

// Snapshot current towers as "pending" placements, regenerate the path, and
// pause the wave-spawn flow until the player clicks START WAVE.
function enterPlacementPhase(){
  pendingPlacements = towers.map(t => ({
    type: t.type,
    upgrades: { damage: t.upgrades.damage|0, speed: t.upgrades.speed|0, range: t.upgrades.range|0 }
  }));
  towers = [];
  enemies = [];
  projectiles = [];
  selectedPlacedIdx = -1;
  selectedPending = -1;
  hideUpgradePanel();
  generatePath();
  awaitingPlacement = true;
  waveActive = false;
  flashMsg('PATH MUTATED — riposiziona ' + pendingPlacements.length + ' torrette');
  buildTowerBar();
}

function exitPlacementPhase(){
  awaitingPlacement = false;
  selectedPending = -1;
  selectedTower = 'cannon';
  buildTowerBar();
  buildWaveQueue();
  flashMsg('WAVE ' + waveNum);
  hideOverlay();
}

// Prep is timed in REAL seconds (performance.now) so the countdown always
// matches a real-world stopwatch regardless of gameSpeed. Enemy spawn gaps
// AFTER the prep are still in scaled game-time so the spawn pattern moves
// in lockstep with movement / firing speed.
let wavePrepEndsRealMs = 0;
let prepDoneAtGameTime = -1;
function buildWaveQueue(){
  const def = waveDef(waveNum);
  enemiesToSpawn = [];
  for(const group of def){
    let t = (group.wait || 0);            // ms offset from prep-end, in scaled game-time
    for(let i = 0; i < group.count; i++){
      enemiesToSpawn.push({ type: group.type, atMsAfterPrep: t });
      t += group.gap;
    }
  }
  wavePrepEndsRealMs = performance.now() + WAVE_PREP_MS;   // ← REAL time
  prepDoneAtGameTime = -1;
  waveActive = true;
  // Estimate waveStartMs for any code that still queries it (visual only).
  // The true gate is wavePrepEndsRealMs.
  waveStartMs = gameTime + WAVE_PREP_MS * gameSpeed;
}

function maybeSpawnFromQueue(){
  if(!waveActive) return;
  // Wait for the real-time prep to finish (countdown is in REAL seconds).
  if(performance.now() < wavePrepEndsRealMs) return;
  // Latch the gameTime at the moment prep ended so spawn offsets resolve.
  if(prepDoneAtGameTime < 0) prepDoneAtGameTime = gameTime;
  // Spawn any enemy whose time has come
  while(enemiesToSpawn.length
        && enemiesToSpawn[0].atMsAfterPrep <= (gameTime - prepDoneAtGameTime)){
    spawnEnemy(enemiesToSpawn.shift().type);
    enemiesSpawnedThisWave++;
  }
  // Wave done?
  if(!enemiesToSpawn.length && enemies.length === 0){
    waveActive = false;
    // Endless: reward scales with wave (boss waves give more).
    // Wave 1 → 2 coins so a free-mode player can afford a freeze (3🪙) by
    // wave 2 and a laser (4🪙) by wave 3 — keeping the strategic options open.
    const reward = 2 + Math.floor(waveNum / 2) + (waveNum % 5 === 0 ? 3 : 0);
    if(Coins) Coins.add(reward, 'wave-' + waveNum);
    flashMsg('WAVE ' + waveNum + ' CLEAR  +' + reward + '🪙');
    // Auto-start the next wave's countdown after a short pause
    setTimeout(() => { if(running) startNextWave(); }, 1500);
  }
}

// ── COMBAT ────────────────────────────────────────────────────────────────────
function updateEnemies(dtMs){
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.slowMult = (gameTime < e.slowUntil) ? 0.5 : 1;
    // Move along path (each enemy has its own pathId & path length)
    const totalLen = enemyPathLength(e.pathId);
    e.progress += (e.speed * e.slowMult) * (dtMs / 1000) / totalLen;
    if(e.progress >= 1){
      // Reached end → damage player
      const dmg = e.type === 'boss' ? 5 : (e.type === 'tank' ? 2 : 1);
      lives -= dmg;
      enemies.splice(i, 1);
      if(lives <= 0){ onLose(); return; }
      continue;
    }
    const p = enemyPosAt(e.progress, e.pathId);
    e._prevX = e.x; e._prevY = e.y;     // remember last pos for sprite rotation
    e.x = p.x; e.y = p.y;
  }
}

function distance2(ax, ay, bx, by){
  const dx = ax - bx, dy = ay - by;
  return dx*dx + dy*dy;
}

function updateTowers(dtMs){
  for(const t of towers){
    const def  = TOWER_TYPES[t.type];
    const eff  = effectiveStats(t);
    const tw   = cellToWorld(t.cx, t.cy);
    const rangePx = eff.range * CELL;
    // SLOW tower: fires a burst on cooldown. When ready and ≥1 enemy in range,
    // slows ALL enemies currently in range for `eff.slowMs` then enters cooldown.
    if(t.type === 'slow'){
      if(gameTime - t.lastShotMs >= eff.cooldown){
        // Find any enemy in range to trigger
        let anyIn = false;
        for(const e of enemies){
          if(distance2(tw.x, tw.y, e.x, e.y) <= rangePx * rangePx){ anyIn = true; break; }
        }
        if(anyIn){
          t.lastShotMs = gameTime;
          // Visual pulse
          projectiles.push({
            kind:'blast', x:tw.x, y:tw.y, life:380,
            radius: rangePx, color: def.projColor
          });
          // Apply slow to every NON-SHIELDED enemy currently inside the radius
          for(const e of enemies){
            if(e.shielded) continue;     // shielded enemies ignore freeze
            if(distance2(tw.x, tw.y, e.x, e.y) <= rangePx * rangePx){
              e.slowUntil = Math.max(e.slowUntil, gameTime + eff.slowMs);
            }
          }
        }
      }
      continue;
    }
    let target = null, bestD = Infinity;
    for(const e of enemies){
      const d2 = distance2(tw.x, tw.y, e.x, e.y);
      if(d2 <= rangePx * rangePx && d2 < bestD){ bestD = d2; target = e; }
    }
    t.target = target;
    if(target){
      t.angle = Math.atan2(target.y - tw.y, target.x - tw.x);
      if(gameTime - t.lastShotMs >= eff.cooldown){
        t.lastShotMs = gameTime;
        fireProjectile(t, target, eff);
      }
    }
  }
}

function fireProjectile(t, target, eff){
  const def = TOWER_TYPES[t.type];
  const tw  = cellToWorld(t.cx, t.cy);
  if(t.type === 'laser'){
    target.hp -= eff.damage;
    projectiles.push({
      kind:'beam', x:tw.x, y:tw.y, tx:target.x, ty:target.y,
      color: def.projColor, life: 100
    });
    if(target.hp <= 0) onEnemyKilled(target);
  } else {
    const dx = target.x - tw.x, dy = target.y - tw.y;
    const d = Math.hypot(dx, dy) || 1;
    const speed = 12;
    projectiles.push({
      kind: t.type === 'splash' ? 'splash' : 'shot',
      x:tw.x, y:tw.y,
      vx: (dx/d) * speed, vy: (dy/d) * speed,
      target, damage: eff.damage,
      color: def.projColor,
      splashRadius: eff.splashRadius ? eff.splashRadius * CELL : 0
    });
  }
}

function updateProjectiles(dtMs){
  for(let i = projectiles.length - 1; i >= 0; i--){
    const p = projectiles[i];
    if(p.kind === 'beam'){
      p.life -= dtMs;
      if(p.life <= 0) projectiles.splice(i, 1);
      continue;
    }
    p.x += p.vx;
    p.y += p.vy;
    // Hit detection — bigger hit radius (was 14² = 196) so fast enemies like
    // runners and swifts don't slip past a passing projectile.
    const HIT_R2 = 18 * 18;
    let hitEnemy = null;
    if(p.target && p.target.hp > 0 && distance2(p.x, p.y, p.target.x, p.target.y) < HIT_R2){
      hitEnemy = p.target;
    } else {
      // Fallback: the locked-on target may have died or moved out of the way
      // (common when several cannons fire at the same closest enemy). If the
      // projectile is passing near ANY live enemy, score the hit there
      // instead of letting the projectile fly into the void.
      for(const e of enemies){
        if(e.hp <= 0) continue;
        if(distance2(p.x, p.y, e.x, e.y) < HIT_R2){
          hitEnemy = e;
          break;
        }
      }
    }
    if(hitEnemy){
      if(p.kind === 'splash'){
        // Splash damage to all enemies in radius
        const r2 = p.splashRadius * p.splashRadius;
        for(const e of enemies){
          if(distance2(p.x, p.y, e.x, e.y) <= r2){
            e.hp -= p.damage;
            if(e.hp <= 0) onEnemyKilled(e);
          }
        }
        // Visual blast
        projectiles.push({ kind:'blast', x:p.x, y:p.y, life: 200, radius: p.splashRadius, color: p.color });
      } else {
        hitEnemy.hp -= p.damage;
        if(hitEnemy.hp <= 0) onEnemyKilled(hitEnemy);
      }
      projectiles.splice(i, 1);
      continue;
    }
    // Off-screen cleanup
    if(p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50){
      projectiles.splice(i, 1);
    }
    if(p.kind === 'blast'){
      p.life -= dtMs;
      if(p.life <= 0) projectiles.splice(i, 1);
    }
  }
}

function onEnemyKilled(e){
  if(e._dead) return;
  e._dead = true;
  const def = ENEMY_TYPES[e.type];
  energy += def.reward;
  enemiesKilledThisWave++;
  // Splitter: on death, spawn N minis at the same path progress, slightly
  // staggered so they fan out instead of overlapping into a single dot.
  if(e.splitter && e.splitInto){
    const n = e.splitCount;
    for(let i = 0; i < n; i++){
      const offset = (i - (n - 1) / 2) * 0.005;   // tiny progress offset
      spawnEnemy(e.splitInto, { progress: Math.max(0, Math.min(0.999, e.progress + offset)), isMini: true, pathId: e.pathId });
    }
  }
  // Remove enemy
  const idx = enemies.indexOf(e);
  if(idx >= 0) enemies.splice(idx, 1);
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  // Base bg — fills the entire viewport (covers letterbox bands when the
  // playable grid is centred on a screen with a different aspect ratio).
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);
  // Decorative scanline pattern on the side bands so the empty area looks
  // intentional. Scanlines are vertical lines every 6 px with a low-alpha cyan.
  ctx.fillStyle = '#0a1428';
  for(let x = 0; x < W; x += 6){
    ctx.fillRect(x, 0, 1, H);
  }
  // Subtle radial vignette toward the centre of the canvas — pulls the eye
  // to the grid without hiding the bands entirely.
  const cx = W/2, cy = H/2;
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  grd.addColorStop(0, '#050810ee');
  grd.addColorStop(1, '#05081000');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  // Subtle dark frame around the playable grid so it pops against the bands.
  ctx.fillStyle = '#04060c';
  ctx.fillRect(gridOX - 6, gridOY - 6, CELL * GRID_COLS + 12, CELL * GRID_ROWS + 12);

  // Skin tile: every non-path cell gets the grass texture. Path cells are
  // overlaid with dirt below. Pokemon skin takes priority if its sprite
  // is loaded; otherwise fall back to the Kenney grass.
  const grassImg = isPokemon() ? (pkSprite('pk_grass') || Assets.imgs.grass)
                  : isKenney() ? Assets.imgs.grass
                  : null;
  if(grassImg && grassImg.naturalWidth > 0){
    for(let cy = 0; cy < GRID_ROWS; cy++){
      for(let cx = 0; cx < GRID_COLS; cx++){
        if(!PATH_OCCUPIED.has(`${cx},${cy}`)){
          ctx.drawImage(grassImg, gridOX + cx*CELL, gridOY + cy*CELL, CELL, CELL);
        }
      }
    }
  }

  // Grid background
  ctx.strokeStyle = '#0a1428';
  ctx.lineWidth = 1;
  for(let i=0;i<=GRID_COLS;i++){
    const x = gridOX + i*CELL;
    ctx.beginPath(); ctx.moveTo(x, gridOY); ctx.lineTo(x, gridOY + GRID_ROWS*CELL); ctx.stroke();
  }
  for(let j=0;j<=GRID_ROWS;j++){
    const y = gridOY + j*CELL;
    ctx.beginPath(); ctx.moveTo(gridOX, y); ctx.lineTo(gridOX + GRID_COLS*CELL, y); ctx.stroke();
  }

  // Skin path tile: pokemon path takes priority if loaded; otherwise Kenney.
  const dirtImg = isPokemon() ? (pkSprite('pk_path') || Assets.imgs.path)
                 : isKenney() ? Assets.imgs.path
                 : null;
  if(dirtImg && dirtImg.naturalWidth > 0){
    // Tile every PATH cell with dirt.
    for(const key of PATH_OCCUPIED){
      const [cx, cy] = key.split(',').map(Number);
      if(cx < 0 || cx >= GRID_COLS || cy < 0 || cy >= GRID_ROWS) continue;
      ctx.drawImage(dirtImg, gridOX + cx*CELL, gridOY + cy*CELL, CELL, CELL);
    }
    // Faint cyan dashed line over each path so the routes stay readable.
    ctx.strokeStyle = '#00f5ff66';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    for(const path of PATHS){
      ctx.beginPath();
      for(let i = 0; i < path.cells.length; i++){
        const p = cellToWorld(path.cells[i].x, path.cells[i].y);
        i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  } else {
    // Classic neon path — draw EACH path separately so they can cross each other.
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for(const path of PATHS){
      ctx.strokeStyle = '#1a2538';
      ctx.lineWidth = CELL * 0.78;
      ctx.beginPath();
      for(let i = 0; i < path.cells.length; i++){
        const p = cellToWorld(path.cells[i].x, path.cells[i].y);
        i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    // Path highlight (dashed) — one pass over all paths.
    ctx.strokeStyle = '#00f5ff44';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    for(const path of PATHS){
      ctx.beginPath();
      for(let i = 0; i < path.cells.length; i++){
        const p = cellToWorld(path.cells[i].x, path.cells[i].y);
        i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  // Entry / exit markers for EVERY path.
  for(const path of PATHS){
    const entry = cellToWorld(path.cells[0].x, path.cells[0].y);
    const exit  = cellToWorld(path.cells[path.cells.length - 1].x, path.cells[path.cells.length - 1].y);
    ctx.fillStyle = '#44ff88'; ctx.shadowColor = '#44ff88'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(entry.x, entry.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff5566'; ctx.shadowColor = '#ff5566';
    ctx.beginPath(); ctx.arc(exit.x, exit.y, 8, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Tower range preview at hover (skipped for MVP, can add later)

  // Towers
  for(const t of towers) drawTower(t);

  // Enemies
  for(const e of enemies) drawEnemy(e);

  // Projectiles
  for(const p of projectiles) drawProjectile(p);

  // Placement-phase overlay (after path mutation): tells the player to
  // re-position their existing towers, then click START WAVE in the bar.
  if(awaitingPlacement){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a0b8e0';
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.035) + 'px Orbitron, sans-serif';
    ctx.fillText('PATH MUTATED', W/2, H/2 - Math.min(W, H) * 0.10);
    ctx.fillStyle = '#00f5ff';
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 24;
    const fontSize = Math.floor(Math.min(W, H) * 0.07);
    ctx.font = 'bold ' + fontSize + 'px Orbitron, sans-serif';
    if(pendingPlacements.length > 0){
      ctx.fillText('Piazza ' + pendingPlacements.length + ' torrette', W/2, H/2 + fontSize * 0.32);
    } else {
      ctx.fillStyle = '#44ff88';
      ctx.shadowColor = '#44ff88';
      ctx.fillText('Pronto — premi START WAVE', W/2, H/2 + fontSize * 0.32);
    }
    ctx.fillStyle = '#a0b8e055';
    ctx.shadowBlur = 0;
    ctx.font = Math.floor(Math.min(W, H) * 0.022) + 'px "Share Tech Mono", monospace';
    ctx.fillText('upgrade preservati — placement gratis', W/2, H/2 + Math.min(W, H) * 0.10);
    ctx.restore();
  }

  // Wave-prep countdown — shown big in the middle BEFORE spawns start.
  // Uses REAL time (performance.now) so the seconds match a stopwatch
  // regardless of the current game-speed multiplier.
  if(waveActive && performance.now() < wavePrepEndsRealMs){
    const remainMs = wavePrepEndsRealMs - performance.now();
    const seconds = Math.ceil(remainMs / 1000);
    const subSec = (remainMs % 1000) / 1000;       // 0..1 within the current second
    const pulse = 1 + (1 - subSec) * 0.20;          // gentle pulse at each tick
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a0b8e0';
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.035) + 'px Orbitron, sans-serif';
    ctx.fillText('WAVE ' + waveNum + ' INCOMING', W/2, H/2 - Math.min(W, H) * 0.10);
    ctx.fillStyle = '#00f5ff';
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 28;
    const fontSize = Math.floor(Math.min(W, H) * 0.16 * pulse);
    ctx.font = 'bold ' + fontSize + 'px Orbitron, sans-serif';
    ctx.fillText(String(seconds), W/2, H/2 + fontSize * 0.32);
    ctx.fillStyle = '#a0b8e055';
    ctx.shadowBlur = 0;
    ctx.font = Math.floor(Math.min(W, H) * 0.022) + 'px "Share Tech Mono", monospace';
    ctx.fillText('place / upgrade your towers', W/2, H/2 + Math.min(W, H) * 0.10);
    ctx.restore();
  }

  // Flash
  if(_flash.t > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, _flash.t);
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.06) + 'px Orbitron, sans-serif';
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 22;
    ctx.textAlign = 'center';
    ctx.fillText(_flash.text, W/2, H/2);
    ctx.restore();
    _flash.t -= 0.015;
  }
}

function drawTower(t){
  const def = TOWER_TYPES[t.type];
  const eff = effectiveStats(t);
  const w = cellToWorld(t.cx, t.cy);
  // Range circle (faint, uses upgraded range)
  ctx.strokeStyle = def.color + '33';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(w.x, w.y, eff.range * CELL, 0, Math.PI*2); ctx.stroke();
  // Selection highlight if this is the currently-picked tower
  const isSelected = towers[selectedPlacedIdx] === t;
  if(isSelected){
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(w.x - CELL*0.42, w.y - CELL*0.42, CELL*0.84, CELL*0.84);
    ctx.setLineDash([]);
  }
  // Tower base tile (Kenney or Pokemon). If the Pokemon skin doesn't have
  // a tower-base sprite the Kenney base is used as a fallback.
  const baseImg = isPokemon() ? (pkSprite('pk_tower_base') || Assets.imgs.base)
                 : isKenney() ? Assets.imgs.base
                 : null;
  if(baseImg && baseImg.naturalWidth > 0){
    ctx.drawImage(baseImg, w.x - CELL*0.45, w.y - CELL*0.45, CELL*0.9, CELL*0.9);
  }
  // Pokemon tower sprite (if available) replaces the neon box + barrel.
  const towerKey = 'pk_tower_' + (t.type === 'slow' ? 'freeze' : t.type);
  const towerImg = isPokemon() ? pkSprite(towerKey) : null;
  if(towerImg){
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(t.angle + Math.PI / 2); // sprite "up" → barrel direction
    const ts = CELL * 0.85;
    ctx.drawImage(towerImg, -ts/2, -ts/2, ts, ts);
    ctx.restore();
  } else {
    // Base
    ctx.fillStyle = def.color + '33';
    ctx.fillRect(w.x - CELL*0.35, w.y - CELL*0.35, CELL*0.7, CELL*0.7);
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = def.color; ctx.shadowBlur = 14;
    ctx.strokeRect(w.x - CELL*0.35, w.y - CELL*0.35, CELL*0.7, CELL*0.7);
    ctx.shadowBlur = 0;
    // Barrel (rotated toward target)
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(t.angle);
    ctx.fillStyle = def.color;
    if(t.type === 'cannon')      ctx.fillRect(0, -3, CELL*0.36, 6);
    else if(t.type === 'laser')  ctx.fillRect(0, -2, CELL*0.42, 4);
    else if(t.type === 'splash'){ ctx.fillRect(0, -4, CELL*0.32, 8); }
    else /* slow */              { ctx.beginPath(); ctx.arc(0, 0, CELL*0.18, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  // Upgrade-level dots underneath the base: 5 small marks per stat
  const total = (t.upgrades?.damage || 0) + (t.upgrades?.speed || 0) + (t.upgrades?.range || 0);
  if(total > 0){
    const maxDots = Math.min(15, total);
    const dotSize = Math.max(2, CELL * 0.05);
    const startX = w.x - (maxDots * (dotSize + 1)) / 2;
    for(let i = 0; i < maxDots; i++){
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(startX + i * (dotSize + 1), w.y + CELL * 0.4, dotSize, dotSize);
    }
  }
}

function drawEnemy(e){
  const def = ENEMY_TYPES[e.type];
  ctx.save();
  ctx.translate(e.x, e.y);

  // Pokemon skin: draw a sprite if available for this enemy type. Sprite is
  // rotated to face the path tangent (so "forward = top of sprite" lines up
  // with movement direction). Each enemy stores its previous (x,y) so we
  // can derive a smooth heading; fall back to no rotation if undefined.
  const skinKey = 'pk_' + e.type;
  const skinImg = isPokemon() ? pkSprite(skinKey) : null;
  if(skinImg){
    // Heading angle from velocity along path. e._prevX/_prevY is updated in
    // updateEnemies — see below. atan2(dy, dx) returns the angle of motion
    // in screen coords (0 = right). To make the SPRITE'S TOP face forward,
    // we add π/2 (since canvas rotate 0 = right and our sprites face up).
    const dx = e.x - (e._prevX !== undefined ? e._prevX : e.x);
    const dy = e.y - (e._prevY !== undefined ? e._prevY : e.y);
    if(dx !== 0 || dy !== 0){
      ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
    }
    const size = e.size * 2.4;        // scale up — the sprite art has padding
    ctx.drawImage(skinImg, -size/2, -size/2, size, size);
  } else {
    // No skin sprite available → procedural shape (default behaviour).
    ctx.fillStyle = def.color;
    ctx.shadowColor = def.color; ctx.shadowBlur = 14;
    if(e.type === 'grunt'){
      ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);
    } else if(e.type === 'runner'){
      ctx.beginPath();
      ctx.moveTo(0, -e.size/2);
      ctx.lineTo(e.size/2, e.size/2);
      ctx.lineTo(-e.size/2, e.size/2);
      ctx.closePath();
      ctx.fill();
    } else if(e.type === 'tank'){
      ctx.beginPath();
      ctx.arc(0, 0, e.size/2, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, e.size*0.2, 0, Math.PI*2); ctx.fill();
    } else if(e.type === 'boss'){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = (i/6) * Math.PI*2;
        const r = e.size * (i%2 === 0 ? 1.0 : 0.55);
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        i===0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    } else if(e.type === 'splitter'){
      ctx.beginPath();
      ctx.moveTo(0, -e.size/2);
      ctx.lineTo(e.size/2, 0);
      ctx.lineTo(0, e.size/2);
      ctx.lineTo(-e.size/2, 0);
      ctx.closePath();
      ctx.fill();
    } else if(e.type === 'mini'){
      ctx.beginPath(); ctx.arc(0, 0, e.size/2, 0, Math.PI*2); ctx.fill();
    } else if(e.type === 'swift'){
      ctx.beginPath();
      ctx.moveTo(-e.size/2, -e.size/2);
      ctx.lineTo(e.size/2,  0);
      ctx.lineTo(-e.size/2, e.size/2);
      ctx.lineTo(-e.size/4, 0);
      ctx.closePath();
      ctx.fill();
    } else if(e.type === 'shielded'){
      ctx.beginPath(); ctx.arc(0, 0, e.size/2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#e0f0ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.size/2 + 3, 0, Math.PI*2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  // Restore so HP-bar / slow-ring don't rotate.
  ctx.restore();
  ctx.save();
  ctx.translate(e.x, e.y);
  // HP bar
  const w = e.size * 1.3, h = 3;
  const ratio = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = '#000';
  ctx.fillRect(-w/2, -e.size/2 - 8, w, h);
  ctx.fillStyle = ratio > 0.5 ? '#44ff88' : (ratio > 0.25 ? '#ffcc00' : '#ff5566');
  ctx.fillRect(-w/2, -e.size/2 - 8, w * ratio, h);
  // Slow indicator (skipped on shielded — they can't be slowed)
  if(gameTime < e.slowUntil && !e.shielded){
    ctx.strokeStyle = '#88ccff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.size/2 + 4, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawProjectile(p){
  if(p.kind === 'beam'){
    ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 12;
    ctx.lineWidth = 3;
    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.tx, p.ty); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    return;
  }
  if(p.kind === 'blast'){
    const t = 1 - (p.life / 200);
    ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 22;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 1 - t;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * t, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    return;
  }
  ctx.fillStyle = p.color;
  ctx.shadowColor = p.color; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

// ── HUD ───────────────────────────────────────────────────────────────────────
let _lastEnergyDisp = -1;
function updateHud(){
  document.getElementById('h-wave').textContent  = String(waveNum);
  document.getElementById('h-lives').textContent = lives;
  const e = Math.round(energy);
  document.getElementById('h-energy').textContent = e;
  document.getElementById('h-coins').textContent = Coins ? Coins.formatted() : '0';
  // When energy changes and the upgrade panel is open, refresh button states
  if(e !== _lastEnergyDisp && selectedPlacedIdx >= 0){
    renderUpgradePanel();
  }
  _lastEnergyDisp = e;
}

// ── FLOW ──────────────────────────────────────────────────────────────────────
function showMenu(){
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  const cards = Object.entries(TOWER_TYPES).map(([key,t]) => {
    const coinTxt = t.coinCost > 0
      ? `<div class="price">${t.cost}⚡ + ${t.coinCost}🪙 / torretta</div>`
      : `<div class="price" style="color:#44ff88">${t.cost}⚡ (gratis)</div>`;
    return `<div class="unlock-card">
      <div style="font-family:Orbitron,sans-serif;font-weight:700;color:${t.color}">${t.name}</div>
      <div>${t.description}</div>
      ${coinTxt}
    </div>`;
  }).join('');
  ol.innerHTML = `
    <h2>NEON DEFENDER+</h2>
    <p>Modalità endless: le ondate si susseguono senza fine, sempre più dure.</p>
    <p>Click su una cella libera per piazzare la torre selezionata. Ogni torretta non-cannon costa 🪙 ad ogni piazzamento.</p>
    <div class="unlock-grid">${cards}</div>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">START</button>
      <button class="btn" id="graphics-toggle-btn" onclick="toggleGraphics()" style="padding:6px 18px;font-size:0.72rem">${graphicsMode === 'kenney' ? 'SPRITE' : 'CLASSICA'}</button>
    </div>
  `;
}

function hideOverlay(){ document.getElementById('overlay').style.display = 'none'; }

function startGame(){
  lives = STARTING_LIVES;
  energy = STARTING_ENERGY;
  waveNum = 0;
  waveActive = false;
  awaitingPlacement = false;
  pendingPlacements = [];
  selectedPending = -1;
  enemies = []; towers = []; projectiles = []; enemiesToSpawn = [];
  gameTime = 0;
  selectedTower = 'cannon';
  selectedPlacedIdx = -1;
  // Recompute grid dimensions for the current screen — produces a grid that
  // fills the viewport instead of being tiny on portrait phones. Locked for
  // the run so existing tower positions stay valid through orientation flips.
  computeGridDimensions();
  computeLayout();
  generatePath();          // brand-new procedural path every run
  hideUpgradePanel();
  buildTowerBar();
  hideOverlay();
  running = true;
  lastT = performance.now();
  startNextWave();
  requestAnimationFrame(loop);
}

function onLose(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">DEFEAT</h2>
    <p>Wave reached: <b style="color:#fff">${waveNum}</b></p>
    <p>Coins: <b style="color:#ffcc00">${Coins ? Coins.formatted() : '0'}</b></p>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">RETRY</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function showPauseMenu(){
  running = false;
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>PAUSE</h2>
    <p>Wave ${waveNum} · Lives ${lives} · Energy ${Math.round(energy)}</p>
    <div class="btn-row">
      <button class="btn" onclick="resumeGame()">RESUME</button>
      <button class="btn" onclick="startGame()">RESTART</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
}

function resumeGame(){
  hideOverlay();
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function goBack(){
  if(running && !confirm('Tornare al menu principale?')) return;
  window.location.href = '../';
}

// ── FLASH ─────────────────────────────────────────────────────────────────────
let _flash = { text:'', t:0 };
function flashMsg(text){ _flash.text = text; _flash.t = 1; }

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastT = 0;
// Speed multiplier for the simulation (player-controlled via the ×N button
// stacked under the back button). Cycles 1 → 2 → 3 → 1. Applied to every
// per-frame dt before passing to update functions, so enemy movement,
// tower firing, projectile travel and spawn schedule all scale uniformly.
// **Does NOT scale countdowns** — those are measured in REAL time
// (performance.now) so a "5 seconds" prep stays 5 real seconds regardless
// of the simulation speed.
let gameSpeed = 2;   // default: 2× (per user preference)
function toggleGameSpeed(){
  gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 3 : 1;
  const b = document.getElementById('speed-btn');
  if(b){
    b.textContent = gameSpeed + '×';
    b.classList.toggle('active', gameSpeed > 1);
  }
}
function loop(ts){
  if(!running) return;
  const realDt = Math.min(40, ts - lastT);
  lastT = ts;
  const dt = realDt * gameSpeed;     // ⟵ scaled by the player's speed setting
  gameTime += dt;
  updateEnemies(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  maybeSpawnFromQueue();
  draw();
  updateHud();
  requestAnimationFrame(loop);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
buildTowerBar();
showMenu();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

window.addEventListener('coins:change', () => { updateHud(); buildTowerBar(); });
</script>
