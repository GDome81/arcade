<html lang="it">
<head>

<link rel="stylesheet" href="../shared/theme.css">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050810;color:#e0e8ff;
    font-family:'Share Tech Mono',monospace;overflow:hidden;
    min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;
  }
  #game-wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  #game{display:block;width:100%;height:100%;background:#050810;touch-action:none}

  #hud{
    position:fixed;top:0;left:0;right:0;padding:8px 56px 8px 60px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:linear-gradient(to bottom,#050810dd,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center;min-width:48px}
  .hud-label{font-size:9px;letter-spacing:.2em;color:#00f5ff99;text-transform:uppercase}
  .hud-value{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.05rem;color:#fff;
    text-shadow:0 0 10px #00f5ff;line-height:1;margin-top:2px;letter-spacing:.05em;
  }
  .hud-value.coins{color:#ffcc00;text-shadow:0 0 10px #ffcc0088}
  .hud-value.energy{color:#44ff88;text-shadow:0 0 10px #44ff8888}
  .hud-value.lives{color:#ff5566;text-shadow:0 0 10px #ff556688}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  }
  /* Speed-toggle button — cycles 1× → 2× → 3× → 1× on tap. Stacked under
     the back button so it doesn't overlap with the top-right Coins block. */
  #speed-btn{
    position:fixed;top:52px;left:8px;min-width:46px;height:32px;padding:0 8px;
    border-radius:6px;background:#0a1428cc;border:1px solid #ffcc00aa;color:#ffcc00;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
    box-shadow:0 0 10px #ffcc0044;
  }
  #speed-btn.active{box-shadow:0 0 16px #ffcc00aa;background:#0a1428ee}
  /* Audio mute toggle — stacked under the speed button. */
  #audio-btn{
    position:fixed;top:90px;left:8px;width:46px;height:32px;padding:0 8px;
    border-radius:6px;background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:auto;
    box-shadow:0 0 10px #00f5ff44;
  }
  #audio-btn.off{ color:#888; border-color:#444; box-shadow:none; }

  /* Tower selector — bottom bar */
  #tower-bar{
    position:fixed;bottom:0;left:0;right:0;padding:10px;
    display:flex;justify-content:center;gap:10px;
    background:linear-gradient(to top,#050810cc,transparent);
    pointer-events:none;z-index:5;
  }
  .twr{
    pointer-events:auto;cursor:pointer;user-select:none;
    width:72px;padding:8px 6px;border-radius:8px;
    background:#0a1428cc;border:2px solid #00f5ff44;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.1em;
    transition:all .15s;
  }
  .twr:hover{border-color:#00f5ff88;background:#0a1428ee}
  .twr.active{border-color:#00f5ff;box-shadow:0 0 18px #00f5ff66;background:#00f5ff11}
  .twr.locked{opacity:.5;cursor:not-allowed}
  .twr.locked:hover{border-color:#00f5ff44}
  .twr .icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
  .twr .name{color:#00f5ff;font-weight:700}
  .twr .cost{color:#44ff88;font-size:9px;letter-spacing:.05em}
  .twr.locked .cost{color:#ffcc00}

  #upgrade-panel{
    position:fixed;left:50%;transform:translateX(-50%);bottom:90px;
    z-index:6;min-width:240px;max-width:340px;padding:12px 14px;border-radius:10px;
    background:#0a1428ee;border:1px solid #00f5ff88;display:none;
    box-shadow:0 0 28px #00f5ff44;
    font-family:'Share Tech Mono',monospace;color:#e0e8ff;
  }
  #upgrade-panel h3{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.95rem;
    letter-spacing:.2em;color:#00f5ff;margin-bottom:8px;text-align:center;
    text-shadow:0 0 12px #00f5ff77;
  }
  .stat-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:5px 0;font-size:.78rem;
  }
  .stat-row .label{color:#a0b8e0;letter-spacing:.12em;width:60px}
  .stat-row .dots{display:flex;gap:3px}
  .stat-row .dot{
    width:9px;height:9px;border-radius:50%;
    border:1px solid #00f5ff44;background:transparent;
  }
  .stat-row .dot.on{background:#00f5ff;box-shadow:0 0 8px #00f5ff;border-color:#00f5ff}
  .stat-row .up-btn{
    padding:3px 10px;border-radius:4px;cursor:pointer;
    background:#0a1428;border:1px solid #44ff88;color:#44ff88;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.08em;
  }
  .stat-row .up-btn:hover{background:#44ff8822;box-shadow:0 0 12px #44ff8888}
  .stat-row .up-btn.disabled{
    border-color:#88888844;color:#888;cursor:not-allowed;background:transparent;
  }
  .panel-row{display:flex;gap:8px;margin-top:8px;justify-content:space-between}
  .panel-row .sell-btn{
    flex:1;padding:6px;background:#0a1428;border:1px solid #ff998866;color:#ff9988;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em;
    cursor:pointer;border-radius:4px;
  }
  .panel-row .close-btn{
    padding:6px 12px;background:#0a1428;border:1px solid #00f5ff66;color:#00f5ff;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em;
    cursor:pointer;border-radius:4px;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#050810cc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.2rem;
    color:#00f5ff;letter-spacing:.25em;text-shadow:0 0 30px #00f5ff;margin-bottom:6px;
  }
  #overlay p{color:#a0b8e0;font-size:.92rem;letter-spacing:.1em}
  .btn{
    margin-top:8px;padding:10px 24px;background:transparent;border:2px solid #00f5ff;
    color:#00f5ff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #00f5ff44;transition:all .15s;
  }
  .btn:hover{background:#00f5ff22;box-shadow:0 0 28px #00f5ff88}
  .btn.warn{border-color:#ffcc00;color:#ffcc00;box-shadow:0 0 18px #ffcc0044}
  .btn.warn:hover{background:#ffcc0022;box-shadow:0 0 28px #ffcc0088}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

  .unlock-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;max-width:520px;margin-top:8px;
  }
  .unlock-card{
    border:1px solid #00f5ff44;border-radius:8px;padding:10px;background:#0a142866;
    font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .unlock-card.owned{border-color:#44ff88;color:#44ff88}
  .unlock-card .price{color:#ffcc00;font-family:Orbitron,sans-serif;font-weight:700}

  /* Wave-preview bestiary card */
  .enemy-card{
    width:min(440px, 92vw); padding:18px 18px 22px;
    background:#0a1428dd; border:1px solid #00f5ff55; border-radius:14px;
    box-shadow:0 0 38px #00f5ff33; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .enemy-card-hdr{ width:100%; position:relative; }
  .enemy-counter{
    position:absolute; right:0; top:-4px; color:#5a7090; font-size:.7rem;
    font-family:'Orbitron',sans-serif; letter-spacing:.18em;
  }
  .enemy-new-badge{
    position:absolute; left:0; top:-4px; color:#050810; background:#ffcc00;
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:.7rem;
    letter-spacing:.18em; padding:2px 8px; border-radius:4px;
    box-shadow:0 0 14px #ffcc0088;
  }
  .enemy-card h2{
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.6rem;
    letter-spacing:.22em;
  }
  .enemy-sprite{
    width:120px; height:120px; object-fit:contain;
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:radial-gradient(circle, #ffffff08, transparent 70%);
  }
  .enemy-shape{
    display:flex; align-items:center; justify-content:center;
    border-radius:16px; border:2px solid currentColor;
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:3.4rem;
  }
  .enemy-tip{
    color:#ffcc00; font-family:'Orbitron',sans-serif; font-size:.74rem;
    letter-spacing:.14em; margin:0;
  }
  .enemy-desc{
    color:#cdd9ee; font-size:.88rem; line-height:1.4; max-width:380px;
    letter-spacing:.02em; margin:0;
  }
  .enemy-stats{
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:4px;
  }
  .enemy-stats > div{
    display:flex; flex-direction:column; align-items:center; min-width:60px;
    padding:6px 10px; background:#0a142866; border:1px solid #00f5ff33; border-radius:6px;
  }
  .enemy-stats span{
    color:#7a8db0; font-size:.66rem; letter-spacing:.16em;
    font-family:'Orbitron',sans-serif;
  }
  .enemy-stats b{ color:#fff; font-size:1.05rem; margin-top:2px; }
  .enemy-best-row{
    font-family:'Orbitron',sans-serif; font-size:.74rem; letter-spacing:.12em;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  .enemy-best{
    padding:3px 9px; border:1px solid; border-radius:4px;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:.7rem;
    letter-spacing:.14em; background:#0a142866;
  }
  .tutorial-bullets{
    list-style:none; padding:0; margin:0; text-align:left;
    color:#cdd9ee; font-size:.82rem; line-height:1.45; max-width:380px;
    display:flex; flex-direction:column; gap:4px;
  }
  .tutorial-bullets li{
    padding-left:18px; position:relative;
  }
  .tutorial-bullets li::before{
    content:'▸'; color:#00f5ff; position:absolute; left:0;
  }
  .btn[disabled]{ opacity:.3; cursor:not-allowed; box-shadow:none; }
  .btn[disabled]:hover{ background:transparent; }
</style>

<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div style="width:42px"></div>
  <div class="hud-item"><span class="hud-label">Wave</span><span class="hud-value" id="h-wave">0/10</span></div>
  <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-value lives" id="h-lives">20</span></div>
  <div class="hud-item"><span class="hud-label">Energy</span><span class="hud-value energy" id="h-energy">100</span></div>
  <div class="hud-item"><span class="hud-label">Coins</span><span class="hud-value coins" id="h-coins">0</span></div>
</div>

<button id="back-btn" title="Torna al launcher" onclick="goBack()">✖</button>
<button id="speed-btn" class="active" title="Velocita di gioco" onclick="toggleGameSpeed()">2×</button>
<button id="audio-btn" title="Audio on/off" onclick="toggleAudio()">🔊</button>

<div id="tower-bar"></div>

<div id="upgrade-panel"></div>

<div id="overlay"></div>

<script src="../shared/brutimon.js"></script>
<script src="../shared/profile.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/coins.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/cloud-sync.js"></script>
<script src="../shared/leaderboard.js"></script>
<script>
// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  computeLayout();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));

// ── AUDIO ─────────────────────────────────────────────────────────────────────
// Web Audio synth: SFX + simple chord-progression music. The AudioContext is
// lazily created on the first user gesture (browsers block autoplay).
// `silence()` zeros every live gain so leaving the game cuts the sound
// instantly (per project convention — see audio-cleanup feedback memory).
const Sfx = (() => {
  let ctx = null;
  let masterGain = null;     // user mute switch
  let sfxGain = null;        // SFX bus
  let musicGain = null;      // music bus
  let musicTimer = null;     // setInterval handle for the music sequencer
  let musicStep = 0;
  let enabled = localStorage.getItem('defAudioOn') !== 'false';   // default on
  let musicEnabled = localStorage.getItem('defMusicOn') !== 'false';

  function ensure(){
    if(ctx) return ctx;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e){ return null; }
    masterGain = ctx.createGain();
    masterGain.gain.value = enabled ? 1 : 0;
    masterGain.connect(ctx.destination);
    sfxGain = ctx.createGain();
    sfxGain.gain.value = 0.55;
    sfxGain.connect(masterGain);
    musicGain = ctx.createGain();
    musicGain.gain.value = musicEnabled ? 0.18 : 0;
    musicGain.connect(masterGain);
    return ctx;
  }

  // Generic short tone with envelope.
  function tone({freq=440, dur=0.12, type='sine', vol=0.4, attack=0.005, release=0.06, sweep=0, dest}){
    if(!enabled) return;
    if(!ensure()) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if(sweep){
      o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.linearRampToValueAtTime(0, t0 + dur + release);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t0);
    o.stop(t0 + dur + release + 0.02);
  }

  // White-noise burst (for explosions / hits).
  function noise({dur=0.18, vol=0.4, hp=0, lp=12000}){
    if(!enabled) return;
    if(!ensure()) return;
    const t0 = ctx.currentTime;
    const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for(let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = lp;
    const hpf = ctx.createBiquadFilter();
    hpf.type = 'highpass'; hpf.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(hpf); hpf.connect(filt); filt.connect(g); g.connect(sfxGain);
    src.start(t0);
    src.stop(t0 + dur);
  }

  // ── Public SFX ────────────────────────────────────────────────────────────
  function shoot(type){
    if(type === 'cannon') tone({freq:680, dur:0.06, type:'square', vol:0.18, sweep:-220});
    else if(type === 'laser') tone({freq:1400, dur:0.08, type:'sawtooth', vol:0.10, sweep:-300});
    else if(type === 'splash') tone({freq:280, dur:0.10, type:'triangle', vol:0.22, sweep:-120});
    else if(type === 'slow') tone({freq:520, dur:0.18, type:'sine', vol:0.16, sweep:240});
  }
  function explosion(){
    noise({dur:0.32, vol:0.45, hp:120, lp:3200});
    tone({freq:120, dur:0.08, type:'sawtooth', vol:0.22, sweep:-80});
  }
  function enemyHit(){
    noise({dur:0.04, vol:0.18, hp:1200, lp:8000});
  }
  function enemyDeath(type){
    if(type === 'boss'){
      noise({dur:0.6, vol:0.55, hp:60, lp:2400});
      tone({freq:90,  dur:0.5, type:'sawtooth', vol:0.30, sweep:-50});
      tone({freq:160, dur:0.4, type:'square',   vol:0.22, sweep:-80});
    } else if(type === 'tank' || type === 'shielded'){
      noise({dur:0.25, vol:0.38, hp:80, lp:3000});
      tone({freq:200, dur:0.18, type:'square', vol:0.22, sweep:-100});
    } else {
      tone({freq:380, dur:0.08, type:'triangle', vol:0.25, sweep:-200});
    }
  }
  function placeTower(){
    tone({freq:520, dur:0.05, type:'square', vol:0.20});
    setTimeout(() => tone({freq:780, dur:0.06, type:'square', vol:0.20}), 50);
  }
  function waveStart(){
    tone({freq:440,  dur:0.10, type:'square', vol:0.22});
    setTimeout(() => tone({freq:660,  dur:0.12, type:'square', vol:0.24}), 110);
    setTimeout(() => tone({freq:880,  dur:0.16, type:'square', vol:0.26}), 230);
  }
  function bossSpawn(){
    tone({freq:140, dur:0.4, type:'sawtooth', vol:0.30, sweep:60});
    setTimeout(() => tone({freq:90, dur:0.6, type:'sawtooth', vol:0.35, sweep:-30}), 200);
  }
  function gameOver(){
    tone({freq:440, dur:0.2, type:'sawtooth', vol:0.30, sweep:-100});
    setTimeout(() => tone({freq:330, dur:0.25, type:'sawtooth', vol:0.30, sweep:-100}), 220);
    setTimeout(() => tone({freq:220, dur:0.5,  type:'sawtooth', vol:0.32, sweep:-80}),  480);
  }
  function click(){
    tone({freq:880, dur:0.03, type:'square', vol:0.12});
  }

  // ── Music ────────────────────────────────────────────────────────────────
  // 4-chord loop in A minor: Am – F – C – G. Each step is a quarter note at
  // ~110 BPM. On every step we play a bass note + a soft arpeggio note.
  // Sounds intentionally lo-fi / chiptune-ish to match the neon vibe.
  const MUSIC_BPM = 100;
  const CHORDS = [
    { root: 110.00, arp:[220.00, 261.63, 329.63] },   // A minor
    { root:  87.31, arp:[174.61, 220.00, 261.63] },   // F major
    { root:  65.41, arp:[196.00, 261.63, 329.63] },   // C major  (lower root)
    { root:  98.00, arp:[196.00, 246.94, 293.66] }    // G major
  ];
  function musicStepFn(){
    if(!musicEnabled || !enabled) return;
    if(!ensure()) return;
    const beat   = musicStep % 16;       // 16 steps per loop (4 beats × 4 chords)
    const chord  = CHORDS[Math.floor(beat / 4)];
    const inBeat = beat % 4;
    // Bass on beat 0 of each chord.
    if(inBeat === 0){
      tone({freq: chord.root, dur:0.42, type:'triangle', vol:0.28, attack:0.01, release:0.18, dest: musicGain});
    }
    // Arpeggio on beats 1..3.
    if(inBeat > 0){
      const note = chord.arp[(inBeat - 1) % chord.arp.length];
      tone({freq: note, dur:0.22, type:'square', vol:0.10, attack:0.005, release:0.10, dest: musicGain});
    }
    // Subtle high tick on every beat.
    tone({freq: 1500 + (inBeat % 2 === 0 ? 0 : 200), dur:0.02, type:'square', vol:0.04, dest: musicGain});
    musicStep++;
  }
  function startMusic(){
    if(!musicEnabled) return;
    if(!ensure()) return;
    if(musicTimer) return;
    musicStep = 0;
    const stepMs = (60 / MUSIC_BPM) * 1000 / 1;   // 1 step per beat
    musicTimer = setInterval(musicStepFn, stepMs);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  }

  // ── Control ──────────────────────────────────────────────────────────────
  function silence(){
    // Zero gains immediately (matches the project audio-cleanup convention).
    if(masterGain) masterGain.gain.value = 0;
    if(musicGain)  musicGain.gain.value  = 0;
    stopMusic();
  }
  function suspend(){
    silence();
    if(ctx && ctx.state !== 'suspended') ctx.suspend().catch(()=>{});
  }
  function resume(){
    if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    if(masterGain) masterGain.gain.value = enabled ? 1 : 0;
    if(musicGain)  musicGain.gain.value  = (enabled && musicEnabled) ? 0.18 : 0;
  }
  function toggle(){
    enabled = !enabled;
    localStorage.setItem('defAudioOn', enabled ? 'true' : 'false');

// Wave definitions: list of {type, count, gap (ms between spawns), wait (ms before first)}
// Endless mode: difficulty escalates over time. The first ~4 waves are a
// gentle ramp (only grunts) so a player who started with just two cannons
// can build a foothold; new enemy types unlock progressively from there.
function waveDef(n){
  const w = [];
  // Grunts always — gentle start (wave 1 = 4 grunts), then linear growth.
  const grunts = 3 + Math.floor(n * 1.5);
  const grGap  = Math.max(260, 1050 - n * 50);
  w.push({ type:'grunt', count: grunts, gap: grGap, wait: 0 });
  // Runners from wave 3 (was wave 2). Counts grow from wave 3 onward.
  if(n >= 3){
    const runners = Math.max(1, Math.floor(1 + (n - 2) * 1.1));
    w.push({ type:'runner', count: runners, gap: Math.max(220, 600 - n*15), wait: 4500 });
  }
  // Tanks from wave 5 (was wave 3).
  if(n >= 5){
    const tanks = Math.max(1, Math.floor(1 + (n - 4) * 0.5));
    w.push({ type:'tank', count: tanks, gap: Math.max(550, 1200 - n*40), wait: 7500 });
  }
  // Splitters from wave 8 (was 6) — punish chokepoints.
  if(n >= 8){
    const splitters = 1 + Math.floor((n - 8) * 0.3);
    w.push({ type:'splitter', count: splitters, gap: 2000, wait: 5500 });
  }
  // Swift from wave 11 (was 9) — fast, low-HP.
  if(n >= 11){
    const swifts = 2 + Math.floor((n - 11) * 0.5);
    w.push({ type:'swift', count: swifts, gap: 350, wait: 9000 });
  }
  // Shielded from wave 14 (was 12) — immune to freeze.
  if(n >= 14){
    const shielded = 1 + Math.floor((n - 14) * 0.4);
    w.push({ type:'shielded', count: shielded, gap: 1000, wait: 8500 });
  }
  // Boss every 4 waves (was 3), starting from wave 8 (was 6). Multi-boss
  // begins to appear around wave 13. HP scaling is also steeper for bosses
  // inside spawnEnemy.
  if(n >= 8 && n % 4 === 0){
    const bosses = Math.max(1, 1 + Math.floor((n - 12) / 5));
    w.push({ type:'boss', count: bosses, gap: 2200, wait: 10000 });
  }
  return w;
}

// All enemy types appearing in wave n. Splitter "drops" mini at death, so
// mini is shown alongside splitter even though it never spawns directly.
// The bestiary preview shows every enemy in the upcoming wave; the
// "new this wave" subset (against wave n-1) tells the renderer which cards
// to badge as NUOVO so already-seen enemies aren't a surprise.
function enemyTypesInWave(n){
  const here = new Set(waveDef(n).map(g => g.type));
  if(here.has('splitter')) here.add('mini');
  return [...here];
}
function newEnemyTypesInWave(n){
  const here = new Set(enemyTypesInWave(n));
  if(n <= 1) return [...here];
  const prev = new Set(enemyTypesInWave(n - 1));
  return [...here].filter(t => !prev.has(t));
}

// ── LAYOUT ────────────────────────────────────────────────────────────────────
let CELL = 50;
let gridOX = 0, gridOY = 0;       // offset to centre the grid on screen
// Compute GRID_COLS / GRID_ROWS to FILL the viewport given a target cell
// size. Called ONCE at startGame so existing tower coordinates stay valid
// across mid-run resize (the grid count doesn't change during a run; only
// CELL/gridOX/gridOY rescale via computeLayout).
function computeGridDimensions(){
  const hudPad = 60, barPad = 110;
  const availW = Math.max(320, W - 8);
  const availH = Math.max(320, H - hudPad - barPad);
  // Target cell size: bigger on tablet/desktop so towers/enemies feel
  // chunky rather than tiny on big monitors. Smaller on phone to fit
  // a useful grid in landscape. Bounded so the count stays reasonable.
  const targetCell = (availW < 600 || availH < 600) ? 44 : 78;
  GRID_COLS = Math.max(12, Math.min(24, Math.floor(availW / targetCell)));
  GRID_ROWS = Math.max(9,  Math.min(18, Math.floor(availH / targetCell)));
}
function computeLayout(){
  // Fit grid into the canvas, leaving space for HUD top + tower bar bottom.
  // Cell size adapts to the current viewport — but GRID_COLS / GRID_ROWS
  // stay locked for the run (see computeGridDimensions).
  const hudPad = 60, barPad = 110;
  const availW = W;
  const availH = H - hudPad - barPad;
  CELL = Math.floor(Math.min(availW / GRID_COLS, availH / GRID_ROWS));
  gridOX = Math.floor((W - CELL * GRID_COLS) / 2);
  gridOY = hudPad + Math.floor((availH - CELL * GRID_ROWS) / 2);
}
computeGridDimensions();
fitCanvas();

function cellToWorld(cx, cy){ return { x: gridOX + cx*CELL + CELL/2, y: gridOY + cy*CELL + CELL/2 }; }
function worldToCell(wx, wy){
  return { cx: Math.floor((wx - gridOX) / CELL), cy: Math.floor((wy - gridOY) / CELL) };
}

// Pre-compute which cells are on ANY path (forbidden for towers).
let PATH_OCCUPIED = new Set();
function buildPathOccupied(){
  PATH_OCCUPIED = new Set();
  for(const path of PATHS){
    const cells = path.cells;
    for(let i = 0; i < cells.length - 1; i++){
      const a = cells[i], b = cells[i + 1];
      const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
      let x = a.x, y = a.y;
      while(x !== b.x || y !== b.y){
        PATH_OCCUPIED.add(`${x},${y}`);
        if(x !== b.x) x += dx;
        else if(y !== b.y) y += dy;
      }
      PATH_OCCUPIED.add(`${b.x},${b.y}`);
    }
  }
}

// ── PATH GENERATOR ────────────────────────────────────────────────────────────
// Builds 1–3 procedural paths. Each path has its own ENTRY (just outside the
// grid on a random edge) and EXIT (just outside the grid on a different edge).
// Enemies are randomly assigned a path at spawn time. Towers must defend ALL
// paths since enemies are spawned across the lot.
function generatePaths(){
  const numEntries = 1 + Math.floor(Math.random() * 3);   // 1..3
  const numExits   = numEntries >= 2 ? (1 + Math.floor(Math.random() * 2)) : 1;
  PATHS = [];
  // Reserve a few candidate edge points so paths don't share the same entry/exit.
  const entryPoints = pickEdgePoints(numEntries);
  const exitPoints  = pickEdgePoints(numExits, entryPoints);
  for(let i = 0; i < numEntries; i++){
    const entry = entryPoints[i];
    const exit  = exitPoints[i % numExits];
    const cells = buildRandomPath(entry, exit);
    if(cells.length >= 2) PATHS.push(makePath(cells));
  }
  if(PATHS.length === 0){
    // Fallback: at least one straight path so the game never stalls.
    PATHS.push(makePath(buildRandomPath(
      { x: -1, y: Math.floor(GRID_ROWS / 2), edge: 'L' },
      { x: GRID_COLS, y: Math.floor(GRID_ROWS / 2), edge: 'R' }
    )));
  }
  buildPathOccupied();
}
// Wrap a list of cells into a Path object with cached length.
function makePath(cells){
  let len = 0;
  for(let i = 0; i < cells.length - 1; i++){
    len += Math.abs(cells[i+1].x - cells[i].x) + Math.abs(cells[i+1].y - cells[i].y);
  }
  return { cells, length: len };
}
// Pick N random edge points avoiding the given exclusion set.
function pickEdgePoints(n, exclude){
  const used = new Set();
  if(exclude){
    for(const e of exclude) used.add(e.edge + ':' + (e.edge === 'L' || e.edge === 'R' ? e.y : e.x));
  }
  const out = [];
  // Available edges: L (left), R (right), T (top), B (bottom)
  const edges = ['L', 'R', 'T', 'B'];
  let tries = 0;
  while(out.length < n && tries < 50){
    tries++;
    const edge = edges[Math.floor(Math.random() * edges.length)];
    let p;
    if(edge === 'L'){
      const y = 2 + Math.floor(Math.random() * Math.max(1, GRID_ROWS - 4));
      p = { x: -1, y, edge };
    } else if(edge === 'R'){
      const y = 2 + Math.floor(Math.random() * Math.max(1, GRID_ROWS - 4));
      p = { x: GRID_COLS, y, edge };
    } else if(edge === 'T'){
      const x = 2 + Math.floor(Math.random() * Math.max(1, GRID_COLS - 4));
      p = { x, y: -1, edge };
    } else {
      const x = 2 + Math.floor(Math.random() * Math.max(1, GRID_COLS - 4));
      p = { x, y: GRID_ROWS, edge };
    }
    const k = edge + ':' + (edge === 'L' || edge === 'R' ? p.y : p.x);
    if(used.has(k)) continue;
    used.add(k);
    out.push(p);
  }
  return out;
}
// Generate a sequence of waypoints from `entry` to `exit` with a random walk.
// Walks toward the exit on each "hop" (alternating axis), with vertical /
// horizontal detours for interest.
function buildRandomPath(entry, exit){
  const pts = [{ x: entry.x, y: entry.y }];
  // First cell: just inside the grid from the entry.
  let cur;
  if(entry.edge === 'L')      cur = { x: 0, y: entry.y };
  else if(entry.edge === 'R') cur = { x: GRID_COLS - 1, y: entry.y };
  else if(entry.edge === 'T') cur = { x: entry.x, y: 0 };
  else                         cur = { x: entry.x, y: GRID_ROWS - 1 };
  pts.push({ ...cur });

  // Target cell: just inside the grid from the exit.
  let target;
  if(exit.edge === 'L')      target = { x: 0, y: exit.y };
  else if(exit.edge === 'R') target = { x: GRID_COLS - 1, y: exit.y };
  else if(exit.edge === 'T') target = { x: exit.x, y: 0 };
  else                        target = { x: exit.x, y: GRID_ROWS - 1 };

  // Random walk toward the target. Up to ~10 detour waypoints.
  const detours = 5 + Math.floor(Math.random() * 5);
  for(let i = 0; i < detours; i++){
    // Move along a random axis by a small step, biased toward the target.
    const axis = Math.random() < 0.5 ? 'x' : 'y';
    if(axis === 'x'){
      const dist = target.x - cur.x;
      if(Math.abs(dist) > 1){
        const step = Math.sign(dist) * (2 + Math.floor(Math.random() * 3));
        cur.x = clamp(cur.x + step, 1, GRID_COLS - 2);
        pts.push({ ...cur });
      } else {
        // Wiggle vertically
        const step = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 2));
        cur.y = clamp(cur.y + step, 1, GRID_ROWS - 2);
        pts.push({ ...cur });
      }
    } else {
      const dist = target.y - cur.y;
      if(Math.abs(dist) > 1){
        const step = Math.sign(dist) * (2 + Math.floor(Math.random() * 3));
        cur.y = clamp(cur.y + step, 1, GRID_ROWS - 2);
        pts.push({ ...cur });
      } else {
        const step = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 2));
        cur.x = clamp(cur.x + step, 1, GRID_COLS - 2);
        pts.push({ ...cur });
      }
    }
  }
  // Final approach to the target waypoint, two-axis manhattan.
  if(cur.x !== target.x){ cur.x = target.x; pts.push({ ...cur }); }
  if(cur.y !== target.y){ cur.y = target.y; pts.push({ ...cur }); }
  // Step off the grid into the exit cell.
  pts.push({ x: exit.x, y: exit.y });
  return pts;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function generatePath(){ generatePaths(); }   // back-compat alias
generatePaths();

// ── UPGRADE SYSTEM ────────────────────────────────────────────────────────────
// Each tower has three stats upgradeable to level 5. Effects compound linearly.
const MAX_UP_LEVEL = 5;
const UP_COST = [0, 25, 45, 75, 120, 180];   // index = next level (1..5)
function effectiveStats(t){
  const def = TOWER_TYPES[t.type];
  const up  = t.upgrades || { damage:0, speed:0, range:0 };
  return {
    range:    def.range    * (1 + up.range  * 0.18),
    damage:   def.damage   * (1 + up.damage * 0.40),
    cooldown: def.cooldown * (1 - up.speed  * 0.15),   // level 5 = 25% cooldown
    slow:     def.slow,
    splashRadius: def.splashRadius,
    // Slow tower: DAMAGE-level upgrade extends the slow duration (+ 1s per level)
    slowMs:   SLOW_DURATION_MS + up.damage * 1000,
  };
}
function upgradeCost(t, stat){
  const next = (t.upgrades[stat] || 0) + 1;
  if(next > MAX_UP_LEVEL) return Infinity;
  return UP_COST[next];
}
function tryUpgrade(towerIdx, stat){
  const t = towers[towerIdx];
  if(!t) return;
  if((t.upgrades[stat] || 0) >= MAX_UP_LEVEL){ flashMsg('MAX LEVEL'); return; }
  const cost = upgradeCost(t, stat);
  if(energy < cost){ flashMsg('NOT ENOUGH ENERGY'); return; }
  energy -= cost;
  t.upgrades[stat]++;
  renderUpgradePanel();
}
function sellTower(towerIdx){
  const t = towers[towerIdx];
  if(!t) return;
  const def = TOWER_TYPES[t.type];
  let spent = def.cost;
  for(const s of ['damage','speed','range']){
    for(let lvl = 1; lvl <= (t.upgrades[s]||0); lvl++) spent += UP_COST[lvl];
  }
  energy += Math.floor(spent * 0.6);
  towers.splice(towerIdx, 1);
  selectedPlacedIdx = -1;
  hideUpgradePanel();
}

// ── UPGRADE PANEL UI ──────────────────────────────────────────────────────────
function showUpgradePanel(){ renderUpgradePanel(); }
function hideUpgradePanel(){
  // If a panel was actually open, ALSO deselect the tower-creation chip in
  // the bottom bar — otherwise a stray tap on an empty cell right after
  // closing would accidentally place a new tower. (Skip when called from
  // startGame / enterPlacementPhase where no panel was open and the caller
  // wants to preserve selectedTower.)
  const wasOpen = selectedPlacedIdx >= 0;
  selectedPlacedIdx = -1;
  if(wasOpen){
    selectedTower = null;
    buildTowerBar();
  }
  document.getElementById('upgrade-panel').style.display = 'none';
}
function renderUpgradePanel(){
  const panel = document.getElementById('upgrade-panel');
  if(selectedPlacedIdx < 0 || selectedPlacedIdx >= towers.length){
    panel.style.display = 'none';
    return;
  }
  const t = towers[selectedPlacedIdx];
  const def = TOWER_TYPES[t.type];
  function row(stat, label){
    const lvl = t.upgrades[stat] || 0;
    const dots = [];
    for(let i = 1; i <= MAX_UP_LEVEL; i++){
      dots.push(`<div class="dot ${i <= lvl ? 'on' : ''}"></div>`);
    }
    const maxed = lvl >= MAX_UP_LEVEL;
    const cost = maxed ? '—' : upgradeCost(t, stat);
    const enough = !maxed && energy >= cost;
    const cls = (maxed || !enough) ? 'up-btn disabled' : 'up-btn';
    const onclick = (maxed || !enough) ? '' : `onclick="tryUpgrade(${selectedPlacedIdx},'${stat}')"`;
    const btnLabel = maxed ? 'MAX' : ('+ ' + cost + '⚡');
    return `<div class="stat-row">
      <span class="label">${label}</span>
      <div class="dots">${dots.join('')}</div>
      <button class="${cls}" ${onclick}>${btnLabel}</button>
    </div>`;
  }
  // Refund preview
  let spent = def.cost;
  for(const s of ['damage','speed','range']){
    for(let lvl=1; lvl<=(t.upgrades[s]||0); lvl++) spent += UP_COST[lvl];
  }
  const refund = Math.floor(spent * 0.6);

  panel.innerHTML = `
    <h3 style="color:${def.color};text-shadow:0 0 12px ${def.color}88">${def.name}</h3>
    ${t.type === 'slow'
       ? row('damage','DURATION') + row('speed','COOLDOWN') + row('range','RANGE')
       : row('damage','DAMAGE')   + row('speed','SPEED')    + row('range','RANGE')}
    <div class="panel-row">
      <button class="sell-btn" onclick="sellTower(${selectedPlacedIdx})">SELL +${refund}⚡</button>
      <button class="close-btn" onclick="hideUpgradePanel()">CLOSE</button>
    </div>
  `;
  panel.style.display = 'block';
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', e => handlePlace(e.clientX, e.clientY));
canvas.addEventListener('touchend', e => {
  if(e.changedTouches && e.changedTouches[0]){
    e.preventDefault();
    handlePlace(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
}, {passive:false});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape' && running) showPauseMenu();
  if(e.key === '1') selectTower('cannon');
  if(e.key === '2') selectTower('laser');
  if(e.key === '3') selectTower('slow');
  if(e.key === '4') selectTower('splash');
});

function handlePlace(clientX, clientY){
  if(!running) return;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const c = worldToCell(x, y);

  // 1) Tap on an existing tower → open / switch its upgrade panel. Also
  //    DESELECT the tower-creation chip in the bottom bar so the next tap
  //    on an empty cell doesn't accidentally place a new tower.
  if(c.cx >= 0 && c.cx < GRID_COLS && c.cy >= 0 && c.cy < GRID_ROWS){
    const existing = towers.findIndex(t => t.cx === c.cx && t.cy === c.cy);
    if(existing >= 0){
      selectedPlacedIdx = existing;
      selectedTower = null;
      buildTowerBar();
      showUpgradePanel();
      return;
    }
  }

  // 2) Any other tap → close the panel (clicking "outside" a tower).
  //    hideUpgradePanel() also clears selectedTower, so a subsequent tap on
  //    an empty cell does nothing until the player re-taps a chip in the bar.
  hideUpgradePanel();

  // ── Placement phase (after path mutation) ──
  // Re-place the player's existing towers from the pendingPlacements queue.
  // Upgrades are preserved; nothing is bought or refunded.
  if(awaitingPlacement){
    if(c.cx < 0 || c.cx >= GRID_COLS || c.cy < 0 || c.cy >= GRID_ROWS) return;
    if(PATH_OCCUPIED.has(`${c.cx},${c.cy}`)) return;
    if(towers.some(t => t.cx === c.cx && t.cy === c.cy)) return;
    if(pendingPlacements.length === 0) return;
    // Auto-pick the first pending tower if the player hasn't tapped one.
    if(selectedPending < 0 || selectedPending >= pendingPlacements.length){
      selectedPending = 0;
    }
    const p = pendingPlacements.splice(selectedPending, 1)[0];
    towers.push({
      cx: c.cx, cy: c.cy, type: p.type,
      lastShotMs: 0, angle: 0, target: null,
      upgrades: { damage: p.upgrades.damage, speed: p.upgrades.speed, range: p.upgrades.range }
    });
    Sfx.placeTower();
    selectedPending = -1;
    buildTowerBar();
    return;
  }

  // 3) Then try to place a new tower from the bottom-bar selection.
  //    If no chip is selected (just closed an upgrade panel), do nothing —
  //    the player must explicitly tap a chip first to opt in to placement.
  if(!selectedTower) return;
  if(c.cx < 0 || c.cx >= GRID_COLS || c.cy < 0 || c.cy >= GRID_ROWS) return;
  if(PATH_OCCUPIED.has(`${c.cx},${c.cy}`)) return;
  const def = TOWER_TYPES[selectedTower];
  if(energy < def.cost){ flashMsg('NOT ENOUGH ENERGY'); return; }
  if(def.coinCost > 0){
    if(!Coins.canSpend(def.coinCost)){ flashMsg('NEED ' + def.coinCost + '🪙'); return; }
    if(!Coins.spend(def.coinCost, 'place-' + selectedTower)) return;
  }
  energy -= def.cost;
  towers.push({
    cx: c.cx, cy: c.cy, type: selectedTower,
    lastShotMs: 0, angle: 0, target: null,
    upgrades: { damage: 0, speed: 0, range: 0 }
  });
  Sfx.placeTower();
}

// ── TOWER BAR UI ──────────────────────────────────────────────────────────────
function buildTowerBar(){
  const bar = document.getElementById('tower-bar');
  bar.innerHTML = '';
  // Placement phase: the bar shows the queue of pending towers and a START
  // button (visible once the queue is empty). Click a tower to select it,
  // then tap an empty cell to place it.
  if(awaitingPlacement){
    pendingPlacements.forEach((p, i) => {
      const def = TOWER_TYPES[p.type];
      const totalUp = (p.upgrades.damage|0) + (p.upgrades.speed|0) + (p.upgrades.range|0);
      const div = document.createElement('div');
      div.className = 'twr' + (selectedPending === i ? ' active' : '');
      div.innerHTML = `
        <div class="icon">${towerIconSVG(p.type, def.color)}</div>
        <div class="name">${def.name}</div>
        <div class="cost" style="color:${totalUp > 0 ? '#ffcc00' : '#a0b8e0'}">${totalUp > 0 ? '★' + totalUp : 'lvl 0'}</div>
      `;
      div.addEventListener('click', () => { selectedPending = i; buildTowerBar(); });
      bar.appendChild(div);
    });
    if(pendingPlacements.length === 0){
      const startBtn = document.createElement('div');
      startBtn.style.cssText = 'pointer-events:auto;cursor:pointer;padding:12px 22px;background:#0a1428;border:2px solid #44ff88;color:#44ff88;font-family:Orbitron,sans-serif;font-weight:700;border-radius:8px;letter-spacing:.2em;display:flex;align-items:center;box-shadow:0 0 18px #44ff8866';
      startBtn.textContent = 'START WAVE ▶';
      startBtn.addEventListener('click', exitPlacementPhase);
      bar.appendChild(startBtn);
    }
    return;
  }
  for(const key of Object.keys(TOWER_TYPES)){
    const t = TOWER_TYPES[key];
    const affordable = canAfford(key);
    const div = document.createElement('div');
    div.className = 'twr' + (selectedTower === key ? ' active' : '') + (affordable ? '' : ' locked');
    const coinTxt = t.coinCost > 0 ? `<div class="cost" style="color:#ffcc00">+${t.coinCost}🪙</div>` : '';
    div.innerHTML = `
      <div class="icon">${towerIconSVG(key, t.color)}</div>
      <div class="name">${t.name}</div>
      <div class="cost">${t.cost}⚡</div>
      ${coinTxt}
    `;
    div.addEventListener('click', () => selectTower(key));
    bar.appendChild(div);
  }
}
function towerIconSVG(type, color){

function selectTower(key){
  selectedTower = key;
  buildTowerBar();
