<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>BRUTIMON DODGE</title>
<script>(function(){try{var s=localStorage.getItem("skin");if(s==="fitness"||s==="classic"||s==="pokemon"){document.documentElement.classList.add("skin-"+s);}}catch(e){}})();</script>
<link rel="stylesheet" href="../shared/theme.css">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#44ff88">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a3a0a;color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100%}
  body{touch-action:none;user-select:none;-webkit-user-select:none}
  #game-wrap{position:fixed;inset:0}
  #game{display:block;width:100%;height:100%;background:#0a3a0a;touch-action:none}

  #hud{
    /* padding clears back ✖ (left 50px) and fullscreen ⛶ (right 50px) corner buttons */
    position:fixed;top:0;left:0;right:0;padding:8px 56px 8px 60px;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to bottom,#000a00dd,transparent);
    pointer-events:none;z-index:5;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center;min-width:50px}
  .hud-item .label{font-size:10px;letter-spacing:.22em;color:#a0e0a099;text-transform:uppercase;font-family:'Orbitron',sans-serif}
  .hud-item .value{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.4rem;color:#44ff88;
    text-shadow:0 0 12px #44ff88;letter-spacing:.06em;line-height:1;margin-top:2px;
  }
  .hud-item.lives .value{color:#ff6666}
  .hud-item.wave .value{color:#ffcc44}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a3a0acc;border:1px solid #44ff88aa;color:#44ff88;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;
  }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#0a3a0acc;backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;
  }
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2rem;
    color:#44ff88;letter-spacing:.18em;text-shadow:0 0 26px #44ff88;margin:6px 0;
  }
  #overlay p{color:#cfeacf;font-size:.95rem;margin:4px 0}
  #overlay .hint{color:#88cc88;font-size:.78rem;margin-top:10px;line-height:1.5;max-width:380px}
  #overlay .hint b{color:#ffcc44}
  .btn{
    margin-top:10px;padding:10px 22px;background:transparent;border:2px solid #44ff88;
    color:#44ff88;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.8rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #44ff8844;
  }
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div class="hud-item"><span class="label">Tempo</span><span class="value" id="h-time">0</span></div>
  <div class="hud-item wave"><span class="label">Onda</span><span class="value" id="h-wave">1</span></div>
  <div class="hud-item lives"><span class="label">Vite</span><span class="value" id="h-lives">3</span></div>
</div>

<button id="back-btn" onclick="window.location.href='../'">✖</button>

<div id="overlay"></div>

<script src="../shared/brutimon.js"></script>
<script src="../shared/profile.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/coins.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/cloud-sync.js"></script>
<script src="../shared/keyguard.js"></script>
<script src="../shared/leaderboard.js"></script>
<script src="../shared/gamepad.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

const WORLD_W = 900, WORLD_H = 600;
function s(){ return Math.min(W / WORLD_W, H / WORLD_H); }
function w2s(wx, wy){
  const sc = s();
  const xOffset = (W - WORLD_W * sc) / 2;
  const yOffset = (H - WORLD_H * sc) / 2;
  return { x: xOffset + wx * sc, y: yOffset + wy * sc, s: sc };
}
function s2w(sx, sy){
  const sc = s();
  const xOffset = (W - WORLD_W * sc) / 2;
  const yOffset = (H - WORLD_H * sc) / 2;
  return { x: (sx - xOffset) / sc, y: (sy - yOffset) / sc };
}

// ── Assets ──────────────────────────────────────────────────────────────────
// Player is always rendered as the stage-1 form of a Brutimon species.
// Picker on game start lets the user pick the species. Enemies come from
// the shared Brutimon roster — wave-scaled stage with a chance of a
// legendary stage-5 every 5 waves (visual "mini-boss").
let PLAYER_SPECIES = 'glitchino';
Brutimon.preloadAll && Brutimon.preloadAll();
const imgs = {};
const BASE = '../neon-defender/assets/skin-pokemon/';
// Only the grass tile is kept from the legacy skin — player/enemy sprites
// come from the brutimon registry now.
for(const k of ['grass']){
  const im = new Image(); im.src = BASE + k + '.png'; imgs[k] = im;
}
function ready(im){ return im && im.complete && im.naturalWidth > 0; }

// ── Sfx ─────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let ctx = null, master = null, on = localStorage.getItem('dodgeAudio') !== 'false';
  function ensure(){
    if(ctx) return ctx;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
    master = ctx.createGain(); master.gain.value = on ? 0.55 : 0; master.connect(ctx.destination);
    return ctx;
  }
  function tone({freq=440, dur=0.08, type='sine', vol=0.18, sweep=0}){
    if(!on) return; if(!ensure()) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.04);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise({dur=0.08, vol=0.2, lp=4000, hp=200}){
    if(!on) return; if(!ensure()) return;
    const t0 = ctx.currentTime;
    const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for(let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f1 = ctx.createBiquadFilter(); f1.type='highpass'; f1.frequency.value = hp;
    const f2 = ctx.createBiquadFilter(); f2.type='lowpass';  f2.frequency.value = lp;
    const g  = ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f1); f1.connect(f2); f2.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur);
  }
  function hit(){ tone({freq:200, dur:0.18, type:'sawtooth', vol:0.25, sweep:-100}); noise({dur:0.1, vol:0.2}); }
  function wave(){
    tone({freq:660, dur:0.10, type:'square', vol:0.22});
    setTimeout(() => tone({freq:990, dur:0.14, type:'square', vol:0.24}), 110);
  }
  function pickup(){
    [880, 1100, 1320].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.06, type:'square', vol:0.18}), i * 60));
  }
  function bomb(){ noise({dur:0.6, vol:0.35, hp:80, lp:4000}); tone({freq:120, dur:0.4, type:'sawtooth', vol:0.32, sweep:-80}); }
  function over(){
    [523, 440, 349].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.30, type:'sawtooth', vol:0.26, sweep:-50}), i * 240));
  }
  return { hit, wave, pickup, bomb, over };
})();

// ── State ───────────────────────────────────────────────────────────────────
const PLAYER_R = 22;
const ENEMY_R  = 22;
const PLAYER_SPEED = 360;          // world px/s
let player = { x: WORLD_W/2, y: WORLD_H/2, tx: WORLD_W/2, ty: WORLD_H/2 };
let enemies = [];                  // { x, y, vx, vy, sprite, hp }
let pickups = [];                  // { x, y, kind ('dash'|'bomb'|'shield') }
let lives = 3;
let wave = 1;
let waveSpawnAt = 0;
let pickupSpawnAt = 0;
let startMs = 0;
let invulnUntil = 0;
let dashUntil = 0;
let shieldUntil = 0;
let running = false;
let lastT = 0;

function reset(){
  player.x = WORLD_W/2; player.y = WORLD_H/2;
  player.tx = player.x; player.ty = player.y;
  enemies = []; pickups = [];
  lives = 3; wave = 1;
  startMs = performance.now();
  waveSpawnAt = startMs + 500;
  pickupSpawnAt = startMs + 6000;
  invulnUntil = 0; dashUntil = 0; shieldUntil = 0;
  updateHud();
}
function updateHud(){
  const t = Math.max(0, Math.floor((performance.now() - startMs) / 1000));
  document.getElementById('h-time').textContent = t;
  document.getElementById('h-wave').textContent = wave;
  document.getElementById('h-lives').textContent = lives;
}

// ── Input: tap to set target ───────────────────────────────────────────────
function onPointer(sx, sy){
  if(!running) return;
  const w = s2w(sx, sy);
  player.tx = Math.max(PLAYER_R, Math.min(WORLD_W - PLAYER_R, w.x));
  player.ty = Math.max(PLAYER_R, Math.min(WORLD_H - PLAYER_R, w.y));
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); canvas.setPointerCapture(e.pointerId);
  onPointer(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', e => {
  if(e.buttons || e.pointerType === 'touch') onPointer(e.clientX, e.clientY);
});
window.addEventListener('contextmenu', e => { if(running) e.preventDefault(); });

// ── Spawning ────────────────────────────────────────────────────────────────
function spawnEnemy(){
  // Spawn at random border, target the player.
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if(side === 0){ x = -ENEMY_R; y = Math.random() * WORLD_H; }
  else if(side === 1){ x = WORLD_W + ENEMY_R; y = Math.random() * WORLD_H; }
  else if(side === 2){ x = Math.random() * WORLD_W; y = -ENEMY_R; }
  else                { x = Math.random() * WORLD_W; y = WORLD_H + ENEMY_R; }
  const dx = player.x - x, dy = player.y - y;
  const d = Math.hypot(dx, dy) || 1;
  // Every 5th wave the swarm includes a rare legendary visitor (1 in 6).
  const isLegendary = wave > 0 && wave % 5 === 0 && Math.random() < 0.18;
  const spec = isLegendary ? Brutimon.bossEnemy(wave) : Brutimon.randomEnemy(wave);
  // Speed scales gently with wave number and the tier multiplier.
  const baseSpeed = 80 + Math.min(140, wave * 12);
  const speed = baseSpeed * spec.spdMult;
  enemies.push({
    x, y,
    vx: (dx / d) * speed,
    vy: (dy / d) * speed,
    sprite: spec.sprite,
    species: spec.species, stage: spec.stage,
    radiusMult: spec.radiusMult || 1,
    color: spec.color || '#ff6666',
    rarity: spec.rarity || 'comune',
    hp: 1
  });
}
function spawnPickup(){
  const kinds = ['dash', 'bomb', 'shield'];
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  pickups.push({
    x: 60 + Math.random() * (WORLD_W - 120),
    y: 60 + Math.random() * (WORLD_H - 120),
    kind
  });
}

// ── Update ──────────────────────────────────────────────────────────────────
function update(dt){
  const now = performance.now();
  // Gamepad: while the analog stick is pushed past the dead-zone, walk in
  // the stick's direction by projecting a target ~100 units ahead each
  // frame. This re-uses the existing tx/ty pursuit logic — touch + tap
  // still works as before.
  const gp = window.GamepadInput && window.GamepadInput.state();
  if(gp && window.GamepadInput.isConnected()){
    const mag = Math.hypot(gp.stickL.x, gp.stickL.y);
    if(mag > 0.18){
      const nx = gp.stickL.x / mag, ny = gp.stickL.y / mag;
      player.tx = Math.max(PLAYER_R, Math.min(WORLD_W - PLAYER_R, player.x + nx * 100));
      player.ty = Math.max(PLAYER_R, Math.min(WORLD_H - PLAYER_R, player.y + ny * 100));
    }
  }
  // Player movement: constant speed toward target (clamped)
  const dx = player.tx - player.x, dy = player.ty - player.y;
  const d = Math.hypot(dx, dy);
  const speed = PLAYER_SPEED * (now < dashUntil ? 1.7 : 1.0);
  if(d > 4){
    const step = Math.min(speed * dt, d);
    player.x += (dx / d) * step;
    player.y += (dy / d) * step;
  }
  // Enemies homing-ish (re-target slightly to follow player)
  for(const e of enemies){
    const dex = player.x - e.x, dey = player.y - e.y;
    const dd = Math.hypot(dex, dey) || 1;
    const sp = Math.hypot(e.vx, e.vy) || 1;
    // Slight steering toward player
    const tvx = (dex / dd) * sp, tvy = (dey / dd) * sp;
    const blend = 1.5 * dt;
    e.vx += (tvx - e.vx) * blend;
    e.vy += (tvy - e.vy) * blend;
    e.x += e.vx * dt; e.y += e.vy * dt;
  }
  // Wave spawn: every WAVE_INTERVAL_MS, spawn N enemies.
  const elapsed = now - startMs;
  // First wave at t=0.5s, then every 8s a fresh batch.
  if(now >= waveSpawnAt){
    const count = Math.min(20, 2 + Math.floor(wave * 1.5));
    for(let i = 0; i < count; i++) setTimeout(spawnEnemy, i * 220);
    Sfx.wave();
    wave++;
    waveSpawnAt = now + Math.max(5000, 9000 - wave * 250);
    updateHud();
  }
  // Pickup spawn
  if(now >= pickupSpawnAt){
    if(pickups.length < 3) spawnPickup();
    pickupSpawnAt = now + 5000 + Math.random() * 3000;
  }
  // Collisions: player ↔ enemy
  if(now > invulnUntil){
    for(let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      if(dx*dx + dy*dy < (PLAYER_R + ENEMY_R) * (PLAYER_R + ENEMY_R)){
        if(now < shieldUntil){
          // Shield: kill enemy, no damage
          enemies.splice(i, 1);
          shieldUntil = 0;
          Sfx.bomb();
        } else {
          lives--;
          enemies.splice(i, 1);
          invulnUntil = now + 1500;
          Sfx.hit();
          updateHud();
          if(lives <= 0){ onGameOver(); return; }
        }
      }
    }
  }
  // Collisions: player ↔ pickup
  for(let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i];
    const dx = p.x - player.x, dy = p.y - player.y;
    if(dx*dx + dy*dy < (PLAYER_R + 22) * (PLAYER_R + 22)){
      applyPickup(p.kind);
      pickups.splice(i, 1);
    }
  }
  // Drop enemies that wandered off (after homing failures)
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if(e.x < -200 || e.x > WORLD_W + 200 || e.y < -200 || e.y > WORLD_H + 200) enemies.splice(i, 1);
  }
}
function applyPickup(kind){
  const now = performance.now();
  if(kind === 'dash')   dashUntil   = now + 4000;
  if(kind === 'shield') shieldUntil = now + 8000;
  if(kind === 'bomb'){
    // Clear all enemies on screen.
    enemies = [];
    Sfx.bomb();
    return;
  }
  Sfx.pickup();
}

// ── Draw ────────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#062006'; ctx.fillRect(0, 0, W, H);
  const sc = s();
  // Grass tiles
  const grass = imgs.grass;
  if(ready(grass)){
    const origin = w2s(0, 0);
    const TILE = 64 * sc;
    for(let yy = origin.y; yy < origin.y + WORLD_H * sc; yy += TILE){
      for(let xx = origin.x; xx < origin.x + WORLD_W * sc; xx += TILE){
        ctx.drawImage(grass, xx, yy, TILE + 1, TILE + 1);
      }
    }
  } else {
    const o = w2s(0, 0);
    ctx.fillStyle = '#1a6a1a';
    ctx.fillRect(o.x, o.y, WORLD_W * sc, WORLD_H * sc);
  }
  // Border
  const tl = w2s(0, 0);
  ctx.strokeStyle = '#e8ffe855';
  ctx.lineWidth = Math.max(2, 3 * sc);
  ctx.strokeRect(tl.x, tl.y, WORLD_W * sc, WORLD_H * sc);
  // Pickups
  const now = performance.now();
  for(const p of pickups){
    const pos = w2s(p.x, p.y);
    const pulse = 0.85 + 0.15 * Math.sin(now * 0.006);
    const r = 22 * sc * pulse;
    const colors = { dash:'#44aaff', bomb:'#ffcc44', shield:'#ff88ff' };
    const icons  = { dash:'⚡', bomb:'💥', shield:'✨' };
    ctx.fillStyle = colors[p.kind] + '66';
    ctx.beginPath(); ctx.arc(pos.x, pos.y, r * 1.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colors[p.kind];
    ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(22 * sc) + 'px Orbitron';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icons[p.kind], pos.x, pos.y);
  }
  // Enemies
  for(const e of enemies){
    const pos = w2s(e.x, e.y);
    const r = ENEMY_R * sc * (e.radiusMult || 1);
    // Rarity halo
    if(e.stage >= 3 && e.color){
      ctx.save();
      ctx.shadowColor = e.color; ctx.shadowBlur = e.stage >= 5 ? 22 * sc : 14 * sc;
      ctx.fillStyle = e.color + (e.stage >= 5 ? '99' : '66');
      ctx.beginPath(); ctx.arc(pos.x, pos.y, r * (e.stage >= 5 ? 1.3 : 1.18), 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#ff666644';
    ctx.beginPath(); ctx.arc(pos.x, pos.y + r * 0.5, r * 1.05, 0, Math.PI*2); ctx.fill();
    const im = e.sprite;
    const sz = r * 2.4;
    if(im && im.complete && im.naturalWidth > 0) ctx.drawImage(im, pos.x - sz/2, pos.y - sz/2, sz, sz);
    else { ctx.fillStyle = e.color || '#ff6666'; ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI*2); ctx.fill(); }
  }
  // Player
  const pp = w2s(player.x, player.y);
  // Invuln flash
  const inv = now < invulnUntil;
  if(inv && Math.floor(now / 80) % 2 === 0){ /* skip drawing this frame for blink */ }
  else {
    // Shield aura
    if(now < shieldUntil){
      const pulse = 1.0 + 0.1 * Math.sin(now * 0.008);
      ctx.strokeStyle = '#ff88ff';
      ctx.lineWidth = Math.max(2, 3 * sc);
      ctx.shadowColor = '#ff88ff'; ctx.shadowBlur = 22 * sc;
      ctx.beginPath(); ctx.arc(pp.x, pp.y, PLAYER_R * sc * 1.5 * pulse, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // Dash trail
    if(now < dashUntil){
      ctx.strokeStyle = '#44aaff';
      ctx.lineWidth = Math.max(2, 3 * sc);
      ctx.beginPath(); ctx.arc(pp.x, pp.y, (PLAYER_R + 8) * sc + Math.sin(now/80) * 2, 0, Math.PI*2); ctx.stroke();
    }
    // Player halo + sprite (cucciolo form of the chosen brutimon)
    ctx.fillStyle = '#44ff8866';
    ctx.beginPath(); ctx.arc(pp.x, pp.y + PLAYER_R * 0.5 * sc, PLAYER_R * sc * 1.1, 0, Math.PI*2); ctx.fill();
    const im = Brutimon.image(PLAYER_SPECIES, 1);
    const sz = PLAYER_R * 2.4 * sc;
    if(Brutimon.imageReady(im)) ctx.drawImage(im, pp.x - sz/2, pp.y - sz/2, sz, sz);
    else { ctx.fillStyle = '#44ff88'; ctx.beginPath(); ctx.arc(pp.x, pp.y, PLAYER_R * sc, 0, Math.PI*2); ctx.fill(); }
    // Yellow ring (you-are-here marker)
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = Math.max(2, 3 * sc);
    ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 18 * sc;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, PLAYER_R * sc + 4, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

// ── Loop ────────────────────────────────────────────────────────────────────
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  const isPaused = window.Pause && Pause.isPaused();
  if(!isPaused){
    update(dt);
  }
  draw();
  if((ts | 0) % 5 === 0) updateHud();
  requestAnimationFrame(loop);
}

// ── Flow ────────────────────────────────────────────────────────────────────
function startGame(){
  reset();
  document.getElementById('overlay').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function onGameOver(){
  running = false;
  Sfx.over();
  const seconds = Math.max(0, Math.floor((performance.now() - startMs) / 1000));
  const reward = Math.floor(seconds / 8) + (wave - 1);
  if(window.Coins && reward > 0) Coins.add(reward, 'dodge-' + seconds);
  // Leaderboard score = seconds * 10 + wave reached → rewards both endurance
  // and the burst of late-game waves.
  if(window.CloudSync) CloudSync.recordScore(null, seconds * 10 + wave);
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  ol.innerHTML = `
    <h2>SCONFITTA!</h2>
    <p>Tempo sopravvissuto: <b style="color:#fff">${seconds}s</b></p>
    <p>Onda raggiunta: <b style="color:#ffcc44">${wave}</b></p>
    <p>+${reward}🪙</p>
    <div class="btn-row">
      <button class="btn" onclick="startGame()">RIPROVA</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="window.location.href='../'">MENU</button>
    </div>
  `;
}
function showMenu(){
  const ol = document.getElementById('overlay');
  ol.style.display = 'flex';
  Brutimon.registry().then(reg => {
    const species = reg.species || [];
    const choices = species.map(s => `
      <div class="card" data-id="${s.id}" style="background:#0a3a0a88;border:2px solid #44ff8866;border-radius:10px;padding:10px;cursor:pointer;width:110px;text-align:center">
        <img src="${Brutimon.BASE}/${s.id}/${s.id}_1.png"
             style="width:64px;height:64px;display:block;margin:0 auto 4px;image-rendering:pixelated"/>
        <div style="font-family:Orbitron,sans-serif;font-weight:700;font-size:.78rem;color:#44ff88;letter-spacing:.1em">${s.name.toUpperCase()}</div>
      </div>
    `).join('');
    ol.innerHTML = `
      <h2>BRUTIMON DODGE</h2>
      <p>Sopravvivi alle ondate di mostri il più a lungo possibile!</p>
      <div class="hint">
        <div><b>Tap o trascina</b> per spostare il tuo Brutimon</div>
        <div>Tocca un nemico = -1 vita. Hai <b>3 vite</b>.</div>
        <div><b style="color:#44aaff">⚡ DASH</b> = scatto, <b style="color:#ff88ff">✨ SHIELD</b> = parata, <b style="color:#ffcc44">💥 BOMB</b> = pulisce</div>
        <div>Ogni 5 onde un Brutimon <b style="color:#ffcc44">leggendario</b> compare nello sciame!</div>
      </div>
      <h3 style="font-family:Orbitron,sans-serif;color:#44ff88;letter-spacing:.16em;margin-top:10px">Scegli il tuo Brutimon</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0">${choices}</div>
    `;
    ol.querySelectorAll('.card[data-id]').forEach(el => {
      el.addEventListener('click', () => { PLAYER_SPECIES = el.dataset.id; startGame(); });
    });
  });
}
window.startGame = startGame;
showMenu();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
<script src="../shared/no-gestures.js"></script>
<script src="../shared/fullscreen.js"></script>
<script src="../shared/pause.js"></script>
<script>
  if(window.Pause){
    Pause.attach({
      canPause: () => !!running,
      onPause:  () => {},
      onResume: () => { lastT = performance.now(); }
    });
  }
</script>
</body>
</html>
