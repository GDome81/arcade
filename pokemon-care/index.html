<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>BRUTIMON CARE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#44ccff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a1828;color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100%}
  body{touch-action:none;user-select:none;-webkit-user-select:none}
  #scene{position:fixed;inset:0}
  #game{display:block;width:100%;height:100%;touch-action:none}

  /* Top bar with stats — padding clears back ✖ on the left and fullscreen ⛶ on the right.
     The 56 px right clearance is intentional so stat value numbers don't fight the
     fullscreen icon; the coin counter now lives under the back button on the LEFT. */
  #stats{
    position:fixed;top:0;left:0;right:0;padding:10px 56px 6px 60px;
    display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none;
    background:linear-gradient(to bottom,#0a1828ee,#0a182800);
  }
  .stat{display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.15em;color:#bcd5e0}
  .stat .ic{font-size:1.05rem;line-height:1}
  .stat .lab{min-width:74px;color:#bcd5e0aa}
  .stat .bar{
    flex:1;height:10px;background:#0a182888;border:1px solid #44ccff33;border-radius:6px;overflow:hidden;
  }
  .stat .fill{height:100%;background:linear-gradient(90deg,#44ccff,#88f0ff);transition:width .35s, background .35s}
  .stat .num{min-width:34px;text-align:right;font-weight:700;color:#fff}
  .stat.hunger .fill{background:linear-gradient(90deg,#ffcc44,#ffdd66)}
  .stat.happy .fill{background:linear-gradient(90deg,#ff66cc,#ff99dd)}
  .stat.clean .fill{background:linear-gradient(90deg,#88ddff,#bbeeff)}
  .stat.energy .fill{background:linear-gradient(90deg,#44ffaa,#88ffcc)}
  .stat.danger .fill{background:linear-gradient(90deg,#ff4444,#ff8866)!important}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1828cc;border:1px solid #44ccffaa;color:#44ccff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:60;display:flex;align-items:center;justify-content:center;
  }

  /* Bottom action bar */
  #actions{
    position:fixed;left:0;right:0;bottom:0;padding:10px 12px 16px;z-index:6;
    background:linear-gradient(to top,#0a1828ee,#0a182800);
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  }
  .act{
    background:linear-gradient(160deg,#152840,#0a1828);
    border:2px solid #44ccff66;border-radius:14px;padding:10px 12px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    min-width:78px;transition:transform .12s,border-color .12s,box-shadow .12s;
  }
  .act:hover{transform:translateY(-3px);border-color:#44ccff;box-shadow:0 0 22px #44ccff55}
  .act.disabled{opacity:.4;pointer-events:none}
  .act .ic{font-size:1.6rem;line-height:1}
  .act .nm{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;color:#44ccff;letter-spacing:.12em;margin-top:3px}
  .act .pr{font-size:.62rem;color:#ffcc44;margin-top:2px;letter-spacing:.05em}

  /* Pet area: HP, stage, name */
  #petinfo{
    position:fixed;top:96px;left:0;right:0;text-align:center;z-index:6;pointer-events:none;
  }
  #petinfo .name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.4rem;color:#44ccff;letter-spacing:.16em;text-shadow:0 0 16px #44ccff}
  #petinfo .stage{font-size:.78rem;color:#bcd5e0;letter-spacing:.18em;margin-top:2px}
  /* Coin counter — anchored to the LEFT under the back button so it lives in
     its own clear column and never fights the stat-bar values (which are
     right-aligned and were getting covered when the coin sat on the right). */
  #coin-hud{
    position:fixed; top:50px; left:8px; z-index:6; pointer-events:none;
    background:#1a0a08cc; border:1px solid #ffcc44aa; border-radius:8px;
    padding:3px 10px 3px 8px;
    color:#ffcc44; font-family:'Orbitron',sans-serif; font-weight:700;
    letter-spacing:.08em; font-size:.85rem;
    display:flex; align-items:center; gap:5px;
    box-shadow:0 0 12px #ffcc4422;
  }
  #coin-hud .ic{font-size:.95rem; line-height:1}
  #coin-hud .val{text-shadow:0 0 8px #ffcc44aa}
  #coin-hud.pop{ animation: coinPop .35s }
  @keyframes coinPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.20); }
    100% { transform: scale(1); }
  }

  /* Illness badge — appears when state.illness is set. Sits next to the
     coin chip so the user immediately sees there's something to act on. */
  #ill-hud{
    position:fixed; top:84px; left:8px; z-index:6; pointer-events:none;
    background:#3a1212cc; border:1px solid #ff5566; border-radius:8px;
    padding:3px 10px; color:#ff8888;
    font-family:'Orbitron',sans-serif; font-weight:700;
    letter-spacing:.1em; font-size:.7rem;
    display:none; align-items:center; gap:5px;
    box-shadow:0 0 14px #ff556644;
    animation: illPulse 1.4s ease-in-out infinite;
  }
  #ill-hud.show{display:flex}
  @keyframes illPulse {
    0%, 100% { box-shadow: 0 0 10px #ff556644; }
    50%      { box-shadow: 0 0 22px #ff5566bb; }
  }

  #petinfo .grow{margin:6px auto 0;width:min(70%,260px)}
  #petinfo .grow-bar{height:5px;background:#0a182888;border:1px solid #ffcc4444;border-radius:3px;overflow:hidden}
  #petinfo .grow-fill{height:100%;background:linear-gradient(90deg,#ffcc44,#ff9966);width:0%;transition:width .4s}
  #petinfo .grow-text{font-size:.62rem;color:#ffcc44aa;letter-spacing:.10em;margin-top:3px;font-family:'Orbitron',sans-serif}
  #petinfo .grow-text.max{color:#44ffcc}

  /* Overlays */
  .panel{
    position:fixed;inset:0;z-index:30;
    background:#0a1828dd;backdrop-filter:blur(6px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px;text-align:center;overflow-y:auto;
  }
  .panel.show{display:flex}
  .panel h1{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.2rem;
    color:#44ccff;letter-spacing:.18em;text-shadow:0 0 26px #44ccff;margin:6px 0;
  }
  .panel h3{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1rem;color:#ffcc44;letter-spacing:.14em;margin:8px 0 4px}
  .panel p{color:#bcd5e0;font-size:.95rem;max-width:480px}
  .btn{
    margin-top:14px;padding:12px 26px;background:transparent;border:2px solid #44ccff;
    color:#44ccff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;
    letter-spacing:.22em;cursor:pointer;text-transform:uppercase;border-radius:6px;
    box-shadow:0 0 18px #44ccff55;
  }
  .btn.alt{border-color:#ffcc44;color:#ffcc44;box-shadow:0 0 18px #ffcc4455}
  .picks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px;max-width:560px}
  .pick{
    background:linear-gradient(160deg,#152840,#0a1828);
    border:2px solid #44ccff44;border-radius:14px;padding:14px;cursor:pointer;width:130px;
  }
  .pick:hover{border-color:#44ccff;box-shadow:0 0 22px #44ccff55}
  .pick img{width:84px;height:84px;display:block;margin:0 auto 6px}
  .pick .lab{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;color:#44ccff;letter-spacing:.12em}

  #notify{
    position:fixed;top:160px;left:50%;transform:translateX(-50%) scale(0);
    background:#0a1828ee;border:2px solid #ffcc4488;border-radius:12px;
    padding:10px 18px;font-family:'Orbitron',sans-serif;font-weight:700;
    color:#ffcc44;letter-spacing:.18em;font-size:.9rem;
    pointer-events:none;z-index:7;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  #notify.show{transform:translateX(-50%) scale(1)}

  /* Bath suds overlay */
  .bath{position:fixed;inset:0;background:#88ddff44;z-index:8;pointer-events:none;animation:fadeOut 1.5s forwards}
  @keyframes fadeOut { 0% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes pop {
    0%   { transform: scale(0.6); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .coin-flash{
    position:fixed;top:60px;right:14px;
    background:#1a1a08cc;border:1px solid #ffcc44;border-radius:8px;
    padding:4px 10px;color:#ffcc44;font-family:'Orbitron',sans-serif;letter-spacing:.1em;font-weight:700;
    z-index:8;pointer-events:none;font-size:.8rem;
    transform:translateX(100px);transition:transform .35s;
  }
  .coin-flash.show{transform:translateX(0)}
</style>
</head>
<body>

<div id="scene"><canvas id="game"></canvas></div>

<button id="back-btn" onclick="window.location.href='../'">✖</button>

<div id="stats">
  <div class="stat hunger"><span class="ic">🍖</span><span class="lab">Fame</span><div class="bar"><div class="fill" id="b-h"></div></div><span class="num" id="n-h">100</span></div>
  <div class="stat happy"><span class="ic">😊</span><span class="lab">Felicità</span><div class="bar"><div class="fill" id="b-y"></div></div><span class="num" id="n-y">100</span></div>
  <div class="stat clean"><span class="ic">✨</span><span class="lab">Pulizia</span><div class="bar"><div class="fill" id="b-c"></div></div><span class="num" id="n-c">100</span></div>
  <div class="stat energy"><span class="ic">⚡</span><span class="lab">Energia</span><div class="bar"><div class="fill" id="b-e"></div></div><span class="num" id="n-e">100</span></div>
</div>

<div id="petinfo">
  <div class="name" id="p-name">BRUTIMON</div>
  <div class="stage" id="p-stage">CUCCIOLO</div>
  <div class="grow">
    <div class="grow-bar"><div class="grow-fill" id="g-fill"></div></div>
    <div class="grow-text" id="g-text">0/3h alla prossima evoluzione</div>
  </div>
</div>

<div id="coin-hud" title="Monete">
  <span class="ic">🪙</span><span class="val" id="coin-val">0</span>
</div>
<div id="ill-hud" title="Il pet è malato — usa MEDICINA">
  <span id="ill-icon">🤒</span><span id="ill-label">MALATO</span>
</div>

<div id="actions">
  <div class="act" id="a-feed"   onclick="doAction('feed')"><div class="ic">🍎</div><div class="nm">SFAMA</div></div>
  <div class="act" id="a-cuddle" onclick="doAction('cuddle')"><div class="ic">🤗</div><div class="nm">COCCOLE</div></div>
  <div class="act" id="a-play"   onclick="doAction('play')"><div class="ic">🎾</div><div class="nm">GIOCA</div></div>
  <div class="act" id="a-bath"   onclick="doAction('bath')"><div class="ic">🛁</div><div class="nm">LAVA</div></div>
  <div class="act" id="a-sleep"  onclick="doAction('sleep')"><div class="ic">💤</div><div class="nm">DORMI</div></div>
  <div class="act" id="a-medic"  onclick="doAction('medic')"><div class="ic">💊</div><div class="nm">MEDICINA</div><div class="pr" id="medic-cost">20🪙</div></div>
  <div class="act" onclick="doAction('mini')"><div class="ic">🎯</div><div class="nm">CACCIA</div><div class="pr">+monete</div></div>
  <div class="act" onclick="doAction('treat')"><div class="ic">🍰</div><div class="nm">DOLCETTO</div><div class="pr">5🪙</div></div>
  <div class="act" onclick="doAction('toy')"><div class="ic">🪀</div><div class="nm">GIOCO</div><div class="pr">10🪙</div></div>
  <div class="act" id="a-evolve" onclick="forceEvolve()"><div class="ic">✨</div><div class="nm">EVOLVI</div><div class="pr" id="evolve-cost">20🪙</div></div>
  <div class="act" onclick="changeBrutimon()"><div class="ic">🔄</div><div class="nm">CAMBIA</div></div>
</div>

<div id="notify"></div>

<div id="panel-pick" class="panel"></div>
<div id="panel-evolve" class="panel"></div>
<div id="panel-low" class="panel"></div>

<script src="../shared/profile.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/brutimon.js"></script>
<script src="../shared/coins.js"></script>
<script>
'use strict';

const POKE_POOL = ['swift','runner','mini','grunt','tank'];
const BASE = '../neon-defender/assets/skin-pokemon/';
const imgs = {};
for(const k of POKE_POOL){ const im = new Image(); im.src = BASE + k + '.png'; imgs[k] = im; }
function ready(im){ return im && im.complete && im.naturalWidth > 0; }

// ─── Brutimon species — loaded from shared/brutimon/index.json at boot ─────
let BRUTI_LIST = [];       // [{ id, name, tag, rarity }]
let currentCard = null;    // metadata for the currently adopted brutimon
Brutimon.registry().then(reg => {
  BRUTI_LIST = reg.species || [];
  // Pre-fetch stage sprites for the picker so they're cached by the time it opens
  Brutimon.preload(BRUTI_LIST.map(s => s.id));
}).catch(() => {});

// Return the HTMLImage to render for the current pet, picking the right
// brutimon stage sprite when the pet is a brutimon.
function currentSpriteImage(){
  if(state.kind === 'brutimon' && state.species){
    const s = Math.min(5, Math.max(1, ((state.stage | 0) + 1)));
    return Brutimon.image(state.species, s);
  }
  return imgs[state.species || state.sprite];
}
function currentSpriteReady(){
  const im = currentSpriteImage();
  return im && im.complete && im.naturalWidth > 0;
}
// HTTP URL for the current sprite — used by the evolve modal (which uses an
// <img src=...> tag rather than the canvas).
function currentSpriteSrc(){
  if(state.kind === 'brutimon' && state.species){
    const s = Math.min(5, Math.max(1, ((state.stage | 0) + 1)));
    return `${Brutimon.BASE}/${state.species}/${state.species}_${s}.png`;
  }
  return `${BASE}${state.species || state.sprite}.png`;
}
// Load and cache the brutimon card metadata when the pet is a brutimon.
function refreshCard(){
  if(state.kind === 'brutimon' && state.species){
    Brutimon.card(state.species).then(c => { currentCard = c; updateHUD(); });
  } else {
    currentCard = null;
  }
}

// ─── Audio ───────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let ac = null, master = null;
  function ensure(){ if(ac) return ac; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); return ac; }
  function tone({freq=440, dur=0.08, type='sine', vol=0.18, sweep=0}){
    if(!ensure()) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.04);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.06);
  }
  function silence(){ if(master) master.gain.value = 0; }
  function unmute(){ if(master) master.gain.value = 0.5; }
  function feed(){  tone({freq:660, dur:0.10, type:'square', vol:0.18}); setTimeout(() => tone({freq:880, dur:0.10, type:'square', vol:0.18}), 90); }
  function play(){  tone({freq:880, dur:0.06, type:'square', vol:0.16}); setTimeout(() => tone({freq:1320, dur:0.08, type:'square', vol:0.18}), 60); setTimeout(() => tone({freq:1100, dur:0.10, type:'square', vol:0.18}), 130); }
  function bath(){  tone({freq:400, dur:0.30, type:'sine', vol:0.18, sweep:200}); }
  function sleep(){ tone({freq:300, dur:0.30, type:'sine', vol:0.14, sweep:-100}); }
  function coin(){  tone({freq:880, dur:0.06, type:'square', vol:0.18}); setTimeout(() => tone({freq:1320, dur:0.10, type:'square', vol:0.20}), 70); }
  function evolve(){ [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.20, type:'square', vol:0.20}), i * 130)); }
  function nope(){  tone({freq:200, dur:0.20, type:'sawtooth', vol:0.22, sweep:-80}); }
  return { feed, play, bath, sleep, coin, evolve, nope, silence, unmute };
})();
window.addEventListener('pagehide', () => Sfx.silence());
document.addEventListener('visibilitychange', () => { if(document.hidden) Sfx.silence(); else Sfx.unmute(); });

// ─── State ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'pkcare-v1';
const STAGES = ['CUCCIOLO', 'GIOVANE', 'ADOLESCENTE', 'ADULTO', 'LEGGENDARIO'];
const STAGE_THRESH = [0, 2, 6, 15, 35];   // care-hours of "all stats >= 60" to advance

function defaultState(){
  return {
    name: '',
    kind: 'pokemon',        // 'pokemon' | 'brutimon'
    species: '',            // sprite key for pokemon, registry id for brutimon
    sprite: '',             // legacy alias of species (kept in sync for old code paths)
    hunger: 100, happy: 100, clean: 100, energy: 100,
    stage: 0,
    careHours: 0,
    lastTickMs: Date.now(),
    lastCoinMs: Date.now(),
    sleeping: false,
    born: Date.now(),
    // Sickness tracking. illness ∈ null | 'starvation' | 'depression' |
    // 'exhaustion' | 'infection'. illTimers counts how long (in seconds of
    // real play) each stat has been critically low.
    illness: null,
    illTimers: { hunger: 0, happy: 0, clean: 0, energy: 0 },
  };
}

// ─── Illness ────────────────────────────────────────────────────────────────
// Per stat, a real-time timer ticks up while the stat is BELOW the threshold
// and resets when the stat recovers ABOVE the recovery line. When a timer
// crosses ILL_THRESHOLD_S the pet becomes sick with the matching illness.
// While sick, decay is amplified by ILL_DECAY_MULT so the player has to
// react (MEDICINA action costs coins and clears the illness).
const ILL_THRESHOLD_S  = 60;          // seconds spent low before becoming sick
const ILL_LOW_LIMIT    = 18;          // % under which the timer accumulates
const ILL_RECOVER_LIMIT = 45;         // % over which the timer resets
const ILL_DECAY_MULT   = 1.6;         // decay multiplier while sick
const ILLNESSES = {
  hunger:  { id: 'starvation', label: 'AFFAMATO',  icon: '🥶' },
  happy:   { id: 'depression', label: 'TRISTE',    icon: '😭' },
  clean:   { id: 'infection',  label: 'INFEZIONE', icon: '🤢' },
  energy:  { id: 'exhaustion', label: 'SFINITO',   icon: '😵' }
};
const ILL_BY_ID = (function(){
  const m = {};
  for(const k of Object.keys(ILLNESSES)){ m[ILLNESSES[k].id] = ILLNESSES[k]; }
  return m;
})();
const MEDICINE_COST = 20;

function updateIllness(dt){
  if(!state.illTimers) state.illTimers = { hunger: 0, happy: 0, clean: 0, energy: 0 };
  // Already sick: don't accumulate more timers; the cure is the only way out.
  if(state.illness) return;
  for(const k of Object.keys(ILLNESSES)){
    const v = state[k];
    if(v <  ILL_LOW_LIMIT)      state.illTimers[k] = (state.illTimers[k] || 0) + dt;
    else if(v > ILL_RECOVER_LIMIT) state.illTimers[k] = 0;
    if(state.illTimers[k] >= ILL_THRESHOLD_S){
      const ill = ILLNESSES[k];
      state.illness = ill.id;
      state.illTimers[k] = 0;
      notify(`MALATTIA: ${ill.label}`, '#ff5566');
      Sfx.nope();
      if(window.Track) Track.event('pet_sick', { illness: ill.id });
      return;
    }
  }
}
function illBadge(){
  const wrap = document.getElementById('ill-hud');
  if(!wrap) return;
  if(!state.illness){ wrap.classList.remove('show'); return; }
  const ill = ILL_BY_ID[state.illness];
  if(!ill){ wrap.classList.remove('show'); return; }
  document.getElementById('ill-icon').textContent  = ill.icon;
  document.getElementById('ill-label').textContent = ill.label;
  wrap.classList.add('show');
}
let state = defaultState();

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s.sprite && !s.species) return null;
    // Backward-compat: old saves had only `sprite` (always a pokemon id) and
    // no `kind`/`species`. Treat them as the pokemon kind.
    if(!s.kind){ s.kind = 'pokemon'; }
    if(!s.species){ s.species = s.sprite; }
    if(!s.sprite){ s.sprite = s.species; }
    return s;
  } catch(e){ return null; }
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

// Time-based decay (offline catch-up: if you re-open after hours, stats decay).
// Aggressive rates — the user wants the pet to demand attention often so the
// game feels engaging. At these numbers a fully-charged pet drops below the
// "danger" 30% threshold in ~20-25 minutes of inactivity, and the sad face
// shows up if happy goes uncuddled for a while.
const DECAY_PER_HOUR = { hunger: 130, happy: 110, clean: 140, energy: 120 };
// Sleep regen is intentionally fast — the player won't sit and watch a 2h bar.
// 1200/hour = 20 per minute = full 0→100 recharge in 5 minutes of real time.
const SLEEP_ENERGY_PER_HOUR = 1200;
function applyTimePass(){
  const now = Date.now();
  let elapsedMs = now - state.lastTickMs;
  if(elapsedMs < 0) elapsedMs = 0;
  // Cap offline time to 24h so the pet doesn't fully die from a week-long pause
  elapsedMs = Math.min(elapsedMs, 24 * 3600 * 1000);
  const h = elapsedMs / (3600 * 1000);
  // During sleep, hunger/happy decay less but energy regenerates instead of decaying
  if(state.sleeping){
    state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * 0.4 * h);
    state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * 0.6 * h);
    state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h);
    state.energy = Math.min(100, state.energy + SLEEP_ENERGY_PER_HOUR * h);
    if(state.energy >= 100) state.sleeping = false;
  } else {
    state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * h);
    state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * h);
    state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h);
    state.energy = Math.max(0, state.energy - DECAY_PER_HOUR.energy * h);
  }
  // Care-time accumulator: only counts when ALL stats >= 60
  if(state.hunger >= 60 && state.happy >= 60 && state.clean >= 60 && state.energy >= 60){
    state.careHours = (state.careHours || 0) + h;
  }
  // Coin generation: 1 coin every 8 minutes if happy AND fed; we batch in offline catch-up
  if(state.happy >= 50 && state.hunger >= 50){
    const COIN_INTERVAL_MS = 8 * 60 * 1000;
    let gained = 0;
    let cursor = state.lastCoinMs;
    while(now - cursor >= COIN_INTERVAL_MS){
      cursor += COIN_INTERVAL_MS;
      gained++;
      if(gained > 30) break; // cap offline coin gain
    }
    if(gained > 0 && window.Coins){
      Coins.add(gained, 'pkcare-passive');
      flashCoin(gained);
    }
    state.lastCoinMs = cursor;
  } else {
    state.lastCoinMs = now;
  }
  state.lastTickMs = now;
  checkEvolve();
}
function checkEvolve(){
  for(let i = STAGES.length - 1; i > state.stage; i--){
    if(state.careHours >= STAGE_THRESH[i]){
      const old = state.stage;
      state.stage = i;
      if(i > old) onEvolve(STAGES[old], STAGES[i]);
      break;
    }
  }
}

// ─── UI updates ──────────────────────────────────────────────────────────────
function setBar(id, v){
  const f = document.getElementById(id);
  f.style.width = v + '%';
  const n = document.getElementById(id.replace('b-', 'n-'));
  n.textContent = Math.round(v);
  const parent = f.parentElement.parentElement;
  if(v < 25) parent.classList.add('danger'); else parent.classList.remove('danger');
}
function updateHUD(){
  setBar('b-h', state.hunger);
  setBar('b-y', state.happy);
  setBar('b-c', state.clean);
  setBar('b-e', state.energy);
  document.getElementById('p-name').textContent  = state.name || (state.species || state.sprite || '').toUpperCase();
  // For brutimon, show "STAGE_LIFECYCLE_NAME · evolved-name" e.g. "GIOVANE · Glitchix"
  const baseStageLabel = STAGES[state.stage] || 'CUCCIOLO';
  let stageLabel = baseStageLabel;
  if(state.kind === 'brutimon' && currentCard){
    const evName = currentCard['stage_' + ((state.stage|0)+1) + '_name'];
    if(evName) stageLabel += ' · ' + evName;
  }
  document.getElementById('p-stage').textContent = stageLabel + (state.sleeping ? ' · ZZZ' : '');
  // Disable actions that don't apply right now
  document.getElementById('a-sleep').classList.toggle('disabled', state.sleeping || state.energy > 95);
  const cu = document.getElementById('a-cuddle');
  if(cu) cu.classList.toggle('disabled', performance.now() < cuddleCdUntil);
  // Evolve button: show next-stage cost, disable at max stage.
  const ev = document.getElementById('a-evolve');
  const evCost = document.getElementById('evolve-cost');
  if(ev && evCost){
    const atMax = state.stage >= STAGES.length - 1;
    const nextCost = atMax ? null : (FORCE_EVOLVE_COST[state.stage + 1] || 100);
    evCost.textContent = atMax ? 'MAX' : (nextCost + '🪙');
    ev.classList.toggle('disabled', atMax);
  }
  // Medicine button: disabled when the pet is healthy.
  const md = document.getElementById('a-medic');
  if(md){
    md.classList.toggle('disabled', !state.illness);
  }
  // Illness badge top-left
  illBadge();
  // Growth bar: progress within current stage toward the next threshold
  const gFill = document.getElementById('g-fill');
  const gText = document.getElementById('g-text');
  if(gFill && gText){
    const lastIdx = STAGES.length - 1;
    if(state.stage >= lastIdx){
      gFill.style.width = '100%';
      gText.textContent = 'EVOLUZIONE COMPLETA ★';
      gText.classList.add('max');
    } else {
      const cur = STAGE_THRESH[state.stage];
      const next = STAGE_THRESH[state.stage + 1];
      const span = Math.max(0.0001, next - cur);
      const done = Math.max(0, Math.min(span, (state.careHours || 0) - cur));
      const pct = (done / span) * 100;
      gFill.style.width = pct.toFixed(1) + '%';
      const remaining = Math.max(0, next - (state.careHours || 0));
      const hh = remaining.toFixed(remaining < 1 ? 2 : 1);
      gText.textContent = `${hh}h alla prossima evoluzione`;
      gText.classList.remove('max');
    }
  }
}

function notify(msg, color){

// ─── Actions ─────────────────────────────────────────────────────────────────
let cuddleCdUntil = 0;
let miniGame = null;          // { until, treatsLeft, totalCoins }

function doAction(kind){
  applyTimePass();
  if(state.sleeping && kind !== 'sleep'){
    notify('STA DORMENDO!', '#888');
    Sfx.nope();
    state.sleeping = false; // wake on poke
    save(); updateHUD(); return;
  }
  switch(kind){
    case 'feed':
      if(state.hunger >= 95){ notify('NON HA FAME', '#ff8866'); Sfx.nope(); return; }
      state.hunger = Math.min(100, state.hunger + 35);
      state.happy  = Math.min(100, state.happy + 4);
      state.clean  = Math.max(0, state.clean - 5);
      Sfx.feed();
      notify('+ FAME', '#ffcc44'); animMood('happy'); break;
    case 'play':
      if(state.energy < 12){ notify('TROPPO STANCO!', '#ff8866'); Sfx.nope(); return; }
      state.happy  = Math.min(100, state.happy + 30);
      state.energy = Math.max(0, state.energy - 15);
      state.hunger = Math.max(0, state.hunger - 6);
      Sfx.play();
      notify('+ FELICITÀ', '#ff66cc'); animMood('play'); break;
    case 'bath':
      if(state.clean >= 95){ notify('GIÀ PULITO', '#888'); Sfx.nope(); return; }
      state.clean = 100; state.happy = Math.max(0, state.happy - 6);
      Sfx.bath();
      const fx = document.createElement('div'); fx.className = 'bath';
      document.body.appendChild(fx); setTimeout(() => fx.remove(), 1600);
      // Sparkle particles around pet
      for(let i = 0; i < 16; i++) spawnSparkle(petX + (Math.random() - 0.5) * 120, petY + (Math.random() - 0.5) * 120);
      notify('+ PULIZIA', '#88ddff'); animMood('bath'); break;
    case 'sleep':
      if(state.energy >= 95){ notify('NON È STANCO', '#888'); Sfx.nope(); return; }
      state.sleeping = !state.sleeping;
      Sfx.sleep();
      notify(state.sleeping ? 'DORME ZZZ' : 'SVEGLIO', '#88ccff'); break;
    case 'cuddle':
      if(performance.now() < cuddleCdUntil){ notify('ANCORA UN ATTIMO', '#888'); Sfx.nope(); return; }
      cuddleCdUntil = performance.now() + 4000;
      state.happy = Math.min(100, state.happy + 8);
      Sfx.play();
      // Heart particles around pet
      for(let i = 0; i < 5; i++) spawnHeart(petX + (Math.random() - 0.5) * 40, petY - 30);
      bounceUntil = performance.now() + 400;
      animMood('happy'); notify('+ COCCOLE', '#ff66cc'); break;
    case 'mini':
      if(miniGame){ notify('GIÀ IN CORSO!', '#888'); return; }
      if(state.energy < 8){ notify('TROPPO STANCO!', '#ff8866'); Sfx.nope(); return; }
      state.energy = Math.max(0, state.energy - 8);
      startMiniGame();
      if(window.Track) Track.event('mini_game_start', { sprite: state.sprite, stage: state.stage });
      notify('CACCIA AI DOLCETTI!', '#ffcc44'); break;
    case 'treat':
      if(!window.Coins || !Coins.spend(5)){ notify('NON BASTANO 🪙', '#ff8866'); Sfx.nope(); return; }
      state.happy  = Math.min(100, state.happy + 18);
      state.hunger = Math.min(100, state.hunger + 8);
      for(let i = 0; i < 6; i++) spawnHeart(petX + (Math.random() - 0.5) * 30, petY - 20);
      Sfx.feed(); animMood('happy'); notify('DOLCETTO!', '#ffcc44'); break;
    case 'toy':
      if(!window.Coins || !Coins.spend(10)){ notify('NON BASTANO 🪙', '#ff8866'); Sfx.nope(); return; }
      state.happy  = Math.min(100, state.happy + 35);
      for(let i = 0; i < 10; i++) spawnHeart(petX + (Math.random() - 0.5) * 50, petY - 30);
      Sfx.play(); animMood('play'); notify('NUOVO GIOCO!', '#ff66cc'); break;
    case 'medic':
      if(!state.illness){ notify('STA BENE', '#888'); Sfx.nope(); return; }
      if(!window.Coins || !Coins.spend(MEDICINE_COST)){
        notify(`SERVONO ${MEDICINE_COST}🪙`, '#ff8866'); Sfx.nope(); return;
      }
      // Cure: clear illness, reset all illness timers, restore the stat that
      // triggered the illness back over the recovery threshold.
      {
        const old = state.illness;
        const map = { starvation:'hunger', depression:'happy', infection:'clean', exhaustion:'energy' };
        const k = map[old];
        if(k) state[k] = Math.max(state[k], ILL_RECOVER_LIMIT + 25);
        state.illness = null;
        state.illTimers = { hunger: 0, happy: 0, clean: 0, energy: 0 };
        if(window.Track) Track.event('pet_healed', { illness: old, cost: MEDICINE_COST });
      }
      Sfx.coin();
      for(let i = 0; i < 14; i++) spawnSparkle(petX + (Math.random()-0.5)*60, petY + (Math.random()-0.5)*60);
      animMood('happy');
      notify('CURATO!', '#44ff88');
      break;
  }
  state.lastTickMs = Date.now();
  save(); updateHUD();
}

// ─── Mini-games — three variants picked at random each round ────────────────
// 'treats'  → cakes fall from the sky;        tap = +1🪙 + happy
// 'bubbles' → soap bubbles rise from below;   tap = +1🪙 + clean
// 'stars'   → shooting stars zip across fast; tap = +3🪙 (harder to catch)
const MINI_VARIANTS = ['treats', 'bubbles', 'stars'];
function startMiniGame(){
  const now = performance.now();
  const variant = MINI_VARIANTS[Math.floor(Math.random() * MINI_VARIANTS.length)];
  miniGame = {
    variant,
    until: now + 10000,
    nextSpawnAt: now,
    coinsEarned: 0,
    itemsTotal: variant === 'stars' ? 8 : 14,
    itemsSpawned: 0
  };
  const banner =
    variant === 'treats'  ? 'CACCIA AI DOLCETTI!' :
    variant === 'bubbles' ? 'POP BOLLE!' :
                            'STELLE CADENTI!';
  notify(banner, variant === 'stars' ? '#88ccff' : '#ffcc44');
}
function updateMiniGame(now){
  if(!miniGame) return;
  const haveActive = floatingItems.some(f => f.fromMini);
  const done = now >= miniGame.until ||
               (miniGame.itemsSpawned >= miniGame.itemsTotal && !haveActive);
  if(done){
    if(window.Track) Track.event('mini_game_end', {
      variant: miniGame.variant, coinsEarned: miniGame.coinsEarned,
      itemsTotal: miniGame.itemsTotal
    });
    if(miniGame.coinsEarned > 0){
      notify(`+${miniGame.coinsEarned}🪙 OK!`, '#ffcc44');
    } else {
      notify('FALLITA', '#ff8866');
    }
    miniGame = null;
    return;
  }
  if(miniGame.itemsSpawned < miniGame.itemsTotal && now >= miniGame.nextSpawnAt){
    if(miniGame.variant === 'treats')       spawnMiniItem('treat',  true);
    else if(miniGame.variant === 'bubbles') spawnMiniItem('bubble', true);
    else                                    spawnMiniItem('star',   true);
    miniGame.itemsSpawned++;
    miniGame.nextSpawnAt = now + (miniGame.variant === 'stars' ? 550 : 320) + Math.random() * 300;
  }
}

// ─── Particles + floating items ──────────────────────────────────────────────
let particles = [];
let floatingItems = [];
let nextAmbientTreatMs = 0;
let nextPoopMs = 0;

// ─── Floor encounters — TOYS the pet plays with + MUD PUDDLES it walks into ─
// No more drag-to-zone. The pet bumps into these as it wanders so the
// gameplay loop is "stuff appears → pet reacts" instead of "drag the pet".
//
//   toy   → pet plays with it: -energy, -clean, +happy, +1 coin
//           toy disappears after the interaction.
//   mud   → pet steps in it: -clean, -energy. Mud lingers ~30 s, then dries.
//
// Both spawn on cooldown timers that are seeded each time one resolves.
const TOY_ICONS  = ['🎾','🧸','🪀','🎲','🪁'];
let toys     = [];   // { x, y, icon, age, life, eaten }
let mudPools = [];   // { x, y, r, age, life, used }
let nextToyMs = 0;
let nextMudMs = 0;

function bandRect(){
  // Same band the pet uses for wandering — keeps spawns inside the playable area.
  const band = wanderBand();
  return { top: band.padTop + 40, bot: H - band.padBot - 60 };
}

function scheduleNextToy(){
  // 9–18 s between toys when the pet is awake.
  nextToyMs = performance.now() + 9000 + Math.random() * 9000;
}
function scheduleNextMud(){
  // 22–50 s between mud puddles — less frequent than toys.
  nextMudMs = performance.now() + 22000 + Math.random() * 28000;
}
function spawnToy(){
  if(toys.length >= 2) return;
  const r = bandRect();
  const usable = Math.max(60, r.bot - r.top);
  toys.push({
    x: 60 + Math.random() * Math.max(40, W - 120),
    y: r.top + Math.random() * usable,
    icon: TOY_ICONS[Math.floor(Math.random() * TOY_ICONS.length)],
    age: 0, life: 22, eaten: false
  });
}
function spawnMud(){
  if(mudPools.length >= 2) return;
  const r = bandRect();
  const usable = Math.max(60, r.bot - r.top);
  mudPools.push({
    x: 60 + Math.random() * Math.max(40, W - 120),
    y: r.top + usable * (0.55 + Math.random() * 0.4),  // bias toward lower half
    r: 46 + Math.random() * 16,
    age: 0, life: 30, used: false
  });
}

function updateToys(dt){
  if(!state.sleeping){
    if(!nextToyMs) scheduleNextToy();
    if(performance.now() >= nextToyMs){
      spawnToy();
      scheduleNextToy();
    }
  }
  // Tick lifetime and detect pet pickup.
  const sz = currentPetSize();
  const hitR = sz * 0.45;
  for(let i = toys.length - 1; i >= 0; i--){
    const t = toys[i];
    t.age += dt;
    if(t.age >= t.life){ toys.splice(i, 1); continue; }
    if(t.eaten) continue;
    const dx = petX - t.x, dy = petY - t.y;
    if(dx*dx + dy*dy < (hitR + 22) * (hitR + 22)){
      // Pet plays with the toy → tired + dirty + happy + 1 coin.
      t.eaten = true;
      state.happy  = Math.min(100, state.happy  + 8);
      state.energy = Math.max(0,   state.energy - 6);
      state.clean  = Math.max(0,   state.clean  - 5);
      bounceUntil = performance.now() + 360;
      animMood('play');
      if(window.Coins){ Coins.add(1, 'pkcare-toy'); flashCoin(1); }
      Sfx.play();
      for(let k = 0; k < 6; k++) spawnHeart(petX + (Math.random()-0.5)*30, petY - 20);
      for(let k = 0; k < 4; k++) spawnSparkle(t.x, t.y);
      // Toy vanishes shortly after pickup; let the player see the "bite" frame.
      setTimeout(() => { const idx = toys.indexOf(t); if(idx >= 0) toys.splice(idx, 1); }, 180);
      updateHUD(); save();
    }
  }
}
function updateMud(dt){
  if(!state.sleeping){
    if(!nextMudMs) scheduleNextMud();
    if(performance.now() >= nextMudMs){
      spawnMud();
      scheduleNextMud();
    }
  }
  for(let i = mudPools.length - 1; i >= 0; i--){
    const m = mudPools[i];
    m.age += dt;
    if(m.age >= m.life){ mudPools.splice(i, 1); continue; }
    const dx = petX - m.x, dy = petY - m.y;
    if(dx*dx + dy*dy < m.r * m.r){
      // Walking through mud drains clean + energy continuously. Trigger the
      // "got muddy" mood flash exactly once per mud encounter so it doesn't
      // strobe.
      state.clean  = Math.max(0, state.clean  - 22 * dt);
      state.energy = Math.max(0, state.energy - 12 * dt);
      if(!m.used){
        m.used = true;
        animMood('bath');  // muddy face icon; the mood emoji set already covers this
        for(let k = 0; k < 6; k++) spawnSparkle(m.x + (Math.random()-0.5)*30, m.y + (Math.random()-0.5)*20);
      }
    }
  }
}
function drawToys(){
  for(const t of toys){
    const wob = Math.sin(t.age * 6) * 4;
    const fadeIn  = Math.min(1, t.age * 4);
    const fadeOut = Math.min(1, (t.life - t.age) * 2);
    const a = Math.min(fadeIn, fadeOut);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 16;
    ctx.font = 'bold 38px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(t.icon, t.x + wob, t.y);
    ctx.restore();
  }
}
function drawMud(){
  for(const m of mudPools){
    const fade = Math.min(1, m.age * 2, (m.life - m.age) * 0.4);
    ctx.save();
    ctx.globalAlpha = 0.85 * fade;
    const grd = ctx.createRadialGradient(m.x, m.y, 4, m.x, m.y, m.r);
    grd.addColorStop(0, '#7a4a20');
    grd.addColorStop(0.7, '#4a2a10');
    grd.addColorStop(1, '#2a1a0800');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r, m.r * 0.55, 0, 0, Math.PI*2); ctx.fill();
    // Little splatter dots
    ctx.fillStyle = '#5a3015';
    for(let k = 0; k < 5; k++){
      const ang = k * 1.257;
      const rx = Math.cos(ang) * m.r * 0.7, ry = Math.sin(ang) * m.r * 0.35;
      ctx.beginPath(); ctx.arc(m.x + rx, m.y + ry, 3 + (k % 2), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ─── Visitor brutimons — other species drop by to play with the pet ─────────
// Every 25-55 s a random other brutimon walks in from one screen edge, bounces
// off the pet, and exits the other side. Bumping into your pet gives a small
// happiness/coin boost ("social bonus"). They're drawn at stage 1 (cucciolo).
let visitors = [];                    // { speciesId, x, y, vx, vy, age, life, bumped, size, img }
let nextVisitorMs = 0;
function scheduleNextVisitor(){
  // 25-55 s between visits, slightly more frequent at higher pet stages.
  const base = 25000 + Math.random() * 30000;
  nextVisitorMs = performance.now() + base;
}
function spawnVisitor(){
  if(!BRUTI_LIST.length) return;
  // Pick a random brutimon other than the player's current species.
  const pool = BRUTI_LIST.filter(s => s.id !== state.species);
  const pick = (pool.length ? pool : BRUTI_LIST)[Math.floor(Math.random() * (pool.length || BRUTI_LIST.length))];
  const band = wanderBand();
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? -60 : W + 60;
  // Use the same band the pet wanders in so the visitor actually meets it.
  const y = band.padTop + Math.random() * Math.max(40, H - band.padTop - band.padBot);
  const sp = 90 + Math.random() * 60;
  visitors.push({
    speciesId: pick.id,
    x, y,
    vx: fromLeft ? sp : -sp, vy: (Math.random() - 0.5) * 40,
    age: 0, life: 22,
    petBumpCdUntil: 0,             // ms timestamp when this visitor can bump the pet again
    size: 100,
    img: Brutimon.image(pick.id, 1),
    name: pick.name
  });
  if(window.Track) Track.event('visitor_spawned', { species: pick.id });
}

function updateVisitors(dt){
  const now = performance.now();
  // Maybe spawn one — slightly more often than before (15-40 s), still
  // capped at 2 on screen so the canvas doesn't get crowded.
  if(!nextVisitorMs) scheduleNextVisitor();
  if(!state.sleeping && now >= nextVisitorMs && visitors.length < 2){
    spawnVisitor();
    scheduleNextVisitor();
  }

  // 1. Move + wander + soft attraction toward the pet so the bump actually
  //    happens. Without this they often missed each other on a straight pass.
  const band = wanderBand();
  for(const v of visitors){
    v.age += dt;
    // Gentle steering bias toward the pet so they bounce more reliably
    const adx = petX - v.x, ady = petY - v.y;
    const adist = Math.hypot(adx, ady) || 1;
    v.vx += (adx / adist) * 35 * dt;
    v.vy += (ady / adist) * 28 * dt;
    // Mild sinusoidal sway on Y so they don't all overlap on one line
    v.vy += (Math.sin(v.age * 1.7) - v.vy * 0.03) * 22 * dt;
    // Speed cap so the steering doesn't explode
    const sp = Math.hypot(v.vx, v.vy);
    const CAP = 220;
    if(sp > CAP){ v.vx = v.vx / sp * CAP; v.vy = v.vy / sp * CAP; }
    v.x += v.vx * dt;
    v.y += v.vy * dt;
    // Clamp to the wander band so they don't end up under the action panel
    if(v.y < band.padTop)        { v.y = band.padTop;         v.vy = Math.abs(v.vy) * 0.6; }
    if(v.y > H - band.padBot)    { v.y = H - band.padBot;     v.vy = -Math.abs(v.vy) * 0.6; }
  }

  // 2. Visitor ↔ pet collision with cooldown so a single visitor can keep
  //    bumping into the pet during its visit.
  for(const v of visitors){
    const dx = petX - v.x, dy = petY - v.y;
    const minD = (v.size * 0.5 + currentPetSize() * 0.45);
    if(dx*dx + dy*dy < minD * minD && now > v.petBumpCdUntil){
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      const overlap = minD - d;
      v.x -= nx * overlap; v.y -= ny * overlap;
      const KICK = 280;
      v.vx = -nx * KICK; v.vy = -ny * KICK;
      v.petBumpCdUntil = now + 1500;   // can bump again after 1.5 s
      // Bump effects on the pet — playing tires & dirties the pet, but is fun.
      state.happy  = Math.min(100, state.happy  + 6);
      state.energy = Math.max(0,   state.energy - 4);
      state.hunger = Math.max(0,   state.hunger - 3);
      state.clean  = Math.max(0,   state.clean  - 3);
      bounceUntil = now + 360;
      if(window.Coins) Coins.add(1, 'pkcare-visitor');
      flashCoin(1);
      Sfx.play();
      for(let k = 0; k < 8; k++) spawnHeart(petX + (Math.random()-0.5)*40, petY - 20);
      for(let k = 0; k < 6; k++) spawnSparkle(v.x, v.y);
      animMood('play');
      updateHUD(); save();
    }
  }

  // 3. Visitor ↔ visitor billiard bounce. Elastic with energy loss.
  for(let i = 0; i < visitors.length; i++){
    for(let j = i + 1; j < visitors.length; j++){
      const a = visitors[i], b = visitors[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.hypot(dx, dy);
      const minD = (a.size + b.size) * 0.45;
      if(d > 0.001 && d < minD){
        const nx = dx / d, ny = dy / d;
        const overlap = minD - d;
        a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
        b.x += nx * overlap / 2; b.y += ny * overlap / 2;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const rel = rvx * nx + rvy * ny;
        if(rel < 0){
          const e = 0.85;
          const j2 = -(1 + e) * rel / 2;
          a.vx -= j2 * nx; a.vy -= j2 * ny;
          b.vx += j2 * nx; b.vy += j2 * ny;
          spawnSparkle((a.x + b.x) / 2, (a.y + b.y) / 2);
          spawnSparkle((a.x + b.x) / 2 + 8, (a.y + b.y) / 2 - 4);
        }
      }
    }
  }

  // 4. Despawn visitors that left the screen or expired.
  for(let i = visitors.length - 1; i >= 0; i--){
    const v = visitors[i];
    if(v.age > v.life || v.x < -120 || v.x > W + 120) visitors.splice(i, 1);
  }
}

function spawnHeart(x, y){
  particles.push({ x, y,
    vx: (Math.random() - 0.5) * 50,
    vy: -60 - Math.random() * 40,
    life: 1.2, age: 0, kind: 'heart' });
}
function spawnSparkle(x, y){
  particles.push({ x, y,
    vx: (Math.random() - 0.5) * 120,
    vy: (Math.random() - 0.5) * 120,
    life: 0.6, age: 0, kind: 'sparkle' });
}
function spawnTreat(fromMini){
  spawnMiniItem('treat', fromMini);
}
// Unified spawner for any mini-game item (treat / bubble / star). The kind
// drives both physics (gravity / float / sweep) and the tap reward.
function spawnMiniItem(kind, fromMini){
  if(kind === 'treat'){
    const x = 40 + Math.random() * (W - 80);
    floatingItems.push({ x, y: -20,
      vx: (Math.random() - 0.5) * 30, vy: 110 + Math.random() * 60,
      kind: 'treat', life: 9, age: 0, fromMini: !!fromMini });
    return;
  }
  if(kind === 'bubble'){
    const x = 40 + Math.random() * (W - 80);
    floatingItems.push({ x, y: H + 20,
      vx: (Math.random() - 0.5) * 24, vy: -80 - Math.random() * 50,
      kind: 'bubble', life: 8, age: 0, fromMini: !!fromMini });
    return;
  }
  if(kind === 'star'){
    // Sweep diagonally across the screen at a fast speed; only on briefly.
    const fromLeft = Math.random() < 0.5;
    const x  = fromLeft ? -20 : W + 20;
    const y  = 100 + Math.random() * (H * 0.45);
    const sp = 360 + Math.random() * 140;
    floatingItems.push({ x, y,
      vx: fromLeft ? sp : -sp, vy: 30 + Math.random() * 60,
      kind: 'star', life: 4, age: 0, fromMini: !!fromMini });
    return;
  }
}
function spawnPoop(){
  const x = 60 + Math.random() * (W - 120);
  const y = H * 0.62 + Math.random() * (H * 0.12);
  floatingItems.push({ x, y, vx: 0, vy: 0, kind: 'poop', life: 30, age: 0 });
}

function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;
    if(p.age >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.kind === 'heart'){ p.vy -= 30 * dt; p.vx *= (1 - dt * 0.6); }
    else { p.vx *= (1 - dt * 1.6); p.vy *= (1 - dt * 1.6); }
  }
}
function updateFloatingItems(dt){
  const groundY = H - 100;
  for(let i = floatingItems.length - 1; i >= 0; i--){
    const it = floatingItems[i];
    it.age += dt;
    if(it.age >= it.life){ floatingItems.splice(i, 1); continue; }
    if(it.kind === 'treat'){
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      if(it.y > groundY){ it.y = groundY; it.vy = 0; it.vx *= 0.5; }
    } else if(it.kind === 'bubble'){
      // Bubble rises, gently wobbles left-right with a sine sway.
      it.x += (it.vx + Math.sin(it.age * 4) * 16) * dt;
      it.y += it.vy * dt;
      // Pop when it reaches the top
      if(it.y < 80){ floatingItems.splice(i, 1); continue; }
    } else if(it.kind === 'star'){
      // Star coasts straight across; despawn when leaving the screen.
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      if(it.x < -40 || it.x > W + 40){ floatingItems.splice(i, 1); continue; }
    }
  }
}

// ─── Tap input: pet or floating item ─────────────────────────────────────────
// "Tap" reward for tickling the pet (not used for floating items). Called by
// pointerup when the gesture was short and didn't move the pet.
function onPetTap(){
  const now = performance.now();
  if(now - lastPetTapMs < 220) return;
  lastPetTapMs = now;
  bounceUntil = now + 360;
  if(state.sleeping){
    state.sleeping = false;
    notify('SVEGLIATO', '#88ccff');
  } else {
    state.happy = Math.min(100, state.happy + 1);
    const sz = currentPetSize();
    for(let i = 0; i < 3; i++) spawnHeart(petX + (Math.random() - 0.5) * 24, petY - sz * 0.3);
    Sfx.play();
  }
  updateHUD(); save();
}
let lastPetTapMs = 0;

// Tap on a falling treat / rising bubble / shooting star / dropped poop.
// Pet hits are handled by the drag/tap pipeline in wireCanvas below.
function onCanvasTap(sx, sy){
  for(let i = floatingItems.length - 1; i >= 0; i--){
    const it = floatingItems[i];
    const dx = sx - it.x, dy = sy - it.y;
    const hitR = it.kind === 'star' ? 44 : 36;
    if(dx*dx + dy*dy < hitR * hitR){
      if(it.kind === 'treat'){
        if(window.Coins) Coins.add(1, it.fromMini ? 'pkcare-mini' : 'pkcare-tap-treat');
        state.happy = Math.min(100, state.happy + 3);
        flashCoin(1); Sfx.coin();
        for(let k = 0; k < 4; k++) spawnSparkle(it.x, it.y);
        if(miniGame && it.fromMini) miniGame.coinsEarned++;
      } else if(it.kind === 'bubble'){
        if(window.Coins) Coins.add(1, it.fromMini ? 'pkcare-mini-bubble' : 'pkcare-tap-bubble');
        state.clean = Math.min(100, state.clean + 4);
        flashCoin(1); Sfx.bath();
        for(let k = 0; k < 6; k++) spawnSparkle(it.x, it.y);
        if(miniGame && it.fromMini) miniGame.coinsEarned++;
      } else if(it.kind === 'star'){
        if(window.Coins) Coins.add(3, it.fromMini ? 'pkcare-mini-star' : 'pkcare-tap-star');
        state.happy = Math.min(100, state.happy + 6);
        flashCoin(3); Sfx.coin();
        for(let k = 0; k < 10; k++) spawnSparkle(it.x + (Math.random()-0.5)*24, it.y + (Math.random()-0.5)*24);
        if(miniGame && it.fromMini) miniGame.coinsEarned += 3;
      } else if(it.kind === 'poop'){
        if(window.Coins) Coins.add(1, 'pkcare-clean');
        state.clean = Math.min(100, state.clean + 6);
        flashCoin(1); Sfx.bath();
        for(let k = 0; k < 4; k++) spawnSparkle(it.x, it.y);
      }
      floatingItems.splice(i, 1);
      updateHUD(); save();
      return true;
    }
  }
  return false;
}

// ─── Pet wander (gentle drift around the scene) ──────────────────────────────
let petX = 0, petY = 0;
let petTx = 0, petTy = 0;
let nextWanderAt = 0;
let bounceUntil = 0;

function currentPetSize(){
  const stageScale = 0.6 + state.stage * 0.18;
  return Math.min(W, H) * 0.36 * stageScale;
}
// Compute the live "wander band" — the strip of the canvas where the pet is
// allowed to roam. We measure the actual height of the stats panel at the
// top and the action grid at the bottom so the pet never wanders behind a
// button or under the stat bars.
function wanderBand(){
  const stats   = document.getElementById('stats');
  const actions = document.getElementById('actions');
  const padTop  = (stats   ? stats.offsetHeight   : 130) + 60;   // breathing room
  const padBot  = (actions ? actions.offsetHeight : 220) + 30;
  return { padTop, padBot };
}

function updatePet(dt){
  if(petX === 0 && petY === 0){
    petX = W / 2; petY = H / 2 + 20;
    petTx = petX; petTy = petY;
  }
  const now = performance.now();
  const band = wanderBand();
  // Sleeping pet stays where it is and slowly drifts to a nice spot if needed
  if(state.sleeping){
    petTx = W / 2; petTy = band.padTop + (H - band.padTop - band.padBot) * 0.5;
  } else if(now >= nextWanderAt){
    nextWanderAt = now + 3500 + Math.random() * 4000;
    const sz = currentPetSize();
    const padX = sz * 0.5 + 20;
    petTx = padX + Math.random() * (W - padX * 2);
    petTy = band.padTop + Math.random() * Math.max(20, H - band.padTop - band.padBot);
  }
  // Hard-clamp the pet's actual position too, in case the layout shrinks
  // (orientation change, keyboard, etc.) and the previous target is now
  // inside one of the UI panels.
  petY = Math.max(band.padTop + 10, Math.min(H - band.padBot - 10, petY));
  const dx = petTx - petX, dy = petTy - petY;
  const d = Math.hypot(dx, dy);
  const speed = state.sleeping ? 20 : 70;
  if(d > 4){
    const step = Math.min(speed * dt, d);
    petX += (dx / d) * step;
    petY += (dy / d) * step;
  }
}

// Wire pointer events. Two gestures only — no more dragging the pet around.
//   • tap on the pet → onPetTap (cuddle = happy bonus)
//   • tap anywhere else → onCanvasTap (floating items / mini-game targets)
(function wireCanvas(){
  const cv = document.getElementById('game');
  let downAt = 0, downX = 0, downY = 0, downOnPet = false;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    downAt = performance.now();
    downX = e.clientX; downY = e.clientY;
    const sz = currentPetSize();
    const dx = e.clientX - petX, dy = e.clientY - petY;
    downOnPet = dx*dx + dy*dy < (sz * 0.6) * (sz * 0.6);
    if(!downOnPet){
      // Floating-item tap takes effect immediately.
      onCanvasTap(e.clientX, e.clientY);
    }
  });
  cv.addEventListener('pointerup', e => {
    const dt = performance.now() - downAt;
    const moved = (e.clientX - downX) ** 2 + (e.clientY - downY) ** 2 > 25;
    if(downOnPet && !moved && dt < 320) onPetTap();
  });
})();

// ─── Pet rendering (canvas) ──────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = window.innerWidth; H = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

let mood = 'idle';
let moodUntil = 0;
let bubbles = [];
function animMood(m){ mood = m; moodUntil = performance.now() + 900; }

function avgMood(){
  return (state.hunger + state.happy + state.clean + state.energy) / 4;
}

function drawScene(ts){
  // Background gradient depending on cleanliness + happiness
  const cleanRatio = state.clean / 100;
  const happyRatio = state.happy / 100;
  ctx.save();
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  const top = `rgba(${Math.floor(20 + 80 * cleanRatio)},${Math.floor(40 + 120 * happyRatio)},${Math.floor(80 + 100 * cleanRatio)},1)`;
  const bot = `rgba(${Math.floor(8 + 30 * cleanRatio)},${Math.floor(20 + 30 * happyRatio)},${Math.floor(40 + 60 * cleanRatio)},1)`;
  grd.addColorStop(0, top); grd.addColorStop(1, bot);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  // Stars in the background (parallax)
  for(let i = 0; i < 40; i++){
    const x = ((i * 137 + ts * 0.04) % W);
    const y = ((i * 211 + ts * 0.02) % (H - 200)) + 60;
    const sz = (i % 3) + 1;
    ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 4) * 0.1})`;
    ctx.fillRect(x, y, sz, sz);
  }

  // Floor
  ctx.fillStyle = '#0a1828';
  ctx.fillRect(0, H - 140, W, 140);
  ctx.fillStyle = '#44ccff22';
  ctx.fillRect(0, H - 142, W, 2);

  // Dirt overlay when cleanliness is low
  if(state.clean < 50){
    const dirty = 1 - state.clean / 50;
    for(let i = 0; i < 24; i++){
      const x = ((i * 197) % W);
      const y = ((i * 113) % (H - 160)) + 80;
      ctx.fillStyle = `rgba(120,80,40,${0.25 * dirty})`;
      ctx.beginPath(); ctx.arc(x, y, 4 + (i % 4), 0, Math.PI*2); ctx.fill();
    }
  }

  // ─── Mud puddles (drawn under the toys so the pet on top reads first) ──
  drawMud();
  drawToys();

  // ─── Floating items (treats / poop) ─────────────────────────────────────
  const nowMs = performance.now();
  for(const it of floatingItems){
    if(it.kind === 'treat'){
      // Wobble while falling
      const wob = Math.sin(it.age * 8) * 4;
      ctx.font = '34px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#fff';
      ctx.fillText('🍰', it.x + wob, it.y);
      ctx.shadowBlur = 0;
      // Sparkle hint
      ctx.fillStyle = '#ffcc44aa';
      ctx.beginPath(); ctx.arc(it.x + 12 + wob, it.y - 16, 2, 0, Math.PI*2); ctx.fill();
    } else if(it.kind === 'bubble'){
      // Translucent ring + inner highlight; gently breathes in size.
      const r = 22 + Math.sin(it.age * 5) * 2;
      ctx.save();
      ctx.shadowColor = '#88ddff'; ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(170, 230, 255, 0.18)';
      ctx.beginPath(); ctx.arc(it.x, it.y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#bbeeff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(it.x, it.y, r, 0, Math.PI*2); ctx.stroke();
      // Specular highlight
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(it.x - r * 0.35, it.y - r * 0.4, r * 0.18, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(it.kind === 'star'){
      // Glowing star with a trailing tail pointing back along velocity.
      ctx.save();
      const speed = Math.hypot(it.vx, it.vy) || 1;
      const tx = -(it.vx / speed) * 30, ty = -(it.vy / speed) * 30;
      const grd = ctx.createLinearGradient(it.x, it.y, it.x + tx, it.y + ty);
      grd.addColorStop(0, '#ffff88'); grd.addColorStop(1, '#ffff8800');
      ctx.strokeStyle = grd; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(it.x, it.y); ctx.lineTo(it.x + tx, it.y + ty); ctx.stroke();
      ctx.shadowColor = '#ffff88'; ctx.shadowBlur = 22;
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText('⭐', it.x, it.y);
      ctx.restore();
    } else if(it.kind === 'poop'){
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#664422'; ctx.shadowBlur = 10;
      ctx.fillText('💩', it.x, it.y);
      ctx.shadowBlur = 0;
      // Tap hint pulse
      const pulse = 1 + 0.10 * Math.sin(nowMs * 0.01);
      ctx.strokeStyle = '#ff888866';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(it.x, it.y, 28 * pulse, 0, Math.PI*2); ctx.stroke();
    }
  }

  // ─── Visitor brutimons (drawn before the pet so the pet can overlap them) ─
  for(const v of visitors){
    const sz = v.size * (1 + 0.04 * Math.sin(v.age * 4));
    // Shadow
    ctx.fillStyle = '#00000055';
    ctx.beginPath();
    ctx.ellipse(v.x, v.y + sz * 0.42, sz * 0.36, sz * 0.10, 0, 0, Math.PI*2);
    ctx.fill();
    // Sprite
    if(Brutimon.imageReady(v.img)){
      const flip = v.vx < 0;
      ctx.save();
      if(flip){ ctx.translate(v.x, v.y); ctx.scale(-1, 1); ctx.drawImage(v.img, -sz/2, -sz/2, sz, sz); }
      else { ctx.drawImage(v.img, v.x - sz/2, v.y - sz/2, sz, sz); }
      ctx.restore();
    } else {
      ctx.fillStyle = '#88ddff'; ctx.beginPath();
      ctx.arc(v.x, v.y, sz * 0.35, 0, Math.PI*2); ctx.fill();
    }
    // Floating name tag the first ~3 s
    if(v.age < 3){
      const a = Math.max(0, 1 - v.age / 3);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Orbitron, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
      ctx.fillText(v.name, v.x, v.y - sz * 0.5 - 4);
      ctx.restore();
    }
  }

  // ─── Pet ────────────────────────────────────────────────────────────────
  // currentSpriteImage() picks the right stage PNG when the pet is a brutimon,
  // and falls back to the legacy pokemon sprite cache otherwise.
  const im = currentSpriteImage();
  const t = ts * 0.001;
  const sleepingNow = state.sleeping;
  // Breathing bounce + walking bob when moving
  const dxMove = petTx - petX, dyMove = petTy - petY;
  const moving = Math.hypot(dxMove, dyMove) > 6 && !sleepingNow;
  const breath = sleepingNow ? Math.sin(t * 1.5) * 4 : Math.sin(t * 2) * 5;
  const walk   = moving ? Math.abs(Math.sin(t * 7)) * 6 : 0;
  // Tap-bounce scale
  const bounceFrac = Math.max(0, (bounceUntil - nowMs) / 360);
  const bounceScale = 1 + 0.18 * Math.sin(bounceFrac * Math.PI * 2.5);
  // Stage scaling grows more across the 5 brutimon stages so the player sees
  // the pet visibly bigger as it evolves.
  const stageScale = 0.55 + state.stage * 0.14;
  const baseSz = Math.min(W, H) * 0.36 * stageScale;
  const sz = baseSz * bounceScale;
  const px = petX;
  const py = petY + breath - walk;
  // Shadow (squashes when bouncing)
  ctx.fillStyle = '#00000055';
  ctx.beginPath(); ctx.ellipse(px, py + sz * 0.45, sz * 0.4 / bounceScale, sz * 0.10 / bounceScale, 0, 0, Math.PI*2); ctx.fill();
  // Pet image
  if(ready(im)){
    ctx.save();
    if(sleepingNow){ ctx.globalAlpha = 0.8; }
    // Face the wander direction (flip horizontally if heading left)
    const facingLeft = dxMove < -8 && !sleepingNow;
    if(facingLeft){ ctx.translate(px, py); ctx.scale(-1, 1); ctx.drawImage(im, -sz/2, -sz/2, sz, sz); }
    else { ctx.drawImage(im, px - sz/2, py - sz/2, sz, sz); }
    ctx.restore();
  } else {
    ctx.fillStyle = '#44ccff';
    ctx.beginPath(); ctx.arc(px, py, sz * 0.4, 0, Math.PI*2); ctx.fill();
  }

  // ─── Particles (hearts / sparkles) ──────────────────────────────────────
  for(const p of particles){
    const a = Math.max(0, 1 - p.age / p.life);
    if(p.kind === 'heart'){
      ctx.font = `${Math.floor(22 * (0.7 + 0.3 * a))}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff';
      ctx.fillText('❤', p.x, p.y);
      ctx.globalAlpha = 1;
    } else if(p.kind === 'sparkle'){
      ctx.globalAlpha = a;
      ctx.fillStyle = '#88ddff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 2 * a, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Mini-game overlay timer ring
  if(miniGame){
    const remain = Math.max(0, (miniGame.until - nowMs) / 10000);
    ctx.save();
    ctx.strokeStyle = '#ffcc44';
    ctx.lineWidth = 5;
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 14;
    const cx = W - 40, cy = H * 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, 22, -Math.PI/2, -Math.PI/2 + remain * Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffcc44';
    ctx.font = 'bold 14px Orbitron'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🎯', cx, cy);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Orbitron';
    ctx.fillText(miniGame.coinsEarned + '🪙', cx, cy + 36);
    ctx.restore();
  }

  // Mood emoji bubble
  const now = performance.now();
  let moodEmoji = '';
  if(now < moodUntil){
    if(mood === 'happy') moodEmoji = '😋';
    else if(mood === 'play')  moodEmoji = '🥳';
    else if(mood === 'bath')  moodEmoji = '🛁';
  } else if(sleepingNow){
    moodEmoji = 'Z';
  } else {
    const a = avgMood();
    if(state.hunger < 25) moodEmoji = '😩';
    else if(state.happy < 25) moodEmoji = '😢';
    else if(state.clean < 25) moodEmoji = '🥴';
    else if(state.energy < 25) moodEmoji = '😴';
    else if(a > 80) moodEmoji = '😊';
  }
  if(moodEmoji){
    ctx.font = `${Math.floor(sz * 0.30)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.fillText(moodEmoji, px + sz * 0.4, py - sz * 0.45);
    ctx.shadowBlur = 0;
  }

  // Sleep Zs
  if(sleepingNow){
    ctx.fillStyle = '#bcd5e0';
    ctx.font = `bold ${Math.floor(sz * 0.20)}px Orbitron`;
    ctx.textAlign = 'center';
    const off = (ts * 0.001 * 2) % 1;
    for(let i = 0; i < 3; i++){
      const yOff = -sz * 0.7 - i * 18 - off * 18;
      ctx.globalAlpha = 1 - i * 0.3 - off * 0.3;
      ctx.fillText('Z', px + sz * 0.3, py + yOff);
    }
    ctx.globalAlpha = 1;
  }
}

// ─── Ambient spawning (treats from the sky, poop on the floor) ────────────
function tickAmbient(){
  const now = performance.now();
  if(!miniGame && now >= nextAmbientTreatMs && !state.sleeping){
    // First treat lands quickly; later ones every 25-50s
    nextAmbientTreatMs = now + 25000 + Math.random() * 25000;
    spawnTreat(false);
  }
  if(state.clean < 55 && now >= nextPoopMs){
    nextPoopMs = now + 35000 + Math.random() * 35000;
    // Cap to 2 active poops so the screen doesn't get cluttered
    const cur = floatingItems.filter(i => i.kind === 'poop').length;
    if(cur < 2) spawnPoop();
  }
}

// ─── Loop ────────────────────────────────────────────────────────────────────
let lastT = performance.now();
let lastSaveSec = -1;
function loop(ts){
  const prevT = lastT;
  const dt = (ts - lastT) / 1000; lastT = ts;
  // Apply tiny decay each frame for smooth bar movement
  if(state.sprite){
    const h = dt / 3600;
    // While sick the pet drains faster — the player has to react.
    const sickK = state.illness ? ILL_DECAY_MULT : 1;
    if(state.sleeping){
      state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * 0.4 * h * sickK);
      state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * 0.6 * h * sickK);
      state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h * sickK);
      state.energy = Math.min(100, state.energy + SLEEP_ENERGY_PER_HOUR * h);
      if(state.energy >= 100) state.sleeping = false;
    } else {
      state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * h * sickK);
      state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * h * sickK);
      state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h * sickK);
      state.energy = Math.max(0, state.energy - DECAY_PER_HOUR.energy * h * sickK);
    }
    // Sickness tick — see updateIllness for thresholds + effects.
    updateIllness(dt);
    if(state.hunger >= 60 && state.happy >= 60 && state.clean >= 60 && state.energy >= 60){
      state.careHours = (state.careHours || 0) + h;
    }
    // Passive coin every 8 minutes when happy AND fed
    const now = Date.now();
    if(state.happy >= 50 && state.hunger >= 50){
      if(now - state.lastCoinMs >= 8 * 60 * 1000){
        state.lastCoinMs = now;
        if(window.Coins){ Coins.add(1, 'pkcare-passive'); flashCoin(1); Sfx.coin(); }
      }
    } else {
      state.lastCoinMs = now;
    }
    checkEvolve();
    updateHUD();
    const sec = Math.floor(ts / 1000);
    if(sec !== lastSaveSec){ lastSaveSec = sec; save(); } // save once per second
  }
  // Live interactions: pet wander, particles, floating items, ambient + mini-game
  if(state.sprite){
    updatePet(dt);
    updateToys(dt);
    updateMud(dt);
    updateParticles(dt);
    updateFloatingItems(dt);
    if(!nextVisitorMs) scheduleNextVisitor();   // first call seeds the timer
    updateVisitors(dt);
    tickAmbient();
    updateMiniGame(performance.now());
  }
  drawScene(ts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Save on hide
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if(document.hidden){ state.lastTickMs = Date.now(); save(); } else { applyTimePass(); updateHUD(); } });

// ─── Onboarding / Evolve panels ──────────────────────────────────────────────
async function showPicker(opts){
  opts = opts || {};
  const allowCancel = !!opts.allowCancel;
  const ol = document.getElementById('panel-pick');
  // Make sure registry + first-stage sprites are loaded so the tiles render.
  try { await Brutimon.preload(BRUTI_LIST.map(s => s.id)); } catch(e){}
  const reg = await Brutimon.registry();
  const species = reg.species || [];
  ol.innerHTML = `
    <h1>BRUTIMON CARE</h1>
    <p>Adotta il tuo Brutimon e prenditene cura. Si evolve attraverso 5 stadi quando lo tratti bene.</p>
    <h3>SCEGLI IL TUO COMPAGNO</h3>
    <div class="picks">
      ${species.map(s => `
        <div class="pick" data-id="${s.id}">
          <img src="${Brutimon.BASE}/${s.id}/${s.id}_1.png" />
          <div class="lab">${s.name.toUpperCase()}</div>
          <div style="font-size:.65rem;color:#a0b8e088;margin-top:4px;letter-spacing:.08em">${s.tag || ''}</div>
        </div>
      `).join('')}
    </div>
    <p style="margin-top:18px;font-size:.78rem;color:#a0b8e0">
      Sfama, gioca, lava, fallo dormire. Mantieni le statistiche sopra il 60% per evolverlo, oppure usa <b style="color:#ffcc44">FORZA EVOLUZIONE</b> spendendo monete.
    </p>
    ${allowCancel ? '<button class="btn" id="pick-cancel" style="margin-top:6px">ANNULLA</button>' : ''}
  `;
  ol.classList.add('show');
  const cancelBtn = document.getElementById('pick-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => ol.classList.remove('show'));
  ol.querySelectorAll('.pick').forEach(el => {
    el.addEventListener('click', () => {
      state = defaultState();
      state.kind = 'brutimon';
      state.species = el.dataset.id;
      state.sprite  = el.dataset.id;    // legacy compat
      const meta = species.find(s => s.id === state.species);
      state.name = (meta && meta.name.toUpperCase()) || state.species.toUpperCase();
      currentCard = null;
      refreshCard();
      save();
      ol.classList.remove('show');
      updateHUD();
      Sfx.evolve();
      return;
    });
  });
}
function showPicker_LEGACY_UNUSED(){
  // (kept until cleanup) old pokemon-only picker, replaced by the brutimon
  // registry-driven one above.
  const ol = document.getElementById('panel-pick');
  ol.innerHTML = `
    <div class="picks">
      ${POKE_POOL.map(sp => `
        <div class="pick" data-sp="${sp}">
          <img src="${BASE}${sp}.png" />
          <div class="lab">${sp.toUpperCase()}</div>
        </div>
      `).join('')}
    </div>
  `;
  ol.classList.add('show');
  ol.querySelectorAll('.pick').forEach(el => {
    el.addEventListener('click', () => {
      const sp = el.dataset.sp;
      state = defaultState();
      state.sprite = sp;
      state.name = sp.toUpperCase();
      save();
      ol.classList.remove('show');
      updateHUD();
    });
  });
}

function onEvolve(fromStage, toStage, paid){
  Sfx.evolve();
  if(window.Track) Track.event('pet_evolve', { from: fromStage, to: toStage, sprite: state.sprite, careHours: state.careHours, paid: !!paid });
  // Natural evolution = +25🪙 bonus reward. Force-evolve already cost coins,
  // so it skips the bonus to avoid being net-positive.
  if(!paid && window.Coins) Coins.add(25, 'pkcare-evolve');
  // Big burst of sparkles + hearts around the pet for a celebratory feel.
  for(let i = 0; i < 60; i++) spawnSparkle(petX + (Math.random() - 0.5) * 240, petY + (Math.random() - 0.5) * 240);
  for(let i = 0; i < 10; i++) spawnHeart(petX + (Math.random() - 0.5) * 80, petY - 20);
  bounceUntil = performance.now() + 800;
  // Short delay so the player sees the burst before the modal pops up.
  setTimeout(() => {
    const ol = document.getElementById('panel-evolve');
    // For brutimon, the new stage has its own name (e.g. Glitchix) — show it.
    let evName = '';
    if(state.kind === 'brutimon' && currentCard){
      const n = currentCard['stage_' + ((state.stage|0)+1) + '_name'];
      if(n) evName = `<p style="color:#ffcc44;font-family:Orbitron,sans-serif;letter-spacing:.14em;margin-top:6px">${n}</p>`;
    }
    ol.innerHTML = `
      <h1>EVOLUZIONE!</h1>
      <p>${state.name} cresce da <b style="color:#44ccff">${fromStage}</b> a <b style="color:#44ffcc">${toStage}</b>.</p>
      ${evName}
      <img src="${currentSpriteSrc()}" style="width:160px;height:160px;margin:18px 0;image-rendering:pixelated;filter:drop-shadow(0 0 28px #44ffcc) drop-shadow(0 0 60px #ffcc4488);animation:pop .7s"/>
      <p>+25🪙 bonus!</p>
      <button class="btn alt" onclick="document.getElementById('panel-evolve').classList.remove('show')">CONTINUA</button>
    `;
    ol.classList.add('show');
  }, 700);
  save();
}

// ─── Force evolution (paid) ──────────────────────────────────────────────────
// Spend coins to skip directly to the next stage. Cost grows with the target
// stage so it stays useful but never trivial.
const FORCE_EVOLVE_COST = [0, 20, 35, 60, 100];   // cost to *reach* stage idx
function forceEvolve(){
  if(state.stage >= STAGES.length - 1){ notify('GIÀ AL MASSIMO', '#888'); Sfx.nope(); return; }
  const target = state.stage + 1;
  const cost = FORCE_EVOLVE_COST[target] || 100;
  if(!window.Coins || !Coins.canSpend(cost)){
    notify(`SERVONO ${cost}🪙`, '#ff8866');
    Sfx.nope();
    return;
  }
  if(!Coins.spend(cost, 'pkcare-force-evolve')) return;
  const oldName = STAGES[state.stage];
  state.stage = target;
  // Award the care-time threshold so the bar matches.
  state.careHours = Math.max(state.careHours, STAGE_THRESH[target] || 0);
  if(window.Track) Track.event('pet_force_evolve', { species: state.species, stage: target, cost });
  save();
  onEvolve(oldName, STAGES[target], true);   // `paid` → no +25 natural bonus
  updateHUD();
}
window.forceEvolve = forceEvolve;

// Open the picker again to adopt a different brutimon. Confirms first so a
// stray tap doesn't wipe the current pet's progress.
function changeBrutimon(){
  if(state.species && !confirm('Vuoi adottare un altro Brutimon? Quello attuale verrà sostituito quando ne sceglierai uno nuovo.')) return;
  if(window.Track) Track.event('pet_change', { from: state.species });
  // Don't wipe state until the user actually picks a new pet — they may
  // dismiss the picker via ANNULLA and we want the current pet to survive.
  showPicker({ allowCancel: !!state.species });
}
window.changeBrutimon = changeBrutimon;

// ─── Boot ────────────────────────────────────────────────────────────────────
const loaded = load();
if(loaded){
  state = loaded;
  applyTimePass();
  updateHUD();
  refreshCard();
} else {
  showPicker();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
