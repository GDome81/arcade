<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>POKEMON CARE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#44ccff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a1828;color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100%}
  body{touch-action:none;user-select:none;-webkit-user-select:none}
  #scene{position:fixed;inset:0}
  #game{display:block;width:100%;height:100%;touch-action:none}

  /* Top bar with stats */
  #stats{
    position:fixed;top:0;left:0;right:0;padding:10px 16px 6px 60px;
    display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none;
    background:linear-gradient(to bottom,#0a1828ee,#0a182800);
  }
  .stat{display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.15em;color:#bcd5e0}
  .stat .ic{font-size:1.05rem;line-height:1}
  .stat .lab{min-width:74px;color:#bcd5e0aa}
  .stat .bar{
    flex:1;height:10px;background:#0a182888;border:1px solid #44ccff33;border-radius:6px;overflow:hidden;
  }
  .stat .fill{height:100%;background:linear-gradient(90deg,#44ccff,#88f0ff);transition:width .35s, background .35s}
  .stat .num{min-width:34px;text-align:right;font-weight:700;color:#fff}
  .stat.hunger .fill{background:linear-gradient(90deg,#ffcc44,#ffdd66)}
  .stat.happy .fill{background:linear-gradient(90deg,#ff66cc,#ff99dd)}
  .stat.clean .fill{background:linear-gradient(90deg,#88ddff,#bbeeff)}
  .stat.energy .fill{background:linear-gradient(90deg,#44ffaa,#88ffcc)}
  .stat.danger .fill{background:linear-gradient(90deg,#ff4444,#ff8866)!important}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1828cc;border:1px solid #44ccffaa;color:#44ccff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:60;display:flex;align-items:center;justify-content:center;
  }

  /* Bottom action bar */
  #actions{
    position:fixed;left:0;right:0;bottom:0;padding:10px 12px 16px;z-index:6;
    background:linear-gradient(to top,#0a1828ee,#0a182800);
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  }
  .act{
    background:linear-gradient(160deg,#152840,#0a1828);
    border:2px solid #44ccff66;border-radius:14px;padding:10px 12px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    min-width:78px;transition:transform .12s,border-color .12s,box-shadow .12s;
  }
  .act:hover{transform:translateY(-3px);border-color:#44ccff;box-shadow:0 0 22px #44ccff55}
  .act.disabled{opacity:.4;pointer-events:none}
  .act .ic{font-size:1.6rem;line-height:1}
  .act .nm{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;color:#44ccff;letter-spacing:.12em;margin-top:3px}
  .act .pr{font-size:.62rem;color:#ffcc44;margin-top:2px;letter-spacing:.05em}

  /* Pet area: HP, stage, name */
  #petinfo{
    position:fixed;top:96px;left:0;right:0;text-align:center;z-index:6;pointer-events:none;
  }
  #petinfo .name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.4rem;color:#44ccff;letter-spacing:.16em;text-shadow:0 0 16px #44ccff}
  #petinfo .stage{font-size:.78rem;color:#bcd5e0;letter-spacing:.18em;margin-top:2px}

  /* Overlays */
  .panel{
    position:fixed;inset:0;z-index:30;
    background:#0a1828dd;backdrop-filter:blur(6px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px;text-align:center;overflow-y:auto;
  }
  .panel.show{display:flex}
  .panel h1{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.2rem;
    color:#44ccff;letter-spacing:.18em;text-shadow:0 0 26px #44ccff;margin:6px 0;
  }
  .panel h3{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1rem;color:#ffcc44;letter-spacing:.14em;margin:8px 0 4px}
  .panel p{color:#bcd5e0;font-size:.95rem;max-width:480px}
  .btn{
    margin-top:14px;padding:12px 26px;background:transparent;border:2px solid #44ccff;
    color:#44ccff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;
    letter-spacing:.22em;cursor:pointer;text-transform:uppercase;border-radius:6px;
    box-shadow:0 0 18px #44ccff55;
  }
  .btn.alt{border-color:#ffcc44;color:#ffcc44;box-shadow:0 0 18px #ffcc4455}
  .picks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px;max-width:560px}
  .pick{
    background:linear-gradient(160deg,#152840,#0a1828);
    border:2px solid #44ccff44;border-radius:14px;padding:14px;cursor:pointer;width:130px;
  }
  .pick:hover{border-color:#44ccff;box-shadow:0 0 22px #44ccff55}
  .pick img{width:84px;height:84px;display:block;margin:0 auto 6px}
  .pick .lab{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;color:#44ccff;letter-spacing:.12em}

  #notify{
    position:fixed;top:160px;left:50%;transform:translateX(-50%) scale(0);
    background:#0a1828ee;border:2px solid #ffcc4488;border-radius:12px;
    padding:10px 18px;font-family:'Orbitron',sans-serif;font-weight:700;
    color:#ffcc44;letter-spacing:.18em;font-size:.9rem;
    pointer-events:none;z-index:7;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  #notify.show{transform:translateX(-50%) scale(1)}

  /* Bath suds overlay */
  .bath{position:fixed;inset:0;background:#88ddff44;z-index:8;pointer-events:none;animation:fadeOut 1.5s forwards}
  @keyframes fadeOut { 0% { opacity: 1 } 100% { opacity: 0 } }

  .coin-flash{
    position:fixed;top:60px;right:14px;
    background:#1a1a08cc;border:1px solid #ffcc44;border-radius:8px;
    padding:4px 10px;color:#ffcc44;font-family:'Orbitron',sans-serif;letter-spacing:.1em;font-weight:700;
    z-index:8;pointer-events:none;font-size:.8rem;
    transform:translateX(100px);transition:transform .35s;
  }
  .coin-flash.show{transform:translateX(0)}
</style>
</head>
<body>

<div id="scene"><canvas id="game"></canvas></div>

<button id="back-btn" onclick="window.location.href='../'">✖</button>

<div id="stats">
  <div class="stat hunger"><span class="ic">🍖</span><span class="lab">Fame</span><div class="bar"><div class="fill" id="b-h"></div></div><span class="num" id="n-h">100</span></div>
  <div class="stat happy"><span class="ic">😊</span><span class="lab">Felicità</span><div class="bar"><div class="fill" id="b-y"></div></div><span class="num" id="n-y">100</span></div>
  <div class="stat clean"><span class="ic">✨</span><span class="lab">Pulizia</span><div class="bar"><div class="fill" id="b-c"></div></div><span class="num" id="n-c">100</span></div>
  <div class="stat energy"><span class="ic">⚡</span><span class="lab">Energia</span><div class="bar"><div class="fill" id="b-e"></div></div><span class="num" id="n-e">100</span></div>
</div>

<div id="petinfo">
  <div class="name" id="p-name">POKEMON</div>
  <div class="stage" id="p-stage">CUCCIOLO</div>
</div>

<div id="actions">
  <div class="act" id="a-feed" onclick="doAction('feed')"><div class="ic">🍎</div><div class="nm">SFAMA</div></div>
  <div class="act" id="a-play" onclick="doAction('play')"><div class="ic">🎾</div><div class="nm">GIOCA</div></div>
  <div class="act" id="a-bath" onclick="doAction('bath')"><div class="ic">🛁</div><div class="nm">LAVA</div></div>
  <div class="act" id="a-sleep" onclick="doAction('sleep')"><div class="ic">💤</div><div class="nm">DORMI</div></div>
  <div class="act" onclick="doAction('treat')"><div class="ic">🍰</div><div class="nm">DOLCETTO</div><div class="pr">5🪙</div></div>
  <div class="act" onclick="doAction('toy')"><div class="ic">🪀</div><div class="nm">GIOCO</div><div class="pr">10🪙</div></div>
</div>

<div id="notify"></div>

<div id="panel-pick" class="panel"></div>
<div id="panel-evolve" class="panel"></div>
<div id="panel-low" class="panel"></div>

<script src="../shared/coins.js"></script>
<script>
'use strict';

const POKE_POOL = ['swift','runner','mini','grunt','tank'];
const BASE = '../neon-defender/assets/skin-pokemon/';
const imgs = {};
for(const k of POKE_POOL){ const im = new Image(); im.src = BASE + k + '.png'; imgs[k] = im; }
function ready(im){ return im && im.complete && im.naturalWidth > 0; }

// ─── Audio ───────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let ac = null, master = null;
  function ensure(){ if(ac) return ac; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); return ac; }
  function tone({freq=440, dur=0.08, type='sine', vol=0.18, sweep=0}){
    if(!ensure()) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.04);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.06);
  }
  function silence(){ if(master) master.gain.value = 0; }
  function unmute(){ if(master) master.gain.value = 0.5; }
  function feed(){  tone({freq:660, dur:0.10, type:'square', vol:0.18}); setTimeout(() => tone({freq:880, dur:0.10, type:'square', vol:0.18}), 90); }
  function play(){  tone({freq:880, dur:0.06, type:'square', vol:0.16}); setTimeout(() => tone({freq:1320, dur:0.08, type:'square', vol:0.18}), 60); setTimeout(() => tone({freq:1100, dur:0.10, type:'square', vol:0.18}), 130); }
  function bath(){  tone({freq:400, dur:0.30, type:'sine', vol:0.18, sweep:200}); }
  function sleep(){ tone({freq:300, dur:0.30, type:'sine', vol:0.14, sweep:-100}); }
  function coin(){  tone({freq:880, dur:0.06, type:'square', vol:0.18}); setTimeout(() => tone({freq:1320, dur:0.10, type:'square', vol:0.20}), 70); }
  function evolve(){ [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.20, type:'square', vol:0.20}), i * 130)); }
  function nope(){  tone({freq:200, dur:0.20, type:'sawtooth', vol:0.22, sweep:-80}); }
  return { feed, play, bath, sleep, coin, evolve, nope, silence, unmute };
})();
window.addEventListener('pagehide', () => Sfx.silence());
document.addEventListener('visibilitychange', () => { if(document.hidden) Sfx.silence(); else Sfx.unmute(); });

// ─── State ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'pkcare-v1';
const STAGES = ['CUCCIOLO', 'GIOVANE', 'ADULTO', 'ANZIANO'];
const STAGE_THRESH = [0, 3, 8, 20];   // care-hours of "all stats >= 60" to advance

function defaultState(){
  return {
    name: '',
    sprite: '',
    hunger: 100, happy: 100, clean: 100, energy: 100,
    stage: 0,
    careHours: 0,
    lastTickMs: Date.now(),
    lastCoinMs: Date.now(),
    sleeping: false,
    born: Date.now(),
  };
}
let state = defaultState();

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s.sprite) return null;
    return s;
  } catch(e){ return null; }
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

// Time-based decay (offline catch-up: if you re-open after hours, stats decay)
const DECAY_PER_HOUR = { hunger: 25, happy: 18, clean: 14, energy: 22 };
function applyTimePass(){
  const now = Date.now();
  let elapsedMs = now - state.lastTickMs;
  if(elapsedMs < 0) elapsedMs = 0;
  // Cap offline time to 24h so the pet doesn't fully die from a week-long pause
  elapsedMs = Math.min(elapsedMs, 24 * 3600 * 1000);
  const h = elapsedMs / (3600 * 1000);
  // During sleep, hunger/happy decay less but energy regenerates instead of decaying
  if(state.sleeping){
    state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * 0.4 * h);
    state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * 0.6 * h);
    state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h);
    state.energy = Math.min(100, state.energy + 50 * h);
    if(state.energy >= 100) state.sleeping = false;
  } else {
    state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * h);
    state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * h);
    state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h);
    state.energy = Math.max(0, state.energy - DECAY_PER_HOUR.energy * h);
  }
  // Care-time accumulator: only counts when ALL stats >= 60
  if(state.hunger >= 60 && state.happy >= 60 && state.clean >= 60 && state.energy >= 60){
    state.careHours = (state.careHours || 0) + h;
  }
  // Coin generation: 1 coin every 8 minutes if happy AND fed; we batch in offline catch-up
  if(state.happy >= 50 && state.hunger >= 50){
    const COIN_INTERVAL_MS = 8 * 60 * 1000;
    let gained = 0;
    let cursor = state.lastCoinMs;
    while(now - cursor >= COIN_INTERVAL_MS){
      cursor += COIN_INTERVAL_MS;
      gained++;
      if(gained > 30) break; // cap offline coin gain
    }
    if(gained > 0 && window.Coins){
      Coins.add(gained, 'pkcare-passive');
      flashCoin(gained);
    }
    state.lastCoinMs = cursor;
  } else {
    state.lastCoinMs = now;
  }
  state.lastTickMs = now;
  checkEvolve();
}
function checkEvolve(){
  for(let i = STAGES.length - 1; i > state.stage; i--){
    if(state.careHours >= STAGE_THRESH[i]){
      const old = state.stage;
      state.stage = i;
      if(i > old) onEvolve(STAGES[old], STAGES[i]);
      break;
    }
  }
}

// ─── UI updates ──────────────────────────────────────────────────────────────
function setBar(id, v){
  const f = document.getElementById(id);
  f.style.width = v + '%';
  const n = document.getElementById(id.replace('b-', 'n-'));
  n.textContent = Math.round(v);
  const parent = f.parentElement.parentElement;
  if(v < 25) parent.classList.add('danger'); else parent.classList.remove('danger');
}
function updateHUD(){
  setBar('b-h', state.hunger);
  setBar('b-y', state.happy);
  setBar('b-c', state.clean);
  setBar('b-e', state.energy);
  document.getElementById('p-name').textContent  = state.name || state.sprite.toUpperCase();
  document.getElementById('p-stage').textContent = STAGES[state.stage] + (state.sleeping ? ' · ZZZ' : '');
  // Disable actions that don't apply right now
  document.getElementById('a-sleep').classList.toggle('disabled', state.sleeping || state.energy > 95);
}

function notify(msg, color){
  const n = document.getElementById('notify');
  n.textContent = msg;
  n.style.borderColor = (color || '#ffcc44') + 'aa';
  n.style.color = color || '#ffcc44';
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 1400);
}

function flashCoin(n){
  let el = document.querySelector('.coin-flash');
  if(!el){ el = document.createElement('div'); el.className = 'coin-flash'; document.body.appendChild(el); }
  el.textContent = `+${n}🪙`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1400);
}

// ─── Actions ─────────────────────────────────────────────────────────────────
function doAction(kind){
  applyTimePass();
  if(state.sleeping && kind !== 'sleep'){
    notify('STA DORMENDO!', '#888');
    Sfx.nope();
    state.sleeping = false; // wake on poke
    save(); updateHUD(); return;
  }
  switch(kind){
    case 'feed':
      if(state.hunger >= 95){ notify('NON HA FAME', '#ff8866'); Sfx.nope(); return; }
      state.hunger = Math.min(100, state.hunger + 35);
      state.happy  = Math.min(100, state.happy + 4);
      state.clean  = Math.max(0, state.clean - 5);
      Sfx.feed();
      notify('+ FAME', '#ffcc44'); animMood('happy'); break;
    case 'play':
      if(state.energy < 12){ notify('TROPPO STANCO!', '#ff8866'); Sfx.nope(); return; }
      state.happy  = Math.min(100, state.happy + 30);
      state.energy = Math.max(0, state.energy - 15);
      state.hunger = Math.max(0, state.hunger - 6);
      Sfx.play();
      notify('+ FELICITÀ', '#ff66cc'); animMood('play'); break;
    case 'bath':
      if(state.clean >= 95){ notify('GIÀ PULITO', '#888'); Sfx.nope(); return; }
      state.clean = 100; state.happy = Math.max(0, state.happy - 6);
      Sfx.bath();
      const fx = document.createElement('div'); fx.className = 'bath';
      document.body.appendChild(fx); setTimeout(() => fx.remove(), 1600);
      notify('+ PULIZIA', '#88ddff'); animMood('bath'); break;
    case 'sleep':
      if(state.energy >= 95){ notify('NON È STANCO', '#888'); Sfx.nope(); return; }
      state.sleeping = !state.sleeping;
      Sfx.sleep();
      notify(state.sleeping ? 'DORME ZZZ' : 'SVEGLIO', '#88ccff'); break;
    case 'treat':
      if(!window.Coins || !Coins.spend(5)){ notify('NON BASTANO 🪙', '#ff8866'); Sfx.nope(); return; }
      state.happy  = Math.min(100, state.happy + 18);
      state.hunger = Math.min(100, state.hunger + 8);
      Sfx.feed(); animMood('happy'); notify('DOLCETTO!', '#ffcc44'); break;
    case 'toy':
      if(!window.Coins || !Coins.spend(10)){ notify('NON BASTANO 🪙', '#ff8866'); Sfx.nope(); return; }
      state.happy  = Math.min(100, state.happy + 35);
      Sfx.play(); animMood('play'); notify('NUOVO GIOCO!', '#ff66cc'); break;
  }
  state.lastTickMs = Date.now();
  save(); updateHUD();
}

// ─── Pet rendering (canvas) ──────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = window.innerWidth; H = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

let mood = 'idle';
let moodUntil = 0;
let bubbles = [];
function animMood(m){ mood = m; moodUntil = performance.now() + 900; }

function avgMood(){
  return (state.hunger + state.happy + state.clean + state.energy) / 4;
}

function drawScene(ts){
  // Background gradient depending on cleanliness + happiness
  const cleanRatio = state.clean / 100;
  const happyRatio = state.happy / 100;
  ctx.save();
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  const top = `rgba(${Math.floor(20 + 80 * cleanRatio)},${Math.floor(40 + 120 * happyRatio)},${Math.floor(80 + 100 * cleanRatio)},1)`;
  const bot = `rgba(${Math.floor(8 + 30 * cleanRatio)},${Math.floor(20 + 30 * happyRatio)},${Math.floor(40 + 60 * cleanRatio)},1)`;
  grd.addColorStop(0, top); grd.addColorStop(1, bot);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  // Stars in the background (parallax)
  for(let i = 0; i < 40; i++){
    const x = ((i * 137 + ts * 0.04) % W);
    const y = ((i * 211 + ts * 0.02) % (H - 200)) + 60;
    const sz = (i % 3) + 1;
    ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 4) * 0.1})`;
    ctx.fillRect(x, y, sz, sz);
  }

  // Floor
  ctx.fillStyle = '#0a1828';
  ctx.fillRect(0, H - 140, W, 140);
  ctx.fillStyle = '#44ccff22';
  ctx.fillRect(0, H - 142, W, 2);

  // Dirt overlay when cleanliness is low
  if(state.clean < 50){
    const dirty = 1 - state.clean / 50;
    for(let i = 0; i < 24; i++){
      const x = ((i * 197) % W);
      const y = ((i * 113) % (H - 160)) + 80;
      ctx.fillStyle = `rgba(120,80,40,${0.25 * dirty})`;
      ctx.beginPath(); ctx.arc(x, y, 4 + (i % 4), 0, Math.PI*2); ctx.fill();
    }
  }

  // Pet
  const im = imgs[state.sprite];
  const t = ts * 0.001;
  const sleepingNow = state.sleeping;
  // breathing bounce
  const bob = sleepingNow ? Math.sin(t * 1.5) * 4 : Math.sin(t * 2) * 6;
  const stageScale = 0.6 + state.stage * 0.18;
  const sz = Math.min(W, H) * 0.36 * stageScale;
  const px = W / 2, py = H / 2 + 20 + bob;
  // shadow
  ctx.fillStyle = '#00000055';
  ctx.beginPath(); ctx.ellipse(px, py + sz * 0.45, sz * 0.4, sz * 0.10, 0, 0, Math.PI*2); ctx.fill();
  // pet image
  if(ready(im)){
    ctx.save();
    // Sleep tint
    if(sleepingNow){ ctx.globalAlpha = 0.8; }
    ctx.drawImage(im, px - sz/2, py - sz/2, sz, sz);
    ctx.restore();
  } else {
    ctx.fillStyle = '#44ccff';
    ctx.beginPath(); ctx.arc(px, py, sz * 0.4, 0, Math.PI*2); ctx.fill();
  }

  // Mood emoji bubble
  const now = performance.now();
  let moodEmoji = '';
  if(now < moodUntil){
    if(mood === 'happy') moodEmoji = '😋';
    else if(mood === 'play')  moodEmoji = '🥳';
    else if(mood === 'bath')  moodEmoji = '🛁';
  } else if(sleepingNow){
    moodEmoji = 'Z';
  } else {
    const a = avgMood();
    if(state.hunger < 25) moodEmoji = '😩';
    else if(state.happy < 25) moodEmoji = '😢';
    else if(state.clean < 25) moodEmoji = '🥴';
    else if(state.energy < 25) moodEmoji = '😴';
    else if(a > 80) moodEmoji = '😊';
  }
  if(moodEmoji){
    ctx.font = `${Math.floor(sz * 0.30)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.fillText(moodEmoji, px + sz * 0.4, py - sz * 0.45);
    ctx.shadowBlur = 0;
  }

  // Sleep Zs
  if(sleepingNow){
    ctx.fillStyle = '#bcd5e0';
    ctx.font = `bold ${Math.floor(sz * 0.20)}px Orbitron`;
    ctx.textAlign = 'center';
    const off = (ts * 0.001 * 2) % 1;
    for(let i = 0; i < 3; i++){
      const yOff = -sz * 0.7 - i * 18 - off * 18;
      ctx.globalAlpha = 1 - i * 0.3 - off * 0.3;
      ctx.fillText('Z', px + sz * 0.3, py + yOff);
    }
    ctx.globalAlpha = 1;
  }
}

// ─── Loop ────────────────────────────────────────────────────────────────────
let lastT = performance.now();
let lastSaveSec = -1;
function loop(ts){
  const prevT = lastT;
  const dt = (ts - lastT) / 1000; lastT = ts;
  // Apply tiny decay each frame for smooth bar movement
  if(state.sprite){
    const h = dt / 3600;
    if(state.sleeping){
      state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * 0.4 * h);
      state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * 0.6 * h);
      state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h);
      state.energy = Math.min(100, state.energy + 50 * h);
      if(state.energy >= 100) state.sleeping = false;
    } else {
      state.hunger = Math.max(0, state.hunger - DECAY_PER_HOUR.hunger * h);
      state.happy  = Math.max(0, state.happy  - DECAY_PER_HOUR.happy  * h);
      state.clean  = Math.max(0, state.clean  - DECAY_PER_HOUR.clean  * h);
      state.energy = Math.max(0, state.energy - DECAY_PER_HOUR.energy * h);
    }
    if(state.hunger >= 60 && state.happy >= 60 && state.clean >= 60 && state.energy >= 60){
      state.careHours = (state.careHours || 0) + h;
    }
    // Passive coin every 8 minutes when happy AND fed
    const now = Date.now();
    if(state.happy >= 50 && state.hunger >= 50){
      if(now - state.lastCoinMs >= 8 * 60 * 1000){
        state.lastCoinMs = now;
        if(window.Coins){ Coins.add(1, 'pkcare-passive'); flashCoin(1); Sfx.coin(); }
      }
    } else {
      state.lastCoinMs = now;
    }
    checkEvolve();
    updateHUD();
    const sec = Math.floor(ts / 1000);
    if(sec !== lastSaveSec){ lastSaveSec = sec; save(); } // save once per second
  }
  drawScene(ts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Save on hide
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if(document.hidden){ state.lastTickMs = Date.now(); save(); } else { applyTimePass(); updateHUD(); } });

// ─── Onboarding / Evolve panels ──────────────────────────────────────────────
function showPicker(){
  const ol = document.getElementById('panel-pick');
  ol.innerHTML = `
    <h1>POKEMON CARE</h1>
    <p>Adotta il tuo Pokemon e prenditene cura. Si evolve quando lo tratti bene per parecchio tempo.</p>
    <h3>SCEGLI IL TUO COMPAGNO</h3>
    <div class="picks">
      ${POKE_POOL.map(sp => `
        <div class="pick" data-sp="${sp}">
          <img src="${BASE}${sp}.png" />
          <div class="lab">${sp.toUpperCase()}</div>
        </div>
      `).join('')}
    </div>
    <p style="margin-top:18px;font-size:.8rem">Sfama, gioca, lava, fallo dormire. Mantieni le statistiche sopra il 60% per evolverlo.</p>
  `;
  ol.classList.add('show');
  ol.querySelectorAll('.pick').forEach(el => {
    el.addEventListener('click', () => {
      const sp = el.dataset.sp;
      state = defaultState();
      state.sprite = sp;
      state.name = sp.toUpperCase();
      save();
      ol.classList.remove('show');
      updateHUD();
    });
  });
}

function onEvolve(fromStage, toStage){
  const ol = document.getElementById('panel-evolve');
  Sfx.evolve();
  if(window.Coins) Coins.add(25, 'pkcare-evolve');
  ol.innerHTML = `
    <h1>EVOLUZIONE!</h1>
    <p>${state.name} cresce da <b style="color:#44ccff">${fromStage}</b> a <b style="color:#44ffcc">${toStage}</b>.</p>
    <img src="${BASE}${state.sprite}.png" style="width:140px;height:140px;margin:18px 0;filter:drop-shadow(0 0 20px #44ffcc)"/>
    <p>+25🪙 bonus!</p>
    <button class="btn alt" onclick="document.getElementById('panel-evolve').classList.remove('show')">CONTINUA</button>
  `;
  ol.classList.add('show');
  save();
}

// ─── Boot ────────────────────────────────────────────────────────────────────
const loaded = load();
if(loaded){
  state = loaded;
  applyTimePass();
  updateHUD();
} else {
  showPicker();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
