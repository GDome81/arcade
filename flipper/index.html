<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>NEON PINBALL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Pinball">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050810;color:#e0e8ff;
    font-family:'Share Tech Mono',monospace;overflow:hidden;
    min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;
    touch-action:none;
  }
  #game-wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;background:#050810;touch-action:none}

  #hud{
    /* Right padding 100px clears the audio toggle (right:8) AND the shared fullscreen
       button (also at right:8 from fullscreen.js — they end up stacked). Left padding
       60px clears the back ✖ button. */
    position:fixed;top:0;left:0;right:0;padding:6px 100px 6px 60px;z-index:5;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:linear-gradient(to bottom, #050810dd, transparent);
    pointer-events:none;
  }
  .hud-block{display:flex;flex-direction:column;align-items:center;min-width:54px}
  .hud-label{font-size:.6rem;letter-spacing:.18em;color:#7a9ad8;text-transform:uppercase}
  .hud-value{font-family:Orbitron,sans-serif;font-weight:700;font-size:1.02rem;color:#00f5ff;text-shadow:0 0 8px #00f5ff88}
  .hud-value.score{color:#ffcc44;text-shadow:0 0 10px #ffcc44aa;font-size:1.15rem}
  .hud-value.coins{color:#ffcc00;text-shadow:0 0 8px #ffcc0088}
  .hud-value.balls{color:#ff5566;text-shadow:0 0 8px #ff5566aa}
  .hud-value.mult{color:#44ff88;text-shadow:0 0 8px #44ff88aa}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#0a1428cc;border:1px solid #00f5ff88;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;
  }

  /* Mission ticker — small banner under HUD */
  #mission-banner{
    position:fixed;top:52px;left:50%;transform:translateX(-50%);
    padding:6px 14px;border-radius:6px;
    background:#0a1428cc;border:1px solid #44ff8866;
    color:#44ff88;font-family:Orbitron,sans-serif;font-size:.78rem;
    letter-spacing:.14em;z-index:5;display:none;pointer-events:none;
    box-shadow:0 0 14px #44ff8855;
  }
  #mission-banner.active{display:block}

  /* Big multiball banner */
  #multiball-banner{
    position:fixed;top:50%;left:50%;transform:translate(-50%, -50%);
    font-family:Orbitron,sans-serif;font-weight:900;font-size:3rem;
    color:#ff66cc;letter-spacing:.3em;text-shadow:0 0 30px #ff66cc;
    z-index:6;pointer-events:none;display:none;
    animation:mbpulse .6s ease-in-out infinite alternate;
  }
  @keyframes mbpulse {
    from { transform: translate(-50%, -50%) scale(1); opacity: .85; }
    to   { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
  }
  #multiball-banner.active{display:block}

  /* Touch hint zones (mobile only) — visualise where the flipper zones are. */
  .touch-hint{
    position:fixed;bottom:0;width:50%;height:55%;
    pointer-events:none;z-index:3;display:none;
    background:linear-gradient(to top, #00f5ff10, transparent);
    border-top:1px solid #00f5ff22;
  }
  .touch-hint.left { left:0;  border-right:1px dashed #00f5ff22; }
  .touch-hint.right{ right:0; border-left:1px dashed #00f5ff22;  }
  @media (pointer: coarse){ .touch-hint{display:block} }

  /* Plunger LAUNCH button — small chip in the bottom-right corner. The rest
     of the right half of the screen is reserved for the right flipper. */
  #launch-btn{
    position:fixed;right:8px;bottom:8px;
    width:90px;height:50px;border-radius:8px;
    background:#0a1428dd;border:2px solid #ffcc44cc;color:#ffcc44;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.16em;
    box-shadow:0 0 18px #ffcc4466;display:none;z-index:6;
    user-select:none;touch-action:manipulation;cursor:pointer;
    align-items:center;justify-content:center;
  }
  #launch-btn.charging{background:#ffcc4488;color:#fff;box-shadow:0 0 28px #ffcc44cc}
  @media (pointer: coarse){ #launch-btn{display:flex} }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#050810ee;backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;
  }
  #overlay.hide{display:none}
  #overlay h2{
    font-family:Orbitron,sans-serif;font-weight:900;font-size:2.2rem;
    color:#00f5ff;letter-spacing:.25em;text-shadow:0 0 30px #00f5ff;margin-bottom:6px;
  }
  #overlay p{color:#a0b8e0;font-size:.86rem;letter-spacing:.08em;max-width:480px;line-height:1.5}
  #overlay .row{display:flex;gap:24px;justify-content:center;margin:6px 0}
  #overlay .stat{display:flex;flex-direction:column;align-items:center}
  #overlay .stat-label{font-size:.7rem;color:#7a9ad8;letter-spacing:.16em;text-transform:uppercase}
  #overlay .stat-val{font-family:Orbitron,sans-serif;font-weight:700;font-size:1.3rem;color:#fff;text-shadow:0 0 10px #00f5ff88}
  #overlay .stat-val.gold{color:#ffcc44;text-shadow:0 0 10px #ffcc44aa}
  .btn{
    margin-top:4px;padding:10px 22px;background:transparent;border:2px solid #00f5ff;
    color:#00f5ff;font-family:Orbitron,sans-serif;font-weight:700;font-size:.82rem;
    letter-spacing:.22em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #00f5ff44;transition:all .15s;
  }
  .btn:hover{background:#00f5ff22;box-shadow:0 0 28px #00f5ff88}
  .btn.gold{border-color:#ffcc44;color:#ffcc44;box-shadow:0 0 18px #ffcc4444}
  .btn.gold:hover{background:#ffcc4422;box-shadow:0 0 28px #ffcc4488}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

  #audio-toggle{
    /* Sit to the left of the shared fullscreen button (which is at right:8) */
    position:fixed;top:8px;right:54px;width:42px;height:36px;border-radius:6px;
    background:#0a1428cc;border:1px solid #00f5ff66;color:#00f5ff;
    font-family:Orbitron,sans-serif;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body>

<div id="game-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div style="width:42px"></div>
  <div class="hud-block"><span class="hud-label">Score</span><span class="hud-value score" id="h-score">0</span></div>
  <div class="hud-block"><span class="hud-label">Balls</span><span class="hud-value balls" id="h-balls">3</span></div>
  <div class="hud-block"><span class="hud-label">Mult</span><span class="hud-value mult" id="h-mult">×1</span></div>
  <div class="hud-block"><span class="hud-label">Best</span><span class="hud-value" id="h-best">0</span></div>
  <div class="hud-block"><span class="hud-label">Coins</span><span class="hud-value coins" id="h-coins">0</span></div>
</div>

<button id="back-btn" title="Torna al launcher" onclick="goBack()">✖</button>
<button id="audio-toggle" onclick="Sfx.toggle()">♫</button>

<div id="mission-banner"></div>
<div id="multiball-banner">MULTIBALL!</div>

<div class="touch-hint left"></div>
<div class="touch-hint right"></div>
<button id="launch-btn">LAUNCH</button>

<div id="overlay"></div>

<script src="../shared/profile.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/coins.js"></script>
<script src="../shared/cloud-sync.js"></script>
<script src="../shared/leaderboard.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// NEON PINBALL — single procedural table, neon-cyber aesthetic.
// Controls: Z = left flipper, M = right flipper, SPACE = plunger (hold/release).
// Mobile:  tap left half = left flipper, right half = right flipper,
//          tap-and-hold the bottom-right corner = plunger charge.
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
fitCanvas();

// ── TABLE COORDINATES ────────────────────────────────────────────────────────
// World is 600 × 1000 (portrait). View is letterboxed/scaled to fit viewport.
const T = { W: 600, H: 1000 };
const BALL_R = 11;
let scale = 1, offX = 0, offY = 0;
function recomputeView(){
  scale = Math.min(W / T.W, H / T.H);
  offX  = (W - T.W * scale) / 2;
  offY  = (H - T.H * scale) / 2;
}
recomputeView();
window.addEventListener('resize', recomputeView);

function w2s(x, y){ return { x: offX + x * scale, y: offY + y * scale }; }
function s2w(sx, sy){ return { x: (sx - offX) / scale, y: (sy - offY) / scale }; }

// ── BRUTIMON SKIN ──────────────────────────────────────────────────────────────
// When the launcher's global skin is set to "pokemon" we paint the targets,
// bumpers, balls and bonus mover with Brutimon sprites. Default = on (the
// arcade defaults to the Brutimon skin everywhere). Sprites are loaded once
// and resolved by species key; missing/failed images degrade silently to the
// original neon-style rendering.
const POKE_SKIN = (localStorage.getItem('skin') || 'pokemon') === 'pokemon';
const PkAssets = { imgs: {} };
(function loadPokeAssets(){
  if(!POKE_SKIN) return;
  const base = '../neon-defender/assets/skin-pokemon/';
  for(const k of ['grunt','runner','mini','swift','tank','shielded','splitter','boss']){
    const im = new Image();
    im.src = base + k + '.png';
    PkAssets.imgs[k] = im;
  }
})();
function pkImg(key){
  const im = PkAssets.imgs[key];
  return (im && im.complete && im.naturalWidth > 0) ? im : null;
}

// ── AUDIO (Web Audio synth — no sample files) ────────────────────────────────
const Sfx = {
  ctx: null, master: null, enabled: localStorage.getItem('pinAudioOff') !== '1',
  init(){
    if(this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.28 : 0;
      this.master.connect(this.ctx.destination);
    } catch(e){}
  },
  toggle(){
    this.init();
    this.enabled = !this.enabled;
    localStorage.setItem('pinAudioOff', this.enabled ? '0' : '1');
    if(this.master) this.master.gain.value = this.enabled ? 0.28 : 0;
    const b = document.getElementById('audio-toggle');
    if(b) b.textContent = this.enabled ? '♫' : '✕';
  },
  // Generic envelope tone — used by most events.
  blip(freq, dur = 0.08, type = 'sine', gain = 0.5){
    if(!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  // Frequency sweep — used for bumper pops.
  sweep(f0, f1, dur = 0.12, type = 'square', gain = 0.45){
    if(!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  // Filtered noise burst — slingshots / explosions.
  noise(dur = 0.12, cutoff = 800, gain = 0.35){
    if(!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, Math.ceil(dur * this.ctx.sampleRate), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },
  // Multi-note arpeggio — mission complete / multiball / extra ball.
  arp(notes, dur = 0.08, type = 'square', gain = 0.4){
    if(!this.ctx || !this.enabled) return;
    notes.forEach((freq, i) => setTimeout(() => this.blip(freq, dur, type, gain), i * 80));
  },
  bumper(){ this.sweep(420, 80, 0.10, 'square', 0.5); },
  slingshot(){ this.noise(0.10, 1200, 0.3); },
  dropTarget(){ this.blip(880, 0.06, 'square', 0.45); },
  flipper(){ this.blip(110, 0.04, 'sine', 0.3); },
  plungerLaunch(){ this.sweep(60, 220, 0.20, 'sawtooth', 0.4); },
  drain(){ this.sweep(280, 50, 0.40, 'triangle', 0.5); },
  rampLoop(){ this.arp([660, 880, 1100], 0.06, 'sine', 0.35); },
  missionComplete(){ this.arp([523, 659, 784, 1047], 0.10, 'square', 0.45); },
  multiballStart(){ this.arp([392, 494, 587, 740, 880, 1047], 0.12, 'square', 0.5); },
  extraBall(){ this.arp([523, 659, 784], 0.10, 'sine', 0.4); }
};
// Reflect saved pref on the audio button
setTimeout(() => { const b = document.getElementById('audio-toggle'); if(b) b.textContent = Sfx.enabled ? '♫' : '✕'; }, 0);

// ── TABLE LAYOUT ─────────────────────────────────────────────────────────────
// Static colliders. Each segment is { x1, y1, x2, y2, restitution? }.
// Each bumper is  { cx, cy, r, score, color }.
// Each slingshot is { ax, ay, bx, by, cx, cy, color, score }  — A→B is the
// kick face (long diagonal facing the inlane); B→C and C→A bounce normally.
// Drop targets are { cx, cy, w, h, hit, color, score }.

const _segs = [];
function seg(x1, y1, x2, y2, e){ _segs.push({ x1, y1, x2, y2, restitution: e !== undefined ? e : 0.78 }); }
// Arc helper — n short segments approximating an arc.
// `oneWayInside` flag: when set, the arc only collides with balls that are
// INSIDE the circle (distance to center < radius). Kept for optional one-way
// curved walls.
function arcSegs(cx, cy, r, a0, a1, n, e, oneWayInside){
  const step = (a1 - a0) / n;
  let px = cx + Math.cos(a0) * r, py = cy + Math.sin(a0) * r;
  for(let i = 1; i <= n; i++){
    const a = a0 + i * step;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    const segObj = { x1: px, y1: py, x2: x, y2: y,
                     restitution: e !== undefined ? e : 0.78 };
    if(oneWayInside){
      segObj.inwardOnly = true;
      segObj.arcCx = cx; segObj.arcCy = cy; segObj.arcR = r;
      // Hidden one-way arc segment.
      segObj.hidden = true;
    }
    _segs.push(segObj);
    px = x; py = y;
  }
}

// The table now uses the visible flat ceiling below. The old hidden top dome
// collider created a small invisible pocket near the launch-lane exit.

// Outer walls of the main play area — extended UP to the visible ceiling at
// y = 10 so the playfield has a proper lid.
seg(15, 10, 15, 800);            // left outer
// Inner divider — ONLY the lower segment exists. The upper portion (between
// the ceiling and y=230) is left open and covered exclusively by the gate
// below. This is the "buco" the launched ball needs to enter the playfield.
seg(505, 230, 505, 970);
// Invisible one-way gate spanning the WHOLE opening. While the ball has
// `inLane=true` (still climbing/bouncing in the plunger lane) the gate is
// transparent so it can cross into the playfield via the smooth arc; once
// the ball is clearly in the playfield the gate only blocks movement back
// into the plunger lane.
(function(){
  const gate = { x1: 505, y1: 10, x2: 505, y2: 230, restitution: 0.5, gateBlocksFromLeft: true, hidden: true };
  _segs.push(gate);
})();

// ── PLAYFIELD CEILING ── stops at x=505 where the smooth arc takes over.
seg(15, 10, 505, 10);

// Lower funnel — angled walls that lead the ball toward the flippers without
// pinching the play area too much. End exactly at the flipper pivots.
// Symmetric: play area centre is x=260 (= (15+505)/2). Flipper pivots are
// pulled OUT a bit (140 / 380) so the gap between tips at rest is generous.
seg(15, 800, 140, 920);         // lower-left slope → left flipper pivot
seg(505, 800, 380, 920);        // lower-right slope → right flipper pivot

// Tight side walls below the flipper pivots (they cap the outside, but the
// flippers themselves close off the drain when raised). The drain gap is
// between the two flipper-tip rest positions in the centre.
seg(140, 920, 170, 990);
seg(380, 920, 350, 990);
// Drain mouth: open between x≈170..350 at y=990..1000 (ball falls through).

// ── Plunger lane (right side) ──
// Outer wall: vertical from y=80 down to y=970.
seg(575, 80, 575, 970);
// ── SMOOTH ARC AT THE TOP OF THE LAUNCH RAMP ──
// A quarter-circle that gently rolls the ball from the lane (vertical at
// x=575) into the playfield (horizontal at y=10). Center at (505, 80)
// radius 70 → tangentially meets the outer wall at (575, 80) and the
// playfield ceiling at (505, 10). Replaces the sharp diagonal cap which
// kept punting balls back into the lane.
arcSegs(505, 80, 70, 0, -Math.PI / 2, 8, 0.7);
// Bottom of the lane (plunger sits here)
seg(505, 970, 575, 970);

// ── BUMPERS ── classic triangle layout, centred on the play area (x=260).
const BUMPERS = [
  { cx: 170, cy: 290, r: 28, color: '#ff5566', score: 200, poke: 'grunt' },
  { cx: 260, cy: 220, r: 32, color: '#44ff88', score: 250, poke: 'tank'  },
  { cx: 350, cy: 290, r: 28, color: '#ffcc44', score: 200, poke: 'swift' },
];

// ── SLINGSHOTS ──
// Right-angled triangle. The HYPOTENUSE (A → B) is the kick face and faces
// the outer inlane: a ball falling between the side wall and the slingshot
// hits this face, gets a strong outward-up impulse, and is launched back
// into the bumper area. The other two sides (B → C and C → A) bounce
// normally.
//
//        ┌── B (inner, near flipper inlane)
//        │\
//        │ \   ← B→C: inner vertical wall
//        │  \
//   C ───┘   \
//   ↑         A   ← C→A: bottom edge
//   bottom-outer corner
//   kick face = A→B (long diagonal, facing UP-and-OUT)
const SLINGSHOTS = [
  { // Left slingshot — sits just above the left flipper, against the inlane.
    // Sits ABOVE the lower-left wall (which now runs (15,800)→(140,920)).
    ax: 80,  ay: 845,      // bottom-outer (just above the outer wall slope)
    bx: 160, by: 745,      // top-inner (above the flipper inlane)
    cx: 160, cy: 875,      // bottom-inner (right under B, near flipper pivot)
    color: '#ff66cc', score: 75
  },
  { // Right slingshot — mirror about the centreline (x=260).
    ax: 440, ay: 845,
    bx: 360, by: 745,
    cx: 360, cy: 875,
    color: '#ff66cc', score: 75
  }
];
// Slingshot impulse strength (px/s applied along the kick face normal).
const SLING_KICK = 560;

// ── DROP TARGETS — row of 5 across the upper-middle ──
// Each drop is tagged with a pokemon species so the Brutimon-skin renderer
// can swap the magenta rectangle for a sprite-on-pedestal.
const DROP_POKE = ['mini','runner','splitter','shielded','boss'];
const DROP_TARGETS = [];
function rebuildDropTargets(){
  DROP_TARGETS.length = 0;
  const baseY = 440;
  // Centred row: 5 targets * 40 spacing, total span 160, centred on x=260.
  for(let i = 0; i < 5; i++){
    DROP_TARGETS.push({
      cx: 180 + i * 40, cy: baseY,
      w: 32, h: 16,
      hit: false, hitAt: 0,
      score: 500,
      poke: DROP_POKE[i]
    });
  }
}
rebuildDropTargets();

// ── RAMP LOOPS — sensor regions ──
// Touching these awards bonus + triggers a mission step. They're not solid;
// just trigger zones. Drawn as glowing arrows on the table.
const RAMPS = [
  { x: 28,  y: 360, w: 50, h: 26, score: 1000, key: 'left-loop',  color: '#88ccff', cooldown: 0 },
  { x: 442, y: 360, w: 50, h: 26, score: 1000, key: 'right-loop', color: '#88ccff', cooldown: 0 },
];

// ── FLIPPERS ──
// Screen Y goes DOWN, so a POSITIVE angle is "below horizontal" (down-right
// for the left flipper, down-left for the right). The flipper sweeps about
// 50° from rest to active.
const FLIPPER_LEN   = 105;
const UPPER_LEN     = 70;       // shorter pair, mid-table
const FLIPPER_REST  = 0.48;     // rest angle below horizontal (rad)
const FLIPPER_ACT   = 0.32;     // active angle ABOVE horizontal (rad)
const FLIPPER_OMEGA = 26;       // angular speed (rad/sec) while sweeping
function makeFlipperState(side, pivotX, pivotY, len){
  const restAngle = side === 'left' ? FLIPPER_REST : Math.PI - FLIPPER_REST;
  return { side, pivotX, pivotY, len,
           angle: restAngle, target: restAngle, prevAngle: restAngle, up: false };
}
const flippers = {
  // Lower pair — main defence. Pivots at x=140 / x=380 so the tip-to-tip gap
  // at rest is ~44 units (~2 ball diameters).
  left:       makeFlipperState('left',  140, 920, FLIPPER_LEN),
  right:      makeFlipperState('right', 380, 920, FLIPPER_LEN),
  // Upper pair — mid-table, just above the slingshots. Shorter (70px) so they
  // don't reach the centre line. Controlled by the SAME Z / M keys as the
  // lower pair, giving "double flippers" feel (classic table moves: cradle
  // pass, upper-flipper feed into ramps, etc).
  leftUpper:  makeFlipperState('left',   95, 620, UPPER_LEN),
  rightUpper: makeFlipperState('right', 425, 620, UPPER_LEN)
};
const ALL_FLIPPERS = [flippers.left, flippers.right, flippers.leftUpper, flippers.rightUpper];
const LEFT_FLIPPERS  = [flippers.left,  flippers.leftUpper];
const RIGHT_FLIPPERS = [flippers.right, flippers.rightUpper];
function flipperTip(f){
  const L = f.len || FLIPPER_LEN;
  return { x: f.pivotX + Math.cos(f.angle) * L,
           y: f.pivotY + Math.sin(f.angle) * L };
}
function setFlipperUp(f, up){
  f.up = up;
  if(f.side === 'left'){
    // Sweep from +REST (down-right) to -ACT (up-right)
    f.target = up ? -FLIPPER_ACT : FLIPPER_REST;
  } else {
    // Sweep from π-REST (down-left) to π+ACT (up-left)
    f.target = up ? Math.PI + FLIPPER_ACT : Math.PI - FLIPPER_REST;
  }
}
function setSideUp(side, up){
  // Sound once per side, not per flipper.
  Sfx.flipper();
  const list = side === 'left' ? LEFT_FLIPPERS : RIGHT_FLIPPERS;
  for(const f of list) setFlipperUp(f, up);
}

// ── STATE ────────────────────────────────────────────────────────────────────

// ── BONUS MOVER ──
// A roaming pokemon target that drifts across the mid-table during play.
// Spawns every BONUS_SPAWN_S seconds while a ball is in play. Hitting it gives
// a big score bonus + advances multiball arming. Skin-agnostic — fallback
// rendering is a glowing pink star.
const BONUS_POKES = ['boss','splitter','swift','shielded'];
const BONUS_SPAWN_S = 14;
const bonusMover = {
  active: false, x: 260, y: 380, vx: 130, r: 22,
  poke: 'boss', spawnAt: 0, lifeUntil: 0
};
function spawnBonusMover(){
  bonusMover.active = true;
  bonusMover.poke = BONUS_POKES[Math.floor(Math.random() * BONUS_POKES.length)];
  // Random side & speed; mid-table y between drops and bumpers.
  const fromLeft = Math.random() < 0.5;
  bonusMover.x = fromLeft ? 30  : 490;
  bonusMover.vx = fromLeft ? 130 + Math.random() * 90 : -(130 + Math.random() * 90);
  bonusMover.y = 360 + Math.random() * 40;
  bonusMover.lifeUntil = gameTime + 9;
}
function updateBonusMover(dt){
  if(!bonusMover.active){
    if(gameTime >= bonusMover.spawnAt && balls.some(b => b.alive && !b.inPlunger)){
      spawnBonusMover();
    }
    return;
  }
  bonusMover.x += bonusMover.vx * dt;
  // Bounce off the side walls so it drifts back and forth.
  if(bonusMover.x < 30) { bonusMover.x = 30;  bonusMover.vx = Math.abs(bonusMover.vx); }
  if(bonusMover.x > 490){ bonusMover.x = 490; bonusMover.vx = -Math.abs(bonusMover.vx); }
  if(gameTime >= bonusMover.lifeUntil){
    bonusMover.active = false;
    bonusMover.spawnAt = gameTime + BONUS_SPAWN_S;
  }
}
function onBonusHit(){
  if(!bonusMover.active) return;
  bonusMover.active = false;
  bonusMover.spawnAt = gameTime + BONUS_SPAWN_S * 1.5;
  const bonus = 2500 * multiplier;
  score += bonus;
  Sfx.bonusHit && Sfx.bonusHit();
  flashOverlayMsg('+' + bonus.toLocaleString());
  // Side reward: instantly advance current mission by 1 step.
  const m = currentMission();
  if(m && m.progress < m.target){
    m.progress++;
    if(m.progress >= m.target) completeMission(m);
    else updateMissionBanner();
  }
  updateHud();
}

// ── PHYSICS — ball update with substepping ───────────────────────────────────
const GRAVITY   = 1700;          // px/sec²
const DRAG      = 0.0005;        // velocity damping per frame
const MAX_SPEED = 2400;          // raised from 1800 so a freshly-launched ball
                                 // doesn't get its launch velocity capped at
                                 // the plunger and fall short of the lane top.
const SUBSTEPS  = 8;             // collision steps per frame — at MAX_SPEED 2400
                                 // this is 5 px/substep, still well under the
                                 // ball's 11 px radius so no tunneling.

// Brutimon-skin: balls get a random species so the multiball looks like a
// little zoo, AND a rotation that builds up over the game so the sprite
// visibly spins as the ball moves.
const BALL_POKES = ['grunt','runner','mini','swift','splitter','boss'];
function pickBallPoke(){ return BALL_POKES[Math.floor(Math.random() * BALL_POKES.length)]; }
function spawnBallInPlunger(){
  return {
    x: 540, y: 955, vx: 0, vy: 0, r: BALL_R,
    inPlunger: true, alive: true,
    inLane: true,    // ← the launch-lane gate stays open until ball clearly leaves
    poke: pickBallPoke(), rot: 0
  };
}
function spawnBallAtTop(){
  return {
    x: 260, y: 240, vx: (Math.random() - 0.5) * 200, vy: 400, r: BALL_R,
    inPlunger: false, alive: true,
    inLane: false,   // multiball spawns directly in the playfield — gate is closed for it
    poke: pickBallPoke(), rot: Math.random() * Math.PI * 2
  };
}

function updateBalls(dt){
  for(const b of balls){
    if(!b.alive) continue;
    if(b.inPlunger){
      // While in plunger lane, ball can only move vertically (rests at bottom).
      // Plunger physics is handled separately (charging + release).
      continue;
    }
    const dts = dt / SUBSTEPS;
    for(let s = 0; s < SUBSTEPS; s++){
      // Gravity
      b.vy += GRAVITY * dts;
      // Drag
      b.vx *= (1 - DRAG);
      b.vy *= (1 - DRAG);
      // Speed cap
      const sp = Math.hypot(b.vx, b.vy);
      if(sp > MAX_SPEED){ b.vx = b.vx / sp * MAX_SPEED; b.vy = b.vy / sp * MAX_SPEED; }
      // Integrate
      b.x += b.vx * dts;
      b.y += b.vy * dts;
      // Spin the sprite proportional to travelled distance (Brutimon skin
      // visual — a stationary metal ball doesn't visibly rotate).
      b.rot = (b.rot || 0) + Math.hypot(b.vx, b.vy) * dts * 0.018;
      // Slam the launch-lane gate behind the ball: once it has cleanly
      // crossed into the playfield (x < 490, or just left of the divider
      // below the gate), the gate becomes a solid wall for THIS ball. Note
      // we never set it back to true unless the ball drains and a new one
      // is spawned.
      if(b.inLane && (b.x < 490 || (b.x < 505 && b.y > 220))){
        b.inLane = false;
      }
      // Collisions
      collideBallAgainstTable(b);
      // Sensor triggers (ramps)
      for(const r of RAMPS){
        if(r.cooldown > 0) r.cooldown -= dts;
        if(r.cooldown > 0) continue;
        if(b.x > r.x && b.x < r.x + r.w && b.y > r.y && b.y < r.y + r.h){
          onRampLoop(r);
          r.cooldown = 0.8;
        }
      }
    }
    // Drain — fell past the bottom?
    if(b.y > T.H + 40){
      b.alive = false;
      Sfx.drain();
    }
  }
  // Remove dead balls and handle drain consequences once per frame
  for(let i = balls.length - 1; i >= 0; i--){
    if(!balls[i].alive){ balls.splice(i, 1); }
  }
  if(running && balls.length === 0){
    if(inMultiball){
      // Multiball ended naturally
      endMultiball();
    }
    handleBallDrained();
  }
}

function collideBallAgainstTable(b){
  // Static walls
  for(const s of _segs) collideSegment(b, s);

  // Roaming bonus pokemon (drifts across mid-table when active)
  if(bonusMover.active){
    const ddx = b.x - bonusMover.x, ddy = b.y - bonusMover.y;
    const min = b.r + bonusMover.r;
    if(ddx*ddx + ddy*ddy < min * min){
      onBonusHit();
    }
  }

  // Bumpers
  for(const bm of BUMPERS) collideBumper(b, bm);
  // Drop targets
  for(const dt of DROP_TARGETS){
    if(dt.hit) continue;
    if(collideAABB(b, dt.cx - dt.w/2, dt.cy - dt.h/2, dt.w, dt.h)){
      onDropTargetHit(dt);
    }
  }
  // Slingshots — three faces. KICK FACE = A→B (hypotenuse, gets the impulse).
  // The other two faces (B→C, C→A) bounce normally.
  //
  // The old code did `if(collideSegment(...)) continue;` after each non-kick
  // face. That was the bug: if the ball was DEEPLY inside the triangle (e.g.
  // after a hard launch), one face's push-out wouldn't fully evict the ball
  // and the `continue` skipped the other faces, leaving the ball stuck inside
  // and visually "passing through" on the next frame. Now we ALSO check
  // explicitly whether the ball is inside the triangle and force a push-out
  // along the closest edge, then run the three face collisions normally
  // (without `continue`).
  for(const sl of SLINGSHOTS){
    pushBallOutOfTriangle(b, sl);
    collideSegment(b, { x1: sl.bx, y1: sl.by, x2: sl.cx, y2: sl.cy, restitution: 0.6 });
    collideSegment(b, { x1: sl.cx, y1: sl.cy, x2: sl.ax, y2: sl.ay, restitution: 0.6 });
    if(collideSegment(b, { x1: sl.ax, y1: sl.ay, x2: sl.bx, y2: sl.by, restitution: 0.55 })){
      // Kick impulse along the outward normal of the hypotenuse.
      const fx = sl.bx - sl.ax, fy = sl.by - sl.ay;
      let nx = -fy, ny = fx;
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const towardC = (sl.cx - sl.ax) * nx + (sl.cy - sl.ay) * ny;
      if(towardC > 0){ nx = -nx; ny = -ny; }
      b.vx += nx * SLING_KICK;
      b.vy += ny * SLING_KICK;
      onSlingshotHit(sl);
    }
  }
  // Flippers
  for(const f of ALL_FLIPPERS) collideFlipper(b, f);
}

// If the ball CENTER is inside the slingshot triangle, find the closest edge
// and teleport it just outside that edge along the outward normal. Prevents
// the "ball stuck inside the slingshot" failure mode that previously caused
// the visual "passes through" bug after a hard kick.
function pushBallOutOfTriangle(b, sl){
  // Barycentric coordinates of ball center wrt triangle A,B,C.
  const ax = sl.ax, ay = sl.ay, bx = sl.bx, by = sl.by, cx = sl.cx, cy = sl.cy;
  const v0x = cx - ax, v0y = cy - ay;
  const v1x = bx - ax, v1y = by - ay;
  const v2x = b.x - ax, v2y = b.y - ay;
  const d00 = v0x*v0x + v0y*v0y;
  const d01 = v0x*v1x + v0y*v1y;
  const d11 = v1x*v1x + v1y*v1y;
  const denom = d00*d11 - d01*d01;
  if(Math.abs(denom) < 0.0001) return;
  const d20 = v2x*v0x + v2y*v0y;
  const d21 = v2x*v1x + v2y*v1y;
  const v = (d11*d20 - d01*d21) / denom;
  const w = (d00*d21 - d01*d20) / denom;
  const u = 1 - v - w;
  if(u <= 0 || v <= 0 || w <= 0) return;   // outside triangle, nothing to do
  // Inside: find which of the 3 edges is closest, push out perpendicular to it.
  const faces = [
    { x1: bx, y1: by, x2: cx, y2: cy },
    { x1: cx, y1: cy, x2: ax, y2: ay },
    { x1: ax, y1: ay, x2: bx, y2: by }
  ];
  let best = null, bestD = Infinity;
  for(const f of faces){
    const fdx = f.x2 - f.x1, fdy = f.y2 - f.y1;
    const flen = fdx*fdx + fdy*fdy || 1;
    let t = ((b.x - f.x1) * fdx + (b.y - f.y1) * fdy) / flen;
    t = Math.max(0, Math.min(1, t));
    const pX = f.x1 + t * fdx, pY = f.y1 + t * fdy;
    const dd = (b.x - pX)**2 + (b.y - pY)**2;
    if(dd < bestD){ bestD = dd; best = { pX, pY, fdx, fdy }; }
  }
  // Outward normal along (ballPos - closestPoint), but if the ball is exactly
  // on the edge the direction is undefined → fall back to a perpendicular
  // pointing away from the triangle centroid.
  let nx = b.x - best.pX, ny = b.y - best.pY;
  const nl = Math.hypot(nx, ny);
  if(nl < 0.0001){
    const cgX = (ax + bx + cx) / 3, cgY = (ay + by + cy) / 3;
    // Perpendicular to the edge, pointing away from centroid.
    let pnx = -best.fdy, pny = best.fdx;
    const pnl = Math.hypot(pnx, pny) || 1;
    pnx /= pnl; pny /= pnl;
    if((best.pX - cgX) * pnx + (best.pY - cgY) * pny < 0){ pnx = -pnx; pny = -pny; }
    nx = pnx; ny = pny;
  } else {
    nx /= nl; ny /= nl;
  }
  // Place the ball OUTSIDE the edge with a small margin to avoid FP overlap.
  b.x = best.pX + nx * (b.r + 0.5);
  b.y = best.pY + ny * (b.r + 0.5);
  // Also REFLECT the velocity if it's currently pointing INTO the triangle.
  // Without this the ball would push out, drift right back in next substep,
  // push out again, … visually "passing through" the slingshot.
  const vDotN = b.vx * nx + b.vy * ny;
  if(vDotN < 0){
    const e = 0.55;
    b.vx -= (1 + e) * vDotN * nx;
    b.vy -= (1 + e) * vDotN * ny;
  }
}

function collideSegment(b, seg){
  // One-way arc: skip the collision entirely when the ball is OUTSIDE the
  // circle that the arc belongs to.
  if(seg.inwardOnly){
    const adx = b.x - seg.arcCx, ady = b.y - seg.arcCy;
    if(adx*adx + ady*ady > seg.arcR * seg.arcR) return false;
  }
  // Launch-lane exit gate. Behaviour is driven by a per-ball boolean
  // `inLane` — true while the ball hasn't clearly left the launch lane yet,
  // false the moment it does. The gate is OPEN while `inLane` is true; after
  // that it is one-way and only blocks balls moving from the playfield back
  // into the lane. If the ball is already moving away from the gate, don't
  // push it back into the small top-right corner.
  if(seg.gateBlocksFromLeft){
    if(b.inLane) return false;
    const gateX = seg.x1;
    if(!(b.x <= gateX && b.vx > 0)) return false;
  }
  const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
  const lenSq = dx*dx + dy*dy || 1;
  let t = ((b.x - seg.x1) * dx + (b.y - seg.y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = seg.x1 + t * dx, cy = seg.y1 + t * dy;
  const ddx = b.x - cx, ddy = b.y - cy;
  const distSq = ddx*ddx + ddy*ddy;
  if(distSq >= b.r * b.r) return false;
  const dist = Math.sqrt(distSq) || 0.0001;
  const nx = ddx / dist, ny = ddy / dist;
  // Push out
  b.x = cx + nx * b.r;
  b.y = cy + ny * b.r;
  // Reflect
  const vDotN = b.vx * nx + b.vy * ny;
  if(vDotN < 0){
    const e = seg.restitution !== undefined ? seg.restitution : 0.78;
    b.vx -= (1 + e) * vDotN * nx;
    b.vy -= (1 + e) * vDotN * ny;
  }
  return true;
}

function collideBumper(b, bm){
  const dx = b.x - bm.cx, dy = b.y - bm.cy;
  const distSq = dx*dx + dy*dy;
  const minDist = b.r + bm.r;
  if(distSq >= minDist * minDist) return false;
  const dist = Math.sqrt(distSq) || 0.0001;
  const nx = dx / dist, ny = dy / dist;
  // Push the ball OUT of the bumper with a small extra margin so the next
  // substep doesn't re-collide just from floating-point overlap.
  b.x = bm.cx + nx * (minDist + 0.6);
  b.y = bm.cy + ny * (minDist + 0.6);
  // Reflect the velocity properly: keep the tangential component, flip the
  // normal one with restitution, then add an outward POP on top. Previously
  // we hard-wrote the velocity to nx*700 / ny*700, which killed tangential
  // motion AND was the same magnitude every time — so a ball trapped
  // between a bumper and a nearby wall got the same radial push every
  // frame, bouncing forever between the two.
  const vDotN = b.vx * nx + b.vy * ny;
  if(vDotN < 0){
    const e = 0.92;                  // bouncy bumper
    b.vx -= (1 + e) * vDotN * nx;
    b.vy -= (1 + e) * vDotN * ny;
  }
  // Outward kick — adds energy on top of the reflection. Slightly randomised
  // so two consecutive hits on the same bumper don't trace the same path
  // back to whatever wall trapped the ball.
  // Bumper escalation: each consecutive bumper hit raises this ball's kick
  // multiplier (capped at 4×) so a ball that gets stuck pinballing between
  // a bumper and a wall is ALWAYS eventually shot free. The multiplier
  // resets to 1× the next time the ball touches one of the bottom (player-
  // controlled) flippers — so the player still "earns" their next strong
  // pop by saving the ball.
  if(b._bumperBoost === undefined) b._bumperBoost = 1;
  const pop = (520 + Math.random() * 80) * b._bumperBoost;
  b._bumperBoost = Math.min(4, b._bumperBoost * 1.4);
  b.vx += nx * pop;
  b.vy += ny * pop;
  // Stuck-loop break: if THIS ball just hit THIS bumper a couple of times
  // in quick succession, it's wedged. Add a strong sideways nudge toward
  // the playfield centre (x=260) so the ball escapes the corner.
  const now = performance.now();
  if(b._lastBumperHit === bm && now - (b._lastBumperHitAt || 0) < 250){
    b._bumperHitStreak = (b._bumperHitStreak || 0) + 1;
    if(b._bumperHitStreak >= 2){
      const towardCenter = (260 - b.x);
      const dir = Math.sign(towardCenter) || 1;
      b.vx += dir * 380;
      b.vy -= 200;                   // also lift it a bit
      b._bumperHitStreak = 0;
    }
  } else {
    b._bumperHitStreak = 0;
  }
  b._lastBumperHit = bm;
  b._lastBumperHitAt = now;
  onBumperHit(bm);
  return true;
}

function collideAABB(b, x, y, w, h){
  // AABB-vs-circle. Returns true and reflects on the contact normal.
  const closestX = Math.max(x, Math.min(b.x, x + w));
  const closestY = Math.max(y, Math.min(b.y, y + h));
  const dx = b.x - closestX, dy = b.y - closestY;
  const distSq = dx*dx + dy*dy;
  if(distSq >= b.r * b.r) return false;
  const dist = Math.sqrt(distSq) || 0.0001;
  const nx = dx / dist, ny = dy / dist;
  b.x = closestX + nx * b.r;
  b.y = closestY + ny * b.r;
  const vDotN = b.vx * nx + b.vy * ny;
  if(vDotN < 0){
    const e = 0.65;
    b.vx -= (1 + e) * vDotN * nx;
    b.vy -= (1 + e) * vDotN * ny;
  }
  return true;
}

// Robust flipper collision — handles the FAST SWEEP case.
// The flipper rotates up to ~25° in a single frame (FLIPPER_OMEGA / 60). With
// only ONE collision sample at the end-of-frame angle, the ball can fall
// "between" the start and end pose of the sweep and tunnel through. To fix
// this we also sample 4 intermediate angles between prevAngle and angle —
// if the ball is in the swept region at any of those poses, the collision
// triggers. Cheap (~5 sample tests / flipper / substep) and effective.
function collideFlipper(b, f){
  if(collideFlipperAtAngle(b, f, f.angle)) return true;
  if(f.angle !== f.prevAngle){
    const N = 4;
    for(let i = 1; i <= N; i++){
      const a = f.prevAngle + (f.angle - f.prevAngle) * (i / (N + 1));
      if(collideFlipperAtAngle(b, f, a)) return true;
    }
  }
  return false;
}

function collideFlipperAtAngle(b, f, ang){
  // Treat the flipper as a thick line segment from pivot to tip AT THE
  // SUPPLIED ANGLE (may differ from f.angle when sweep-sampling).
  const L = f.len || FLIPPER_LEN;
  const tipX = f.pivotX + Math.cos(ang) * L;
  const tipY = f.pivotY + Math.sin(ang) * L;
  const dx = tipX - f.pivotX, dy = tipY - f.pivotY;
  const lenSq = dx*dx + dy*dy || 1;
  let t = ((b.x - f.pivotX) * dx + (b.y - f.pivotY) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = f.pivotX + t * dx, cy = f.pivotY + t * dy;
  const ddx = b.x - cx, ddy = b.y - cy;
  const FLIPPER_THICK = 9;
  const minDist = b.r + FLIPPER_THICK;
  const distSq = ddx*ddx + ddy*ddy;
  if(distSq >= minDist * minDist) return false;
  const dist = Math.sqrt(distSq) || 0.0001;
  const nx = ddx / dist, ny = ddy / dist;
  b.x = cx + nx * minDist;
  b.y = cy + ny * minDist;
  // Surface velocity at contact (ω × r) — omega is the FRAME-LEVEL rotation
  // rate; same value whether we hit a sweep-sampled pose or the final one.
  const omega = (f.angle - f.prevAngle) * 60;   // approximate ω = Δangle/Δt (1/60s)
  const rx = cx - f.pivotX, ry = cy - f.pivotY;
  const cpVx = -ry * omega;
  const cpVy =  rx * omega;
  const relVx = b.vx - cpVx;
  const relVy = b.vy - cpVy;
  const vDotN = relVx * nx + relVy * ny;
  if(vDotN < 0){
    const e = 0.88;
    const newRelVx = relVx - (1 + e) * vDotN * nx;
    const newRelVy = relVy - (1 + e) * vDotN * ny;
    b.vx = newRelVx + cpVx;
    b.vy = newRelVy + cpVy;
  }
  // Bottom flippers are the player-controlled "saver" paddles (pivots at
  // y = 920). Touching them resets this ball's bumper-kick escalation to
  // the baseline 1×. Upper-feeder flippers (pivots ~y = 620) don't reset
  // it — those are part of the bumper combo loop.
  if(f.pivotY > 800) b._bumperBoost = 1;
  return true;
}

// ── EVENT HOOKS ──────────────────────────────────────────────────────────────
function addScore(n){
  const mult = multiplier;
  score += n * mult;
  // Coin reward every 50k points (works in both paid & free thanks to Coins.add)
  if(score >= nextCoinAt){
    while(score >= nextCoinAt){
      if(window.Coins) Coins.add(1, 'pinball-score');
      nextCoinAt += coinThreshold;
    }
  }
  updateHud();
}

function onBumperHit(bm){
  bm.litUntil = performance.now() + 250;
  Sfx.bumper();
  addScore(bm.score);
  // Mission: bumper-rush — track unique bumpers hit
  const m = currentMission();
  if(m && m.key === 'bumper-rush'){
    m.hits.add(bm.cx + ',' + bm.cy);
    m.progress = m.hits.size;
    if(m.progress >= m.target) completeMission();
    else updateMissionBanner();
  }
}

function onSlingshotHit(sl){
  sl.litUntil = performance.now() + 200;
  Sfx.slingshot();
  addScore(sl.score);
}

function onDropTargetHit(dt){
  dt.hit = true;
  dt.hitAt = performance.now();
  Sfx.dropTarget();
  addScore(dt.score);
  // Mission: drop-squad — count drops
  const m = currentMission();
  if(m && m.key === 'drop-squad'){
    m.progress = DROP_TARGETS.filter(t => t.hit).length;
    if(m.progress >= m.target) completeMission();
    else updateMissionBanner();
  }
  // All drops hit? Award bonus + reset, regardless of active mission.
  if(DROP_TARGETS.every(t => t.hit)){
    setTimeout(() => {
      addScore(2000);
      // Temporary 2× multiplier for 12 s.
      multiplier = Math.max(multiplier, 2);
      multUntil = gameTime + 12;
      Sfx.arp([523, 659, 784], 0.10, 'sine', 0.4);
      rebuildDropTargets();
      updateHud();
    }, 500);
  }
}

function onRampLoop(r){
  r.litUntil = performance.now() + 300;
  Sfx.rampLoop();
  addScore(r.score);
  // Mission: cybergate — count consecutive ramp loops
  const m = currentMission();
  if(m && m.key === 'cybergate'){
    m.progress = Math.min(m.target, m.progress + 1);
    if(m.progress >= m.target) completeMission();
    else updateMissionBanner();
  }
}

// ── MISSIONS ─────────────────────────────────────────────────────────────────
function currentMission(){ return MISSIONS[missionIdx]; }
function resetMissionProgress(m){
  m.progress = 0;
  if(m.hits) m.hits = new Set();
}
function updateMissionBanner(){
  const el = document.getElementById('mission-banner');
  const m = currentMission();
  if(!m || !running){ el.classList.remove('active'); return; }
  el.classList.add('active');
  el.textContent = m.name + '  ' + m.progress + '/' + m.target;
}
function completeMission(){
  const m = currentMission();
  addScore(m.reward);
  flashOverlayMsg('★ ' + m.name + ' ★  +' + m.reward);
  Sfx.missionComplete();
  missionsCompleted++;
  resetMissionProgress(m);
  // Cycle to the next mission
  missionIdx = (missionIdx + 1) % MISSIONS.length;
  // Every 2 completed missions → MULTIBALL armed (next plunger launch will multiball).
  // Was 3; lowered so kids actually see multiball happen.
  if(missionsCompleted % 2 === 0) multiballArmed = true;
  updateMissionBanner();
}

// ── MULTIBALL ────────────────────────────────────────────────────────────────
function startMultiball(){
  if(inMultiball) return;
  inMultiball = true;
  multiplier = Math.max(multiplier, 3);
  multUntil = gameTime + 25;       // 3× score for the whole multiball window
  multiballEndsAt = gameTime + 25;
  multiballArmed = false;
  // Spawn 2 extra balls at the top of the table for a total of 3.
  balls.push(spawnBallAtTop());
  balls.push(spawnBallAtTop());
  Sfx.multiballStart();
  const banner = document.getElementById('multiball-banner');
  banner.classList.add('active');
  setTimeout(() => banner.classList.remove('active'), 2500);
  updateHud();
}
function endMultiball(){
  inMultiball = false;
  multiplier = 1;
  multUntil = 0;
}

// ── FLIPPERS UPDATE ──────────────────────────────────────────────────────────
function updateFlippers(dt){
  for(const f of ALL_FLIPPERS){
    f.prevAngle = f.angle;
    const da = f.target - f.angle;
    const maxStep = FLIPPER_OMEGA * dt;
    if(Math.abs(da) <= maxStep) f.angle = f.target;
    else f.angle += Math.sign(da) * maxStep;
  }
}

// ── PLUNGER ──────────────────────────────────────────────────────────────────
function updatePlunger(dt){
  if(plunger.pulling){
    plunger.charge = Math.min(1, plunger.charge + dt * 1.5);
  }
  // Visual / physics: ball sitting on the plunger gets pushed up on release.
}
function releasePlunger(){
  if(!plunger.pulling) return;
  const power = plunger.charge;
  plunger.pulling = false;
  plunger.charge = 0;
  // Launch ANY ball resting on the plunger (i.e. inside the lane near the
  // bottom). We don't rely on the `inPlunger` flag alone — that gets cleared
  // on first launch, and a ball that bounced back down into the lane would
  // never lift off again. Geometric check is robust.
  let launched = 0;
  for(const b of balls){
    const inLane = b.x > 505 && b.x < 575 && b.y > 880;
    if(!inLane) continue;
    b.inPlunger = false;
    b.vx = (Math.random() - 0.5) * 30;       // tiny lateral spread
    // Generous base: even a near-zero charge clears the lane top diagonal.
    // Full power (cap MAX_SPEED=2400) launches the ball nearly to the apex.
    b.vy = -(1700 + power * 1500);
    launched++;
  }
  if(launched > 0){
    Sfx.plungerLaunch();
    // If multiball was armed, trigger it on the launch.
    if(multiballArmed) startMultiball();
  }
}

// ── DRAIN / LIFE LOST ────────────────────────────────────────────────────────
function handleBallDrained(){
  ballsLeft--;
  if(ballsLeft <= 0){
    endGame();
    return;
  }
  // Reset multiplier on drain
  multiplier = 1;
  multUntil = 0;
  // Reset mission progress on drain (light penalty)
  resetMissionProgress(currentMission());
  // Spawn a new ball in the plunger
  balls.push(spawnBallInPlunger());
  updateHud();
  updateMissionBanner();
}

// ── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  // Outside-table decorative bg (cover letterbox bands)
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);
  // Scanline pattern
  ctx.fillStyle = '#0a1428';
  for(let x = 0; x < W; x += 6) ctx.fillRect(x, 0, 1, H);
  // Vignette toward the table center
  const cx = W/2, cy = H/2;
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  grd.addColorStop(0, '#050810ee');
  grd.addColorStop(1, '#05081000');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);

  // Table background (slight gradient)
  const tg = ctx.createLinearGradient(0, 0, 0, T.H);
  tg.addColorStop(0, '#0a1428');
  tg.addColorStop(1, '#050810');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, T.W, T.H);

  // Faint grid
  ctx.strokeStyle = '#0f1e36';
  ctx.lineWidth = 1;
  for(let x = 0; x <= T.W; x += 50){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, T.H); ctx.stroke();
  }
  for(let y = 0; y <= T.H; y += 50){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(T.W, y); ctx.stroke();
  }

  // Ramps (sensor zones) — drawn as glowing arrows
  for(const r of RAMPS){
    const lit = r.litUntil && performance.now() < r.litUntil;
    ctx.fillStyle = lit ? r.color : r.color + '33';
    ctx.shadowColor = r.color; ctx.shadowBlur = lit ? 22 : 6;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    // Arrow
    ctx.fillStyle = '#050810';
    ctx.font = 'bold 18px Orbitron, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('↑', r.x + r.w/2, r.y + r.h/2);
  }
  ctx.shadowBlur = 0;

  // Static walls (excluding hidden ones, e.g. the one-way dome whose
  // 14 short segments would otherwise stripe the area above the playfield).
  ctx.strokeStyle = '#00f5ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8;
  for(const s of _segs){
    if(s.hidden) continue;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Plunger lane separator label
  ctx.fillStyle = '#00f5ff44';
  ctx.font = 'bold 11px Orbitron, sans-serif';
  ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(555, 500); ctx.rotate(-Math.PI/2);
  ctx.fillText('PLUNGER LANE', 0, 0);
  ctx.restore();

  // Drop targets — in Brutimon-skin mode each target is a sprite sitting on
  // a glowing pedestal; the pedestal disappears once the target is hit
  // (the pokemon "ran away").
  for(const dt of DROP_TARGETS){
    if(dt.hit) continue;
    const sprite = POKE_SKIN ? pkImg(dt.poke) : null;
    if(sprite){
      // Pedestal
      ctx.fillStyle = '#ff66cc44';
      ctx.fillRect(dt.cx - dt.w/2, dt.cy - dt.h/2, dt.w, dt.h);
      ctx.strokeStyle = '#ff66cc'; ctx.lineWidth = 1.5;
      ctx.strokeRect(dt.cx - dt.w/2, dt.cy - dt.h/2, dt.w, dt.h);
      // Sprite ON TOP of the pedestal, with a halo.
      const sz = 28;
      ctx.shadowColor = '#ff66cc'; ctx.shadowBlur = 14;
      ctx.drawImage(sprite, dt.cx - sz/2, dt.cy - sz/2 - 10, sz, sz);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#ff66cc';
      ctx.shadowColor = '#ff66cc'; ctx.shadowBlur = 12;
      ctx.fillRect(dt.cx - dt.w/2, dt.cy - dt.h/2, dt.w, dt.h);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(dt.cx - dt.w/2, dt.cy - dt.h/2, dt.w, dt.h);
    }
  }

  // Slingshots
  for(const sl of SLINGSHOTS){
    const lit = sl.litUntil && performance.now() < sl.litUntil;
    ctx.fillStyle = lit ? sl.color + 'cc' : sl.color + '33';
    ctx.shadowColor = sl.color; ctx.shadowBlur = lit ? 24 : 10;
    ctx.beginPath();
    ctx.moveTo(sl.ax, sl.ay); ctx.lineTo(sl.bx, sl.by); ctx.lineTo(sl.cx, sl.cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = sl.color; ctx.lineWidth = 2.5;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Bumpers — Brutimon-skin: glowing colored disk with the pokemon sprite on
  // top. Pulses when recently hit (litUntil). Classic mode keeps the
  // ring-and-dot design.
  for(const bm of BUMPERS){
    const lit = bm.litUntil && performance.now() < bm.litUntil;
    const pulse = lit ? 1.15 : 1;
    const sprite = POKE_SKIN ? pkImg(bm.poke) : null;
    ctx.save();
    ctx.translate(bm.cx, bm.cy);
    ctx.fillStyle = bm.color;
    ctx.shadowColor = bm.color;
    ctx.shadowBlur = lit ? 36 : 18;
    ctx.beginPath(); ctx.arc(0, 0, bm.r * pulse, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    if(sprite){
      // Solid colored disk + sprite on top.
      const sz = bm.r * 1.5;
      ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
    } else {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, bm.r * 0.55, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, bm.r * 0.22, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Flippers — all four (lower pair + upper mid-table pair).
  for(const f of ALL_FLIPPERS){
    const tip = flipperTip(f);
    const isUpper = (f === flippers.leftUpper || f === flippers.rightUpper);
    ctx.save();
    // Upper flippers in a slightly different colour so the player can read
    // them at a glance.
    const col = isUpper ? '#ffcc44' : '#00f5ff';
    ctx.strokeStyle = col;
    ctx.lineWidth = isUpper ? 12 : 16;
    ctx.lineCap = 'round';
    ctx.shadowColor = col; ctx.shadowBlur = isUpper ? 14 : 18;
    ctx.beginPath();
    ctx.moveTo(f.pivotX, f.pivotY);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    // Pivot dot
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(f.pivotX, f.pivotY, isUpper ? 4 : 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Plunger spring (right channel)
  const plY = plunger.yBot - plunger.charge * 28;
  ctx.fillStyle = plunger.pulling ? '#ffcc44' : '#00f5ff';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
  ctx.fillRect(plunger.x - plunger.width/2, plY, plunger.width, plunger.yBot - plY + 10);
  // Spring coils
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#00f5ff66';
  ctx.lineWidth = 1.5;
  for(let i = 0; i < 4; i++){
    const y = plY + 6 + i * 5;
    if(y > plunger.yBot) break;
    ctx.beginPath();
    ctx.moveTo(plunger.x - plunger.width/2, y);
    ctx.lineTo(plunger.x + plunger.width/2, y);
    ctx.stroke();
  }

  // Roaming bonus pokemon — high-value mid-table target that drifts.
  if(bonusMover.active){
    const sprite = POKE_SKIN ? pkImg(bonusMover.poke) : null;
    const pulse = 1 + 0.10 * Math.sin(performance.now() * 0.012);
    ctx.save();
    ctx.translate(bonusMover.x, bonusMover.y);
    // Rainbow-ish glow (mid-flash hue based on time)
    const hue = (performance.now() / 6) % 360;
    ctx.shadowColor = `hsl(${hue}, 90%, 60%)`;
    ctx.shadowBlur = 32;
    ctx.fillStyle = `hsl(${hue}, 90%, 60%)55`;
    ctx.beginPath(); ctx.arc(0, 0, bonusMover.r * pulse * 1.4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    if(sprite){
      const sz = bonusMover.r * 2 * pulse;
      ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
    } else {
      ctx.fillStyle = `hsl(${hue}, 90%, 75%)`;
      ctx.beginPath();
      for(let i = 0; i < 5; i++){
        const a = -Math.PI/2 + i * Math.PI * 2 / 5;
        const r = i % 2 === 0 ? bonusMover.r : bonusMover.r * 0.45;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // Balls — Brutimon-skin: each ball is a sprite that rotates as it travels.
  // Cyan glow halo retained for visual continuity with the rest of the table.
  for(const b of balls){
    const sprite = POKE_SKIN ? pkImg(b.poke) : null;
    ctx.save();
    ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffffffaa';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    if(sprite){
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot || 0);
      const sz = b.r * 2.7;
      ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
    } else {
      ctx.fillStyle = '#00f5ff';
      ctx.beginPath(); ctx.arc(b.x - 3, b.y - 3, b.r * 0.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Outer table border
  ctx.strokeStyle = '#00f5ffaa';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 20;
  ctx.strokeRect(2, 2, T.W - 4, T.H - 4);
  ctx.shadowBlur = 0;

  ctx.restore();

  // Center flash overlay (for mission complete etc.)
  if(_flash.t > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, _flash.t);
    ctx.fillStyle = '#ffcc44';
    ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.05) + 'px Orbitron, sans-serif';
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 24;
    ctx.textAlign = 'center';
    ctx.fillText(_flash.text, W/2, H * 0.4);
    ctx.restore();
    _flash.t -= 0.012;
  }
}

const _flash = { text: '', t: 0 };
function flashOverlayMsg(t){ _flash.text = t; _flash.t = 1.4; }

// ── HUD ──────────────────────────────────────────────────────────────────────
function updateHud(){
  document.getElementById('h-score').textContent = score.toLocaleString();
  document.getElementById('h-balls').textContent = ballsLeft;
  document.getElementById('h-mult').textContent  = '×' + multiplier;
  document.getElementById('h-best').textContent  = highScore.toLocaleString();
  document.getElementById('h-coins').textContent = window.Coins ? Coins.formatted() : '0';
}

// ── INPUT ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  if(e.key === 'z' || e.key === 'Z' || e.key === 'ArrowLeft')  setSideUp('left',  true);
  if(e.key === 'm' || e.key === 'M' || e.key === 'ArrowRight') setSideUp('right', true);
  if(e.key === ' '){ plunger.pulling = true; }
  if(e.key === 'Escape' && running) showPause();
});
window.addEventListener('keyup', e => {
  if(e.key === 'z' || e.key === 'Z' || e.key === 'ArrowLeft')  setSideUp('left',  false);
  if(e.key === 'm' || e.key === 'M' || e.key === 'ArrowRight') setSideUp('right', false);
  if(e.key === ' '){ releasePlunger(); }
});

// Touch: tap LEFT HALF of screen = left flipper, RIGHT HALF = right flipper.
// No special plunger zone — the dedicated LAUNCH button below handles it
// (mounted on top of the canvas with its own touch handlers, so taps on it
// don't reach the canvas listener).
const touchToFlipper = new Map();    // touchId → 'left'|'right'
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  Sfx.init();
  for(const t of e.changedTouches){
    const px = t.clientX;
    const side = (px < W / 2) ? 'left' : 'right';
    touchToFlipper.set(t.identifier, side);
    setSideUp(side, true);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    const kind = touchToFlipper.get(t.identifier);
    touchToFlipper.delete(t.identifier);
    if(kind) setSideUp(kind, false);
  }
}, { passive: false });
canvas.addEventListener('touchcancel', e => {
  for(const t of e.changedTouches){
    const kind = touchToFlipper.get(t.identifier);
    touchToFlipper.delete(t.identifier);
    if(kind) setSideUp(kind, false);
  }
}, { passive: false });

// Dedicated LAUNCH button (mobile). Hold to charge, release to fire.
// Mouse handlers too so it also works on a desktop tested at touch-coarse.
const launchBtn = document.getElementById('launch-btn');
function launchDown(e){ e.preventDefault(); Sfx.init(); plunger.pulling = true; launchBtn.classList.add('charging'); }
function launchUp(e){ e.preventDefault(); releasePlunger(); launchBtn.classList.remove('charging'); }
launchBtn.addEventListener('touchstart',  launchDown, {passive:false});
launchBtn.addEventListener('touchend',    launchUp,   {passive:false});
launchBtn.addEventListener('touchcancel', launchUp,   {passive:false});
launchBtn.addEventListener('mousedown',   launchDown);
launchBtn.addEventListener('mouseup',     launchUp);
launchBtn.addEventListener('mouseleave',  launchUp);

// ── FLOW ─────────────────────────────────────────────────────────────────────
function startGame(){
  Sfx.init();
  score = 0;
  ballsLeft = BALLS_PER_GAME;
  multiplier = 1;
  multUntil = 0;
  inMultiball = false;
  multiballArmed = false;
  missionIdx = 0;
  missionsCompleted = 0;
  for(const m of MISSIONS) resetMissionProgress(m);
  rebuildDropTargets();
  for(const r of RAMPS) r.cooldown = 0;
  nextCoinAt = coinThreshold;
  balls = [spawnBallInPlunger()];
  gameOver = false;
  // Reset & schedule the first bonus mover (waits BONUS_SPAWN_S after launch).
  bonusMover.active = false;
  bonusMover.spawnAt = BONUS_SPAWN_S;
  running = true;
  document.getElementById('overlay').classList.add('hide');
  updateHud();
  updateMissionBanner();
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  running = false;
  gameOver = true;
  Sfx.drain();
  if(score > highScore){
    highScore = score;
    localStorage.setItem('pinball-best', String(highScore));
  }
  if(window.CloudSync) CloudSync.recordScore(null, score);
  document.getElementById('mission-banner').classList.remove('active');
  showOverlay(`
    <h2 style="color:#ff5566;text-shadow:0 0 28px #ff5566">GAME OVER</h2>
    <div class="row">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-val gold">${score.toLocaleString()}</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-val">${highScore.toLocaleString()}</span></div>
    </div>
    <p>Coins guadagnati questa partita: usali per upgrade in altri giochi dell'arcade.</p>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">RIPROVA</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `);
}

  running = false;

  showOverlay(`
    <h2>NEON PINBALL</h2>
    <p>Flipper procedurale: 3 bumper, 2 slingshot, 5 drop target, 2 ramp loop, 3 missioni e MULTIBALL ogni 3 missioni completate.</p>
    <p>Desktop: <b>Z</b> sx · <b>M</b> dx · <b>SPAZIO</b> plunger.<br>
       Mobile: tocca metà sinistra/destra · angolo basso-destro per il plunger.</p>
    <div class="row">
      <div class="stat"><span class="stat-label">Record</span><span class="stat-val gold">${highScore.toLocaleString()}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `);
}

function showPause(){
  running = false;
  showOverlay(`
    <h2>PAUSE</h2>
    <p>Score: <b style="color:#fff">${score.toLocaleString()}</b> · Balls left: <b style="color:#fff">${ballsLeft}</b></p>
    <div class="btn-row">
      <button class="btn gold" onclick="resumeGame()">RESUME</button>
      <button class="btn" onclick="startGame()">RESTART</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `);
}
function resumeGame(){
  running = true;
  document.getElementById('overlay').classList.add('hide');
  lastT = performance.now();
  requestAnimationFrame(loop);
}
function showOverlay(html){
  const ol = document.getElementById('overlay');
  ol.innerHTML = html;
  ol.classList.remove('hide');
}

function goBack(){
  if(running && !confirm('Tornare al menu principale?')) return;
  Sfx.master && (Sfx.master.gain.value = 0);
  window.location.href = '../';
}

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.033, (ts - lastT) / 1000);
  lastT = ts;
  gameTime += dt;
  // Tick down multiplier window
  if(multiplier > 1 && gameTime > multUntil){
    multiplier = 1;
    updateHud();
  }
  // Tick down multiball end
  if(inMultiball && gameTime > multiballEndsAt && balls.length <= 1){
    endMultiball();
  }
  updateFlippers(dt);
  updatePlunger(dt);
  updateBalls(dt);
  updateBonusMover(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
showMainMenu();
window.addEventListener('coins:change', updateHud);
// Silence audio when leaving the page
window.addEventListener('pagehide', () => { if(Sfx.master) Sfx.master.gain.value = 0; });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && Sfx.master) Sfx.master.gain.value = 0;
  else if(Sfx.master) Sfx.master.gain.value = Sfx.enabled ? 0.28 : 0;
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
