<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>POKEMON MEMORY</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:linear-gradient(160deg, #1a2a4a, #0a1828);color:#e0e8ff;font-family:'Share Tech Mono',monospace;min-height:100vh}
  body{touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden}

  #back-btn{
    position:fixed;top:8px;left:8px;width:42px;height:36px;border-radius:6px;
    background:#101822cc;border:1px solid #ffcc44aa;color:#ffcc44;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;z-index:7;display:flex;align-items:center;justify-content:center;
  }

  #hud{
    display:flex;justify-content:space-around;align-items:center;
    padding:14px 16px 6px;font-family:'Orbitron',sans-serif;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center}
  .hud-item .label{font-size:10px;letter-spacing:.22em;color:#ffcc4499;text-transform:uppercase}
  .hud-item .value{font-weight:900;font-size:1.4rem;color:#ffcc44;text-shadow:0 0 12px #ffcc4488;letter-spacing:.06em}

  .grid{
    display:grid; gap:8px;
    width:min(96vw, 480px); margin:8px auto;
    grid-template-columns:repeat(4, 1fr);
  }
  .card{
    aspect-ratio:1/1; perspective:600px; cursor:pointer;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transition:transform .35s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner{
    transform:rotateY(180deg);
  }
  .card-face{
    position:absolute; inset:0; border-radius:10px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center;
    border:2px solid #2a3a55;
  }
  .card-back{
    background:linear-gradient(135deg, #2266dd, #114488);
    box-shadow:0 0 18px #66ccff44 inset;
  }
  .card-back::after{
    content:"?"; font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:2.4rem; color:#ffcc44; text-shadow:0 0 14px #ffcc44aa;
  }
  .card-front{
    background:#fff; transform:rotateY(180deg);
    box-shadow:0 0 20px #ffcc4422 inset;
  }
  .card-front img{
    width:78%; height:78%; image-rendering:pixelated;
  }
  .card.matched .card-front{
    background:#88ff8866; border-color:#44ff88;
    box-shadow:0 0 24px #44ff8888 inset;
  }
  .card.disabled{ pointer-events:none; }

  #overlay{
    position:fixed;inset:0;z-index:10;
    background:#0a1828cc;backdrop-filter:blur(4px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:24px;text-align:center;
  }
  #overlay.on{display:flex}
  #overlay h2{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2rem;
    color:#ffcc44;letter-spacing:.18em;text-shadow:0 0 26px #ffcc44;margin:6px 0;
  }
  #overlay p{color:#cdd9ee;font-size:.95rem;margin:4px 0}
  .btn{
    margin-top:10px;padding:10px 22px;background:transparent;border:2px solid #ffcc44;
    color:#ffcc44;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.8rem;
    letter-spacing:.2em;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 18px #ffcc4444;
  }
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}

  #celebration{
    position:fixed;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;
    z-index:9;flex-direction:column;
  }
  #celebration.on{display:flex}
</style>
</head>
<body>

<button id="back-btn" onclick="window.location.href='../'">✖</button>

<div id="hud">
  <div class="hud-item"><span class="label">Mosse</span><span class="value" id="h-moves">0</span></div>
  <div class="hud-item"><span class="label">Tempo</span><span class="value" id="h-time">0:00</span></div>
  <div class="hud-item"><span class="label">Coppie</span><span class="value" id="h-pairs">0/8</span></div>
</div>

<div class="grid" id="grid"></div>

<div id="celebration"><canvas id="celebrate-canvas"></canvas></div>
<div id="overlay"></div>

<script src="../shared/coins.js"></script>
<script>
const BASE = '../neon-defender/assets/skin-pokemon/';
const SPECIES = ['grunt','runner','mini','swift','tank','shielded','splitter','boss'];   // 8 → 16 cards (4×4)
let cards = [];        // array of {sprite, matched, el}
let firstPick = null;
let secondPick = null;
let lock = false;
let moves = 0;
let matched = 0;
let startMs = 0;
let timerId = null;
let celebrating = false;

// ── Sfx ─────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let ctx = null, master = null, on = localStorage.getItem('memAudio') !== 'false';
  function ensure(){
    if(ctx) return ctx;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
    master = ctx.createGain(); master.gain.value = on ? 0.6 : 0; master.connect(ctx.destination);
    return ctx;
  }
  function tone(opts){
    if(!on) return; if(!ensure()) return;
    const { freq=440, dur=0.1, type='sine', vol=0.3, sweep=0 } = opts;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.05);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }
  function flip(){ tone({freq:780, dur:0.05, type:'square', vol:0.15}); }
  function match(){
    tone({freq:660, dur:0.08, type:'square', vol:0.22});
    setTimeout(() => tone({freq:990, dur:0.10, type:'square', vol:0.22}), 90);
  }
  function nomatch(){ tone({freq:220, dur:0.16, type:'sawtooth', vol:0.18, sweep:-80}); }
  function win(){
    const scale = [523, 659, 784, 1047, 1319];
    scale.forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.15, type:'square', vol:0.24}), i * 140));
  }
  return { flip, match, nomatch, win };
})();

// ── Board ───────────────────────────────────────────────────────────────────
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildBoard(){
  cards = [];
  firstPick = secondPick = null; lock = false;
  moves = 0; matched = 0;
  const deck = shuffle([...SPECIES, ...SPECIES]);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  deck.forEach((sprite, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front"><img src="${BASE}${sprite}.png" alt="${sprite}" /></div>
      </div>`;
    card.addEventListener('click', () => onCardClick(idx));
    grid.appendChild(card);
    cards.push({ sprite, matched: false, el: card });
  });
  updateHud();
  startMs = performance.now();
  if(timerId) clearInterval(timerId);
  timerId = setInterval(updateTimer, 500);
}
function onCardClick(idx){
  if(lock || celebrating) return;
  const c = cards[idx];
  if(c.matched) return;
  if(firstPick === idx) return;
  c.el.classList.add('flipped');
  Sfx.flip();
  if(firstPick === null){
    firstPick = idx;
    return;
  }
  // Second pick
  secondPick = idx;
  moves++; updateHud();
  if(cards[firstPick].sprite === c.sprite){
    cards[firstPick].matched = true;
    c.matched = true;
    cards[firstPick].el.classList.add('matched');
    c.el.classList.add('matched');
    Sfx.match();
    firstPick = secondPick = null;
    matched++;
    updateHud();
    if(matched === SPECIES.length) onWin();
  } else {
    lock = true;
    Sfx.nomatch();
    setTimeout(() => {
      cards[firstPick].el.classList.remove('flipped');
      c.el.classList.remove('flipped');
      firstPick = secondPick = null;
      lock = false;
    }, 850);
  }
}
function updateHud(){
  document.getElementById('h-moves').textContent = moves;
  document.getElementById('h-pairs').textContent = matched + '/' + SPECIES.length;
}
function updateTimer(){
  const s = Math.floor((performance.now() - startMs) / 1000);
  const mm = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2, '0');
  document.getElementById('h-time').textContent = mm + ':' + ss;
}

// ── Celebration ─────────────────────────────────────────────────────────────
function startCelebration(sprite, onDone){
  celebrating = true;
  const wrap = document.getElementById('celebration');
  const cv = document.getElementById('celebrate-canvas');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const img = new Image(); img.src = BASE + sprite + '.png';
  wrap.classList.add('on');
  const start = performance.now();
  const DUR = 2400;
  function tick(){
    const now = performance.now();
    const t = Math.min(1, (now - start) / DUR);
    ctx.fillStyle = `rgba(0,0,0,${0.35 + t * 0.35})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
    // bounce → grow
    const BOUNCE_END = 0.6;
    let scale, oy, rot;
    if(t < BOUNCE_END){
      const bt = t / BOUNCE_END;
      const phase = bt * 3 * Math.PI;
      scale = 1 + 0.10 * Math.abs(Math.sin(phase));
      oy    = -Math.abs(Math.sin(phase)) * Math.min(cv.width, cv.height) * 0.18;
      rot   = Math.sin(phase * 0.6) * 0.18;
    } else {
      const gt = (t - BOUNCE_END) / (1 - BOUNCE_END);
      scale = 1 + Math.pow(gt, 1.4) * 9;
      oy = (1 - gt) * (-Math.min(cv.width, cv.height) * 0.05);
      rot = Math.sin(now * 0.005) * 0.06;
    }
    const sz = Math.min(cv.width, cv.height) * 0.22 * scale;
    ctx.save();
    ctx.translate(cv.width/2, cv.height/2 + oy);
    ctx.fillStyle = '#ffcc4433';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.6, 0, Math.PI*2); ctx.fill();
    ctx.rotate(rot);
    if(img.complete && img.naturalWidth > 0){
      ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
    }
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#ffcc44';
    ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 30 + t * 25;
    ctx.font = 'bold ' + Math.floor(Math.min(cv.width, cv.height) * (0.08 + t * 0.07)) + 'px Orbitron, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('BRAVO!', cv.width/2, Math.min(cv.width, cv.height) * 0.10 + Math.sin(now * 0.012) * 6);
    ctx.restore();
    if(t < 1) requestAnimationFrame(tick);
    else { wrap.classList.remove('on'); celebrating = false; onDone(); }
  }
  // Audio cue too
  const scale = [523, 659, 784, 1047, 1319];
  scale.forEach((f, i) => setTimeout(() => Sfx.match(), i * 130));
  requestAnimationFrame(tick);
}

// ── Flow ────────────────────────────────────────────────────────────────────
function onWin(){
  clearInterval(timerId);
  Sfx.win();
  const seconds = Math.floor((performance.now() - startMs) / 1000);
  // Coin reward: better with fewer moves and faster time.
  const reward = Math.max(3, 20 - moves + Math.max(0, 30 - seconds));
  if(window.Coins) Coins.add(Math.min(40, reward), 'memory-win');
  const winnerSprite = SPECIES[Math.floor(Math.random() * SPECIES.length)];
  startCelebration(winnerSprite, () => {
    const ol = document.getElementById('overlay');
    ol.classList.add('on');
    ol.innerHTML = `
      <h2>HAI VINTO!</h2>
      <p>Mosse: <b style="color:#fff">${moves}</b></p>
      <p>Tempo: <b style="color:#fff">${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</b></p>
      <p>+${Math.min(40, reward)}🪙</p>
      <div class="btn-row">
        <button class="btn" onclick="restart()">RIGIOCA</button>
        <button class="btn" onclick="window.location.href='../'">MENU</button>
      </div>
    `;
  });
}
function restart(){
  document.getElementById('overlay').classList.remove('on');
  buildBoard();
}
window.restart = restart;

// ── Boot ────────────────────────────────────────────────────────────────────
buildBoard();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
