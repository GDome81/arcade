  html,body{margin:0;padding:0;background:#0a0218;color:#fff;

  /* Mode / brutimon pickers. */

<script>
// ─────────────────────────────────────────────────────────────────────────────
// BRUTIMON PONG — bouncing-ball duel, landscape-only.
//
// Two paddles on the left/right side of the arena; the ball bounces between
// them and accelerates a bit on every paddle hit. The ball passing past a
// paddle scores for the opposite side; first to 7 wins the match.
//
// Two modes, picked on the home screen:
//   • VS AI         single-player, computer drives the right paddle
//   • DUE GIOCATORI two thumbs on the same phone — left half of the screen
//                   controls the left paddle, right half controls the right
//
// Original implementation in the bouncing-ball duel genre (mechanic is over
// 50 years old, public domain). Visuals are 100 % brutimon roster the user
// owns.
// ─────────────────────────────────────────────────────────────────────────────

// ── CANVAS ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
function fitCanvas(){
  W = canvas.width  = Math.floor(window.innerWidth);
  H = canvas.height = Math.floor(window.innerHeight);
  checkOrientation();
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
function checkOrientation(){
  const gate = document.getElementById('portrait-gate');
  if(!gate) return;
  const portrait = window.innerHeight > window.innerWidth;
  // `phase` is declared with `let` later in the script. `fitCanvas()` runs
  // BEFORE that declaration, so a bare reference throws TDZ. The try/catch
  // lets the first call fall through cleanly (no game yet → not in-game).
  let inGame = false, ready = false;
  try { inGame = (phase === 'playing'); } catch(e){ inGame = false; }
  try { ready  = (phase === 'ready');   } catch(e){ ready  = false; }
  // Show the gate while the device is portrait AND we're either playing
  // or *waiting to play* — that way the ball never starts moving while
  // the player is still turning the phone.
  gate.style.display = (portrait && (inGame || ready)) ? 'flex' : 'none';
  try {
    if(portrait && inGame){
      // Player rotated the device BACK to portrait mid-match: auto-pause
      // by dropping to 'ready'. The next landscape rotation will trigger
      // a fresh 3-2-1 countdown before play resumes.
      phase = 'ready';
      countdownEndsAt = 0;
    } else if(portrait && ready){
      // Still portrait → keep the countdown cleared. (Rotating back and
      // forth shouldn't let the player "store" 2 seconds of countdown.)
      countdownEndsAt = 0;
    } else if(!portrait && ready && !countdownEndsAt){
      // Landscape, sitting in 'ready' with no countdown scheduled → start
      // the 3-2-1. The loop is what actually flips us to 'playing' when
      // the timer reaches zero.
      countdownEndsAt = performance.now() + 3000;
      lastT = performance.now();    // suppress the dt spike on the first frame back
    }
  } catch(e){}
  if(!inGame && !ready){
    try { if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  }
}
fitCanvas();

// ── WORLD COORDS ─────────────────────────────────────────────────────────────
// Game logic uses a fixed-size world; we scale to fit the canvas. Aspect is
// landscape (1.8:1). On narrower screens letterboxing on top/bottom.
const WORLD_W = 900, WORLD_H = 500;
function worldRect(){
  const s = Math.min(W / WORLD_W, H / WORLD_H);
  const w = WORLD_W * s, h = WORLD_H * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h, s };
}

// ── STATE ────────────────────────────────────────────────────────────────────
const TARGET_SCORE = 7;
let mode = localStorage.getItem('pongMode') || 'ai';                  // 'ai' | 'p2p'
let variant = localStorage.getItem('pongVariant') || 'pong';          // 'pong' | 'tennis'

// Tennis tuning — paddles can roam horizontally within their own half
// (closer to the net = harder shot), and curl the ball with the impact
// point + paddle's own velocity.
const TENNIS_MIN_X_LEFT   = 28;
const TENNIS_MIN_X_RIGHT  = () => WORLD_W / 2 + 12;
const TENNIS_MAX_X_LEFT   = () => WORLD_W / 2 - 12 - PADDLE_W;
const TENNIS_MAX_X_RIGHT  = () => WORLD_W - 28 - PADDLE_W;
const TENNIS_NET_SPEEDUP  = 0.65;     // extra speed at the net (×1 + 0.65 ≈ 65 %)
const TENNIS_SPIN_FACTOR  = 5.4;      // rad/sec applied per unit of off-centre hit
const TENNIS_SPIN_FROM_VY = 0.0040;   // contribution of paddle vy to spin
const TENNIS_SPIN_DECAY   = 0.45;     // per-second multiplicative decay (1=no decay)
let phase = 'menu';                                    // 'menu' | 'ready' | 'playing' | 'gameover'
let running = false;
// 3-2-1 countdown after the device finishes rotating into landscape (or
// after a rotate-back-then-rotate-forward auto-pause). 0 = no countdown
// scheduled. Set by checkOrientation; cleared by the loop when fired.
let countdownEndsAt = 0;

let leftScore = 0, rightScore = 0;
let leftSpeciesId  = localStorage.getItem('pongLeft')  || null;
let rightSpeciesId = localStorage.getItem('pongRight') || null;

const PADDLE_W = 16, PADDLE_H = 96;
const paddleLeft  = { x: 28,                       y: WORLD_H / 2 - PADDLE_H / 2, vy: 0, targetY: WORLD_H / 2 };
const paddleRight = { x: WORLD_W - 28 - PADDLE_W,  y: WORLD_H / 2 - PADDLE_H / 2, vy: 0, targetY: WORLD_H / 2 };

const BALL_R           = 13;
const BALL_START_SPEED = 380;     // px/sec in world coords
const BALL_MAX_SPEED   = 920;
const BALL_SPEEDUP     = 1.06;
const PADDLE_SPEED     = 740;     // px/sec
const ball = { x: WORLD_W / 2, y: WORLD_H / 2, vx: 0, vy: 0, rot: 0, curve: 0, speciesId: null, stage: 1 };

let particles = [];
let speciesList = [];
let pauseUntil = 0;               // delay between rallies (between point and next serve)

// Input — paddle target y comes from EITHER touch (per-half) OR keys.
// In AI mode we also expose a virtual joystick (touch-dpad) so the finger
// doesn't have to sit on top of the paddle and cover the action. The
// joystick result lands in `joyLeft`; the direct-touch path stays for 2P
// mode where two fingers each drive their own paddle and TouchDpad's
// single-touch model isn't enough.
const INPUT = {
  leftTouch: null,    // float world-Y while finger on left half
  rightTouch: null,
  keys: { lUp:false, lDown:false, rUp:false, rDown:false }
};
let joyLeft = { x: 0, y: 0 };       // 16-way virtual joystick (AI mode)
function useVirtualJoystick(){ return mode === 'ai'; }

// ── ASSETS ───────────────────────────────────────────────────────────────────
async function preloadSpecies(){
  try {
    const reg = await Brutimon.registry();
    speciesList = (reg.species || []);
    if(speciesList.length){
      if(!leftSpeciesId)  leftSpeciesId  = speciesList[0].id;
      if(!rightSpeciesId) rightSpeciesId = speciesList[Math.min(1, speciesList.length - 1)].id;
    }
    for(const sp of speciesList){
      for(let st = 1; st <= 5; st++) Brutimon.image(sp.id, st);
    }
  } catch(e){}
}
function imgReady(im){ return im && im.complete && im.naturalWidth > 0; }

// ── BALL SERVE ───────────────────────────────────────────────────────────────
function serveBall(direction){
  ball.x = WORLD_W / 2;
  ball.y = WORLD_H / 2 + (Math.random() - 0.5) * WORLD_H * 0.4;
  const ang = (Math.random() - 0.5) * 0.6;
  ball.vx = Math.cos(ang) * BALL_START_SPEED * direction;
  ball.vy = Math.sin(ang) * BALL_START_SPEED;
  ball.rot = 0;
  ball.curve = 0;
  if(speciesList.length){
    const sp = speciesList[Math.floor(Math.random() * speciesList.length)];
    ball.speciesId = sp.id;
    ball.stage = 1 + Math.floor(Math.random() * 3);
  }
  pauseUntil = performance.now() + 700;
}

function resetMatch(){
  leftScore = 0; rightScore = 0;
  // Tennis spawns paddles closer to the baseline so the player has room
  // to charge toward the net. Pong keeps them locked at the original x.
  if(variant === 'tennis'){
    paddleLeft.x  = TENNIS_MIN_X_LEFT;
    paddleRight.x = TENNIS_MAX_X_RIGHT();
  } else {
    paddleLeft.x  = 28;
    paddleRight.x = WORLD_W - 28 - PADDLE_W;
  }
  paddleLeft.y  = WORLD_H / 2 - PADDLE_H / 2;
  paddleRight.y = WORLD_H / 2 - PADDLE_H / 2;
  paddleLeft.targetY = paddleRight.targetY = WORLD_H / 2;
  paddleLeft.vy = paddleRight.vy = 0;
  paddleLeft.vx = paddleRight.vx = 0;
  particles = [];
  updateScoreHud();
  serveBall(Math.random() < 0.5 ? -1 : 1);
}

// ── INPUT ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if(e.key === 'w' || e.key === 'W') INPUT.keys.lUp   = true;
  if(e.key === 's' || e.key === 'S') INPUT.keys.lDown = true;
  if(e.key === 'ArrowUp')            INPUT.keys.rUp   = true;
  if(e.key === 'ArrowDown')          INPUT.keys.rDown = true;
});
window.addEventListener('keyup', e => {
  if(e.key === 'w' || e.key === 'W') INPUT.keys.lUp   = false;
  if(e.key === 's' || e.key === 'S') INPUT.keys.lDown = false;
  if(e.key === 'ArrowUp')            INPUT.keys.rUp   = false;
  if(e.key === 'ArrowDown')          INPUT.keys.rDown = false;
});

// Touch: each half of the canvas drives one paddle. In VS AI mode both
// halves drive the left paddle (so the player can use either hand).
function screenToWorldY(sy){
  const r = worldRect();
  return (sy - r.y) / r.s;
}
function screenToWorldX(sx){
  const r = worldRect();
  return (sx - r.x) / r.s;
}
// Direct-touch input is ONLY used in 2P mode (one finger per half drives
// each paddle, TouchDpad's single-finger model can't handle that). In AI
// mode TouchDpad attaches further below and drives joyLeft.
canvas.addEventListener('touchstart', e => {
  if(useVirtualJoystick()) return;
  e.preventDefault();
  for(const t of e.changedTouches){
    const wx = screenToWorldX(t.clientX);
    const wy = screenToWorldY(t.clientY);
    if(wx < WORLD_W / 2) INPUT.leftTouch  = { id: t.identifier, x: wx, y: wy };
    else                  INPUT.rightTouch = { id: t.identifier, x: wx, y: wy };
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if(useVirtualJoystick()) return;
  e.preventDefault();
  for(const t of e.changedTouches){
    const wx = screenToWorldX(t.clientX);
    const wy = screenToWorldY(t.clientY);
    if(INPUT.leftTouch  && t.identifier === INPUT.leftTouch.id ){ INPUT.leftTouch.x  = wx; INPUT.leftTouch.y  = wy; }
    if(INPUT.rightTouch && t.identifier === INPUT.rightTouch.id){ INPUT.rightTouch.x = wx; INPUT.rightTouch.y = wy; }
  }
}, { passive: false });
function endTouch(e){
  if(useVirtualJoystick()) return;
  for(const t of e.changedTouches){
    if(INPUT.leftTouch  && t.identifier === INPUT.leftTouch.id ) INPUT.leftTouch  = null;
    if(INPUT.rightTouch && t.identifier === INPUT.rightTouch.id) INPUT.rightTouch = null;
  }
}
canvas.addEventListener('touchend',    endTouch);
canvas.addEventListener('touchcancel', endTouch);
// AI-mode virtual joystick: 16-way snap so the player can aim diagonally
// in tennis without the finger covering the paddle.
if(window.TouchDpad){
  TouchDpad.attach({
    canvas,
    // Analog: magnitude scales with knob distance, so a small finger
    // movement nudges the paddle slowly and a full push runs it. The
    // 16-way snap version was correct in DIRECTION but binary in SPEED,
    // which read as "jerky" — full speed or nothing.
    analog: true,
    onDirection: ({x, y}) => {
      if(!useVirtualJoystick()) return;
      joyLeft = { x, y };
      // Defensive: stamp out any stale mouse target so the legacy fallback
      // path can't fight us mid-drag.
      INPUT.leftTouch = null;
    },
    onStop: () => {
      joyLeft = { x: 0, y: 0 };
      INPUT.leftTouch = null;       // and re-clear on release
    }
  });
}

canvas.addEventListener('mousemove', e => {
  // In AI mode the virtual joystick owns the left paddle. The mousemove
  // handler must NOT touch INPUT.leftTouch there — on mobile, touch
  // events synthesise mousemove with the touch position, so every drag
  // of the joystick was leaving INPUT.leftTouch.y = the (low) Y of the
  // joypad knob. When the user lifted the finger, the paddle update
  // fell back to that stale leftTouch and the paddle slid to the bottom.
  if(useVirtualJoystick()) return;
  const wx = screenToWorldX(e.clientX);
  const wy = screenToWorldY(e.clientY);
  if(wx < WORLD_W / 2) INPUT.leftTouch  = { id: 'mouse', x: wx, y: wy };
  else                  INPUT.rightTouch = { id: 'mouse', x: wx, y: wy };
});

// ── PADDLE UPDATE ────────────────────────────────────────────────────────────
function clampPaddle(p){
  p.y = Math.max(8, Math.min(WORLD_H - 8 - PADDLE_H, p.y));
}
function movePaddleToward(p, targetCenterY, dt, maxSpeed){
  const center = p.y + PADDLE_H / 2;
  const dy = targetCenterY - center;
  const absDy = Math.abs(dy);
  if(absDy < 1){ p.vy = 0; return; }
  const step = Math.sign(dy) * Math.min(absDy, maxSpeed * dt);
  p.vy = step / dt;
  p.y += step;
  clampPaddle(p);
}
// Tennis: paddle.x is also driven from the touch position, clamped to the
// player's own half. Left paddle ∈ [TENNIS_MIN_X_LEFT, TENNIS_MAX_X_LEFT()],
// right paddle ∈ [TENNIS_MIN_X_RIGHT(), TENNIS_MAX_X_RIGHT()].
function tennisXBounds(side){
  return side === 'left'
    ? { lo: TENNIS_MIN_X_LEFT,    hi: TENNIS_MAX_X_LEFT() }
    : { lo: TENNIS_MIN_X_RIGHT(), hi: TENNIS_MAX_X_RIGHT() };
}
function movePaddleX(p, targetX, dt, side, maxSpeed){
  const b = tennisXBounds(side);
  const tx = Math.max(b.lo, Math.min(b.hi, targetX));
  const dx = tx - p.x;
  if(Math.abs(dx) < 1){ p.vx = 0; return; }
  const step = Math.sign(dx) * Math.min(Math.abs(dx), maxSpeed * dt);
  p.vx = step / dt;
  p.x += step;
}
function clampPaddleX(p, side){
  const b = tennisXBounds(side);
  if(p.x < b.lo){ p.x = b.lo; if(p.vx < 0) p.vx = 0; }
  if(p.x > b.hi){ p.x = b.hi; if(p.vx > 0) p.vx = 0; }
}
// Distance-to-net factor 0..1 used for tennis speed-up at impact (1 = at the
// net line). Returns 0 in pong variant.
function netCloseness(p){
  if(variant !== 'tennis') return 0;
  const center = p.x + PADDLE_W / 2;
  const dist = Math.abs(center - WORLD_W / 2);
  const span = WORLD_W / 2 - (PADDLE_W / 2) - 28;
  return Math.max(0, Math.min(1, 1 - dist / span));
}

function updatePaddles(dt){
  const gp = window.GamepadInput && window.GamepadInput.state();
  const padOn = gp && window.GamepadInput.isConnected();

  // LEFT — priority: virtual joystick (AI mode) → direct touch (2P mode)
  // → analog left-stick → keys.
  // The joypad branch needs a real-input threshold (not just `!= 0`) so a
  // stale 0.001 left over from FP drift can't block the gamepad branch
  // when the user picks up a physical controller mid-match.
  const joyActive = useVirtualJoystick()
                 && (Math.abs(joyLeft.x) > 0.02 || Math.abs(joyLeft.y) > 0.02);
  if(joyActive){
    // Velocity-driven motion from the joypad. y always counts; x only in
    // tennis (otherwise the paddle is glued to its serve line).
    paddleLeft.vy = joyLeft.y * PADDLE_SPEED;
    paddleLeft.y += paddleLeft.vy * dt;
    clampPaddle(paddleLeft);
    if(variant === 'tennis'){
      paddleLeft.vx = joyLeft.x * PADDLE_SPEED;
      paddleLeft.x += paddleLeft.vx * dt;
      clampPaddleX(paddleLeft, 'left');
    } else paddleLeft.vx = 0;
  } else if(INPUT.leftTouch){
    movePaddleToward(paddleLeft, INPUT.leftTouch.y, dt, PADDLE_SPEED * 1.4);
    if(variant === 'tennis' && INPUT.leftTouch.x != null){
      movePaddleX(paddleLeft, INPUT.leftTouch.x - PADDLE_W / 2, dt, 'left', PADDLE_SPEED * 1.4);
    } else paddleLeft.vx = 0;
  } else if(padOn && Math.abs(gp.stickL.y) > 0.15){
    paddleLeft.vy = gp.stickL.y * PADDLE_SPEED;
    paddleLeft.y += paddleLeft.vy * dt;
    clampPaddle(paddleLeft);
    if(variant === 'tennis' && Math.abs(gp.stickL.x) > 0.15){
      paddleLeft.vx = gp.stickL.x * PADDLE_SPEED;
      paddleLeft.x += paddleLeft.vx * dt;
      clampPaddleX(paddleLeft, 'left');
    } else paddleLeft.vx = 0;
  } else if(INPUT.keys.lUp || INPUT.keys.lDown){
    const dir = (INPUT.keys.lDown ? 1 : 0) - (INPUT.keys.lUp ? 1 : 0);
    paddleLeft.vy = dir * PADDLE_SPEED;
    paddleLeft.y += paddleLeft.vy * dt;
    clampPaddle(paddleLeft);
    paddleLeft.vx = 0;
  } else {
    paddleLeft.vy = 0; paddleLeft.vx = 0;
  }

  // RIGHT — depends on mode.
  if(mode === 'ai'){
    updateAI(paddleRight, dt);
  } else {
    if(INPUT.rightTouch){
      movePaddleToward(paddleRight, INPUT.rightTouch.y, dt, PADDLE_SPEED * 1.4);
      if(variant === 'tennis' && INPUT.rightTouch.x != null){
        movePaddleX(paddleRight, INPUT.rightTouch.x - PADDLE_W / 2, dt, 'right', PADDLE_SPEED * 1.4);
      } else paddleRight.vx = 0;
    } else if(padOn && Math.abs(gp.stickR.y) > 0.15){
      paddleRight.vy = gp.stickR.y * PADDLE_SPEED;
      paddleRight.y += paddleRight.vy * dt;
      clampPaddle(paddleRight);
      if(variant === 'tennis' && Math.abs(gp.stickR.x) > 0.15){
        paddleRight.vx = gp.stickR.x * PADDLE_SPEED;
        paddleRight.x += paddleRight.vx * dt;
        clampPaddleX(paddleRight, 'right');
      } else paddleRight.vx = 0;
    } else if(INPUT.keys.rUp || INPUT.keys.rDown){
      const dir = (INPUT.keys.rDown ? 1 : 0) - (INPUT.keys.rUp ? 1 : 0);
      paddleRight.vy = dir * PADDLE_SPEED;
      paddleRight.y += paddleRight.vy * dt;
      clampPaddle(paddleRight);
      paddleRight.vx = 0;
    } else {
      paddleRight.vy = 0; paddleRight.vx = 0;
    }
  }
}

// ── AI difficulty (progressive) ──────────────────────────────────────────────
// Skill is a small integer persisted in localStorage. Wins bump it +1,
// losses bump it -1, clamped to [0, 6]. Skill 0 = easy starting point; the
// numbers below were re-tuned downward from the old fixed values so a new
// player isn't pulped on their first match.
function getAiSkill(){
  const v = parseInt(localStorage.getItem('pong-ai-skill') || '0', 10);
  return isFinite(v) ? Math.max(0, Math.min(6, v)) : 0;
}
function bumpAiSkill(delta){
  const v = getAiSkill() + delta;
  localStorage.setItem('pong-ai-skill', String(Math.max(0, Math.min(6, v))));
}
function aiDifficulty(){
  const k = getAiSkill();
  return {
    skill:       k,
    speedMul:    0.62 + 0.05 * k,         // 0.62 → 0.92
    aimNoise:    60   - 7    * k,         // 60   → 18   (px, scaled by ball speed)
    reactMs:     220  - 20   * k,         // 220  → 100  (refresh target slower at low skill)
    advanceProb: 0.10 + 0.10 * k          // 10%  → 70%  (tennis: chance to step toward the net)
  };
}

// AI paddle: predicts ball-y at the paddle line, then commits to that
// target for `reactMs` so the human's last-frame nudge can outwit it.
// Aim noise scales with ball speed so a hot rally is genuinely harder for
// the AI to read — but a soft return still gets returned cleanly.
function updateAI(p, dt){
  const D = aiDifficulty();
  const now = performance.now();

  // ── Y target with reaction delay ──────────────────────────────────────
  if(!p._aiNextReactAt) p._aiNextReactAt = 0;
  if(now >= p._aiNextReactAt){
    let target = WORLD_H / 2;
    if(ball.vx > 0){
      const remaining = (p.x - ball.x) / Math.max(50, ball.vx);
      target = ball.y + ball.vy * remaining;
      let safety = 4;
      while((target < 0 || target > WORLD_H) && safety-- > 0){
        if(target < 0)         target = -target;
        if(target > WORLD_H)   target = 2 * WORLD_H - target;
      }
      const sp = Math.hypot(ball.vx, ball.vy);
      const noise = D.aimNoise * (0.6 + Math.min(1, sp / BALL_MAX_SPEED));
      target += (Math.random() - 0.5) * 2 * noise;
      target += Math.sin(now * 0.005) * 18;
    }
    p._aiTarget = target;
    p._aiNextReactAt = now + D.reactMs;
  }
  const center = p.y + PADDLE_H / 2;
  const dy = (p._aiTarget != null ? p._aiTarget : (WORLD_H/2)) - center;
  const dead = 12;
  const sp = PADDLE_SPEED * D.speedMul;
  if(Math.abs(dy) > dead){
    const step = Math.sign(dy) * Math.min(Math.abs(dy), sp * dt);
    p.vy = step / dt;
    p.y += step;
    clampPaddle(p);
  } else {
    p.vy = 0;
  }

  // ── Tennis: occasionally advance toward the net like a human player ──
  // Roll once every ~500ms; on a hit, commit to an "advance" window of
  // 0.7–1.3s before falling back to the baseline. Probability climbs with
  // skill so weak AI rarely net-plays, strong AI does it constantly.
  if(variant === 'tennis'){
    if(!p._aiAdvanceRollAt) p._aiAdvanceRollAt = 0;
    if(now >= p._aiAdvanceRollAt){
      p._aiAdvanceRollAt = now + 500;
      const onMySide = (ball.x > WORLD_W / 2);
      if(onMySide && Math.random() < D.advanceProb){
        p._aiAdvanceUntil = now + 700 + Math.random() * 600;
      }
    }
    const advancing = now < (p._aiAdvanceUntil || 0);
    const targetX = advancing ? (TENNIS_MIN_X_RIGHT() + 30) : TENNIS_MAX_X_RIGHT();
    const dxAi = targetX - p.x;
    const aiXSp = sp * 0.7;
    if(Math.abs(dxAi) > 6){
      const stepX = Math.sign(dxAi) * Math.min(Math.abs(dxAi), aiXSp * dt);
      p.vx = stepX / dt;
      p.x += stepX;
      clampPaddleX(p, 'right');
    } else {
      p.vx = 0;
    }
  } else {
    p.vx = 0;
  }
}

// ── BALL UPDATE ──────────────────────────────────────────────────────────────
function updateBall(dt){
  if(performance.now() < pauseUntil) return;
  // Tennis spin — applied as a PURE VERTICAL force (scaled by horizontal
  // speed so it only kicks in while the ball is travelling). The previous
  // rotate-the-velocity-vector approach made the ball curl back toward
  // the hitter when the spin was strong + the ball bounced off a wall.
  // Now the horizontal direction is preserved: the ball can curve up/down
  // but always heads toward the opponent.
  if(variant === 'tennis' && Math.abs(ball.curve) > 0.0001){
    const horizSpeed = Math.abs(ball.vx) || 1;
    ball.vy += ball.curve * horizSpeed * dt * 0.18;
    // Cap |vy| so a long rally can't push the ball into a 45°+ dive that
    // makes it look like it reverses.
    const maxVy = horizSpeed * 0.85;
    if(ball.vy >  maxVy) ball.vy =  maxVy;
    if(ball.vy < -maxVy) ball.vy = -maxVy;
    ball.curve *= Math.pow(TENNIS_SPIN_DECAY, dt);
  }
  // Substep the motion so the ball never traverses more than ~half a
  // paddle width per step. A frame of 16ms at BALL_MAX_SPEED already moves
  // the ball ~15px — basically the whole PADDLE_W of 16. On a stuttered
  // frame (30ms+) it jumps past entirely, hence the "the ball passed
  // through me" bug. Substeps eliminate that tunneling.
  const sp = Math.hypot(ball.vx, ball.vy);
  const maxStep = Math.min(PADDLE_W * 0.5, BALL_R);
  const steps   = Math.max(1, Math.ceil((sp * dt) / Math.max(1, maxStep)));
  const sdt     = dt / steps;
  for(let s = 0; s < steps; s++){
    ball.x += ball.vx * sdt;
    ball.y += ball.vy * sdt;
    if(ball.y < BALL_R){          ball.y = BALL_R;             ball.vy =  Math.abs(ball.vy); Sfx.bounce(); spawnHit(ball.x, ball.y, '#ffcc44'); }
    if(ball.y > WORLD_H - BALL_R){ball.y = WORLD_H - BALL_R;   ball.vy = -Math.abs(ball.vy); Sfx.bounce(); spawnHit(ball.x, ball.y, '#ffcc44'); }
    bouncePaddle(paddleLeft,  +1);
    bouncePaddle(paddleRight, -1);
    if(ball.x < -BALL_R){          onPoint('right'); return; }
    if(ball.x > WORLD_W + BALL_R){ onPoint('left');  return; }
  }
  ball.rot += sp * dt * 0.02;
}

function bouncePaddle(p, normalX){
  if((normalX > 0 && ball.vx >= 0) || (normalX < 0 && ball.vx <= 0)) return;
  const px = p.x, py = p.y;
  const closestX = Math.max(px, Math.min(ball.x, px + PADDLE_W));
  const closestY = Math.max(py, Math.min(ball.y, py + PADDLE_H));
  const dx = ball.x - closestX, dy = ball.y - closestY;
  if(dx * dx + dy * dy > BALL_R * BALL_R) return;
  const relative = ((ball.y - py) / PADDLE_H) - 0.5;   // -0.5 top, +0.5 bottom
  const maxAng   = 0.7;
  const ang      = relative * maxAng;
  const cur      = Math.hypot(ball.vx, ball.vy);
  // Tennis: closer to the net = harder shot. The boost multiplies the
  // usual SPEEDUP so it stacks with a long rally.
  const netBoost = 1 + netCloseness(p) * TENNIS_NET_SPEEDUP;
  const speed    = Math.min(BALL_MAX_SPEED, cur * BALL_SPEEDUP * netBoost);
  ball.vx = Math.cos(ang) * speed * normalX;
  ball.vy = Math.sin(ang) * speed;
  ball.x = (normalX > 0) ? (px + PADDLE_W + BALL_R + 1) : (px - BALL_R - 1);
  ball.vy += p.vy * 0.18;
  // Tennis spin: the further from the paddle's centre (vertically) the more
  // curve the shot carries, plus a contribution from the paddle's own vy.
  if(variant === 'tennis'){
    ball.curve = relative * TENNIS_SPIN_FACTOR + p.vy * TENNIS_SPIN_FROM_VY;
  } else {
    ball.curve = 0;
  }
  spawnHit(ball.x, ball.y, normalX > 0 ? '#66e0ff' : '#ff6ad6');
  Sfx.hit();
}

function onPoint(scorer){
  if(scorer === 'left')  leftScore++;
  else                    rightScore++;
  updateScoreHud();
  Sfx.score();
  // Burst of colour from the losing side.
  const x = scorer === 'left' ? WORLD_W - 20 : 20;
  for(let i = 0; i < 18; i++) spawnHit(x, ball.y, scorer === 'left' ? '#ff6ad6' : '#66e0ff');
  if(leftScore >= TARGET_SCORE || rightScore >= TARGET_SCORE){
    onMatchEnd(leftScore >= TARGET_SCORE ? 'left' : 'right');
  } else {
    serveBall(scorer === 'left' ? +1 : -1);   // ball goes toward the player who just lost
  }
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
function spawnHit(x, y, color){
  for(let i = 0; i < 8; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 80 + Math.random() * 180;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.35 + Math.random() * 0.25, age: 0, color
    });
  }
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;
    if(p.age >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 2); p.vy *= (1 - dt * 2);
  }
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function updateScoreHud(){
  document.getElementById('hud-left').textContent  = leftScore;
  document.getElementById('hud-right').textContent = rightScore;
  if(leftSpeciesId)  document.getElementById('hud-left-img').src  = `${Brutimon.BASE}/${leftSpeciesId}/${leftSpeciesId}_3.png`;
  if(rightSpeciesId) document.getElementById('hud-right-img').src = `${Brutimon.BASE}/${rightSpeciesId}/${rightSpeciesId}_3.png`;
}

// ── AUDIO ────────────────────────────────────────────────────────────────────
const Sfx = (() => {
  let actx = null, master = null;
  let on = localStorage.getItem('pongAudio') !== 'false';
  function ensure(){
    if(actx) return actx;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
    master = actx.createGain(); master.gain.value = on ? 0.5 : 0;
    master.connect(actx.destination);
    return actx;
  }
  function tone({freq=440, dur=0.1, type='square', vol=0.3, sweep=0}){
    if(!on || !ensure()) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.04);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    ensure,
    hit(){    tone({freq:520, dur:0.05, type:'square', vol:0.18, sweep: 120}); },
    bounce(){ tone({freq:380, dur:0.05, type:'square', vol:0.10, sweep:-80}); },
    score(){  [523, 659, 784].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.10, vol:0.20}), i * 70)); },
    win(){    [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.16, vol:0.22}), i * 130)); },
    lose(){   [523, 440, 349, 261].forEach((f, i) => setTimeout(() => tone({freq:f, dur:0.28, type:'sawtooth', vol:0.22, sweep:-30}), i * 220)); }
  };
})();

// ── FLOW ─────────────────────────────────────────────────────────────────────
async function startGame(){
  Sfx.ensure();
  // Best-effort landscape lock (only here, at the moment the match starts —
  // not on the menu, which is comfortable in portrait).
  try { if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
  await preloadSpecies();
  resetMatch();
  hideOverlay();
  running = true;
  lastT = performance.now();
  // Every match starts in 'ready' so the user always sees a 3-2-1 before
  // the ball moves. checkOrientation() schedules the countdown immediately
  // when the device is already landscape (most desktops + a phone the
  // user just rotated), or defers it until the device rotates.
  phase = 'ready';
  countdownEndsAt = 0;
  checkOrientation();
  requestAnimationFrame(loop);
}
function onMatchEnd(winner){
  phase = 'gameover';
  running = false;
  if(winner === 'left'){
    Sfx.win();
    if(mode === 'ai'){
      bumpAiSkill(+1);                 // win → AI gets a bit tougher next match
      if(window.Coins) Coins.add(10, 'pong-ai-win');
      // Submit (your_score * 100 + opponent_score) so the leaderboard
      // ranks margin-of-victory: 7-0 beats 7-6.
      if(window.CloudSync) CloudSync.recordScore(null, leftScore * 100 + (TARGET_SCORE - rightScore));
    }
  } else {
    Sfx.lose();
    if(mode === 'ai') bumpAiSkill(-1); // loss → ease off so a rough streak doesn't compound
  }
  const titleColor = winner === 'left' ? '#66e0ff' : '#ff6ad6';
  const titleText  = mode === 'ai'
    ? (winner === 'left' ? 'VITTORIA' : 'SCONFITTA')
    : (winner === 'left' ? 'VINCE A SINISTRA' : 'VINCE A DESTRA');
  const ol = document.getElementById('overlay');
  ol.innerHTML = `
    <h2 style="color:${titleColor};text-shadow:0 0 28px ${titleColor}">${titleText}</h2>
    <p>${leftScore} — ${rightScore}</p>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">RIVINCITA</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
      <button class="btn" onclick="showMainMenu()">CAMBIA MODO</button>
      <button class="btn" onclick="goBack()">MENU</button>
    </div>
  `;
  ol.classList.add('show');
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function goBack(){ window.location.href = '../'; }
window.startGame    = startGame;
window.showMainMenu = showMainMenu;
window.goBack       = goBack;

// ── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts){
  if(!running) return;
  const dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  const isPaused = window.Pause && Pause.isPaused();
  // Countdown: when we're 'ready' AND landscape AND the timer expires,
  // promote to 'playing'. The countdown digit is rendered on top of
  // draw() below.
  if(phase === 'ready' && countdownEndsAt && window.innerWidth > window.innerHeight){
    if(performance.now() >= countdownEndsAt){
      phase = 'playing';
      countdownEndsAt = 0;
      lastT = performance.now();
    }
  }
  if(phase === 'playing' && !isPaused){
    updatePaddles(dt);
    updateBall(dt);
    updateParticles(dt);
  }
  draw();
  drawCountdownOverlay();
  requestAnimationFrame(loop);
}

// Big "3 / 2 / 1" digit drawn over the field in the post-rotation window.
function drawCountdownOverlay(){
  if(!countdownEndsAt) return;
  const remaining = countdownEndsAt - performance.now();
  if(remaining <= 0) return;
  const sec = Math.max(1, Math.ceil(remaining / 1000));
  // Fade in over the first ~150ms of each digit so it pulses with each count.
  const inPhase = 1 - ((remaining % 1000) / 1000);    // 0 → 1 across each second
  const alpha = 0.55 + 0.45 * Math.min(1, inPhase * 4);
  ctx.save();
  ctx.fillStyle = `rgba(0, 0, 0, 0.35)`;
  ctx.fillRect(0, 0, W, H);
  ctx.font = '900 ' + Math.round(Math.min(W, H) * 0.42) + 'px Orbitron, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(255, 224, 80, ${alpha})`;
  ctx.shadowColor = '#ffe04a';
  ctx.shadowBlur = 32;
  ctx.fillText(String(sec), W / 2, H / 2);
  ctx.restore();
}

if(window.Pause){
  Pause.attach({
    canPause: () => (typeof phase !== 'undefined') && phase === 'playing',
    onPause:  () => { /* loop keeps spinning, isPaused gates updates */ },
    onResume: () => { lastT = performance.now(); }
  });
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle = '#0a0218'; ctx.fillRect(0, 0, W, H);
  const r = worldRect();

  // Rainbow gradient background.
  const t = performance.now() * 0.0006;
  const g = ctx.createLinearGradient(r.x, r.y, r.x + r.w, r.y + r.h);
  const hue = (performance.now() * 0.02) % 360;
  g.addColorStop(0, `hsl(${(hue +   0) % 360}, 70%, 20%)`);
  g.addColorStop(0.5, `hsl(${(hue + 120) % 360}, 70%, 18%)`);
  g.addColorStop(1, `hsl(${(hue + 240) % 360}, 70%, 22%)`);
  ctx.fillStyle = g; ctx.fillRect(r.x, r.y, r.w, r.h);

  // Soft glow halos in the corners.
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const haloR = r.h * 0.7;
  const lh = ctx.createRadialGradient(r.x + 60, r.y + r.h / 2, 0, r.x + 60, r.y + r.h / 2, haloR);
  lh.addColorStop(0, 'rgba(102,224,255,0.40)'); lh.addColorStop(1, 'rgba(102,224,255,0)');
  ctx.fillStyle = lh; ctx.fillRect(r.x, r.y, r.w, r.h);
  const rh = ctx.createRadialGradient(r.x + r.w - 60, r.y + r.h / 2, 0, r.x + r.w - 60, r.y + r.h / 2, haloR);
  rh.addColorStop(0, 'rgba(255,106,214,0.40)'); rh.addColorStop(1, 'rgba(255,106,214,0)');
  ctx.fillStyle = rh; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.restore();

  // Centre dashed line.
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = 3 * r.s;
  ctx.setLineDash([14 * r.s, 14 * r.s]);
  ctx.beginPath();
  ctx.moveTo(r.x + r.w / 2, r.y + 10 * r.s);
  ctx.lineTo(r.x + r.w / 2, r.y + r.h - 10 * r.s);
  ctx.stroke();
  ctx.restore();

  // Big translucent score numbers behind the arena (so the centre line frames them).
  ctx.save();
  ctx.font = `bold ${Math.floor(r.h * 0.55)}px Orbitron, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(102,224,255,0.10)';
  ctx.fillText(leftScore,  r.x + r.w * 0.32, r.y + r.h / 2);
  ctx.fillStyle = 'rgba(255,106,214,0.10)';
  ctx.fillText(rightScore, r.x + r.w * 0.68, r.y + r.h / 2);
  ctx.restore();

  // Helper: world → screen.
  const wx = x => r.x + x * r.s;
  const wy = y => r.y + y * r.s;

  // Paddles.
  drawPaddle(paddleLeft,  '#66e0ff', leftSpeciesId,  r, wx, wy);
  drawPaddle(paddleRight, '#ff6ad6', rightSpeciesId, r, wx, wy);

  // Ball — spinning brutimon with a stretched neon trail.
  const speed = Math.hypot(ball.vx, ball.vy) || 1;
  const tx = -(ball.vx / speed) * 50;
  const ty = -(ball.vy / speed) * 50;
  ctx.save();
  const tg = ctx.createLinearGradient(wx(ball.x), wy(ball.y), wx(ball.x + tx), wy(ball.y + ty));
  tg.addColorStop(0, '#ffe04a'); tg.addColorStop(1, 'rgba(255,224,80,0)');
  ctx.strokeStyle = tg; ctx.lineWidth = Math.max(2, BALL_R * 0.9 * r.s); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(wx(ball.x), wy(ball.y));
  ctx.lineTo(wx(ball.x + tx), wy(ball.y + ty));
  ctx.stroke();
  ctx.restore();
  // Ball sprite
  const bsz = BALL_R * 2.4 * r.s;
  const bim = ball.speciesId ? Brutimon.image(ball.speciesId, ball.stage) : null;
  ctx.save();
  ctx.translate(wx(ball.x), wy(ball.y));
  ctx.rotate(ball.rot);
  ctx.shadowColor = '#ffe04a'; ctx.shadowBlur = 14;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, BALL_R * r.s, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  if(imgReady(bim)){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bim, -bsz / 2, -bsz / 2, bsz, bsz);
  }
  ctx.restore();

  // Particles.
  for(const p of particles){
    const a = Math.max(0, 1 - p.age / p.life);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(wx(p.x), wy(p.y), 4 * r.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Countdown pip between rallies — a quick "GO!" so players know when the
  // ball moves.
  const now = performance.now();
  if(now < pauseUntil){
    const remaining = (pauseUntil - now) / 700;
    ctx.save();
    ctx.font = `bold ${Math.floor(r.h * 0.18)}px Orbitron, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ffe04a'; ctx.shadowBlur = 18;
    ctx.globalAlpha = 0.5 + 0.5 * (1 - remaining);
    ctx.fillText('VIA!', r.x + r.w / 2, r.y + r.h * 0.35);
    ctx.restore();
  }
}

function drawPaddle(p, color, speciesId, r, wx, wy){
  // Capsule shape + brutimon sprite centered. Glow ring intensifies briefly
  // after a hit but we keep it constant for clarity.
  const x = wx(p.x), y = wy(p.y);
  const w = PADDLE_W * r.s, h = PADDLE_H * r.s;
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x, y, w, h, w * 0.5); }
  else { ctx.rect(x, y, w, h); }
  ctx.fill();
  ctx.restore();
  // Brutimon face on the paddle — visible only on tall paddles (always true
  // at our paddle height).
  if(speciesId){
    const im = Brutimon.image(speciesId, 3);
    if(imgReady(im)){
      const sz = w * 2.0;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(im, x + w / 2 - sz / 2, y + h / 2 - sz / 2, sz, sz);
    }
  }
}

// ── MAIN MENU ────────────────────────────────────────────────────────────────
async function showMainMenu(){
  phase = 'menu';
  running = false;
  await preloadSpecies();
  const ol = document.getElementById('overlay');
  const picksLeft  = speciesList.map(s => `<div class="pick-tile${s.id === leftSpeciesId ? ' selected' : ''}" data-side="left" data-id="${s.id}"><img src="${Brutimon.BASE}/${s.id}/${s.id}_3.png"/><div class="name">${(s.name||s.id).toUpperCase()}</div></div>`).join('');
  const picksRight = speciesList.map(s => `<div class="pick-tile${s.id === rightSpeciesId ? ' selected' : ''}" data-side="right" data-id="${s.id}"><img src="${Brutimon.BASE}/${s.id}/${s.id}_3.png"/><div class="name">${(s.name||s.id).toUpperCase()}</div></div>`).join('');
  const variantHint = variant === 'tennis'
    ? `Mobile: trascina dentro la tua metà per muoverti sia su/giù sia avanti/indietro verso la rete. Più vicino sei alla rete, più forte il tiro; più colpisci la palla sopra o sotto il centro della racchetta, più effetto darai alla traiettoria.`
    : `Mobile: trascina il dito su un lato dello schermo per muovere la rispettiva racchetta. Desktop: <b>W/S</b> = sinistra · <b>↑/↓</b> = destra.`;
  ol.innerHTML = `
    <h2>BRUTIMON PONG</h2>
    <p>Primo a <b style="color:#ffe04a">${TARGET_SCORE}</b> punti vince.</p>
    <p style="color:#44ffe6;letter-spacing:.22em;margin-bottom:2px">VARIANTE</p>
    <div class="pick-grid modes">
      <div class="pick-tile mode${variant === 'pong'   ? ' selected' : ''}" data-variant="pong"><div class="name">PONG</div></div>
      <div class="pick-tile mode${variant === 'tennis' ? ' selected' : ''}" data-variant="tennis"><div class="name">TENNIS</div></div>
    </div>
    <p style="color:#ffcc44;letter-spacing:.22em;margin-bottom:2px">AVVERSARIO</p>
    <div class="pick-grid modes">
      <div class="pick-tile mode${mode === 'ai'  ? ' selected' : ''}" data-mode="ai"><div class="name">VS AI</div></div>
      <div class="pick-tile mode${mode === 'p2p' ? ' selected' : ''}" data-mode="p2p"><div class="name">2 GIOCATORI</div></div>
    </div>
    <p style="color:#66e0ff;letter-spacing:.22em;margin-bottom:2px">BRUTIMON A SINISTRA</p>
    <div class="pick-grid">${picksLeft}</div>
    <p style="color:#ff6ad6;letter-spacing:.22em;margin-bottom:2px">BRUTIMON A DESTRA</p>
    <div class="pick-grid">${picksRight}</div>
    <div class="btn-row">
      <button class="btn gold" onclick="startGame()">START</button>
      <button class="btn" onclick="Leaderboard.show()">CLASSIFICA</button>
    </div>
    <div class="hint">${variantHint}</div>
  `;
  ol.classList.add('show');
  ol.querySelectorAll('.pick-tile[data-variant]').forEach(t => t.addEventListener('click', () => {
    variant = t.dataset.variant;
    localStorage.setItem('pongVariant', variant);
    showMainMenu();
  }));
  ol.querySelectorAll('.pick-tile[data-mode]').forEach(t => t.addEventListener('click', () => {
    mode = t.dataset.mode;
    localStorage.setItem('pongMode', mode);
    showMainMenu();
  }));
  ol.querySelectorAll('.pick-tile[data-side="left"]').forEach(t => t.addEventListener('click', () => {
    leftSpeciesId = t.dataset.id;
    localStorage.setItem('pongLeft', leftSpeciesId);
    ol.querySelectorAll('.pick-tile[data-side="left"]').forEach(x => x.classList.toggle('selected', x === t));
    updateScoreHud();
  }));
  ol.querySelectorAll('.pick-tile[data-side="right"]').forEach(t => t.addEventListener('click', () => {
    rightSpeciesId = t.dataset.id;
    localStorage.setItem('pongRight', rightSpeciesId);
    ol.querySelectorAll('.pick-tile[data-side="right"]').forEach(x => x.classList.toggle('selected', x === t));
    updateScoreHud();
  }));
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
checkOrientation();
showMainMenu();
requestAnimationFrame(function bootDraw(){
  draw();
  if(phase !== 'playing') requestAnimationFrame(bootDraw);
});
</script>
